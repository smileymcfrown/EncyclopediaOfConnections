# Run 2: connection and mechanism TYPES (the encyclopedia's core catalogue).
# Built on 2026-09-26 from research/prior-art/summary.md section 2 (run 1's merged type list),
# model knowledge, and one web-search supplement pass (which added seals, brakes, linkage ends,
# tube and extrusion fixings, and more maker and robotics types).
#
# Order = research priority (/research-deep works top to bottom):
#   Tier 1: unusual/clever types that can be 3D printed or are useful in robotics
#   Tier 2: other unusual types (joinery for wood, sheet and panels last, as it is the
#           lowest-priority making method)
#   Tier 3: generic baseline entries (at most one per family) for the flow chart to compare against
# Each item's `category` is its main family (the `family` field). Families are listed at the end.
# `notes` lists related variants the entry should also cover (instead of separate entries).
# Types only: no brands or product ranges (brand names appear only as aliases a beginner may search for).

topic: Types of unusual and clever connections and mechanisms for hobbyist makers

items:
  # ==================== TIER 1: unusual + 3D-printable or useful in robotics ====================
  # 1
  - name: Ratcheting reel closure (dial lacing system)
    category: tensioning, reels & take-up
    description: A knob that winds a lace or cable onto a spool to pull two sides together, clicks as it tightens, stays locked, and releases only when you pull or turn the knob by hand (as on snowboard boots and cycling shoes)
  # 2
  - name: Ratchet-tooth torque limiter (clicking torque-limiting cap or knob)
    category: torque limiting & slip
    description: A cap, knob or screwdriver handle with sloped spring-loaded teeth that turns the part until a set tightness, then clicks and slips so you can't over-tighten (fuel caps, torque-limiting screwdrivers)
  # 3
  - name: Ball-detent torque limiter
    category: torque limiting & slip
    description: Spring-loaded balls sit in dimples between two plates and carry the drive until the load gets too high, then pop out so the drive slips instead of breaking something
  # 4
  - name: Friction slip clutch (slip coupling, slipper clutch)
    category: torque limiting & slip
    description: Spring-pressed friction discs pass turning force until a set torque, then slip smoothly; protects gears in robot arms, RC cars and filament spool holders
  # 5
  - name: Torque-limiting gear with flexing spring arms (compliant slip hub)
    category: torque limiting & slip
    description: A one-piece plastic gear or hub whose built-in springy arms grip the shaft and let it slip when overloaded, with no separate parts
    notes: Also covers the RC "servo saver" (a sprung servo horn that gives way under shock)
  # 6
  - name: Shear-pin coupling (breakaway link)
    category: torque limiting & slip
    description: A deliberately weak pin or link that snaps at a set load, sacrificing itself to protect the rest of the machine; replaced after it breaks
  # 7
  - name: Ratchet and pawl (incl. reversible ratchet)
    category: one-way & ratchet
    description: A toothed wheel and a hinged catch (pawl) that lets the wheel turn one way with a click and stops it turning back; a switchable pawl reverses the direction
  # 8
  - name: Linear ratchet (cable-tie ratchet)
    category: one-way & ratchet
    description: A toothed strip and a catch that let it slide one way only, as in a cable tie or the ladder strap on a snowboard binding (ratchet tie-down straps use a rotary ratchet, and most quick-grip clamps use a binding plate instead)
    notes: Also covers cable ties as a fastener (tie mounts, coated stainless ties, a tie behind a hose barb) and the handle ratchet of locking forceps, as printed hobby clamps (never for use on people).
  # 9
  - name: Face ratchet (star ratchet, face-engagement ratchet)
    category: one-way & ratchet
    description: Two discs with sloped teeth on their faces, pressed together by a spring, that drive one way and ride over each other the other way (bicycle hubs, printed ratcheting joints)
  # 10
  - name: Sprag clutch
    category: one-way & ratchet
    description: A ring of tilted wedges (sprags) between two rings that jam instantly when turned one way and slide freely the other way, with no clicking
  # 11
  - name: Roller clutch (one-way bearing)
    category: one-way & ratchet
    description: Rollers sit in ramped pockets and wedge tight when the shaft turns one way, but roll free the other way; sold as a ready-made one-way needle bearing
    notes: Also covers the motion rectifier (two one-way clutches that turn back-and-forth motion into one-way rotation)
  # 12
  - name: Wrap-spring clutch (spring clutch)
    category: one-way & ratchet
    description: A coiled spring wrapped around a shaft that grips tighter when turned one way and loosens the other way; also used as an on/off clutch
  # 13
  - name: Compliant ratchet and overrunning clutch (flexure pawl)
    category: one-way & ratchet
    description: One-piece printed ratchets and one-way clutches whose pawls are springy arms, so there are no pins or separate springs
  # 14
  - name: Binding-plate lock (tilting friction plate)
    category: one-way & ratchet
    description: A plate with a hole slides along a bar, then tilts and bites when pushed the other way, as in caulking guns and quick-grip bar clamps
  # 15
  - name: Bidirectional anti-back-drive clutch (reverse-input blocking clutch)
    category: self-locking & anti-back-drive
    description: A clutch that lets the input shaft turn the output either way, but locks if the output tries to turn the input, so a load can't drive the motor backwards
  # 16
  - name: Worm drive (worm and worm wheel)
    category: gear trains, gearboxes & transmissions
    description: A screw-like gear turning a gear wheel at right angles for a big speed reduction; many designs can't be turned backwards from the wheel (self-locking)
  # 17
  - name: Lead screw and nut (incl. anti-backlash nut)
    category: motion conversion
    description: A threaded rod turning inside a nut to push something in a straight line; low-friction versions can be back-driven, fine-pitch ones hold their place
  # 18
  - name: Half nut (split nut, quick-action nut)
    category: quick-release & tool-free
    description: A nut split in two that opens away from a screw so the part can slide freely, then closes to be driven by the screw again, as in quick-release vices
  # 19
  - name: Over-centre linkage (toggle linkage)
    category: over-centre, toggle & cam clamps
    description: Two links that push past a straight line and lock there, so a load pushes the joint harder into its locked position instead of opening it
  # 20
  - name: Toggle clamp
    category: over-centre, toggle & cam clamps
    description: A lever clamp that snaps past centre to hold work down firmly and releases with a flick; horizontal, vertical, push-pull and squeeze styles
  # 21
  - name: Draw latch (over-centre latch)
    category: over-centre, toggle & cam clamps
    description: A lever on one part hooks a catch on the other and pulls them tightly together as it snaps shut, as on toolboxes and cases
  # 22
  - name: Eccentric cam lever (cam clamp, quick-release skewer)
    category: over-centre, toggle & cam clamps
    description: A lever with an off-centre cam that squeezes or clamps when flipped over and releases when flipped back, as on bike wheel skewers and seat posts
  # 23
  - name: Bistable compliant mechanism (snap-through switch or hinge)
    category: compliant mechanisms & flexures
    description: A one-piece springy part with two stable positions that snaps from one to the other, like a hair clip or a snap bracelet
  # 24
  - name: Push-push latch (push-to-open, heart-cam latch)
    category: locks, latches & catches
    description: Push once to latch, push again to release; a pin follows a heart-shaped track that holds it on alternate pushes (cabinet doors, SD card slots)
  # 25
  - name: Click-pen mechanism (rotating-cam push-push indexer)
    category: indexing & detents
    description: The retractable-pen mechanism, where each push turns a toothed cam one step so it alternately holds the tip out and lets it back in
  # 26
  - name: Sear and trigger (trip release mechanism)
    category: locks, latches & catches
    description: A small catch holds back a large stored force (spring, weight) and a light touch on the trigger releases it, as in mousetraps, crossbows and launchers
  # 27
  - name: Compliant one-piece latch (flexure latch)
    category: locks, latches & catches
    description: A latch made as one springy printed part, where bending the handle pulls the catch back, with no pins or separate springs
  # 28
  - name: Hidden latches (magnetic-key latch, puzzle lock)
    category: locks, latches & catches
    description: A latch hidden inside a door, drawer or box that is released by holding a magnet in the right spot outside, or by tilting or spinning the box so hidden pins move
  # 29
  - name: Push-and-turn child-resistant cap
    category: locks, latches & catches
    description: A cap that only unscrews when pushed down while turning, because its lugs slip over ratchet teeth unless pressed into them
  # 30
  - name: Ball detent (spring plunger)
    category: indexing & detents
    description: A spring-loaded ball presses into dimples so a part clicks into set positions and holds there until pushed on with enough force
    notes: Also covers cabinet ball catches and roller catches
  # 31
  - name: Indexing plunger (pull-knob index pin)
    category: indexing & detents
    description: A spring-loaded pin that you pull out, move the part to a new hole, and let snap back in to lock the position
  # 32
  - name: Compliant detent (flexure click arm)
    category: indexing & detents
    description: A springy printed arm or bump that clicks into notches, giving positive click positions in knobs, dials and hinges without any metal parts
    notes: Also covers the star wheel and jumper spring detent (as in clocks and rotary switches)
  # 33
  - name: Detent hinge (click hinge, position hinge)
    category: indexing & detents
    description: A hinge that clicks and holds at set angles, like a laptop stand or folding table leg
    notes: Also covers drop-ring, bail and dial locks borrowed from orthotic knee joints as hinge-lock ideas, described for maker use only.
  # 34
  - name: Hirth joint (face-spline coupling)
    category: indexing & detents
    description: Two faces with radial teeth that mesh to lock parts at a chosen angle; loosen, turn to the next tooth, tighten (adjustable arms, camera mounts)
    notes: Also covers the ARRI rosette used on film and camera accessories. Also covers the C-stand grip-head rule (hang the load so its weight tightens the knob).
  # 35
  - name: Geneva drive (Maltese cross)
    category: motion conversion
    description: A pin on a steadily turning wheel steps a slotted wheel round by a fixed amount, then holds it still until the next step
  # 36
  - name: Intermittent gear (mutilated or part-toothed gear)
    category: motion conversion
    description: A gear with teeth only on part of its rim, so the gear it drives moves in steps with pauses between them
  # 37
  - name: Bayonet mount (push-and-twist lock)
    category: quick-release & tool-free
    description: Push in and twist a short way so pins or lugs slide under ledges and lock; used on camera lenses, light bulbs and lids
    notes: Also covers the quarter-turn bike-computer mount, and threaded lens mounts (S-mount, C-mount, CS-mount) as the screw-in alternative.
  # 38
  - name: Interrupted-screw lock (interrupted thread, breech lock)
    category: quick-release & tool-free
    description: A thread with gaps cut in it, so the parts push together and lock with a fraction of a turn instead of many turns
  # 39
  - name: Quarter-turn fastener (Dzus-type)
    category: quick-release & tool-free
    description: A stud that locks a panel in place with a quarter turn, by a spiral slot riding over a spring or a cross pin
    notes: Also covers the twistlock (a shaped head dropped through a slot and turned to lock, as on shipping-container corners and drop-in T-nuts)
  # 40
  - name: Quick-release pin (ball-lock pin)
    category: quick-release & tool-free
    description: A pin with small balls near its tip that lock it in a hole until you press a button on the end to let the balls retract
  # 41
  - name: Quick-release plate (camera plate, dovetail clamp)
    category: quick-release & tool-free
    description: A plate with angled edges slides or drops into a matching clamp and is locked by a lever or knob, as on camera tripods
    notes: Also covers Picatinny-style rails and camera cold shoes
  # 42
  - name: Hang-on mounts (keyhole slot, French cleat)
    category: quick-release & tool-free
    description: A head slides into a keyhole-shaped slot, or two bevelled rails hook together, so things hang securely and lift off without tools
    notes: Also covers VESA screen mounts (the standard square of screw holes on screens and monitor arms).
  # 43
  - name: Modular grid mounting systems (pegboard, Gridfinity-style grids)
    category: quick-release & tool-free
    description: Boards or baseplates with a regular grid of holes or sockets that hooks, bins and holders snap, twist, peg or magnet into anywhere on the grid
    notes: 'Types, not products: cover the common grid ideas (pegboard hooks, locking pegboard hooks, baseplate-and-bin grids with magnets, snap-and-thread boards)'
  # 44
  - name: Cantilever snap fit
    category: snap & clip fits
    description: A flexible arm with a hook on the end bends as parts push together, then springs back to catch a ledge; the most common snap fit (includes U- and L-shaped arms)
  # 45
  - name: Annular snap fit
    category: snap & clip fits
    description: A round bead or groove all the way around a part snaps over a matching lip, like a pen cap or a bottle lid clicking on
  # 46
  - name: Torsional snap fit
    category: snap & clip fits
    description: A catch on a twisting bar; press one end and the other end lifts to release, so it can be opened again and again
  # 47
  - name: Snap pin (split-leg push-in pin, rabbit clip)
    category: snap & clip fits
    description: A pin with split, springy legs and a barb that squeezes through a hole and springs open to hold two parts together
  # 48
  - name: Push-in plastic rivet (fir-tree clip, push rivet)
    category: snap & clip fits
    description: A ribbed or expanding plastic pin that pushes into a hole and grips, as used for car trim and panels
  # 49
  - name: Living hinge
    category: compliant mechanisms & flexures
    description: A thin, flexible strip of the same material joining two parts so they fold, like the lid of a ketchup bottle or a tic-tac box
  # 50
  - name: Flexure hinge (notch, leaf-spring and cross-axis pivots)
    category: compliant mechanisms & flexures
    description: A pivot made by a thin or crossed springy section that bends instead of rubbing, giving smooth, backlash-free rotation over a small angle
  # 51
  - name: Parallel leaf-spring flexure (linear flexure stage)
    category: compliant mechanisms & flexures
    description: Two or more parallel springy blades that let a platform slide a short way in a straight line with no sliding friction or play
  # 52
  - name: Compliant gripper and force amplifier
    category: compliant mechanisms & flexures
    description: One-piece bending mechanisms that multiply or redirect a force, such as printed grippers, pliers and crimpers
  # 53
  - name: Fin-ray gripper (fin ray effect finger)
    category: compliant mechanisms & flexures
    description: A flexible triangular finger with cross ribs that wraps around an object when pressed, instead of pushing it away; popular for soft robot grippers
  # 54
  - name: Self-folding print (4D printing)
    category: print-in-place & 3D-printing joints
    description: A flat print with stresses built into its layers, or a dissolvable lock holding back a spring, that folds itself into shape when heated or wetted
  # 55
  - name: Print-in-place hinge
    category: print-in-place & 3D-printing joints
    description: A hinge printed already assembled, with cone-shaped pins and a small gap so it moves straight off the print bed
  # 56
  - name: Heat-set threaded insert
    category: print-in-place & 3D-printing joints
    description: A knurled brass insert pressed into a plastic hole with a hot soldering iron, giving strong, reusable metal threads in a printed part
    notes: Also covers SPIROL's insert advice for prints, including press-in inserts as the best choice in resin.
  # 57
  - name: Captive nut pocket (nut trap)
    category: print-in-place & 3D-printing joints
    description: A hexagonal pocket or side slot in a printed part that holds a nut so a bolt can be tightened without a spanner
  # 58
  - name: Printed screw thread
    category: print-in-place & 3D-printing joints
    description: Threads modelled and printed directly into the parts, for jar lids, caps and coarse screws, with extra clearance so they turn
  # 59
  - name: Crush ribs and spring-fit features (compliant press fit)
    category: print-in-place & 3D-printing joints
    description: Small ribs or springy tabs that squash or flex as a part is pushed in, giving a tight fit even when printer or laser sizes vary
  # 60
  - name: Mid-print embedding (captive nuts, magnets and bearings)
    category: print-in-place & 3D-printing joints
    description: Pausing a print to drop in a nut, magnet or bearing and then printing over it, so the part is trapped inside for good
  # 61
  - name: Heat staking (melted plastic rivet)
    category: print-in-place & 3D-printing joints
    description: A plastic post pushed through a hole and melted over with heat to form a rivet head that holds the parts together
  # 62
  - name: Split-part joints for large prints (dovetail keys, puzzle joints, alignment pins)
    category: print-in-place & 3D-printing joints
    description: Ways to cut a model too big for the printer into pieces that slide, lock or peg back together accurately
  # 63
  - name: Geared hinge (continuous gear hinge)
    category: hinges & pivots
    description: A hinge where two meshing gear-toothed edges roll on each other, so both leaves move together evenly; can be printed in place
  # 64
  - name: Friction hinge (torque hinge)
    category: hinges & pivots
    description: A hinge with built-in friction that stays at any angle you leave it, like a laptop screen
    notes: Also covers hollow-shaft friction hinges that pass wires through the pivot.
  # 65
  - name: Ball-and-socket joint (lockable ball head)
    category: hinges & pivots
    description: A ball held in a cup that can swivel in any direction, sometimes with a clamp to lock it; can be printed in place
    notes: Also covers the pyramid alignment adaptor from prosthetics as a compact screw-locked tilt joint, described for maker use only.
  # 66
  - name: Posable segmented arm (snap-together ball chain, gooseneck)
    category: hinges & pivots
    description: A chain of small ball-and-socket segments that snap together and hold any shape by friction, like a coolant hose or a flexible phone holder
    notes: Also covers the magnetic dial-indicator stand, whose single knob locks all its joints.
  # 67
  - name: Clevis joint (fork-and-pin joint, prong mount)
    category: hinges & pivots
    description: A fork on one part, a tongue on the other and a pin through both, giving a simple strong pivot; interleaved-prong action-camera mounts tighten it with a thumbscrew to set the angle
  # 68
  - name: Rod end and ball link (rose joint, RC ball link)
    category: hinges & pivots
    description: A threaded end with a swivelling ball that joins a push rod to a lever, allowing some tilt and letting the rod length be adjusted, as in RC cars and planes
    notes: Also covers RC pushrod ends such as Z-bends, clevises on threaded rods and set-screw pushrod connectors
  # 69
  - name: Turntable bearing (lazy-Susan bearing, slewing ring)
    category: hinges & pivots
    description: A thin, wide ring bearing that lets a platform turn while carrying weight and tipping loads; printed versions use airsoft BBs as the balls
  # 70
  - name: Telescoping tube twist lock (cam or collet twist lock)
    category: sliding, telescoping & linear motion
    description: Tubes that slide inside each other and lock at any length when you twist a section, by squeezing a split collet or turning a cam
  # 71
  - name: Telescoping tube lever lock (flip lock)
    category: sliding, telescoping & linear motion
    description: A clamp collar with a flip lever that squeezes an outer tube onto an inner one, as on tripod legs and trekking poles
  # 72
  - name: Spring button lock (snap button, push-button tube lock)
    category: sliding, telescoping & linear motion
    description: A spring-loaded button in an inner tube pops out through holes in the outer tube to lock set lengths; press it to slide
  # 73
  - name: Dovetail slide with gib strip (dovetail ways)
    category: sliding, telescoping & linear motion
    description: A carriage with angled edges that slides along a matching angled track, with a tapered strip (gib) that is adjusted to take out any play
  # 74
  - name: Threadless ball screw (rolling-ring drive)
    category: sliding, telescoping & linear motion
    description: Three tilted bearings pressed onto a smooth spinning rod act like a nut and move along it; printable and adjustable, and it slips instead of jamming
  # 75
  - name: Reversing screw (diamond-thread or level-wind screw)
    category: sliding, telescoping & linear motion
    description: A shaft with two crossing grooves so a follower travels back and forth along it while the shaft keeps turning one way, as in fishing reels and filament winders
  # 76
  - name: Multi-stage slide rigging (cascade and continuous string rigging)
    category: sliding, telescoping & linear motion
    description: Ways of running strings or belts through nested slides so one winch extends all the stages, either together (cascade) or one after another (continuous), as in robot lifts
  # 77
  - name: Oldham coupling
    category: clutches & couplings
    description: Three discs with tongue-and-groove slots at right angles that join two shafts which are slightly out of line, while still passing turning force
  # 78
  - name: Jaw coupling (spider coupling)
    category: clutches & couplings
    description: Two hubs with interlocking claws and a rubbery spider between them, joining two shafts while soaking up shocks and small misalignment
  # 79
  - name: Flexible beam coupling (helical-slot coupling)
    category: clutches & couplings
    description: A one-piece coupling with a spiral slot cut round it so it bends to join slightly misaligned shafts without backlash (common on 3D-printer leadscrews)
  # 80
  - name: Universal joint (Hooke's joint, Cardan joint)
    category: clutches & couplings
    description: A cross-shaped piece between two forks that lets one shaft drive another at an angle
  # 81
  - name: Dog clutch (claw clutch)
    category: clutches & couplings
    description: Two parts with interlocking teeth or lugs that slide together to lock drive and apart to disconnect it, with no slipping
  # 82
  - name: Servo horn and spline hub
    category: clutches & couplings
    description: The toothed output shaft (spline) of a hobby servo and the arm or disc that pushes onto it and is held by a screw; how most robot parts attach to a servo
  # 83
  - name: Series-elastic coupling (series elastic actuator)
    category: clutches & couplings
    description: A deliberate spring between a motor gearbox and its output, so the joint absorbs shocks and the spring's stretch can be measured to control force
  # 84
  - name: Cam and follower (plate, barrel and face cams)
    category: motion conversion
    description: A shaped wheel or drum turns and pushes a follower up and down or side to side in a planned pattern
  # 85
  - name: Scotch yoke
    category: motion conversion
    description: A pin on a turning wheel slides in a slot in a sliding bar, turning rotation into smooth back-and-forth straight-line motion
  # 86
  - name: Slider-crank
    category: motion conversion
    description: A crank and connecting rod that turn rotation into back-and-forth sliding, or the reverse, as in an engine piston
  # 87
  - name: Four-bar linkage (incl. parallelogram linkage)
    category: motion conversion
    description: Four bars joined in a loop by pivots, which turns one motion into another shaped motion; the basic building block of most linkages
    notes: Also covers the pantograph (a parallelogram linkage that copies motion at a larger or smaller scale). Also covers lost motion (deliberate free play before the driven part is picked up).
  # 88
  - name: Rack and pinion
    category: motion conversion
    description: A gear (pinion) meshing with a toothed straight bar (rack) to turn rotation into straight-line motion or the reverse
  # 89
  - name: Scissor linkage (lazy tongs, scissor lift)
    category: motion conversion
    description: Crossed bars pinned in the middle and at their ends that stretch out a long way from a small movement, as in scissor lifts and extending mirrors
  # 90
  - name: Iris mechanism
    category: motion conversion
    description: Curved blades that swing in together as a ring turns, closing a round opening evenly like a camera aperture
  # 91
  - name: Whippletree (load-equalising lever)
    category: motion conversion
    description: A floating bar pulled at its middle that shares the pull equally between its two ends, and can be stacked to share it among many, as in wiper blades and robot hands
  # 92
  - name: Twisted-string actuator
    category: motion conversion
    description: A motor twists two or more strings together so they shorten and pull with great force, giving a cheap, light, very high-ratio linear pull
  # 93
  - name: Planetary gear set (epicyclic gearing)
    category: gear trains, gearboxes & transmissions
    description: A central sun gear, planet gears around it and an outer ring gear, giving a compact, strong speed reduction with input and output on the same line
  # 94
  - name: Compound planetary gearbox (split-ring or Wolfrom planetary)
    category: gear trains, gearboxes & transmissions
    description: A planetary set with two ring gears of slightly different tooth counts, giving a very high reduction in one stage; popular in 3D-printed robot actuators
  # 95
  - name: Strain-wave gear (harmonic drive)
    category: gear trains, gearboxes & transmissions
    description: An oval part flexes a thin toothed ring inside a slightly larger ring gear, giving a large, backlash-free reduction in a flat package
  # 96
  - name: Cycloidal drive (cycloidal reducer)
    category: gear trains, gearboxes & transmissions
    description: A lobed disc wobbles around inside a ring of pins, turning slowly as it goes, giving a large, shock-resistant reduction
  # 97
  - name: Differential (bevel gear differential)
    category: gear trains, gearboxes & transmissions
    description: A gear set that lets two output shafts turn at different speeds while sharing the drive, as between the wheels of a car
    notes: Also covers the ball differential used in RC cars and limited-slip types
  # 98
  - name: Bevel gears (incl. mitre and crown gears)
    category: gear trains, gearboxes & transmissions
    description: Cone-shaped gears that pass turning force round a corner, usually at a right angle
  # 99
  - name: Herringbone and helical gears
    category: gear trains, gearboxes & transmissions
    description: Gears with slanted teeth that mesh more smoothly and quietly than straight teeth; herringbone (V-shaped) teeth cancel sideways push and print well
  # 100
  - name: Belt drives (timing, round and V-belt)
    category: gear trains, gearboxes & transmissions
    description: A loop of belt around two pulleys that passes rotation between shafts; toothed timing belts don't slip, round and V-belts can
  # 101
  - name: Capstan cable drive (tendon drive)
    category: gear trains, gearboxes & transmissions
    description: A cable wrapped several turns around a small drum and anchored to a larger drum, giving a smooth, zero-backlash reduction for robot joints
  # 102
  - name: Bowden cable (push-pull cable)
    category: gear trains, gearboxes & transmissions
    description: An inner wire sliding inside a flexible outer sleeve that carries a pull or push around bends, as in bike brakes and 3D-printer extruders
  # 103
  - name: Holding electromagnet (maglock)
    category: powered & active connectors
    description: A coil that holds steel firmly while powered and lets go when the power is cut, as in magnetic door locks and robot tool holders
  # 104
  - name: Electro-permanent magnet
    category: powered & active connectors
    description: A magnet that is switched on or off by a short electric pulse and then holds (or stays released) with no power at all
    notes: Also covers power-free magnetic docking of robot modules (electro-permanent docking faces).
  # 105
  - name: Solenoid latch (solenoid lock, electric strike)
    category: powered & active connectors
    description: An electric coil pulls a spring-loaded bolt or catch back when powered, used to unlock doors, boxes and release mechanisms
  # 106
  - name: Servo or motorised latch
    category: powered & active connectors
    description: A small motor or hobby servo turns a cam, hook or bolt to lock or release, holding its position when power is off
  # 107
  - name: Shape-memory-alloy wire latch (nitinol muscle wire)
    category: powered & active connectors
    description: A thin nickel-titanium wire that shortens when heated by an electric current, pulling a catch to release a latch silently
  # 108
  - name: Electromagnetic brake (power-off, spring-applied)
    category: powered & active connectors
    description: Springs clamp a brake on a motor shaft whenever power is off and a coil pulls it free when powered, so robot joints hold if power fails
  # 109
  - name: Vacuum (suction) gripper
    category: powered & active connectors
    description: A soft cup connected to a vacuum pump or generator that grips smooth objects by suction and lets go when the vacuum is released
    notes: Also covers electroadhesion as an alternative, with a high-voltage safety note.
  # 110
  - name: Granular jamming gripper (coffee-balloon gripper)
    category: powered & active connectors
    description: A soft bag of coffee grounds or grains that moulds around an object, then goes rigid and grips it when the air is sucked out
    notes: Also covers layer jamming (a stack of paper or film stiffened by vacuum).
  # 111
  - name: Magnet joint (embedded magnets, magnetic catch)
    category: clamping, magnetic & friction connections
    description: Pairs of magnets, or a magnet and a steel plate, set into parts so they snap together, align themselves and pull apart by hand
    notes: Also covers programmable (coded) magnet arrays that only mate with a matching pattern.
  # 112
  - name: Switchable permanent magnet (rotary magnetic base)
    category: clamping, magnetic & friction connections
    description: A magnet that is turned on and off by hand with a knob, by rotating one magnet against another, so it holds strongly with no power
  # 113
  - name: Aluminium-extrusion connectors (T-slot nuts and brackets)
    category: clamping, magnetic & friction connections
    description: The nuts, brackets and hidden fasteners that slide into the grooves of T-slot aluminium extrusion to build 3D-printer, CNC and robot frames without welding
    notes: Also covers strut channel and fixed-pitch hole-grid kits (goBILDA, Actobotics, Meccano) as the stepped alternative to a T-slot.
  # 114
  - name: Kinematic coupling (balls in V-grooves)
    category: locating & alignment
    description: Three balls sitting in three V-grooves so a part drops back into exactly the same position every time; used in tool changers and removable print beds
    notes: Also covers kinematic tool-changer mounts, e.g. on multi-tool 3D printers
  # 115
  - name: Self-centring cone and socket (taper locator)
    category: locating & alignment
    description: A cone or tapered pin sliding into a matching socket, which guides two parts into line and centres them as they come together
  # 116
  - name: Keying (one-way-only fit, poka-yoke)
    category: locating & alignment
    description: Uneven pins, notches, tapers or shapes that let a part go together only the right way round, preventing mistakes
    notes: Also covers pin headers and size-keyed barrel plugs as everyday cases, and look-alike barrel plugs as a keying failure.
  # 117
  - name: Constant-force spring (spring-return reel)
    category: springs & energy storage
    description: A tightly curled steel strip that pulls with nearly the same force however far it is unrolled, used in sash-window counterbalances, motor brush holders and cable or hose retractors (tape measures and badge reels mostly use spiral power springs instead)
  # 118
  - name: Ortho-planar spring
    category: springs & energy storage
    description: A flat, one-piece spring cut or printed from sheet whose centre moves in and out of the plane; easy to 3D print or laser cut
  # 119
  - name: Spring balancer (gravity compensation)
    category: springs & energy storage
    description: Springs arranged so they cancel the weight of an arm at any angle, making it feel weightless, as in an anglepoise lamp or a robot arm
    notes: Also covers counterweights as the simplest alternative
  # 120
  - name: Printed leaf spring (flat cantilever spring)
    category: springs & energy storage
    description: A springy strip or arm of plastic or metal that bends to push back; the most practical kind of spring to 3D print
  # 121
  - name: Cam cleat
    category: cord, strap, webbing & textile hardware
    description: Two spring-loaded toothed cams that let a rope pull through one way and grip it the other way; lift the rope up and out to release
    notes: Also covers the plain horn cleat and its cleat hitch as the basic version.
  # 122
  - name: Clam cleat (grooved V-cleat)
    category: cord, strap, webbing & textile hardware
    description: A block with ridged V-shaped grooves that jams a rope pulled into it and releases when the rope is lifted out; no moving parts
    notes: Also covers the plain horn cleat and its cleat hitch as the basic version.
  # 123
  - name: Cam buckle (webbing cam buckle)
    category: cord, strap, webbing & textile hardware
    description: A buckle with a toothed, spring-loaded cam that grips a strap after you pull it tight; press the lever to release
  # 124
  - name: Ladder lock buckle (tension lock, tri-glide)
    category: cord, strap, webbing & textile hardware
    description: A slotted buckle that locks a strap by friction when it is loaded and slides when you tilt it; tri-glides are the simpler non-locking version
    notes: Also covers double D-rings and G-hooks
  # 125
  - name: Side-release buckle
    category: cord, strap, webbing & textile hardware
    description: A plastic buckle whose two springy arms snap into a housing and release when you squeeze both sides, as on backpacks
  # 126
  - name: Cord lock (spring toggle)
    category: cord, strap, webbing & textile hardware
    description: A spring-loaded plunger in a small barrel that grips a cord passing through it; squeeze to slide and adjust
    notes: Also covers the drawstring itself, threaded through a hem or casing or laced through holes.
  # 127
  - name: Magnetic-assisted buckle (magnet guides, catch locks)
    category: cord, strap, webbing & textile hardware
    description: A buckle where magnets pull the two halves together and line them up, then a mechanical catch locks them so the magnet doesn't carry the load
  # 128
  - name: Belt tensioner (spring-loaded idler)
    category: tensioning, reels & take-up
    description: A pulley or roller pushed against a belt or chain by a spring or screw to keep it tight as it stretches
  # 129
  - name: Eccentric adjuster (eccentric nut, spacer or bushing)
    category: adjusters, levellers & spacers
    description: An off-centre spacer or bushing that moves a wheel, pulley or shaft sideways as you turn it, for setting tension or taking up play
  # 130
  - name: O-ring seal
    category: seals & pass-throughs
    description: A rubber ring squeezed in a groove between two parts to seal against water, air or oil; the most reliable way to make a printed enclosure watertight
  # 131
  - name: Gasket (flat, cord-in-groove or cast-in-place)
    category: seals & pass-throughs
    description: A soft layer or cord squeezed between a lid and a housing to seal an opening that isn't round, often pressed into a groove by a ridge on the lid
    notes: 'Also covers sealing washers: the bonded seal (Dowty washer), crush washers and tap washers.'
  # 132
  - name: Labyrinth seal (baffle seal)
    category: seals & pass-throughs
    description: A winding, overlapping path between two parts that keeps out dust and splashes without touching, so it never wears; easy to print into lids and shafts
  # 133
  - name: Hose barb (barbed tube fitting)
    category: seals & pass-throughs
    description: A spigot with sharp ridges that soft tubing is pushed over and gripped by; for low pressure, with a clip added for more hold
    notes: Also covers PEX crimp and clamp-ring fittings and PEX plugs.
  # 134
  - name: Cable gland and strain relief
    category: seals & pass-throughs
    description: A threaded fitting whose nut squeezes a rubber insert around a cable, sealing the hole and stopping the cable being pulled out
    notes: Also covers strain relief for electrical joints, rubber, membrane and desk grommets, cable lacing, and the underwriter's knot.
  # 135
  - name: Slip ring and rotary union
    category: seals & pass-throughs
    description: A joint with sliding contacts (or seals) that carries power, signals or fluid across something that keeps turning, so cables never wind up, as in robot turrets
    notes: Also covers the clockspring (spiral flat cable) as a limited-rotation alternative.
  # 136
  - name: Cable carrier (drag chain, energy chain)
    category: seals & pass-throughs
    description: A chain of hinged hollow links that carries cables and hoses neatly along a moving axis without kinking; one of the most printed functional parts
    notes: Also covers the festoon cable system (cables hung in loops from trolleys running along a track)
  # 137
  - name: Cyanoacrylate (superglue)
    category: adhesives & bonding
    description: A runny or gel glue that sets in seconds by reacting with moisture; strong on tight-fitting plastics, metal and wood but brittle and weak in peel
  # 138
  - name: Two-part epoxy
    category: adhesives & bonding
    description: A resin and hardener mixed together that set into a strong, gap-filling solid; slow or fast types, for metal, wood, most plastics and composites
    notes: Also covers J-B Weld (brand), the epoxy makers often suggest instead of welding.
  # 139
  - name: Solvent welding (solvent cement)
    category: adhesives & bonding
    description: A solvent that softens the surfaces of certain plastics so they fuse together as it evaporates, like acetone on ABS or cement on acrylic and PVC
    notes: Also covers why PE and PP pipe is heat-fused instead.
  # 140
  - name: UV-curing adhesive (incl. resin used as glue)
    category: adhesives & bonding
    description: A liquid that stays wet until hardened in seconds by ultraviolet light, useful for clear parts and for gluing resin prints with the same resin
  # 141
  - name: Hot-melt adhesive (glue gun)
    category: adhesives & bonding
    description: A plastic stick melted in a glue gun that sticks as it cools; quick and gap-filling but weak and softens with heat
    notes: Also covers PLA glue sticks in a high-temperature glue gun, and a dab of hot glue to stop screw-terminal wires working loose.
  # 142
  - name: Double-sided foam tape (acrylic foam pressure-sensitive adhesive)
    category: adhesives & bonding
    description: A tape with sticky foam that grips on contact and stays flexible, mounting parts without drilling; pressure-sensitive adhesive (PSA)
  # ==================== TIER 2: other unusual types ====================
  # 143
  - name: Magnetic coupling and magnetic gear
    category: torque limiting & slip
    description: Magnets on two parts pass turning force through a gap or a wall without touching, and simply slip if overloaded
  # 144
  - name: Tolerance ring (wavy-band press fit)
    category: torque limiting & slip
    description: A wavy spring-steel band squeezed between a shaft and a hole that holds by friction, soaks up loose sizes and heat growth, and slips at a set torque
  # 145
  - name: Centrifugal clutch
    category: clutches & couplings
    description: Weights on a spinning hub fly outwards as speed rises and press against a drum to engage drive automatically, as in go-karts and chainsaws
  # 146
  - name: Self-locking wedge (wedge clamp, taper key)
    category: self-locking & anti-back-drive
    description: A shallow wedge driven into a gap that stays put by friction, holding parts tightly until tapped back out
  # 147
  - name: Inertia-locking reel (seat-belt lock, centrifugal catch)
    category: self-locking & anti-back-drive
    description: A reel that pays out freely when pulled slowly but locks instantly when jerked, by a swinging weight or flyweight catching a ratchet
  # 148
  - name: Woven self-tightening grip (finger-trap grip)
    category: self-locking & anti-back-drive
    description: A braided tube that gets narrower and grips harder the more it is pulled, like a Chinese finger trap or a cable-pulling sock
    notes: Also covers the whoopie sling (an adjustable spliced sling using the finger-trap grip).
  # 149
  - name: Rope grab and ascender (cam rope clamp)
    category: cord, strap, webbing & textile hardware
    description: A toothed cam that lets a clamp slide up a rope but grips hard when loaded downwards, used for climbing and hauling
  # 150
  - name: Turnbuckle
    category: tensioning, reels & take-up
    description: A threaded sleeve with left- and right-hand threads at its ends, so turning it pulls two rods or cables together to tighten them
  # 151
  - name: Capstan and windlass (incl. differential windlass)
    category: tensioning, reels & take-up
    description: A drum turned by a crank that winds in rope with a big force; rope wrapped round a drum also holds a large load with a small pull
    notes: Also covers the Spanish windlass (a rope loop twisted with a stick to pull two points together), for non-medical use only.
  # 152
  - name: Shock-corded sectional pole
    category: tensioning, reels & take-up
    description: Tube sections with elastic cord running through them that pulls each joint home, so a tent pole or wand almost assembles itself
  # 153
  - name: Ratchet tie-down strap (ratchet buckle)
    category: cord, strap, webbing & textile hardware
    description: A lever with a ratchet that winds webbing onto a slotted spool to tighten a load strap, and releases with a trigger
  # 154
  - name: Guy-line slider (friction line tensioner)
    category: cord, strap, webbing & textile hardware
    description: A small plate with holes that a cord threads through so it holds by friction under load but slides to adjust when unloaded, as on tent lines
  # 155
  - name: Quick-release hooks (pelican hook, three-ring release)
    category: cord, strap, webbing & textile hardware
    description: Hooks and ring stacks that hold a heavy load on a rope or strap but let it go with a small pull on a pin, lever or cord
    notes: Also covers the snap shackle
  # 156
  - name: Spring-gate hook (carabiner, snap hook, lobster clasp)
    category: cord, strap, webbing & textile hardware
    description: A hook with a spring-loaded gate that snaps shut behind a ring or rope, sometimes with a screw or twist lock on the gate
  # 157
  - name: Hook-and-loop fastener
    category: cord, strap, webbing & textile hardware
    description: Two fabric strips, one with tiny hooks and one with loops, that stick together when pressed and peel apart
  # 158
  - name: Zipper (slide fastener)
    category: cord, strap, webbing & textile hardware
    description: Two rows of teeth that a slider meshes together or separates as it moves, closing a long opening in one pull
  # 159
  - name: Cam latch (quarter-turn cam lock)
    category: locks, latches & catches
    description: A knob or key turns a flat arm (cam) behind a panel so it hooks over the frame and holds a door or lid shut
  # 160
  - name: Mechanical interlock
    category: locks, latches & catches
    description: A blocking part that stops one action while another is happening, such as a lid that can't open while a machine runs
  # 161
  - name: Pin-tumbler lock (and other tumbler locks)
    category: locks, latches & catches
    description: A key lifts spring-loaded pins or levers to exactly the right heights so a plug can turn; the everyday door lock
  # 162
  - name: Combination lock (wheel pack)
    category: locks, latches & catches
    description: Several wheels with notches that line up only when each is turned to the right number, letting a bar or shackle move
  # 163
  - name: Rotary latch (claw latch)
    category: locks, latches & catches
    description: A rotating jaw that swings shut around a striker bar and is held by a catch, as in car doors and hatches; releases when a lever or cable trips the catch
  # 164
  - name: Folding-blade lock (liner lock, lockback, slip joint)
    category: locks, latches & catches
    description: A pivot that locks a folding blade or arm open when a spring bar or rocker drops behind it; a slip joint only holds it with a detent
  # 165
  - name: Tamper-evident breakaway bridge (frangible link)
    category: locks, latches & catches
    description: Thin plastic bridges that must snap the first time a cap or lid is opened, showing that it has been opened
  # 166
  - name: Quick couplers for tubes and hoses (push-to-connect, sleeve lock)
    category: quick-release & tool-free
    description: Fittings that grip a tube when it is pushed in and release when a collar is pressed or a sleeve is pulled back
    notes: Also covers cam-and-groove (camlock) couplings, plastic thumb-latch lab couplings, and push-fit plumbing reuse and square-cut rules.
  # 167
  - name: DIN-rail clip (top-hat rail snap mount)
    category: quick-release & tool-free
    description: A spring clip that hooks over one edge of a standard metal rail and snaps onto the other, so modules click on and off
    notes: Also covers terminal blocks, the commonest thing on a DIN rail.
  # 168
  - name: Indexable clamping lever (ratchet handle)
    category: quick-release & tool-free
    description: A clamping handle on a toothed spline that you lift to swing round without turning the screw, then let spring back to tighten again, for tight spaces
  # 169
  - name: Spring bar (spring-loaded telescoping pin)
    category: quick-release & tool-free
    description: A tube with spring-loaded ends that pop into holes to hold a strap between two lugs, as on watch straps; quick-release versions have a small lever
  # 170
  - name: Band flange clamp (V-band clamp, tri-clamp)
    category: quick-release & tool-free
    description: A hinged band with a V-shaped groove that wedges two flanged ends together as it is tightened, for quick-disconnect pipes, ducts and brewing kit
    notes: Also covers the grooved pipe coupling (rolled grooves, a gasket and a bolted housing).
  # 171
  - name: Temporary sheet fastener (Cleco-type spring pin)
    category: quick-release & tool-free
    description: A spring-loaded pin fitted from one side with pliers that clamps sheets in line through a hole while they are drilled or riveted, then comes out again
  # 172
  - name: Press stud (snap fastener, popper)
    category: snap & clip fits
    description: A small metal or plastic stud that snaps into a socket with a springy ring, as on clothing and bags
  # 173
  - name: Spring-steel push-on fasteners (push nut, speed nut, U-nut)
    category: snap & clip fits
    description: Stamped spring-steel clips whose prongs bite onto a plain shaft or screw when pushed on, fast to fit and resistant to shaking loose
    notes: Also covers the cage nut (a square nut in a spring-steel cage) used in 19-inch racks.
  # 174
  - name: Lamina emergent torsional joint (LET joint)
    category: compliant mechanisms & flexures
    description: A pattern of cuts in flat sheet that lets part of it twist out of the plane like a hinge, for laser-cut or printed flat mechanisms
  # 175
  - name: Rolling-contact joint (CORE, Jacob's-ladder hinge)
    category: compliant mechanisms & flexures
    description: Two curved surfaces held together by straps or bands so they roll on each other instead of rubbing, giving a low-friction hinge
  # 176
  - name: Mechanical metamaterial mechanism (shear-cell hinge arrays)
    category: compliant mechanisms & flexures
    description: A block made of a repeating grid of tiny cells that bend in a planned way, so the whole block works like a mechanism
  # 177
  - name: Tape-spring hinge (measuring-tape fold)
    category: compliant mechanisms & flexures
    description: A curved metal or plastic strip that folds with a sharp kink and snaps back straight and stiff, like a tape measure, used in deployable booms
  # 178
  - name: Origami mechanisms (waterbomb, Kresling, thick-panel origami)
    category: compliant mechanisms & flexures
    description: Fold patterns used as joints so flat sheets or panels fold up, expand or twist in a planned way
    notes: Also covers kirigami (a slit sheet that pops into 3D when stretched, and kirigami grippers).
  # 179
  - name: Press-fit and expanding inserts (tap-in insert)
    category: print-in-place & 3D-printing joints
    description: Threaded inserts that are pushed or tapped into a hole and held by barbs, or expand as the screw goes in, as an alternative to heat-set inserts
    notes: 'Also covers SPIROL''s findings for prints: press-in inserts work best in resin, and expansion inserts are the weakest.'
  # 180
  - name: Gimbal
    category: hinges & pivots
    description: Rings pivoted at right angles to each other so the object in the middle can tilt freely in two or three directions, as in camera stabilisers
  # 181
  - name: Clip-on concealed hinge (cup hinge)
    category: hinges & pivots
    description: A hidden cabinet hinge that sits in a round pocket in the door and clips on and off its mounting plate without tools, with adjusting screws
  # 182
  - name: Invisible barrel hinge (Soss-type)
    category: hinges & pivots
    description: A hinge made of folding links that hides completely inside the edges of the door and frame when closed
  # 183
  - name: Virtual-pivot linkage (remote centre of motion)
    category: hinges & pivots
    description: A linkage that makes a part rotate about a point in empty space where there is no actual pin, as in some robot wrists and folding mechanisms
  # 184
  - name: Self-closing hinges (spring hinge, rising butt hinge)
    category: hinges & pivots
    description: Hinges that swing a door or lid shut by themselves, using a spring or a sloping knuckle that lifts the door as it opens
  # 185
  - name: Lid and flap stays (folding stay, friction stay)
    category: hinges & pivots
    description: 'Arms that hold a lid or flap open: a folding stay locks just past straight, a sliding stay holds by adjustable friction'
  # 186
  - name: Drawer slide (telescopic ball-bearing slide)
    category: sliding, telescoping & linear motion
    description: Nested metal channels with ball bearings that let a drawer or robot lift extend smoothly, sometimes with a lock-out or soft close
  # 187
  - name: Ball screw
    category: sliding, telescoping & linear motion
    description: A screw and nut with balls rolling between them, turning rotation into straight-line motion with very low friction; it can be back-driven
  # 188
  - name: Differential screw (fine adjustment screw)
    category: sliding, telescoping & linear motion
    description: One screw with two slightly different thread pitches, so each turn moves the part by only the small difference, for very fine adjustment
  # 189
  - name: Rigid chain actuator (zip chain, push chain)
    category: sliding, telescoping & linear motion
    description: A chain whose links lock into a stiff column as they come out of a housing, so it can push as well as pull and packs away small
  # 190
  - name: Spline shaft (sliding spline)
    category: clutches & couplings
    description: A shaft with lengthwise ridges fitting a matching hub, passing turning force while letting the hub slide along the shaft
    notes: Also covers hex shafts and LEGO-style cross axles. Also covers the Bendix starter drive as the helical-spline example.
  # 191
  - name: Constant-velocity joint (CV joint)
    category: clutches & couplings
    description: A joint that drives a shaft at an angle without the speed wobble of a simple universal joint, using balls in curved tracks
  # 192
  - name: Friction clutch (plate or cone clutch)
    category: clutches & couplings
    description: Friction surfaces pressed together to connect drive and pulled apart to disconnect it, able to slip gently while engaging
  # 193
  - name: Keyless locking bush (taper-lock bush, shaft locking device)
    category: clutches & couplings
    description: Tapered rings squeezed by screws that grip a smooth shaft and hub by friction, fixing a pulley or gear without keys or flats
  # 194
  - name: Schmidt coupling (offset coupling)
    category: clutches & couplings
    description: Three discs joined by links that pass rotation between two parallel shafts which are well out of line, at constant speed
  # 195
  - name: Flexible drive shaft (rotating cable)
    category: clutches & couplings
    description: Layers of wound wire in a sleeve that carry rotation round bends, as in rotary-tool extensions and speedometer cables
  # 196
  - name: Quick-return mechanism (Whitworth, crank and slotted lever)
    category: motion conversion
    description: A crank driving a slotted lever so the working stroke is slow and the return stroke is fast, as in shaping machines
  # 197
  - name: Straight-line linkages (Watt, Chebyshev, Peaucellier)
    category: motion conversion
    description: Linkages of pivoted bars arranged so one point moves in a straight or nearly straight line without any slide
    notes: Also covers the Tusi couple (a rolling-circle straight-line mechanism)
  # 198
  - name: Escapement (anchor or verge escapement)
    category: motion conversion
    description: A rocking catch that lets a spring- or weight-driven wheel advance one tooth at a time in a steady rhythm, as in clocks
  # 199
  - name: Bell crank (angle lever)
    category: motion conversion
    description: An L-shaped lever on a pivot that turns a push or pull round a corner, and can change its size, as in RC and aircraft controls
  # 200
  - name: Swashplate and wobble plate
    category: motion conversion
    description: A tilted disc on a shaft that turns rotation into back-and-forth motion of rods around it, or the reverse; also tilts helicopter blades
  # 201
  - name: Anti-backlash gear (split scissor gear)
    category: gear trains, gearboxes & transmissions
    description: A gear made of two halves sprung against each other so its teeth fill the gaps of the mating gear, removing play
  # 202
  - name: Chain and sprocket drive
    category: gear trains, gearboxes & transmissions
    description: A roller chain running on toothed wheels (sprockets) to pass strong, non-slipping rotation between shafts some distance apart
  # 203
  - name: Non-circular gears
    category: gear trains, gearboxes & transmissions
    description: Oval or oddly shaped gears that mesh while turning, so the output speeds up and slows down during each turn
  # 204
  - name: Lantern gear (pin gear)
    category: gear trains, gearboxes & transmissions
    description: A gear made of pins between two discs, easy to make from dowels or laser-cut sheet, used in mills and simple machines
    notes: Also covers the mangle wheel (steady turning into back-and-forth turning).
  # 205
  - name: Friction drives and CVTs (friction wheel, variator)
    category: gear trains, gearboxes & transmissions
    description: A wheel or roller pressed against a disc, cone or another wheel that drives it by friction with no teeth, so it has no backlash, slips when overloaded and, on cones or discs, can change ratio smoothly
  # 206
  - name: Pulley system (block and tackle, differential hoist)
    category: gear trains, gearboxes & transmissions
    description: Ropes running over several pulleys so a small pull lifts a big load; a differential chain hoist also holds the load by itself
    notes: Also covers low-friction rings as a pulley with no moving parts.
  # 207
  - name: Electromagnetic clutch
    category: powered & active connectors
    description: A coil that pulls two plates together to connect a drive when powered and lets them separate when switched off
  # 208
  - name: Thermal actuators (bimetal strip, wax motor)
    category: powered & active connectors
    description: Parts that move when heated, a strip of two bonded metals that bends or a capsule of wax that expands, used to trip or open a latch
  # 209
  - name: Burn-wire and fusible-link release (one-shot thermal release)
    category: powered & active connectors
    description: A cord or low-melting link that holds something until an electric current or heat melts or cuts it, as in satellite and balloon releases
  # 210
  - name: Compression fitting (ferrule fitting)
    category: seals & pass-throughs
    description: A nut that squeezes a ring (ferrule or olive) onto a tube to grip and seal it, undone and remade with spanners
    notes: Also covers sink-trap slip joints, press (crimp) fittings, and the rules that compression joints must stay reachable and aren't for brake-pipe repairs.
  # 211
  - name: Friction brake (band, drum or disc brake)
    category: brakes, dampers & speed control
    description: Friction pads or a band pressed on a turning drum or disc to slow or hold it; a band brake grips harder the further it wraps round
  # 212
  - name: Eddy-current brake (magnetic brake)
    category: brakes, dampers & speed control
    description: A magnet near a moving metal plate that drags on it without touching, more strongly the faster it moves; smooth but can't hold anything still
  # 213
  - name: Speed governor (fly fan, centrifugal governor)
    category: brakes, dampers & speed control
    description: Air vanes or flyweights that keep a spring- or weight-driven mechanism running at a steady speed, as in music boxes and clock chimes
  # 214
  - name: Dampers (rotary and linear soft-close dampers)
    category: brakes, dampers & speed control
    description: Parts filled with oil or air that slow a movement down, so lids, drawers and doors close gently instead of slamming
    notes: Also covers one-shot crush absorbers (crushable foam, honeycomb and crumple zones) that must be replaced after one hit.
  # 215
  - name: Elastomer isolation mount (rubber bobbin mount, isolator grommet)
    category: brakes, dampers & speed control
    description: Rubber blocks, grommets or bobbins between a part and its frame that soak up vibration and noise, as under 3D-printer motors and fans
  # 216
  - name: Suction cup
    category: clamping, magnetic & friction connections
    description: A soft rubber cup pressed onto a smooth surface so air pressure holds it on; some have a lever to increase the suction
  # 217
  - name: Taper fit (Morse taper)
    category: clamping, magnetic & friction connections
    description: A slightly tapered shaft pushed into a matching tapered hole that locks by friction and is knocked apart with a wedge, as in drill chucks
    notes: Also covers the Luer taper and Luer lock (syringe and tubing fittings)
  # 218
  - name: Press fit (interference fit)
    category: clamping, magnetic & friction connections
    description: A part pushed into a hole that is slightly too small for it, so it is held by the squeeze alone (bearings, pins, printed parts)
  # 219
  - name: Collet (and keyless chuck)
    category: clamping, magnetic & friction connections
    description: A slotted sleeve squeezed by a nut or taper so it closes evenly around a round shaft or tool, gripping it centred
  # 220
  - name: Clamp-on tube fittings (slip-on structural fittings)
    category: clamping, magnetic & friction connections
    description: Tees, elbows and crosses that slide onto round tube and lock with set screws, building frames and rails that can be taken apart
    notes: Also covers rod-to-rod cross clamps (the lab boss head) and the external-fixator frame idea, described only for building frames and jigs.
  # 221
  - name: Internal tube anchors (star nut, expansion plug)
    category: clamping, magnetic & friction connections
    description: Parts pushed into the end of a tube that grip the inside with barbs, a squeezed rubber plug or a wedge, giving a thread or a clamp point
  # 222
  - name: Blind threaded fixings (rivet nut, well nut)
    category: clamping, magnetic & friction connections
    description: Threaded inserts fitted from one side only that swell behind thin sheet or a tube wall; a rubber well nut also seals and damps vibration
  # 223
  - name: PVA wood glue (white and yellow glue)
    category: adhesives & bonding
    description: A water-based glue that dries by soaking into porous materials like wood, paper and cork; strong on wood, with water-resistant grades
    notes: Also covers fabric and tacky glues (many are acrylic, not PVA) and anti-fray seam sealant.
  # 224
  - name: Contact adhesive (contact cement)
    category: adhesives & bonding
    description: A rubbery glue spread on both surfaces, left to dry until tacky, then pressed together to bond instantly; good for sheets, rubber, fabric and leather
  # 225
  - name: Polyurethane glue (foaming moisture-cure glue)
    category: adhesives & bonding
    description: A glue that cures by reacting with moisture and foams as it sets, filling gaps; bonds wood, stone, metal, foam and some plastics
  # 226
  - name: Structural acrylic and low-surface-energy plastic adhesives (for PE and PP)
    category: adhesives & bonding
    description: Two-part acrylic glues, and primers used with superglue, that bond tough slippery plastics like polyethylene and polypropylene which most glues can't
  # 227
  - name: Silicone and MS-polymer adhesive sealants
    category: adhesives & bonding
    description: Rubbery glues that cure from moisture in the air into a flexible, waterproof bond that also seals gaps
  # 228
  - name: Elastomeric solvent glue (flexible craft glue)
    category: adhesives & bonding
    description: Thick, clear, rubbery solvent-based glues that stay flexible, for bonding dissimilar materials, fabric, shoes and jewellery
  # 229
  - name: Anaerobic adhesive (threadlocker, retaining compound)
    category: adhesives & bonding
    description: A liquid that hardens only when shut off from air between close-fitting metal parts, used to stop screws loosening or to fix bearings on shafts
  # 230
  - name: Stretch-release adhesive strips
    category: adhesives & bonding
    description: Sticky strips that hold firmly but come away cleanly when you pull the tab slowly along the wall, leaving no residue
  # 231
  - name: Hide glue (animal glue)
    category: adhesives & bonding
    description: A traditional glue made from animal collagen that can be undone later with heat and moisture, used in instrument making and furniture repair
  # 232
  - name: Epoxy putty (kneadable two-part putty)
    category: adhesives & bonding
    description: Two doughs kneaded together that set hard in place, for filling gaps, repairing and building up shapes that can then be drilled and tapped
  # 233
  - name: Elastic averaging (many-feature alignment)
    category: locating & alignment
    description: Many small springy features (ribs, bumps, teeth) that each flex a little so their errors average out, locating parts accurately and repeatably
  # 234
  - name: Locating pins and hole-and-slot
    category: locating & alignment
    description: One pin in a round hole and one in a slot, so parts line up in exactly one position without jamming when sizes vary a little
    notes: Also covers the spigot or register (a round boss in a bore that centres a motor face or chuck).
  # 235
  - name: Exact-constraint mounting (3-2-1 locating)
    category: locating & alignment
    description: Holding a part with exactly as many contact points as it needs (three on a face, two on an edge, one on an end), so it sits the same way every time without strain
  # 236
  - name: Wave and disc springs (compact axial springs)
    category: springs & energy storage
    description: Wavy flat rings or dished washers that give a strong spring force in a very short height, used to preload bearings and take up play
  # 237
  - name: Gas spring (incl. lockable gas spring)
    category: springs & energy storage
    description: A sealed cylinder of pressurised gas whose rod pushes out with a steady force, holding up lids and hatches; lockable types hold at any length
  # 238
  - name: Spiral power spring (clock spring)
    category: springs & energy storage
    description: A flat strip coiled into a spiral that stores energy when wound and releases it as it unwinds, as in clockwork and retracting cords
  # ---- joinery for wood, sheet and panels (lowest priority by making method) ----
  # 239
  - name: Tab-and-slot joint (self-fixturing sheet joint)
    category: interlocking joints & joinery
    description: Tabs on one flat part fit through slots in another so the parts hold each other in place, for laser-cut, CNC and sheet-metal assemblies
  # ---- joinery for wood, sheet and panels (lowest priority by making method) ----
  # 240
  - name: T-slot joint (captive nut and bolt joint)
    category: interlocking joints & joinery
    description: A T-shaped cut-out in the edge of a sheet holds a square nut so a bolt through the other part can clamp them together; common in laser-cut boxes
  # ---- joinery for wood, sheet and panels (lowest priority by making method) ----
  # 241
  - name: Snap-lock sheet joint (barbed or spring finger)
    category: interlocking joints & joinery
    description: Sheet tabs with barbs or springy fingers that click into slots and stay put with no glue or screws
  # ---- joinery for wood, sheet and panels (lowest priority by making method) ----
  # 242
  - name: Cross-halving slot joint (egg-crate joint)
    category: interlocking joints & joinery
    description: Two flat parts each slotted halfway so they slide together into a cross, used for grids, dividers and slot-together furniture
  # ---- joinery for wood, sheet and panels (lowest priority by making method) ----
  # 243
  - name: Finger joint (box joint)
    category: interlocking joints & joinery
    description: Interlocking rectangular fingers along two edges that join at a corner, as in laser-cut boxes and wooden drawers
  # ---- joinery for wood, sheet and panels (lowest priority by making method) ----
  # 244
  - name: Kerf bending (laser-cut living hinge)
    category: interlocking joints & joinery
    description: A pattern of cuts that lets stiff sheet like plywood or acrylic bend around curves or fold like a hinge
  # ---- joinery for wood, sheet and panels (lowest priority by making method) ----
  # 245
  - name: Dovetail joint (through and half-blind)
    category: interlocking joints & joinery
    description: Flared tails and pins that interlock so the joint can't be pulled apart in one direction; the classic drawer corner
  # ---- joinery for wood, sheet and panels (lowest priority by making method) ----
  # 246
  - name: Sliding dovetail
    category: interlocking joints & joinery
    description: A flared tongue that slides along a matching flared groove, locking against pull-out while still sliding lengthwise
  # ---- joinery for wood, sheet and panels (lowest priority by making method) ----
  # 247
  - name: Mortise and tenon (incl. wedged, drawbored and tusk tenons)
    category: interlocking joints & joinery
    description: A tongue (tenon) on one part fits a hole (mortise) in the other; wedges, offset pegs or a removable tusk wedge lock it
  # ---- joinery for wood, sheet and panels (lowest priority by making method) ----
  # 248
  - name: Butterfly key (bow-tie key)
    category: interlocking joints & joinery
    description: A bow-tie-shaped insert set into both parts across a joint or crack so they can't pull apart; also used as a CNC sheet connector
  # ---- joinery for wood, sheet and panels (lowest priority by making method) ----
  # 249
  - name: Japanese interlocking joints (splices and three-way corners)
    category: interlocking joints & joinery
    description: Traditional wood joints like the gooseneck splice and the three-way corner that lock together by shape alone, often with wedges or pegs
  # ---- joinery for wood, sheet and panels (lowest priority by making method) ----
  # 250
  - name: Knock-down cam-lock and cross-dowel connectors
    category: interlocking joints & joinery
    description: Flat-pack fittings where a turning cam grabs a bolt head, or a barrel nut takes a bolt through the other panel, so furniture can be taken apart
    notes: Also covers how Confirmat screws compare with cams.
  # ---- joinery for wood, sheet and panels (lowest priority by making method) ----
  # 251
  - name: Wedge dowel (click-in grooved dowel)
    category: interlocking joints & joinery
    description: A ribbed dowel that clicks into a groove and wedges the panels tightly together, with no screws or tools
  # ---- joinery for wood, sheet and panels (lowest priority by making method) ----
  # 252
  - name: Lever-cam panel connector (self-clamping click connector)
    category: interlocking joints & joinery
    description: A hidden fitting set into a slot that is locked with a turn of a key or clicks shut by itself, pulling panels together; releasable
  # ---- joinery for wood, sheet and panels (lowest priority by making method) ----
  # 253
  - name: Folded seam (hem, lock seam, Pittsburgh lock)
    category: interlocking joints & joinery
    description: Sheet-metal edges folded over each other and pressed flat so they lock together without welding or fasteners
  # ---- joinery for wood, sheet and panels (lowest priority by making method) ----
  # 254
  - name: Bent or twisted tab through a slot (lanced tab)
    category: interlocking joints & joinery
    description: A tab on one sheet-metal part goes through a slot in the other and is bent over or twisted to lock them together
  # ---- joinery for wood, sheet and panels (lowest priority by making method) ----
  # 255
  - name: Clinching (press joining without rivets)
    category: interlocking joints & joinery
    description: A punch and die press two metal sheets into a button shape that locks them together, with no rivet, screw or heat
  # ---- joinery for wood, sheet and panels (lowest priority by making method) ----
  # 256
  - name: Self-clinching fastener (press-in nut or stud)
    category: interlocking joints & joinery
    description: A nut, stud or standoff pressed into a hole in thin sheet metal so the metal flows into its grooves and holds it for good
  # ==================== TIER 3: generic baseline entries (at most one per family) ====================
  # 257
  - name: Ordinary screw joint (bolt and nut, machine screw)
    category: clamping, magnetic & friction connections
    description: A bolt through the parts into a nut or tapped thread, clamping them together; the baseline everything else is compared with
    notes: Also covers washers by job, the carriage (coach) bolt, and robot-kit hole grids.
  # 258
  - name: Self-tapping screw into plastic (thread-forming screw)
    category: print-in-place & 3D-printing joints
    description: A screw that cuts or forms its own thread in a plain hole in a printed or moulded part; simple but wears out after a few uses
    notes: Also covers self-drilling (Tek-type) screws for sheet metal.
  # 259
  - name: Retaining ring (circlip, E-clip)
    category: snap & clip fits
    description: A springy metal ring that snaps into a groove on a shaft or in a hole to stop parts sliding off
  # 260
  - name: Thread-locking hardware (nylon-insert nut, lock washer, split pin)
    category: self-locking & anti-back-drive
    description: Nuts, washers and pins that stop threaded joints shaking loose by friction, springiness or a physical block
  # 261
  - name: Tool-free fasteners (thumbscrew, wing nut, hitch pin and R-clip)
    category: quick-release & tool-free
    description: Ordinary fasteners shaped to be done up by hand, as a simple quick-release baseline
  # 262
  - name: Basic latches (spring latch, slide bolt, hook and eye)
    category: locks, latches & catches
    description: The everyday door latch with a sloped spring bolt, a sliding bolt, and a hook in an eye; the latch baseline
    notes: Also covers the sewn garment hook and eye.
  # 263
  - name: Knuckle hinge (butt hinge)
    category: hinges & pivots
    description: Two leaves joined by a pin through interlocking knuckles; the ordinary door hinge
  # 264
  - name: Plain pivot and rolling bearing (pin in hole, shoulder bolt, ball bearing)
    category: hinges & pivots
    description: A shaft or pin turning in a hole, or in a ball bearing, as the basic way to make something rotate
    notes: Also covers thrust washers as the simplest end-float bearing.
  # 265
  - name: Linear guides (bushings on rods, wheels or carriages on rails)
    category: sliding, telescoping & linear motion
    description: The standard ways to make something slide in a straight line, from plastic bushings on steel rods to wheels and carriages on rails
  # 266
  - name: Shaft-to-hub joints and rigid couplings (key, set screw, D-flat, clamp hub)
    category: clutches & couplings
    description: The ordinary ways to fix a gear, pulley or wheel to a shaft, or join two shafts rigidly end to end
    notes: Also covers shaft collars. Also covers coiled spring pins through a hub, and welding or soldering a hub on for good.
  # 267
  - name: Spur gear pair and gear train (simple, compound, idler)
    category: gear trains, gearboxes & transmissions
    description: Straight-toothed gears on parallel shafts, alone or in chains, as the baseline way to change speed and turning force
  # 268
  - name: Coil spring (compression, extension, torsion)
    category: springs & energy storage
    description: Wire wound into a coil that pushes, pulls or twists back; the baseline spring
    notes: Also covers the repelling-magnet (magnetic) spring as an alternative.
  # 269
  - name: Basic strap and garment closures (prong buckle, button, toggle and loop)
    category: cord, strap, webbing & textile hardware
    description: The everyday belt buckle with a prong, buttons and toggles in loops; the strap and textile baseline
    notes: Also covers sewn garment hooks and eyes and sew-on snaps.
  # 270
  - name: Glued joint design (butt, lap and scarf joints; peel vs shear)
    category: adhesives & bonding
    description: How the shape of a glued joint decides its strength, since most glues are strong in shear and weak when peeled or pulled straight apart
  # 271
  - name: Butt and lap wood joints (screwed, pocket-hole, half-lap)
    category: interlocking joints & joinery
    description: Simple wood joints where parts meet end to face or overlap, held by screws, glue or angled pocket screws; the joinery baseline
    notes: Also covers toe-nailing and clinched nails.
  # 272
  - name: Dowel and biscuit joints
    category: interlocking joints & joinery
    description: Round wooden pins or flat oval wafers glued into matching holes or slots in both parts to align and strengthen a joint
  # 273
  - name: Tongue-and-groove joint (incl. sliding-lid grooves)
    category: interlocking joints & joinery
    description: A ridge on one edge fitting a groove in the other, joining boards edge to edge or letting a lid slide into a box
  # 274
  - name: Blind rivet (pop rivet)
    category: interlocking joints & joinery
    description: A hollow rivet set from one side with a hand tool that pulls a mandrel to swell the far end; the sheet-metal baseline

  # ==================== ADDED 2026-09-29 (/research-add-items) ====================
  # Three items suggested by the run 2 agents (review-notes.md), then 22 found by a web-search
  # gap pass (outline-notes.md). Kept in priority order: tier 1 (275-290), then tier 2 (291-299,
  # joinery last). Numbered after 274 so existing item numbers and file names don't change.
  # 275
  - name: Iris valve (twisted-sleeve valve)
    category: seals & pass-throughs
    description: A fabric or rubber sleeve held between two rings that twists shut like a drawstring when one ring is turned, closing a tube or hopper opening without any blades
    notes: Different from the Iris mechanism, which uses sliding blades. Also covers the pinch valve (a soft tube squeezed shut from outside)
  # 276
  - name: Twisted-and-coiled polymer muscle (fishing-line artificial muscle)
    category: powered & active connectors
    description: Nylon fishing line or sewing thread twisted until it coils like a spring, so it shortens and pulls when heated (by a wrapped heating wire or warm air) and relaxes as it cools
    notes: A heat-driven cousin of the Twisted-string actuator, which needs a motor
  # 277
  - name: Bernoulli gripper (non-contact air gripper)
    category: powered & active connectors
    description: A pad that blows a thin, fast stream of air outwards so the low pressure draws a flat part close and holds it on a cushion of air, for thin wafers, glass, film or fabric
    notes: Unlike the Vacuum (suction) gripper it has no seal and barely touches the part. Also covers electroadhesion as an alternative, with a high-voltage safety note. Also list hydraulics, pneumatics & vacuum in other_families
  # 278
  - name: Tendon-driven joint (cable-pulled finger or tentacle)
    category: motion conversion
    description: A string pulled from a distance bends a chain of hinged or flexible segments, as in printed robot hands and tentacles, with elastic cord or a second string pulling them back
    notes: Different from the Bowden cable (only the sleeve) and the Posable segmented arm (not driven). Also covers spring-closed (voluntary-opening) versus cable-closed (voluntary-closing) grippers, described for maker use only.
  # 279
  - name: Walking linkage (Jansen and Klann leg mechanisms)
    category: motion conversion
    description: A linkage of bars driven by one turning crank whose foot traces a flat stride and then lifts, so a machine walks instead of rolling (as in Theo Jansen's wind-walking sculptures)
  # 280
  - name: Magnetic detent (magnet click stops)
    category: indexing & detents
    description: Small magnets that pull a knob, dial or slider into set positions, giving a click feel without any parts rubbing or wearing
  # 281
  - name: Multi-material interlock (co-printed rigid and flexible parts)
    category: print-in-place & 3D-printing joints
    description: Two plastics that don't stick to each other, such as soft TPU and rigid PLA, printed together with small interwoven beams or dovetails across the seam so they lock by shape
    notes: Now a slicer setting in some slicers; also covers hand-designed interlocking features between materials
  # 282
  - name: Elastic band and elastic cord springs (elastomer springs)
    category: springs & energy storage
    description: Rubber bands, elastic cord or rubber tubing used as stretchy springs, for example to pull a printed finger straight again; they stretch much further than steel springs but creep and perish
  # 283
  - name: Soft pneumatic bending actuator (air-powered soft finger)
    category: hydraulics, pneumatics & vacuum
    description: A rubbery finger cast in silicone or printed in TPU with air chambers along one side, so it curls to grip when pumped full of air and straightens when the air is let out
    notes: Also known by the research name PneuNet (pneumatic network). Also covers fibre-reinforced soft actuators. Also list powered & active connectors and compliant mechanisms & flexures in other_families
  # 284
  - name: Scroll mechanism (self-centring scroll chuck, spiral-slot plate)
    category: clamping, magnetic & friction connections
    description: Turning one plate with a spiral groove or spiral slots moves three or more jaws in or out together, so they always grip a part centred
  # 285
  - name: Multi-turn rotation limiter (travelling-nut and stacked-ring stops)
    category: hinges & pivots
    description: A hard stop that lets a shaft turn more than one full turn and then halts it, for example so a robot turret can't wind its cables off
    notes: Also covers stop work on clock mainsprings; the Geneva stop is covered under Geneva drive. Also covers lost motion, the principle behind its stacked-ring stops.
  # 286
  - name: Genderless connector (hermaphroditic coupling)
    category: quick-release & tool-free
    description: "A coupling whose two halves are identical, so any two pieces mate: fire-hose (Storz-type) couplings, modular robot docking ports, or a printed hinge made from two copies of one part"
  # 287
  - name: Gearless right-angle drive (Hobson's joint, elbow mechanism)
    category: clutches & couplings
    description: Bent rods sliding in holes in two hubs carry rotation round a corner, often 90 degrees, without any gears
    notes: Also covers the gearless right-angle socket adapter
  # 288
  - name: Pneumatic artificial muscle (McKibben muscle)
    category: hydraulics, pneumatics & vacuum
    description: A rubber tube inside a woven sleeve that gets fatter and shorter when pumped with air, pulling hard like a muscle
    notes: Also list powered & active connectors in other_families
  # 289
  - name: "Check valve (one-way valve: flap, ball or duckbill)"
    category: hydraulics, pneumatics & vacuum
    description: A valve that lets air or liquid flow one way only, closed by a flap, a spring-loaded ball or a rubber beak that any backflow presses shut
    notes: Also covers tyre valves (Schrader and Presta), reed valves and printed TPU duckbill valves. Also list seals & pass-throughs and one-way & ratchet in other_families
  # 290
  - name: Bellows boot and way cover (gaiter)
    category: seals & pass-throughs
    description: A folded concertina cover that stretches and squashes as a joint, rod, screw or rail moves, keeping dust and water out; can be printed in TPU
  # 291
  - name: Anti-twister mechanism (twist-free cable feed)
    category: seals & pass-throughs
    description: A loop of cable carried round at exactly half the speed of a spinning part, so power or signals can pass to it through endless turns without a slip ring and without the cable twisting
    notes: Also covers the clockspring (spiral flat cable) as the limited-rotation alternative.
  # 292
  - name: Weight-activated gripping tongs (lifting tongs, lewis)
    category: self-locking & anti-back-drive
    description: Scissor-like tongs, or a wedged plug in a stone (a lewis), whose grip tightens as the load hangs from them, so the heavier the load the harder they bite
  # 293
  - name: Variable-radius pulley (fusee, compound-bow cam)
    category: springs & energy storage
    description: A pulley or cam whose radius changes as it turns, evening out a spring's pull (a clock's fusee) or easing the pull at full draw (a compound bow's let-off)
  # 294
  - name: Tuned mass damper (vibration absorber)
    category: brakes, dampers & speed control
    description: A weight on a spring tuned to the same shaking rate as the part it hangs on, so it swings the opposite way and cancels the vibration
  # 295
  - name: Radial lip seal (rotary shaft seal, oil seal)
    category: seals & pass-throughs
    description: A rubber ring with a springy lip pressed against a spinning shaft, keeping oil in and dirt out where an O-ring would wear through
    notes: Also list hydraulics, pneumatics & vacuum in other_families
  # 296
  - name: Knife-edge and jewel pivots (low-friction point pivots)
    category: hinges & pivots
    description: A hard sharp edge, or a pointed pin in a hard cup (a jewel), that lets a part rock or turn with almost no friction, as in balance scales and meters
  # 297
  - name: Hand-mouldable thermoplastic (polycaprolactone)
    category: adhesives & bonding
    description: Plastic pellets that go soft in hot water at about 60 °C, are shaped by hand into grips, fixings or repairs, set hard as they cool, and can be reheated and reused
    notes: Sold as Polymorph (brand) and similar
  # 298
  - name: Reciprocal frame (self-supporting stick bridge)
    category: interlocking joints & joinery
    description: Short sticks or beams laid so each one rests on the next in a closed ring, holding each other up with no joints or fixings, as in the stick 'Leonardo bridge'
  # 299
  - name: Housing and rebate joints (dado, rabbet)
    category: interlocking joints & joinery
    description: A groove cut across a board (housing or dado) or a step cut along its edge (rebate or rabbet) that another board fits into, as in bookshelves and cabinet backs

  # ==================== ADDED 2026-09-30: new family 'hydraulics, pneumatics & vacuum' ====================
  # 24 types from a web search for the new family (fluid-power-search-2026-09-29.md), in priority
  # order: the family's two baselines first (300-301), then tier 1 (302-309), then tier 2 (310-323).
  # Items 283, 288 and 289 were moved into this family at the same time.
  # 300
  - name: Syringe hydraulics (hydraulic lever, Pascal's principle)
    category: hydraulics, pneumatics & vacuum
    description: Two syringes or cylinders joined by a water-filled tube, so pushing one plunger pushes the other; a small one driving a big one trades distance for force, as in school hydraulic arms, car jacks and bike brakes
    notes: Baseline entry for the family. Also covers master and slave cylinders (brakes), the hydraulic jack and press, water versus air (air feels spongy) and rolling-diaphragm hydrostatic transmissions for robot arms. Also covers hydraulic motion reduction for fine positioning (the micromanipulator principle). Also list gear trains, gearboxes & transmissions in other_families
  # 301
  - name: Air or hydraulic cylinder (pneumatic cylinder, hydraulic ram)
    category: hydraulics, pneumatics & vacuum
    description: A piston in a tube that pushes a rod out when air or oil is let in behind it; a single-acting cylinder returns by a spring or gravity, a double-acting one is driven both ways
    notes: "Baseline entry for the family. Also covers telescopic, rodless and cable cylinders, the air gripper, feeding air to a moving cylinder, and printed cylinders. Safety: crush points, trapped air moving a stopped cylinder, hydraulic oil injection injuries. Also list sliding, telescoping & linear motion and powered & active connectors in other_families"
  # 302
  - name: Switching valve (directional control valve, solenoid valve)
    category: hydraulics, pneumatics & vacuum
    description: A valve that sends air or liquid to one port or another when switched by an electric coil, a hand lever, a foot pedal or air pressure, to make a cylinder or soft actuator move
    notes: "Covers 2/2, 3/2, 5/2 and 5/3 valves, normally open versus normally closed, and pilot-operated valves that need a pressure difference to work. Safety: water hammer when a valve snaps shut. Also list powered & active connectors in other_families"
  # 303
  - name: Peristaltic pump (tube pump, roller pump)
    category: hydraulics, pneumatics & vacuum
    description: Rollers on a turning rotor squeeze a soft tube and push the liquid along it, so only the tube touches the liquid and each turn moves a set amount, which makes it good for dosing
  # 304
  - name: Venturi vacuum generator (vacuum ejector, aspirator)
    category: hydraulics, pneumatics & vacuum
    description: A T-shaped nozzle where a fast jet of compressed air or tap water drags air in through a side port, making suction with no moving parts
    notes: Also covers the airlift pump. Also list powered & active connectors in other_families
  # 305
  - name: Bellows and inflatable actuators (air bag, air spring)
    category: hydraulics, pneumatics & vacuum
    description: A folded or balloon-like chamber that gets longer or lifts when pumped full of air (or shorter when the air is sucked out), giving a straight push with no sliding seals; it can be printed in TPU
    notes: "Also covers air springs, lifting bags and the everting vine robot. Safety: bursts if over-inflated. Also list compliant mechanisms & flexures and powered & active connectors in other_families"
  # 306
  - name: Air-logic valve (pneumatic logic, soft bistable valve)
    category: hydraulics, pneumatics & vacuum
    description: Valves switched by air pressure instead of electricity, joined into simple logic, memories and oscillators so a soft robot can walk or grip with no electronics
    notes: Also covers the shuttle valve. Also list compliant mechanisms & flexures in other_families
  # 307
  - name: Tesla valve (no-moving-parts one-way channel)
    category: hydraulics, pneumatics & vacuum
    description: A channel with looping side pockets that lets liquid or air through easily one way and turns it back on itself the other way; it only slows backflow, so it always leaks a little
    notes: "Often mistaken for a true one-way valve: unlike the Check valve, it never fully seals. Also list one-way & ratchet and print-in-place & 3D-printing joints in other_families"
  # 308
  - name: Vacuum-driven artificial muscle (origami vacuum muscle)
    category: hydraulics, pneumatics & vacuum
    description: A folded skeleton sealed inside a thin bag; sucking the air out collapses the bag onto the skeleton so it contracts, bends or twists with great force
    notes: Also list compliant mechanisms & flexures and powered & active connectors in other_families
  # 309
  - name: Syringe pump (syringe driver)
    category: hydraulics, pneumatics & vacuum
    description: A motor turns a screw that pushes a syringe plunger at a slow, exact rate, to dispense or draw small, measured amounts of liquid
    notes: "Safety: never use a home-made one on people. Also list sliding, telescoping & linear motion in other_families"
  # 310
  - name: Diaphragm pump and squeeze bulb (membrane pump, micro air pump)
    category: hydraulics, pneumatics & vacuum
    description: A rubber disc or bulb flexed in and out between two one-way valves, as in aquarium air pumps, the small air and vacuum pumps that feed soft robots, and hand squeeze bulbs
    notes: Also covers piston hand pumps (bike pumps) and bellows pumps
  # 311
  - name: Air tank and hydraulic accumulator (pressure reservoir)
    category: hydraulics, pneumatics & vacuum
    description: A container that stores air, or oil pushed by trapped gas, a spring or a weight, under pressure so a small pump can drive short, fast bursts of motion, as in robot air tanks, water rockets and CO2 cartridges
    notes: "Safety is the main topic: tanks can burst and hoses whip; never hold stored pressure in a 3D-printed part. Also list springs & energy storage in other_families"
  # 312
  - name: Pressure regulator (pressure-reducing valve)
    category: hydraulics, pneumatics & vacuum
    description: A spring-and-diaphragm valve that turns a high supply pressure down to a steady working pressure that you set, and holds it there as air is used
    notes: Often confused with the Pressure relief valve, which only opens in an emergency
  # 313
  - name: Pressure relief valve (safety valve, pop-off valve)
    category: hydraulics, pneumatics & vacuum
    description: A spring-held valve that pops open and lets pressure out above a set value, so tanks, pumps and soft actuators can't burst
    notes: "Also covers the rupture (burst) disc and vacuum relief valves on dust collectors. Safety: never block or screw down a relief valve. Also list torque limiting & slip in other_families"
  # 314
  - name: Speed-control valve (flow control valve, needle valve)
    category: hydraulics, pneumatics & vacuum
    description: An adjustable narrow gap, usually with a one-way bypass, so a cylinder moves slowly one way and freely the other
    notes: Also covers meter-out control and the quick exhaust valve. Also list brakes, dampers & speed control in other_families
  # 315
  - name: Shut-off valve (tap, ball valve, stopcock)
    category: hydraulics, pneumatics & vacuum
    description: A hand valve that simply opens or closes a pipe; a ball valve turns a drilled ball a quarter turn, and its handle shows whether it is open
    notes: Also covers gate, globe and plug valves. Also list seals & pass-throughs in other_families
  # 316
  - name: Vacuum hold-down table (vacuum table)
    category: hydraulics, pneumatics & vacuum
    description: A flat plate with holes or grooves over a sealed chamber that a vacuum pump empties, so air pressure pins sheets flat for CNC milling, laser cutting or PCB making
    notes: Also list clamping, magnetic & friction connections in other_families
  # 317
  - name: Gear pump (including gerotor)
    category: hydraulics, pneumatics & vacuum
    description: Two meshing gears in a close-fitting case carry liquid round from the inlet to the outlet; the standard small hydraulic pump, and many can also run backwards as a motor
    notes: Also covers internal gear, vane, lobe and flexible-impeller pumps. Also list gear trains, gearboxes & transmissions in other_families
  # 318
  - name: Rotary air actuator (vane or rack-and-pinion rotary actuator)
    category: hydraulics, pneumatics & vacuum
    description: An air- or oil-powered unit that turns a shaft back and forth through a set angle, with a swinging vane or with pistons driving a rack and pinion
    notes: Also covers printed pneumatic stepper motors. Also list powered & active connectors and motion conversion in other_families
  # 319
  - name: Float valve (ballcock)
    category: hydraulics, pneumatics & vacuum
    description: A float on a lever that shuts the water inlet as the level rises, keeping a tank topped up without overflowing, as in toilet cisterns and animal drinkers
  # 320
  - name: Hydraulic ram pump (water-hammer pump)
    category: hydraulics, pneumatics & vacuum
    description: "A pump with no motor: water rushing down a pipe slams a valve shut, and the pressure surge pushes part of the water higher than where it came from"
    notes: "Safety: water-hammer pressure spikes can burst pipes and fittings"
  # 321
  - name: Air bearing and air caster (air-cushion bearing)
    category: hydraulics, pneumatics & vacuum
    description: A pad that floats on a thin film of air blown out through small holes, so a part slides with almost no friction, as on an air-hockey table
    notes: Also list sliding, telescoping & linear motion and hinges & pivots in other_families
  # 322
  - name: Centrifugal pump (impeller pump)
    category: hydraulics, pneumatics & vacuum
    description: A spinning impeller flings water outwards into a spiral casing, giving lots of flow at low pressure; the usual fountain and aquarium pump, which must be full of water (primed) to start
    notes: Unlike the positive-displacement pumps (gear, diaphragm and peristaltic), it gives flow rather than pressure
  # 323
  - name: Automatic siphon (bell siphon)
    category: hydraulics, pneumatics & vacuum
    description: A bell-shaped cap over a standpipe that starts siphoning when the water reaches the top and stops when air gets in, so a grow bed or tank floods and drains by itself with no moving parts

  # ==================== ADDED 2026-10-03 (R22): wider scope, five new families ====================
  # 86 types from six web searches, one per near-scope group (scope-search-2026-10-03-*.md), each
  # checked against all 323 result files. In priority order: the five new families' baselines first
  # (324-328), then tier 1 (329-345, joinery last), then tier 2 (346-409). Item 129 moved into
  # 'adjusters, levellers & spacers' at the same time.
  # Research rules for these families (mains safety, electrical rating bands, heat-work safety,
  # knots grouped by job) are in fields.yaml.
  # 324
  - name: Soldered wire joint (soldered splice)
    category: electrical connections
    description: Two wires, or a wire and a pin or pad, are twisted, hooked or laid together and melted solder flows between them, making a permanent joint that conducts well but needs heat, skill and strain relief
    notes: "Baseline entry for the family. Also covers the Western Union (lineman's), lap, lash, rat-tail and T-splices, solder cups, tinning, and covering the joint with heat-shrink. Soldering metal parts (not wires) is Soldered metal joint. Safety: high heat and possibly toxic solders; stiff solder joints break under vibration; tape-only or soldered splices are not allowed in mains wiring by most North American codes"
  # 325
  - name: Wood screw (including coach screw and Confirmat screw)
    category: everyday fasteners & fixings
    description: A pointed, coarse-threaded screw that cuts its own thread in wood or board and pulls the parts together under its head; the ordinary way to fix wood to wood
    notes: "Baseline entry for the family. Also covers pilot and clearance holes, countersinking, coach (lag) screws, chipboard, drywall and deck screws, and the Confirmat screw used in flat-pack furniture. Also list interlocking joints & joinery in other_families"
  # 326
  - name: Basic knots (overhand knot, half hitch, reef knot)
    category: knots, lashings & sewn joints
    description: The few knots most people half-know, the overhand, the half hitch, and the reef (square) knot with its slipped bow form for shoelaces, used as the baseline the other knot entries are compared with
    notes: "Baseline entry for the family. Also covers what knots do to rope strength (sources differ: record them side by side), how knots slip, capsize or jam, and why the reef knot must never join two ropes. Safety: knots are not for climbing, lifting or holding people without training and rated gear"
  # 327
  - name: Shims, spacers and standoffs (packing, spacer washer)
    category: adjusters, levellers & spacers
    description: Thin packing pieces, washers or tubes put between parts to fill a gap, set a height or spacing, or lift a circuit board clear of a surface; the simplest way to adjust a fit
    notes: "Baseline entry for the family. Also covers shim stock and peel shims, spacer washers, threaded standoffs for circuit boards and panels, and printed spacers. Tapered shims and folding wedges stay in Self-locking wedge. Also list locating & alignment in other_families"
  # 328
  - name: Welded metal joint (fusion welding; stick, MIG, TIG and gas welding)
    category: welding, brazing & soldering
    description: The edges of two metal parts are melted together, usually with added filler metal, by an electric arc or a gas flame, so that they cool as one piece of metal
    notes: "Baseline entry for the family. One entry, with the processes compared in it (MIG easiest to learn, stick cheapest, TIG for thin metal and aluminium, flux-cored for outdoors, gas welding), the five basic joints (butt, lap, corner, edge, T), tack welds and forge welding. Safety: arc light burns eyes and skin, fire, harmful fumes and electric shock"
  # ---- tier 1 ----
  # 329
  - name: Battery holder and battery contacts (spring battery contact, coin-cell holder)
    category: electrical connections
    description: A box or clip that holds cells and presses metal contacts, a coiled spring at one end and a flat or springy tab at the other, onto the battery ends, so cells can be swapped without soldering
    notes: "Also covers leaf-spring contacts, coin-cell holders, the 9 V battery snap, reverse-polarity protection and printed holders with bought springs. Cells joined into packs with nickel strip are Spot weld. Safety: shorted, crushed or overheated lithium cells cause fires; printed plastic springs relax, so use metal contact springs. Also list springs & energy storage in other_families"
  # 330
  - name: Pogo pin (spring-loaded contact pin)
    category: electrical connections
    description: A tiny gold-plated plunger in a tube with a spring behind it, which presses onto a flat pad to make contact without plugging in, for charging docks, test and programming jigs, and parts that dock together
    notes: "Also covers target pads, bed-of-nails test jigs, leaf-spring contact fingers, elastomeric (zebra) strips and blind-mate connectors. Also list springs & energy storage in other_families"
  # 331
  - name: Magnetic connector (magnetic pogo connector, magnetic breakaway power connector)
    category: electrical connections
    description: Spring-loaded contact pins and flat pads with magnets either side that pull the two halves together, line them up and let go safely if the cable is yanked
    notes: "Also covers magnets placed so a wrongly turned plug repels, and DIY magnetic connectors for modular robots and wearables. MagSafe (brand) as an alias. Safety: small strong magnets can be swallowed. Also list clamping, magnetic & friction connections and quick-release & tool-free in other_families"
  # 332
  - name: Screw-in threaded insert (wire thread insert, self-tapping insert)
    category: print-in-place & 3D-printing joints
    description: A threaded sleeve, or a coil of diamond-section wire, screwed into a hole to give a strong, reusable machine-screw thread in soft or brittle material such as resin prints, wood or aluminium, or to repair a stripped thread
    notes: "Also covers helical wire inserts (Helicoil (brand)) and self-tapping inserts for resin prints, where heat-set inserts can't be used. Also list everyday fasteners & fixings in other_families"
  # 333
  - name: Sew-on part (sewing holes, loops and slots on a rigid part)
    category: knots, lashings & sewn joints
    description: Small holes, loops, slots or a thin flange designed into a rigid part, often a 3D print, so it can be stitched to fabric, straps or a costume with needle and thread, like a sew-on button or badge
    notes: "Also covers sewn-on snaps and hooks, holes through a thickened edge, hot-needle piercing, and the alternatives makers compare it with (hot glue, contact adhesive, hook-and-loop). Also list print-in-place & 3D-printing joints and cord, strap, webbing & textile hardware in other_families"
  # 334
  - name: Stopper knots and cord-end anchors
    category: knots, lashings & sewn joints
    description: Ways to stop the end of a cord, string, elastic or thin cable pulling out through a hole in a part, with a bulky knot behind the hole or in a pocket, a crimped stop, a clamp under a screw head, or turns round a post
    notes: "Also covers the overhand, figure-eight and larger stopper knots, counterbored knot pockets, washers behind the hole, and clamping string under a bolt in robots. Also list print-in-place & 3D-printing joints and cord, strap, webbing & textile hardware in other_families"
  # 335
  - name: Printing onto fabric (fabric embedded in a 3D print)
    category: print-in-place & 3D-printing joints
    description: The print is paused after the first few layers, a thin open mesh such as tulle is stretched over it, and the rest is printed so the plastic flows through the holes and locks the fabric in, for flexible scale armour, hinged panels or a print with a fabric skirt
    notes: "Also covers which meshes work, gaps between printed scales as hinges, and holding the mesh flat. Origami mechanisms uses the same method as a hinge layer. Safety: synthetic fabrics melt; watch the first layers after resuming. Also list knots, lashings & sewn joints in other_families"
  # 336
  - name: Locking adjustment screws (push-pull screws, spring-loaded levelling screws)
    category: adjusters, levellers & spacers
    description: Screws that set the tilt, height or end position of a part and then hold it there; one screw pushes while its partner or a spring pulls, so the part is clamped firmly at the chosen setting, as in telescope mirror cells and 3D-printer bed levelling
    notes: "Also covers adjustable stop screws with lock nuts and three-point levelling. Also list locating & alignment in other_families"
  # 337
  - name: Ball caster (ball transfer unit)
    category: hinges & pivots
    description: A large ball resting on small balls or rollers in a cup, so a load can roll in any direction without turning first; used ball-down as the third wheel of small robots and ball-up in tables that heavy things slide across
    notes: Also covers printed ball casters for small robots. Also list sliding, telescoping & linear motion in other_families
  # 338
  - name: Cable through a hinge (hollow hinge pin, cable on the pivot axis, service loop)
    category: seals & pass-throughs
    description: Ways to carry wires, a ribbon cable or a tube across a hinge or a pivot that turns less than a full turn without pinching or breaking them, through a hollow pin or shaft, along the pivot axis, or as a slack loop or wrapped flat cable
    notes: "Also covers hollow-shaft friction hinges, service loops and spiral flat cables (clocksprings) for a few turns. Safety: wire flexed again and again breaks inside its insulation, giving intermittent faults or shorts. Also list hinges & pivots and electrical connections in other_families"
  # 339
  - name: Expanding internal grip (expanding mandrel, inside gripper)
    category: clamping, magnetic & friction connections
    description: A plug or a set of fingers pushed into a hole, ring or tube that grows outward to grip it from the inside and shrinks again to let go, driven by a cone or wedge, a screw-driven linkage or an inflated bladder
    notes: "Also covers expanding mandrels for turning, robot inside grippers and bladder grippers. Safety: a powered inside gripper can drop its part when pressure or power is lost. Also list powered & active connectors in other_families"
  # 340
  - name: Printed chainmail and tile fabric (print-in-place interlinked fabric)
    category: print-in-place & 3D-printing joints
    description: A flat sheet of small links or tiles printed already linked together, so it bends and drapes like cloth in every direction, for cosplay armour, flexible covers, bag panels and fidget toys
    notes: "Also covers link thickness and strength, joining printed panels, and supportless designs. Not real armour. Also list compliant mechanisms & flexures in other_families"
  # 341
  - name: Strut hub (geodesic dome hub, space-frame node)
    category: clamping, magnetic & friction connections
    description: A connector that joins three to six sticks, dowels, tubes or wooden struts at set angles in one node, to build domes, frames and trusses from straight pieces
    notes: "Also covers printed hubs for sticks, skewers and timber, flattened-and-bolted conduit domes, and ball nodes in space frames. Safety: don't climb on or load printed hubs. Also list interlocking joints & joinery in other_families"
  # 342
  - name: Melted plastic weld (plastic welding with a soldering iron, 3D pen or hot-air gun)
    category: welding, brazing & soldering
    description: Two plastic parts are joined by melting their edges together and running in a bead of the same plastic as filler, using a soldering iron, a 3D pen, or a hot-air welder with a welding rod
    notes: "Also covers soldering-iron welding with filament as filler, melting in staples or mesh across cracks, hot-air and extrusion welding, and matching the filler to the plastic. The fix for PE and PP, which glues and solvents can't join. Safety: burns, fire and plastic fumes; keep a separate iron tip for plastic. Also list print-in-place & 3D-printing joints and seals & pass-throughs in other_families"
  # 343
  - name: Friction-welded plastic (rotary-tool friction welding, spin welding)
    category: welding, brazing & soldering
    description: A piece of filament spun in a rotary tool, or a round part spun against another, rubs until friction melts the plastic and the parts fuse into one
    notes: "Also covers spin welding round parts on a drill press, and industrial vibration and metal friction welding as one-line mentions. Safety: eye protection, friction burns. Also list print-in-place & 3D-printing joints in other_families"
  # 344
  - name: Heat-sealed seam (heat-sealed plastic film and coated fabric)
    category: welding, brazing & soldering
    description: Two layers of plastic film, or fabric coated with plastic such as TPU-coated nylon, are pressed together with a hot bar, an iron or a heated wire until the plastic melts into an airtight, waterproof seam
    notes: "Also covers impulse sealers, sealing with an iron through a release sheet, printer-nozzle sealing of soft-robot pouches, and RF and hot-air welding of tarps as mentions. Safety: burns and fumes, especially with PVC. Also list seals & pass-throughs, hydraulics, pneumatics & vacuum and cord, strap, webbing & textile hardware in other_families"
  # 345
  - name: Tensegrity (floating struts held by cords)
    category: interlocking joints & joinery
    description: A structure in which rigid struts don't touch each other and are held in place only by tensioned cords or chains, used for floating tables, shelves and sculptures
    notes: "Also covers the three-strut prism and print-in-place tensegrity models with built-in tensioners. Its nearest relative is Reciprocal frame. Safety: it collapses suddenly if a cord breaks, so keep loads light. Also list tensioning, reels & take-up in other_families"
  # ---- tier 2 ----
  # 346
  - name: Wire-to-board plug connectors (pin header and crimp housing)
    category: electrical connections
    description: Rows of small metal pins on a board, with a plastic plug of crimped sockets on the wires that pushes on, often latched and shaped so it fits only one way; the small plugs on servos, sensors, 3D-printer boards and battery balance leads
    notes: "Also covers pin pitch (look-alike pitches don't mate), shrouded headers, crimp contacts and their tools, jumper wires and solderless breadboards, stacking headers, card-edge connectors and IC sockets. Dupont, JST and Molex (brands) as aliases. Safety: low current only; reversed plugs can damage boards. Also list quick-release & tool-free in other_families"
  # 347
  - name: Crimp terminals (ring, fork and spade terminals, blade quick-disconnect)
    category: electrical connections
    description: A metal end squeezed onto a stripped wire with a crimping tool, ending in a ring or fork that goes under a screw, or a flat blade or sleeve that pushes onto a tab
    notes: "Also covers insulated and bare types, the colour code for wire size, open- and closed-barrel crimps, the insulation crimp for strain relief, bullet terminals, earth ring terminals and heavy cable lugs. Safety: the wrong tool or size pulls out; poor joints heat up and can start fires"
  # 348
  - name: Crimped butt splice (crimp splice connector)
    category: electrical connections
    description: A short metal tube, usually inside a plastic or heat-shrink sleeve; one wire goes in each end and both are squeezed with a crimping tool, joining two wires end to end with no heat
    notes: "Also covers glue-lined heat-shrink butt splices, parallel and closed-end splices, and why a good crimp is gas-tight. Safety: the wrong tool or size gives pull-outs; pull-test every crimp"
  # 349
  - name: Spring-clamp wire connector (lever connector, push-in wire connector)
    category: electrical connections
    description: A spring inside a clear plastic body grips each stripped wire; lift a lever, or just push a solid wire in, and the spring sets the clamping force itself, so it never needs tightening and can be undone and reused
    notes: "Also covers PCB spring terminals, spring speaker terminals, the historic Fahnestock clip, and which wire types suit push-in and lever types. Wago and Lever-Nuts (brands) as aliases. Safety: mains use must follow local law. Also list quick-release & tool-free in other_families"
  # 350
  - name: Screw terminal (terminal block, barrier strip, connector strip)
    category: electrical connections
    description: A stripped wire is clamped by tightening a screw, directly under its head or under a plate, on boards, power supplies and connector strips, so wires can be undone later with a screwdriver
    notes: "Also covers clamping-plate and screw-head types, barrier strips with ring or fork terminals, pluggable terminal blocks, connector-strip enclosures and busbars. Chocolate block as an alias. Safety: never tin wire ends before clamping (solder creeps and the joint loosens and heats); screws loosen with vibration. Also list clamping, magnetic & friction connections in other_families"
  # 351
  - name: Wire-end ferrule (bootlace ferrule, end sleeve)
    category: electrical connections
    description: A thin metal tube, usually with a coloured plastic collar, crimped onto the end of a stranded wire so the strands can't splay apart in a screw or spring terminal
    notes: "Also covers twin-wire ferrules, crimp shapes and colour codes. Safety: splayed strands make a poor, hot joint"
  # 352
  - name: High-current battery plug (bullet connector, polarised battery connector)
    category: electrical connections
    description: Chunky two-pin plugs with large contacts in a shaped, polarised housing that carry tens of amps between a battery, a speed controller and a charger in drones, RC models, robots and e-bikes
    notes: "Also covers matching plug and wire to the current, anti-spark plugs, and sealed solar connectors and larger cousins. XT60, Deans (T-plug), Tamiya, EC3 and MC4 (brands) as aliases. Genderless power connectors stay in Genderless connector. Safety: reversed or shorted lithium packs burn; the plug and the wire must both suit the current"
  # 353
  - name: Heat-shrink tubing (heat-shrink sleeve, adhesive-lined heat-shrink)
    category: electrical connections
    description: A plastic tube slid over a joint before it is made; heating makes it shrink tightly round the joint, insulating it and protecting it from rubbing, and glue-lined types also seal out water
    notes: "Also covers shrink ratio, materials, end caps, cold-shrink tubing, electrical tape, self-amalgamating tape, and mechanical uses (grips, sleeves, bundling). Safety: heat-gun burns. Also list seals & pass-throughs in other_families"
  # 354
  - name: Solder sleeve (solder-seal splice)
    category: electrical connections
    description: A clear heat-shrink tube with a ring of solder in the middle and rings of meltable glue at each end; heating it with a hot-air gun solders, insulates and seals a splice in one step, with no soldering iron
    notes: "Also covers inspecting the joint through the clear tube. Safety: it is still soldering, so the same vibration and mains limits as Soldered wire joint apply"
  # 355
  - name: Standard plug-and-socket connector (USB, barrel jack, audio jack, RJ45)
    category: electrical connections
    description: A ready-made plug and socket built to a published standard, so cables and chargers from anywhere fit; you choose by what the other device already has, how often it will be plugged in, and whether it must latch or seal
    notes: "One entry only: link to lists of the standards rather than describing each one. Also covers gender, panel, board and cable mounting, mating cycles, latching and sealed circular connectors, and look-alike barrel-jack sizes and polarity. Safety: reversed-polarity barrel plugs damage circuits. Also list quick-release & tool-free in other_families"
  # 356
  - name: Insulation-displacement connector (IDC, ribbon-cable plug, punch-down, T-tap)
    category: electrical connections
    description: A forked metal blade is pressed onto an insulated wire so it cuts through the plastic and grips the copper with no stripping, joining many ribbon-cable wires in one squeeze or tapping a new wire into an existing one
    notes: "Also covers pin 1 marking on ribbon cable, punch-down blocks, RJ45 plugs, gel-filled splices and clip-on LED-strip connectors. Scotchlok (brand) as an alias. Safety: cheap fold-over taps chew through wire and fail; signal and small currents only"
  # 357
  - name: Binding post and banana plug (test-lead connector, crocodile clip)
    category: electrical connections
    description: A threaded post with a screw-down cap that clamps a bare wire, spade or plug, and the spring-pin banana plug that pushes into it, as on bench power supplies, meters and speakers; crocodile clips grab anything for a quick test
    notes: "Also covers five-way posts, 4 mm and 2 mm plugs, stackable and shrouded safety plugs, test hooks and jump-lead clamps. Safety: ordinary binding posts aren't insulated for dangerous voltages; use shrouded plugs. Also list quick-release & tool-free in other_families"
  # 358
  - name: Twist-on wire connector (wire nut)
    category: electrical connections
    description: A plastic cap with a tapered metal coil inside, screwed by hand onto the twisted, stripped ends of two or more wires, pulling them together and insulating them; the usual splice in North American house wiring
    notes: "Also covers gel-filled types for damp places. Marrette (brand) as an alias. Safety: describe the type only, with no mains instructions: mains work must follow local law; not certified in most European countries, not for vibrating or damp places unless gel-filled, and not generally recommended for aluminium wire"
  # 359
  - name: Conductive thread (sewn circuit, e-textile stitching)
    category: electrical connections
    description: Thread spun from stainless steel or silver-coated fibres, sewn through the holes of sew-on boards and battery holders so the stitches themselves are the wires in clothing, bags and soft toys
    notes: "Also covers resistance per length, sealing knots, sew-on snaps as plug-and-unplug connectors, conductive fabric and washing. Safety: loose tails and crossing stitches short out, most often next to the battery holder. Also list knots, lashings & sewn joints and cord, strap, webbing & textile hardware in other_families"
  # 360
  - name: Conductive tape (copper foil tape, conductive fabric tape)
    category: electrical connections
    description: Thin copper or metal-coated fabric tape with a sticky backing, laid on paper, card or a print as flat wires that parts are taped, soldered or glued onto
    notes: "Also covers whether the glue layer conducts (many cheap copper tapes don't), folding corners instead of cutting, and shielding. Also list adhesives & bonding in other_families"
  # 361
  - name: Conductive glue, paint and ink (electrically conductive adhesive, silver epoxy)
    category: electrical connections
    description: Glue, paint or ink filled with silver, copper, nickel or carbon particles that touch each other, to stick or paint a joint or track where solder won't work, on heat-sensitive parts, glass, paper, fabric or prints
    notes: "Also covers resistance compared with solder (small currents only), PCB-track and rear-window heater repair, and conductive 3D-printing filament. Safety: solvent fumes in some paints; not for power wiring. Also list adhesives & bonding in other_families"
  # 362
  - name: Flat flexible cable and latching connector (FFC with ZIF connector)
    category: electrical connections
    description: A very thin plastic ribbon with flat copper strips whose bare end slides into a low-profile socket and is locked by flipping a tiny latch, used for cameras and displays and to carry many signals through hinges and moving heads
    notes: "Also covers pitch, same-side and opposite-side contacts (which way up each end goes), stiffeners and latch types. Routing a cable across a pivot is Cable through a hinge. Also list seals & pass-throughs in other_families"
  # 363
  - name: Wire wrap (wire-wrapped connection)
    category: electrical connections
    description: Bare solid wire is wound tightly, about seven turns, round a square metal post with a small hand tool, so the post's corners bite into the wire and make a gas-tight joint that can be unwound and redone with no solder
    notes: Also covers wire-wrap wire, long-post sockets and modified wraps for strain relief. Low voltage only
  # 364
  - name: Hose clamp (worm-drive clamp, ear clamp, spring hose clamp)
    category: clamping, magnetic & friction connections
    description: A metal band tightened round a hose or tube to squeeze it onto a spigot, also used as an all-purpose strap clamp for fixing things to poles and pipes
    notes: "Also covers ear (crimp) clamps, spring clamps, T-bolt clamps, and rubber-sleeve (no-hub) drain couplings held by worm-drive bands. Jubilee clip (brand) as an alias. Hose barb keeps only a short retention summary. Safety: moderate pressures only; cut band ends are sharp; over-tightening cuts soft hose. Also list seals & pass-throughs and hydraulics, pneumatics & vacuum in other_families"
  # 365
  - name: Drive-in fixing pins (roll pin, coiled spring pin, dowel pin, taper pin)
    category: everyday fasteners & fixings
    description: A short steel pin tapped into a hole drilled through both parts and held by its own springiness or a tight fit, so the parts can't turn or slide apart, as when pinning a gear or hub to a shaft (cross-pinning)
    notes: "Also covers grooved and knurled pins, pin punches and choosing between solid and spring pins. Safety: wear eye protection when driving pins. Also list locating & alignment and clutches & couplings in other_families"
  # 366
  - name: Wall plug (expansion anchor for solid walls)
    category: everyday fasteners & fixings
    description: A plastic or fibre sleeve pushed into a drilled hole in brick, block or concrete that swells and grips the hole as a screw is driven in, so the screw holds in material too brittle or crumbly to take a thread
    notes: "Also covers matching plug, drill and screw sizes, and masonry anchors as variants (wedge, sleeve, drop-in, chemical anchors and concrete screws). Rawlplug (brand) as an alias. Safety: check for hidden cables and pipes before drilling; heavy, overhead and tip-prone loads need rated anchors. Also list clamping, magnetic & friction connections in other_families"
  # 367
  - name: Hollow-wall anchors (toggle, molly, self-drilling plasterboard anchor)
    category: everyday fasteners & fixings
    description: Fixings for plasterboard, hollow doors and panels that spread out behind the board or bite into it, because a plain screw or plug would pull straight out of the thin, soft board
    notes: "Also covers spring, gravity and strap toggles, winged plastic anchors and finding a stud instead. Safety: ratings fall sharply in thin or damp board and in ceilings; go by the maker's rating for the wall type. Also list clamping, magnetic & friction connections in other_families"
  # 368
  - name: Push-on edge trim (U-channel edging, grommet edging)
    category: snap & clip fits
    description: A rubber or plastic U-shaped strip with springy metal fingers or barbed ridges inside, pushed onto the edge of a sheet or panel so it grips with no glue, to cover a sharp edge, protect cables or hold a soft part onto a rim
    notes: "Also covers choosing by panel thickness, bulb-seal edging and grommet strip for odd-shaped cut-outs. Also list clamping, magnetic & friction connections and seals & pass-throughs in other_families"
  # 369
  - name: Metal brackets and plates (angle bracket, mending plate, joist hanger)
    category: everyday fasteners & fixings
    description: Stamped steel brackets, straps and flat plates screwed or nailed across a joint to reinforce it or carry its load, such as corner braces, flat and T mending plates, joist hangers and framing ties
    notes: "Also covers corrugated fasteners, toothed truss plates and furniture anti-tip ties. Safety: connectors only reach their rated load with the fastener type, size and number the maker specifies. Also list interlocking joints & joinery in other_families"
  # 370
  - name: Nails, brads and tacks (ring-shank nail)
    category: everyday fasteners & fixings
    description: A smooth or ridged steel pin hammered or fired into wood and held by friction and the wood fibres gripping it; quicker than a screw and good for sideways load, but it pulls out more easily
    notes: "Also covers ring-shank and twisted nails, panel pins, brads and tacks, toe-nailing and clinching. Safety: eye protection when hammering; nail guns are a serious injury risk. Also list interlocking joints & joinery in other_families"
  # 371
  - name: Threaded rod and studs (all-thread, studding, hanger bolt)
    category: everyday fasteners & fixings
    description: A rod threaded all along, or at both ends, used with nuts as a long bolt, tie rod, axle or adjustable spacer; a stud screws into a tapped hole so a nut can clamp a part over it
    notes: "Also covers hanger bolts (wood thread one end, machine thread the other) and printer frames built on threaded rod. Safety: plain plated rod is low-strength, so don't lift with it unless rated; dress cut ends. Also list clamping, magnetic & friction connections in other_families"
  # 372
  - name: Eye bolts, screw eyes and hooks (lifting eye, cup hook, screw hook)
    category: everyday fasteners & fixings
    description: A bolt or screw with a closed loop or a hook on the end, fixed into a part or wall so a rope, cable, spring or hanging object can be attached to it
    notes: "Also covers shouldered and plain eye bolts, and hook-and-eye pairs. Safety: plain eye bolts must not be loaded at an angle; bent-wire eyes open under load; never use unrated eyes or hooks for lifting people, climbing or swings. Also list cord, strap, webbing & textile hardware in other_families"
  # 373
  - name: Staples for wood and fabric (staple gun, hammer tacker, cable staple)
    category: everyday fasteners & fixings
    description: A U-shaped wire fastener driven by a staple gun or hammer tacker, whose crown bridges what it holds, which suits fixing fabric, mesh, film or cables flat onto wood
    notes: "Also covers upholstery and hog-ring uses and insulated cable staples. Safety: staple guns fire like nail guns; never fix mains cable with plain staples. Also list cord, strap, webbing & textile hardware in other_families"
  # 374
  - name: Shackle and quick link (D-shackle, bow shackle, maillon)
    category: cord, strap, webbing & textile hardware
    description: A U-shaped metal link closed by a screw pin or bolt, or an oval link closed by a threaded sleeve, used to join chain, rope eyes, straps and anchor points; stronger than a hook because it closes fully
    notes: "Also covers screw-pin and bolt-type shackles, mousing the pin, and the soft (rope) shackle as a link to Rope splices. Safety: use rated, marked shackles for any load that could hurt someone; don't side-load round-pin shackles. Also list everyday fasteners & fixings in other_families"
  # 375
  - name: Tamper-resistant fasteners (security screw, one-way screw, breakaway-head bolt)
    category: locks, latches & catches
    description: Screws and bolts with unusual drives that ordinary tools won't turn, or that can only be turned one way, to stop casual tampering with covers, battery boxes, signs and public fittings
    notes: "Also covers pin-in-drive heads, shear nuts and when a printed cover needs one (child-proof battery boxes). Also list everyday fasteners & fixings in other_families"
  # 376
  - name: Wire-rope terminations (wire-rope clip, thimble, crimped sleeve)
    category: cord, strap, webbing & textile hardware
    description: Ways to make a loop or an end stop in steel wire rope, by bending it round a grooved thimble and holding the tail with U-bolt clips, or by squeezing a metal sleeve round both parts with a crimping tool
    notes: "Also covers clip spacing, count and the dead-end rule (sources differ: record them side by side), crimped stops for robot tendons and pull-pull cables, and swaged and poured sockets as mentions. Bulldog grip as an alias. Safety: not for lifting people; overhead lifting needs rated terminations and inspection. Also list tensioning, reels & take-up in other_families"
  # 377
  - name: Load-bearing stitch patterns for straps and webbing (bar tack, box-X stitch)
    category: knots, lashings & sewn joints
    description: Dense stitch patterns used where a strap is sewn back on itself or onto a buckle, ring or another strap, such as a bar tack, a box with an X through it or a zigzag pattern, so the load spreads over many stitches
    notes: "Also covers thread and needle choice and published test results (sources differ: record them side by side). Safety: never home-sew climbing slings, harnesses, tow or lifting straps. Also list cord, strap, webbing & textile hardware in other_families"
  # 378
  - name: Hitches to a post, rail, ring or eye (clove hitch, round turn and two half hitches)
    category: knots, lashings & sewn joints
    description: Knots that tie a line to something solid, such as a post, rail, ring, bolt or a hole in a part, and can be tied and undone without tools
    notes: "Also covers the cow hitch (lark's head), timber hitch, horn-cleat hitch and the Palomar knot for slippery line. Also list cord, strap, webbing & textile hardware in other_families"
  # 379
  - name: Tensioning and adjustable hitches (trucker's hitch, taut-line hitch, Prusik)
    category: knots, lashings & sewn joints
    description: Knots that let you pull a line tight and hold it, or slide a loop to adjust it, with no hardware, as in the trucker's hitch for lashing a load, the taut-line hitch for tent lines and the Prusik that grips another rope or a pole
    notes: "Also covers the rolling hitch and adjustable grip hitch, and why slippery modern cords defeat friction hitches. Safety: friction hitches can let go suddenly; climbing uses need training and rated gear. Also list tensioning, reels & take-up in other_families"
  # 380
  - name: Eyelets and grommets (for fabric, leather and sheet)
    category: cord, strap, webbing & textile hardware
    description: A metal or plastic ring set into a hole in fabric, leather or thin sheet to reinforce it, so a cord, hook, lace or peg can pass through without tearing it
    notes: "Also covers setting with a punch or press, washer types, self-piercing grommets and printed screw-together grommets. Rubber cable grommets stay in Cable gland and strain relief"
  # 381
  - name: Bead-in-groove fabric edge (keder, boltrope, screen spline)
    category: cord, strap, webbing & textile hardware
    description: A rope or plastic bead sewn or welded along the edge of fabric, or a rubber cord pressed in over a mesh, that sits in a C-shaped groove in a frame and holds the whole edge at once, as on awnings, tents, sails and window screens
    notes: Also covers keder rails, fly-screen spline rollers and printed clips that lock into keder rails. Also list clamping, magnetic & friction connections in other_families
  # 382
  - name: Fixed loop knots (bowline, figure-eight loop, alpine butterfly)
    category: knots, lashings & sewn joints
    description: Knots that make a loop that won't tighten up, at the end of a line or in its middle, to drop over a hook or post or to clip into
    notes: "Also covers why a bowline can shake loose when unloaded, and the alpine butterfly as the safe way to isolate a damaged section. Safety: for anything that holds a person, use a rated system"
  # 383
  - name: Bends for joining two cords (sheet bend, double fisherman's knot, water knot)
    category: knots, lashings & sewn joints
    description: Knots that join the ends of two ropes, cords or flat tapes, including ones of different thickness
    notes: "Also covers the double sheet bend, the Zeppelin bend, closing a cord into a loop, netting knots, and leaving long tails. Never the reef knot (see Basic knots)"
  # 384
  - name: Pole lashings (square, diagonal, shear and tripod lashings)
    category: knots, lashings & sewn joints
    description: Rope wrapped round two or three poles where they cross or touch, then pulled tight with turns between the poles (frapping turns), to build frames, tripods and A-frames without nails or bolts
    notes: "Also covers round lashing to lengthen a pole and garden lashing of bamboo canes. Safety: check any lashed structure under load before people climb or stand on it. Also list interlocking joints & joinery in other_families"
  # 385
  - name: Rope-end finishing (whipping, heat-sealing, back splice, aglet)
    category: knots, lashings & sewn joints
    description: Ways to stop a cut rope, cord or webbing end fraying, by binding it with twine (whipping), melting synthetic fibres, tucking the strands back (back splice), tape, a dip coating or a cap (aglet)
    notes: "Also covers which fibres can be melted, and printed melting forms and aglets. Safety: burns from flames and hot knives; hard sealed ends can cut hands"
  # 386
  - name: Sewn seams and hand stitches (lockstitch, saddle stitch, flat-felled seam)
    category: knots, lashings & sewn joints
    description: Joining two pieces of fabric or leather with thread passed through both, by machine (lockstitch) or by hand (running, back or saddle stitch), along a seam folded or bound so the edges don't fray
    notes: Also covers plain, French, lapped and bound seams, seam finishes, casings and pole sleeves, and seam taping and sealing. Heat-welded seams are Heat-sealed seam
  # 387
  - name: Lacing (cord through rows of holes or eyelets)
    category: knots, lashings & sewn joints
    description: A cord or leather thong threaded back and forth through rows of holes, eyelets or hooks on two edges to pull them together, as on shoes, leather pouches or a cover laced onto a frame, and loosened and tightened again later
    notes: Also covers criss-cross and edge lacing, lace length, and lacing printed panels together. Cable lacing for wire looms is in Binding knots and seizings. Also list cord, strap, webbing & textile hardware in other_families
  # 388
  - name: Rope splices (eye splice, short splice, braided-rope splice)
    category: knots, lashings & sewn joints
    description: Joining a rope to itself or to another rope by tucking its strands back in, or burying its end inside its hollow core, to make a loop or join that keeps nearly all the rope's strength and is slimmer than a knot
    notes: "Also covers long, back and ring splices, the number of tucks in slippery rope, and the soft shackle (a rope loop closed by a knot). Safety: home-made splices aren't rated; never for climbing or lifting people"
  # 389
  - name: Leather and textile rivets (double-cap, tubular and split rivets)
    category: cord, strap, webbing & textile hardware
    description: Small two-part or hollow rivets set through punched holes in leather, webbing or fabric with a setter on a hard block, to fix straps, handles and buckles permanently
    notes: Also covers single-cap and rapid rivets, choosing the post length, and backing washers. Metal-sheet rivets stay in Blind rivet
  # 390
  - name: Chicago screw (binding screw, sex bolt)
    category: cord, strap, webbing & textile hardware
    description: A short screw that threads into a matching hollow post from the other side, leaving a flat head on both faces, used like a removable rivet in leather, straps and binders and as the pivot in printed key organisers
    notes: Also covers choosing the post length and when to add threadlocker. Also list quick-release & tool-free in other_families
  # 391
  - name: Iron-on fusible web (heat-activated adhesive web, hem tape)
    category: adhesives & bonding
    description: A dry web or film of heat-melting glue laid between two fabrics and pressed with an iron so it melts and bonds them, for no-sew hems, appliqué and iron-on patches
    notes: Also covers fusible interfacing and iron-on patches. Also list knots, lashings & sewn joints in other_families
  # 392
  - name: Binding knots and seizings (constrictor knot, seizing, cable lacing)
    category: knots, lashings & sewn joints
    description: Knots and wrappings that squeeze tightly round a bundle, a bag neck, a hose, or two ropes side by side to hold them together, like a hose clamp made of string
    notes: "Also covers the double constrictor, holding parts for gluing, and cable lacing of wire looms. Safety: seizings aren't for heavy or critical loads. Also list electrical connections in other_families"
  # 393
  - name: Tripod and stand screw mount (tripod socket, camera thread)
    category: quick-release & tool-free
    description: A single threaded socket or stud in a standard thread, so a part screws onto any tripod, ball head, light stand, microphone stand or camera, with locating pins, a rubber pad or a lock ring to stop it twisting
    notes: "Also covers the 1/4-20 and 3/8-16 camera threads, light-stand spigots, anti-twist pins, thread adapters and putting a metal insert in a print. The thread sizes are linked to, not listed. Safety: gear falls if the thread strips in plastic. Also list clamping, magnetic & friction connections and locating & alignment in other_families"
  # 394
  - name: Clamp-on accessory mount for bars, poles and edges (handlebar clamp, desk clamp, U-bolt)
    category: clamping, magnetic & friction connections
    description: A clamp that grips something already there, such as a handlebar, pole, tube, lighting pipe or the edge of a desk or shelf, so an accessory can be fixed on, moved or removed without drilling
    notes: "Also covers split bar clamps, rubber shims for several sizes, U-bolts, pipe clamps and camera-rod clamps. Safety: on bikes and scooters a mount must not slip into the steering, brakes or wheel. Also list quick-release & tool-free in other_families"
  # 395
  - name: Slotted adjustment with a jacking screw (slotted mount, sliding motor plate)
    category: adjusters, levellers & spacers
    description: Screws pass through slots instead of round holes, so a part such as a motor can slide to a new position, often pushed by a separate screw, and is then locked by tightening the screws
    notes: Also covers adjustable centres for belts and chains. Also list tensioning, reels & take-up in other_families
  # 396
  - name: Castor (swivel castor, fixed castor, locking castor)
    category: hinges & pivots
    description: A wheel in a bracket under a cart, robot or piece of furniture so it can be rolled; a swivel castor's wheel sits a little behind its pivot so it swings round to follow the direction of travel, and locking castors brake the wheel, the swivel or both
    notes: "Also covers stem and plate fixings, central locking that locks every castor at once, directional locks, and furniture glides. Safety: lock castors on slopes and respect each castor's rated load. Also list sliding, telescoping & linear motion in other_families"
  # 397
  - name: Levelling foot (adjustable foot, swivel levelling pad)
    category: adjusters, levellers & spacers
    description: A threaded stud with a pad, screwed into the bottom of a leg or machine, so turning it raises or lowers that corner, with a ball joint that often lets the pad sit flat on an uneven floor
    notes: Also covers threaded inserts in tube legs and printed levelling feet. Also list hinges & pivots in other_families
  # 398
  - name: Spring clip clamp (clothes-peg clip, spring clamp, clip-on holder)
    category: clamping, magnetic & friction connections
    description: Two jaws on a pivot, squeezed shut by a spring; you pinch the handles to open it and let go to clamp, as in clothes pegs, spring clamps and clip-on phone or lamp holders
    notes: Also covers printed spring clamps and clips that use a rubber band as the spring. Also list springs & energy storage in other_families
  # 399
  - name: In-line swivel (rope swivel, chain swivel, ball-bearing swivel)
    category: cord, strap, webbing & textile hardware
    description: A small link made of two eyes joined by a free-turning pivot, put in a line, chain, lead or hanger so one end can spin without twisting the other, as on fishing line, dog leads, anchor chain, key rings and hanging signs
    notes: "Also covers barrel, box and ball-bearing swivels and print-in-place swivels. Safety: a swivel can be the weakest link; never hold anything overhead or any person with a printed one. Also list hinges & pivots in other_families"
  # 400
  - name: Multi-point bolt (espagnolette, crémone bolt, lock rods)
    category: locks, latches & catches
    description: One handle drives two or more bolts at once, through a turning rod with hooks or a rack and pinion, so a tall door, a big lid or a pair of cabinet doors is locked at top and bottom with one movement
    notes: "Also covers container and trailer lock rods and printed rack-and-pinion bolts for big boxes. Safety: mind the pinch points"
  # 401
  - name: Flywheel (inertia wheel, friction motor)
    category: springs & energy storage
    description: A heavy spinning wheel that stores energy as spin, smoothing out jerky turning (carrying a crank past its dead points) and keeping a toy or machine going after the push stops
    notes: "Also covers putting the mass near the rim and friction-motor toy cars. Flywheel dart blasters are out of scope. Safety: an over-sped flywheel can burst, so never over-speed printed ones and guard motor-driven ones. Also list brakes, dampers & speed control in other_families"
  # 402
  - name: Tapered pipe thread (NPT, BSPT; PTFE tape, pipe dope)
    category: seals & pass-throughs
    description: A pipe thread that gets wider along its length, so screwing it in wedges the threads tight, while tape or paste fills the tiny gaps so it doesn't leak
    notes: "Also covers how to wrap PTFE tape, pipe dope and anaerobic thread sealant, telling look-alike thread standards apart, and not mixing thread forms. Thread size tables are linked to, not listed. Safety: pressure; overheated PTFE gives off a toxic gas. Also list hydraulics, pneumatics & vacuum in other_families"
  # 403
  - name: Parallel pipe thread with a sealing washer (BSPP, garden-hose thread, pipe union)
    category: seals & pass-throughs
    description: A straight pipe thread only holds the parts together, while a rubber washer, bonded seal or O-ring squeezed against a flat face does the sealing, as on garden hoses and tap connectors
    notes: "Also covers bonded seals, why US and European garden-hose threads don't fit each other, pipe unions and dielectric unions, and printed thread adapters. Also list hydraulics, pneumatics & vacuum in other_families"
  # 404
  - name: Soldered metal joint (soft soldering of metal parts, sweat-soldered copper pipe)
    category: welding, brazing & soldering
    description: Metal parts are joined by melting a low-melting tin alloy (solder) into a tight gap with a soldering iron or a small gas torch, as in copper water pipes, tin toys, stained glass and brass models
    notes: "Also covers which metals solder easily, fluxes, copper-pipe capillary fittings (end-feed and solder-ring), lead-free solder for drinking water, and low-melting solders. Wire joints are Soldered wire joint. Safety: flux fumes can cause asthma, lead, and torch fires. Also list seals & pass-throughs and electrical connections in other_families"
  # 405
  - name: Brazed joint (brazing, silver soldering, hard soldering)
    category: welding, brazing & soldering
    description: Metal parts are heated red-hot with a torch and a brass or silver alloy is melted into a close-fitting gap, giving a strong, leak-proof joint without melting the parts themselves
    notes: "Also covers the gap for capillary flow, silver-solder grades, braze welding, flux-free copper brazing rods, and zinc 'aluminium welding' rods (really a solder). Safety: cadmium-bearing fillers give toxic fumes; fire. Also list seals & pass-throughs in other_families"
  # 406
  - name: Spot weld (resistance spot welding)
    category: welding, brazing & soldering
    description: Two overlapping metal sheets or strips are squeezed between copper electrodes and a short burst of very high current melts a small button of metal between them, as on car bodies, steel boxes and battery packs
    notes: "Also covers nickel strip on battery packs, seam welding and choosing a hobby spot welder. Safety: sparks, and lithium cells catch fire if overheated. Also list interlocking joints & joinery and electrical connections in other_families"
  # 407
  - name: Heat-fused plastic pipe (socket fusion, butt fusion, electrofusion)
    category: welding, brazing & soldering
    description: Polyethylene or polypropylene pipes are joined by melting the pipe end and the fitting on a hot tool, or with a fitting that has a heating wire built in, and pushing them together so they set as one piece
    notes: "Also covers insertion depth, heating and holding times, and why PE and PP pipe can't be solvent-welded. Safety: burns and spurting molten plastic. Also list seals & pass-throughs and hydraulics, pneumatics & vacuum in other_families"
  # 408
  - name: Flare fitting (flared tube fitting, double flare)
    category: seals & pass-throughs
    description: The end of a soft metal tube is spread into a cone with a flaring tool and clamped by a nut against a matching cone, giving a metal-to-metal seal, as on car brake lines, gas pipes and air-conditioner pipes
    notes: "Also covers single and double flares, flaring tools and flare-nut spanners. Safety: brake and gas lines are safety-critical, so follow the rules for them. Also list hydraulics, pneumatics & vacuum in other_families"
  # 409
  - name: Ultrasonic weld (ultrasonic plastic welding, energy director)
    category: welding, brazing & soldering
    description: A tool vibrating at 15 to 40 kHz presses two plastic parts together and the vibration melts a small ridge between them in a moment, sealing them shut with no screws or glue, as in sealed chargers, toys and blister packs
    notes: "Also covers energy directors and shear joints, ultrasonic welding of prints, and laser, infrared, hot-plate and RF welding as mentions. Safety: keep hands away from the horn; noise"

  # ==================== PHASE 5 (2026-10-22, R36, R37): materials and one-to-many ====================
  # Added from the gap search in scope-search-2026-10-22-combined.md, in the owner's order: paper and card,
  # paper pop-ups (new family), foam, clay and polymer clay, carbon fibre and composites, glass and mirror,
  # then one-to-many and many-to-one drives.
  # 410
  - name: Score-and-fold hinge (scored crease, creasing, card hinge)
    category: compliant mechanisms & flexures
    description: A line pressed or lightly cut into paper or card so that it folds cleanly and accurately there, the fold itself then acting as the hinge, as in greeting cards, book covers, card boxes and papercraft models
    notes: "Also covers scoring tools (bone folder, empty ballpoint pen, scoring board, rolling creaser), finding and folding with the paper grain, folding corrugated card across or along the flutes, half-cut (kiss-cut) scores for thick board, the cardboard rebate corner (peel away one liner and the flutes), mountain and valley folds, and folded ribs that stiffen cardboard. Fold patterns are Origami mechanisms, pop-up folds have their own entries. Safety: craft-knife cuts when half-cutting; cut away from the hand holding the ruler. Also list hinges & pivots and interlocking joints & joinery in other_families"
  # 411
  - name: Glued tab joint (glue tab, glue flap, construction tab; edge gluing with a backing strip)
    category: adhesives & bonding
    description: A narrow flap left on the edge of a paper or card part is folded and glued under or behind the next part, the standard way to join papercraft models, card boxes and cardboard tubes
    notes: "Also covers tab width and angled tab ends, gluing the face rather than the tab, tabless edge gluing with a hidden backing strip, flange tabs for joining cardboard tubes and round parts, which glues suit tabs (glue stick, PVA, tacky glue, double-sided tape), and unfolding software that adds tabs automatically. A tab is a small lap joint, so see Glued joint design. Safety: craft knife and solvent glues. Also list interlocking joints & joinery in other_families"
  # 412
  - name: Adhesive tape joint and tape hinge (pressure-sensitive tape; masking, packing, gummed paper and double-sided tissue tape)
    category: adhesives & bonding
    description: A strip of sticky tape across or between two parts holds them together at once with no drying time, and a strip across a gap makes a quick bendy hinge, as on parcels, cardboard models and book repairs
    notes: "Also covers choosing a tape (masking and drafting tape for temporary holds, transparent office tape, box-sealing and filament tape, water-activated gummed paper tape that soaks into cardboard, double-sided tissue tape and adhesive transfer tape for hidden joints, duct and gaffer tape), tape hinges on one side, both sides or woven (incl. the hinges on the moving flaps of foam model planes: clear packing tape, fibre-reinforced tape, soft medical tape of the Blenderm type and gapless hinge tape), quick taped seams on foam-board and cardboard prototypes, and why tape creeps, dries out and lets go with heat, sun and age. Thick foam tape is Double-sided foam tape and copper tape is Conductive tape. Safety: none special beyond residue on surfaces. Also list hinges & pivots in other_families"
  # 413
  - name: Split-pin paper fastener (brass fastener, paper brad, butterfly clip)
    category: hinges & pivots
    description: A small brass pin with a round head and two flat legs is pushed through holes in paper or card and the legs are spread flat behind, holding the layers together while letting them turn, as in moving pictures, card puppets, toy clocks and card linkages
    notes: "Also covers loose and fixed pivots in card linkages, making the hole first with a pencil point or awl, card spacers, scrapbook brads and screenplay binding, and 3D-printed click-together versions. Not the small nail also called a brad (see Nails, brads and tacks). Safety: sharp leg tips; make the hole first instead of forcing the pin, and keep small parts away from young children. Also list everyday fasteners & fixings and motion conversion in other_families"
  # 414
  - name: Cardboard screws and rivets (cardboard construction screw, box rivet, zip-tie rivet)
    category: everyday fasteners & fixings
    description: Reusable plastic screws or click-together plastic rivets made for corrugated cardboard, which join box panels without tape or glue and can make swinging joints, as in cardboard forts, playhouses, costumes and classroom builds
    notes: "Also covers punching the hole, how many layers each length grips, making hinges and pivots with a smooth-shank rivet, zip-tie rivets, brass paper fasteners and nuts and bolts as alternatives, 3D-printed compatible screws, hinges and brackets, and safe cutting tools for children. Brand names (Makedo, Mr. McGroovy's) as search terms only. Safety: punching holes towards the hand; small parts are a choking risk for under-3s. Also list snap & clip fits and hinges & pivots in other_families"
  # 415
  - name: Glue stick and starch paste (paper glue stick, wheat-starch paste, methyl cellulose, wallpaper paste)
    category: adhesives & bonding
    description: Mild water-based glues for paper and card, either a solid stick rubbed on like a lipstick or a cooked flour or starch paste brushed on, which grip the paper fibres and can often be loosened again with water
    notes: "Also covers permanent, washable and colour-change glue sticks, why wet glue makes paper cockle and how to press it flat, wheat-starch paste and methyl cellulose in bookbinding and paper repair (reversible), papier-mâché strips to strengthen cardboard joints, and wallpaper paste. Rubber cement is mentioned under Contact adhesive. Safety: none special; cooked paste goes mouldy, so make it fresh"
  # 416
  - name: Folding box closures (tuck flap, slit lock, snap-lock 1-2-3 bottom, crash-lock bottom)
    category: interlocking joints & joinery
    description: The folded flaps that close a card or cardboard box without tape, where a tuck flap slides inside and is held by friction or a small slit, and lock bottoms interleave their flaps or use pre-glued flaps so the base snaps square as the box opens, as in cereal boxes, card-deck boxes and mailer boxes
    notes: "Also covers straight and reverse tuck ends, dust flaps, friction tuck versus slit lock, tuck-top mailer boxes with locking ears, the glued side seam (manufacturer's joint), box-style codes (FEFCO, ECMA) as search terms, and making boxes from templates or a cutting plotter. Barbed lock tabs are in Snap-lock sheet joint. Safety: none special. Also list snap & clip fits and locks, latches & catches in other_families"
  # 417
  - name: Sewn book bindings (pamphlet stitch, Coptic stitch, kettle stitch, Japanese stab binding)
    category: knots, lashings & sewn joints
    description: Thread sewn through holes along the fold or the edge of a stack of paper holds the pages together as a book, from a three-hole pamphlet stitch for a zine to linked stitches for a sketchbook that opens flat, or a stab binding sewn through the side
    notes: "Also covers sewing through the fold versus through the side, odd numbers of holes and hole spacing, waxed linen thread and how much to cut, piercing jigs and awls, grain direction so pages turn easily, saddle stapling as the quick alternative, and glued (perfect) binding as a mention. Screw-post binding is Chicago screw. Safety: awls and needles. Also list hinges & pivots in other_families"
  # 418
  - name: Loose-leaf bindings (ring binder, spiral coil, comb and wire binding, disc binding)
    category: hinges & pivots
    description: Rings, wire or plastic coils, plastic combs or discs pass through a row of punched holes so the sheets turn like a hinge and, for most types, can be added or removed, as in ring binders, spiral notebooks and disc-bound planners
    notes: "Also covers hole patterns and punches, lever-arch files, binder rings, how discs grip mushroom-shaped holes, which types let a book open flat or fold back on itself, and 3D-printed rings and discs. Screw posts are Chicago screw. Safety: punch and wire-closing tools pinch. Also list quick-release & tool-free and snap & clip fits in other_families"
  # 419
  - name: Parallel-fold pop-up (box fold, step fold, floating layer, parallelogram pop-up)
    category: pop-up & movable paper mechanisms
    description: Two cuts across the centre fold of a card, or a strip glued across it, make a step, box or stage that stands up as the card opens and folds flat as it shuts; its sides stay parallel to the fold, like a paper parallelogram linkage
    notes: "Also covers single-sheet cut-and-fold layer pop-ups and 90-degree kirigami ('origamic architecture') cards, glued-on boxes, tents and arches, multiple layers, floating layers (a flat plane on three parallel supports, straight or diagonal), slot-and-joint arms on a parallelogram, lattice pop-ups (needs confirming), and as mentions the concertina structures of tunnel (peepshow) and carousel books, whose accordion-folded side strips hold cut-out layers apart. Explains the balance rule (the piece's length plus its distance from the fold must match on both sides, or the card won't close) and 90-degree versus 180-degree pop-ups. Safety: craft knives; let glue set before opening. Also list motion conversion and compliant mechanisms & flexures in other_families"
  # 420
  - name: V-fold pop-up (angle fold, mouth fold)
    category: pop-up & movable paper mechanisms
    description: A piece cut or glued across the centre fold at an angle, so that its folds meet at one point on the spine; opening the card swings it up and forward, as in pop-up mouths, wings, trees and the classic pop-up monster card
    notes: "Also covers the single-sheet mouth (beak) pop-up, symmetric and lopsided (asymmetric) V-folds, V-folds stacked on V-folds, the 45-degree fold, and why a narrow V stands taller. Explains the rule that all creases meet at one point on the spine and the angles must balance left and right, or the card won't close flat. Safety: craft knives. Also list motion conversion and compliant mechanisms & flexures in other_families"
  # 421
  - name: Pull-tab and slider mechanism (pull-strip, sliding motion, moving arm, transformation)
    category: pop-up & movable paper mechanisms
    description: A paper strip or tab, pulled by hand or by the page as it opens, slides in a slot or a glued channel to move a picture across the page, swing an arm on a pivot, lift a flap or change one scene into another
    notes: "Also covers the slot slider with folded tabs, guide strips that make a channel, lever arms on paper rivets, the automatic pull-strip that works when the page opens, flaps raised or flipped by a pull-strip, transformations (Venetian-blind slats that slide over each other), the pull-down and the spider-web spiral lifted by a ribbon. Tips for smooth sliding: spacer frames, vellum or foam tape. Safety: craft knives; strips tear at glued ends if the glue has not set. Also list motion conversion and sliding, telescoping & linear motion in other_families"
  # 422
  - name: Volvelle (paper wheel, wheel chart, rotating disc)
    category: pop-up & movable paper mechanisms
    description: Paper discs stacked on one centre pivot so that turning one lines up windows, pointers and pictures on another, as in wheel charts, code and calculator wheels, old astronomy books and pop-up books
    notes: "Also covers pivots made of string, a split-pin paper fastener, a paper rivet (split tabs through a hole), or a grommet or eyelet; wheels hidden between two pages and seen through die-cut windows; dials turned from the page edge; and the dissolving wheel (metamorphosis), where two slotted discs slide over and under each other to change a picture. Safety: sharp split-pin legs and small parts for young children (needs confirming). Also list hinges & pivots and indexing & detents in other_families"
  # 423
  - name: Spring-powered paper pop-up (rubber-band snap-up cube, paper spring, jumping card)
    category: pop-up & movable paper mechanisms
    description: A folded card box held flat with a stretched rubber band inside, or a springy folded paper strip, that jumps into shape when it is let go or slid out of a card or envelope
    notes: "Also covers sizing the band (its flat length a little longer than one side of the cube), tab locks that hold the cube flat until dropped, the folded two-strip paper spring that bounces a figure out of a box, and pop-up cubes in cards. Safety: a strong band can flick the cube or the band at faces (needs confirming); rubber bands perish over time. Also list springs & energy storage in other_families"
  # 424
  - name: V-groove fold (mitre fold, fold-up corner, bevelled fold in foam board and EVA foam)
    category: interlocking joints & joinery
    description: A V-shaped strip is cut out of the back of a sheet almost all the way through, so the thin face layer left behind bends like a hinge and the two cut faces close into a neat glued corner, as in foam-board model planes, EVA foam armour ridges, plywood trays and folded aluminium-composite signs
    notes: "Also covers the square-groove ('overlap') fold in foam board, where a strip of foam one board-thickness wide is removed and the paper skin wraps the corner; Flite Test A- and B-style folds; routed-and-folded composite panels; and mitre folds in wood and veneer held with packing tape on the face while the glue sets. Partial-depth valley cuts for curves belong to kerf bending. Safety: sharp knives and router bits; use contact cement only with good ventilation. Also list compliant mechanisms & flexures and adhesives & bonding in other_families"
  # 425
  - name: Pinned glue joint (pinning; wire, rod, toothpick or skewer pins)
    category: adhesives & bonding
    description: A short pin glued or pushed into matching holes in both parts, so a small glued joint (an arm on a miniature, a broken figure, a resin print, a polymer clay head, foam or foam-board parts) has a hidden pin across it and does not slide or snap off when handled
    notes: "Also covers brass rod, paper-clip and garden-wire pins; toothpick and bamboo-skewer pins in foam and foam board; toothpick and wire pins pushed into raw clay before baking; temporary pins (dressmaker's pins, T-pins) holding foam-board parts while glue sets; marking the second hole with a dab of paint or Blu Tack; oversize holes filled with epoxy or epoxy putty; two pins to stop a part spinning; pinning miniatures to their bases; spreading the load in foam with tape, card or a thin plywood washer. Wooden dowels in furniture are Dowel and biscuit joints. Safety: drill with a pin vice (hand drill), not by holding the part under a power drill; clip wire with eye protection; cut skewer ends flush. Also list interlocking joints & joinery, locating & alignment and everyday fasteners & fixings in other_families"
  # 426
  - name: Slot-in model hinge (CA hinge, flat hinge, pinned hinge point)
    category: hinges & pivots
    description: Small hinges pushed into slots or drilled holes along the edges of a model's wing and its moving flap and glued in, leaving a hidden pivot with no screws, as on the control surfaces of radio-controlled planes made of foam or balsa
    notes: "Also covers fibrous flat 'CA hinges' wicked with thin superglue, moulded pinned hinges, round hinge points set in slow epoxy, and pegging a hinge with a toothpick. Use foam-safe glue on EPS and EPO foam, glue one side at a time, and keep glue out of the pivot (a smear of petroleum jelly on the pin). Safety: a hinge that pulls out in flight loses control of the model, so test each one by tugging. Also list adhesives & bonding in other_families"
  # 427
  - name: Jigsaw puzzle-edge joint (puzzle joint, interlocking tile edge)
    category: interlocking joints & joinery
    description: Edges cut like jigsaw-puzzle pieces, so the shapes on one panel press into matching sockets on the next and lock them side by side with no glue, as on EVA foam floor and play mats
    notes: "Also covers hidden snap-together tile edges and removable border strips. It resists pulling apart sideways but not lifting, so tiles separate on uneven floors or with heat and humidity changes. Overlaps the puzzle joints of split 3D prints (item 62). Also list snap & clip fits in other_families"
  # 428
  - name: Liquid-clay bond (bakeable clay glue, bake-in-stages join)
    category: adhesives & bonding
    description: A thin coat of liquid polymer clay brushed between two pieces of polymer clay, raw or already baked, which fuses them into one when the piece is baked again; used to add small details and to build a sculpture in several bakes
    notes: "Also covers raw-to-raw, raw-to-baked and baked-to-baked joins, a raw-clay bridge between baked parts, thick bakeable pastes, and gel superglue for baked parts that cannot be baked again. Brand of clay changes the result. Safety: bake at the packet temperature with ventilation; burnt polymer clay gives off hydrogen chloride; do not use for food items. Also list welding, brazing & soldering in other_families"
  # 429
  - name: Score-and-slip join (scratch and slip, luting)
    category: adhesives & bonding
    description: Scratching criss-cross lines into both clay surfaces and brushing on slip (the same clay thinned with water to a thick cream), then pressing and blending the seam, so two pieces of soft or leather-hard pottery clay or air-dry clay grow into one; how handles, spouts and modelled details are attached
    notes: "Also covers vinegar or 'magic water' (sodium silicate) instead of slip, reinforcing the seam with a thin coil, matching the dryness of both parts, and PVA glue for already-dry air-dry clay. Safety: dry slowly and evenly, or the join cracks; vinegar dissolves slip-cast pieces; clay dust from sanding dry clay should not be breathed. Firing ceramics is out of scope (parked)."
  # 430
  - name: "Baked-in findings (embedded hardware in clay: eye pins, screw eyes, earring posts, bails)"
    category: everyday fasteners & fixings
    description: Metal loops, pins, posts or bails set into soft polymer clay (with a bent end, a dip of liquid clay, or a second layer of clay pressed over a flat pad) so the baked clay holds them by shape rather than glue; how charms, pendants, earrings and clay buttons get their fittings
    notes: "Also covers screw eyes twisted into a pilot hole in baked clay and locked with a drop of glue, hooked wire set into a drilled hole and filled with clay paste, gems pressed in raw then glued back into their seat, and magnets (glue them on after baking, or use high-temperature grades). Safety: standard neodymium magnets lose strength above about 80 °C and polymer clay cures at about 130 °C; don't bake resin or superglue; air bubbles round hardware can crack the piece. Also list print-in-place & 3D-printing joints and cord, strap, webbing & textile hardware in other_families"
  # 431
  - name: Elastic-strung ball joint (ball-jointed doll stringing, strung doll joint)
    category: hinges & pivots
    description: Hollow body parts with ball-and-socket ends threaded on a stretched elastic cord inside them, so the cord pulls every joint closed and friction holds the pose; used in ball-jointed dolls, printed and clay art dolls and posable figures
    notes: "Also covers S-hooks at hands, feet and head, two-loop stringing (arms across the chest, an upside-down V from the neck to the feet), cord sizes by doll size, double joints, and swap-in hands held by a hook. Safety: an unhooked loop can snap back hard, so clamp it first; stringing too tight cracks thin wrists and ankles; elastic ages and needs replacing. Also list springs & energy storage and tensioning, reels & take-up in other_families"
  # 432
  - name: Wire and foil armature (sculpture armature, foil core)
    category: everyday fasteners & fixings
    description: A bendable wire skeleton, fixed into a base and bulked out with crumpled foil, that clay is pressed over, so thin limbs, heads and tails stay attached and a figure can stand; used for polymer clay, air-dry clay and epoxy putty figures
    notes: "Also covers twisted double wire, epoxy-putty-reinforced armatures, toothpick neck pins, wooden or metal bases, and foil, polystyrene or paper bulking. Safety: wood and stone hold moisture and should be pre-dried before baking; trapped air between foil and clay cracks or puffs in the oven; a PLA print is not a bakeable armature (it softens far below polymer clay temperatures); metal armatures must be removed from clay that will be kiln-fired. Also list locating & alignment in other_families"
  # 433
  - name: Bonded tube joint (lugged, sleeved or fibre-wrapped tube joint; carbon tube connector, bonded end fitting)
    category: adhesives & bonding
    description: Tube ends are glued into or over a socket, sleeve or lug, or wrapped with resin-soaked fibre, so tubes join without drilling holes, as in carbon bike frames, drone booms, camera rigs and bamboo bikes
    notes: "Also covers bond gap and bond length, sanding and cleaning, internal joiners (ferrule tubing), bonded threaded end plugs and quick-release end fittings, printed and metal lugs, tube-to-tube wrapped joints and hemp-wrapped bamboo joints. Safety: carbon touching bare aluminium corrodes it (isolate with anodising, glue or a glass layer); carbon dust; epoxy skin allergy; never ride a home-made frame without testing. Also list interlocking joints & joinery and print-in-place & 3D-printing joints in other_families"
  # 434
  - name: Fillet-and-tape joint (stitch-and-glue seam, glass-tape tabbing, tack-and-tape)
    category: adhesives & bonding
    description: Two panels are held edge to edge, often with wire stitches or cable ties, then a cove of thickened epoxy is run into the corner and resin-wet glass tape is laid over it, joining plywood boats, kayaks, bulkheads and fibreglass parts without frames or screws
    notes: "Also covers stitching with copper wire or cable ties, tack fillets, fillet tools and fillers, taping both sides, tabbing bulkheads and stringers into fibreglass hulls, foam fillets against hard spots, taped butt joints in plywood, and wrapping printed or foam parts into a composite shell. Safety: epoxy skin allergy, sanding dust from glass and cured epoxy, heat from large batches. Also list interlocking joints & joinery in other_families"
  # 435
  - name: Potted insert (sandwich-panel insert, hard point, overdrill-fill-redrill)
    category: everyday fasteners & fixings
    description: The hole in a honeycomb, foam or balsa-cored panel is opened up, the soft core round it is dug out and filled with epoxy round a threaded insert or bolt, so a screw can grip and the core isn't crushed or soaked, as on boat decks, solar-car floors and RC panels
    notes: "Also covers factory flanged inserts, through-thickness and blind potting, the boat 'overdrill, fill and redrill' method, solid hard points laid in during building, and sizing the bracket foot at least as wide as the potting. Safety: water in a cored deck rots balsa; epoxy skin allergy; fast epoxy can overheat in a large fill. Also list adhesives & bonding and seals & pass-throughs in other_families"
  # 436
  - name: Bonding fastener (glue-on stud, bonded-base stud or nut, perforated-base fastener)
    category: everyday fasteners & fixings
    description: A stud, nut or threaded collar on a wide perforated base plate that is glued onto a surface or laminated into it, giving a thread to bolt onto without a hole through the part, as on fibreglass boats, carbon panels and camper walls
    notes: "Also covers surface bonding versus embedding in the lay-up, bonding to the back face so the stud passes through, home-made versions (threaded rod in a glued block of G10), choice of adhesive (epoxy, methacrylate) and holding it still while it cures. Safety: only as strong as the surface it is glued to; don't hang people or overhead loads on it without the maker's ratings. Also list adhesives & bonding in other_families"
  # 437
  - name: "Push-fit rod and spar fittings (kite fittings: tee and cross connectors, ferrules, nocks, end caps)"
    category: quick-release & tool-free
    description: Small moulded, metal or printed sockets that solid carbon or fibreglass rods push into and are held by friction, to join rods at an angle, join two lengths end to end, or finish a rod with a slot for a line, as on kites, model frames and light stands
    notes: "Also covers Eddy and dihedral connectors, vinyl-tube connectors, brass and aluminium ferrules (with a centre stop), arrow nocks and split caps, sleeving a thin rod up to fit a bigger fitting, and printed connectors. Safety: carbon splinters from broken rods; carbon rods conduct electricity, so keep kites away from power lines. Also list clamping, magnetic & friction connections and cord, strap, webbing & textile hardware in other_families"
  # 438
  - name: Compression limiter (crush tube, bolt sleeve, compression sleeve)
    category: everyday fasteners & fixings
    description: A short metal tube fitted in a bolt hole through plastic, a print, a composite plate or a cored panel, so the bolt clamps on the tube instead of the soft material and the joint stays tight instead of crushing or creeping loose
    notes: "Also covers sizing the tube a little shorter than the part, split-seam, moulded-in and pressed-in types, home-made tube or brass-tube versions in prints, epoxy rings in cored panels and wide washers. Safety: a crushed or crept joint loosens without warning, so check bolts on anything that carries people. Also list adjusters, levellers & spacers and print-in-place & 3D-printing joints in other_families"
  # 439
  - name: Panel standoff (sign standoff, glass standoff, stand-off mount, edge-grip standoff)
    category: everyday fasteners & fixings
    description: A metal barrel screwed to the wall, with a cap screwed into its front that clamps a drilled sheet of acrylic, glass or metal, so the sheet floats a set distance off the wall, as on lobby signs, glass name plates and laser-cut acrylic signs
    notes: "Also covers barrel length and cap size, through-grip and edge-grip standoffs, female-female standoffs, mirror screws with domed caps, clear vinyl washers against glass, and printed standoffs. Hole size comes from the maker's table; keep holes at least 1 in (25 mm) from the edge. Safety: toughened (tempered) glass can't be drilled after toughening, so its holes are made before; never let metal touch glass directly; heavy panels need fixings into studs or proper wall anchors. Also list adjusters, levellers & spacers in other_families"
  # 440
  - name: Glass and mirror edge clips and clamps (mirror clips, glass clamp, glass shelf bracket, glass bed clip)
    category: clamping, magnetic & friction connections
    description: Small brackets that hold a sheet of glass, mirror or acrylic by its edge without drilling it, either with a lip the sheet sits behind (mirror clips) or with a screw clamp lined with rubber pads (glass shelf brackets, shower-panel clamps, 3D-printer glass bed clips)
    notes: "Also covers fixed and sliding (spring) mirror clips, J-channel for gym mirrors, glass-to-wall and glass-to-glass clamps, display-cube connectors, printed bed clips and binder clips on glass beds. Two fixed clips below, sliding clips above, about 50 mm in from the corners. Match the clip to the sheet thickness. Safety: keep a gasket between metal and glass, tighten evenly and not too hard, and fix heavy mirrors into studs or with toggle anchors (plastic plugs only up to about 20 lb). Also list everyday fasteners & fixings in other_families"
  # 441
  - name: Copper-foil joint (Tiffany method, foiled and soldered glass)
    category: welding, brazing & soldering
    description: Each piece of glass has its edge wrapped in sticky copper tape that is pressed flat, and the pieces are joined by running a bead of solder along the copper seams, as in Tiffany lamps, suncatchers and small glass boxes
    notes: "Also covers foiling and burnishing, tinning then beading, adding hanging loops and jump rings to glass pendants, 3D shapes held in printed angle jigs, and printed foilers. Safety: lead in 60/40 and 50/50 solder (wash hands, no food in the workspace, keep children away; lead-free solder exists); flux fumes; cut glass edges; wash the piece after soldering. Also list adhesives & bonding in other_families"
  # 442
  - name: Glazing in a rebated frame (glazier's points, glazing putty, glazing bead, picture-frame turn buttons)
    category: everyday fasteners & fixings
    description: A pane of glass, mirror or acrylic sits in a stepped recess (rebate) in a frame and is held by small metal points pushed into the wood, a bead of putty, a pinned strip of wood (glazing bead) or turn buttons that swivel over the backing, as in picture frames and old wooden windows
    notes: "Also covers push-in and diamond points, flexible framing points and point drivers, bedding and face putty (linseed oil and synthetic), glazing beads and tape, and printed turn buttons and clips for printed frames. Safety: old window putty and paint may contain lead (don't dry-sand); cut glass edges; old glass may be brittle. Also list seals & pass-throughs and interlocking joints & joinery in other_families"
  # 443
  - name: Glass door hinge (clamp-on glass hinge, drilled glass-door cup hinge, pivot hinge for glass doors)
    category: hinges & pivots
    description: A hinge made for a glass or acrylic door that can't take wood screws. It either clamps onto the glass edge with a screw and anti-slip pads, fits a cup through a 26 mm hole drilled in the glass, or lets the door turn on pins at its top and bottom corners, as on display cabinets and 3D-printer enclosures
    notes: "Also covers inset and overlay glass hinges, cover caps, pivot hinge and magnetic catch kits, and printed hinges for acrylic enclosure doors. Check the glass thickness range (often 4-6 mm) and weight per pair. Safety: holes in glass must be drilled by a glass shop, and before toughening for toughened glass; plastic must sit between glass and metal. Also list clamping, magnetic & friction connections in other_families"
  # 444
  - name: Wire-bail closure (flip-top, swing-top bottle, lightning stopper, clamp-lid jar)
    category: over-centre, toggle & cam clamps
    description: A wire loop and lever fixed to a bottle or jar swing a lid or stopper with a rubber seal down and lock it shut by snapping past centre, so it can be opened and resealed by hand, as on swing-top beer bottles and clip-top preserving jars
    notes: "Also covers the older Kilner bail jar, porcelain and plastic stoppers, replacement rubber seals and printed TPU seals, and retaining clips. Safety: fermenting or fizzy drinks build pressure, so use bottles made for it and don't over-carbonate; chipped glass rims don't seal. Also list seals & pass-throughs in other_families"
  # 445
  - name: Lead came joint (leaded glass, came glasswork, zinc and brass came)
    category: welding, brazing & soldering
    description: Pieces of glass are slotted into H-shaped strips of soft lead (came), the strips are soldered only where they meet, and a putty-like cement is brushed under the strips to stiffen and waterproof the panel, as in leaded windows and cabinet doors
    notes: "Also covers H and U came, flat and round profiles, stretching lead came, zinc borders, brass-capped and reinforced came, steel reinforcing bars, cementing, and allowing for the came's heart when cutting glass. Safety: lead dust and fumes (wash hands and face, change clothes, no eating in the workspace, keep children away), acid fluxes, cut glass. Also list interlocking joints & joinery in other_families"
  # 446
  - name: Glass fusing (kiln fusing, tack fusing, full fusing)
    category: welding, brazing & soldering
    description: Pieces of compatible glass are stacked and heated in a kiln to about 690-820 C until they stick together (tack fuse) or melt into one smooth piece (full fuse), then cooled slowly so they don't crack, as in fused glass pendants, coasters and dishes
    notes: "Also covers glass compatibility (COE is not enough on its own), checking stress with two polarising filters, annealing and firing schedules, slumping as a second firing, fusing in wire loops and inclusions, and microwave kilns for small pieces. Lampworking and glassblowing are making processes, so they are left out. Safety: kiln heat and burns, glass that is not compatible can crack weeks later, and glass dust from grinding. Also list adhesives & bonding in other_families"
  # 447
  - name: Shelf pins and shelf supports (shelf pegs, spoon pins, glass shelf supports)
    category: everyday fasteners & fixings
    description: Small pegs pushed into a row of holes inside a cupboard or bookcase so a loose shelf rests on them and can be moved up or down; glass shelves use versions with a rubber pad or ring so the glass cannot slip
    notes: "Also covers shelf-pin hole jigs and the 32 mm system, plain, spoon and sleeved pins, locking pins that stop a shelf tipping, glass-shelf supports with rubber rings, keyhole and hidden (floating-shelf) supports as mentions, and printed shelf pins for wood, glass and printed shelves. Safety: glass shelves need supports made for glass and a load limit. Also list adjusters, levellers & spacers in other_families"
  # 448
  - name: Linked lead screws (synchronised Z axis, Z sync belt, screw jack system)
    category: motion conversion
    description: Two or more lead screws turned together by one motor through a closed toothed belt, a chain, or shafts and right-angle gearboxes, so a 3D-printer bed, CNC gantry or lifting platform rises level at every corner
    notes: "Also covers belt- and chain-linked screws on 3D printers and CNC machines, screw-jack lifting systems linked by shafts and T-shaped bevel gearboxes, where to feed the drive in (the middle of a long shaft line is better than one end), belt tensioners, setting all screws level before tightening the pulleys, and the alternative of one motor per screw (see Several motors driving one load). Safety: a skipped tooth or slipped pulley leaves the axis out of level and can jam it; lifting platforms need self-locking screws or a brake. Also list gear trains, gearboxes & transmissions and sliding, telescoping & linear motion in other_families"
  # 449
  - name: Line shaft and power take-off (lineshaft, jackshaft, countershaft, PTO)
    category: gear trains, gearboxes & transmissions
    description: One long driven shaft with several pulleys, sprockets or gears along it that each take power off to a different machine or part, as in old workshops, lapidary benches, toy steam-engine workshops and tractor power take-offs
    notes: "Also covers fast and loose pulleys for stopping one machine, stepped pulleys for speed, a clutch on each take-off, twisting a belt to make one output turn the other way, the jackshaft as a middle shaft that changes the ratio (go-karts, minibikes), and the splined PTO shaft. Safety: spinning shafts, belts, set screws and PTO shafts catch hair and loose clothing and cause deaths and amputations; guard every exposed part. Also list clutches & couplings in other_families"
  # 450
  - name: Bevel splitter and counter-rotating drive (T-gearbox, three-way bevel gearbox, contra-rotating coaxial shafts)
    category: gear trains, gearboxes & transmissions
    description: One bevel gear driving two facing bevel gears, so a single input turns two outputs on one line in opposite directions; with one output shaft running inside the other it spins two propellers, rotors or discs against each other on the same axis
    notes: "Also covers T-type bevel gearboxes with one input and two outputs (a through shaft turns both ends together), reversing an output by flipping the gearbox or by sliding a dog clutch onto the other bevel, planetary contra-rotating hubs, kinetic sculptures with counter-rotating discs, and two-motor coaxial RC helicopters as the electric alternative. Safety: two sets of blades or propellers turning against each other; guard them. Also list motion conversion in other_families"
  # 451
  - name: Several motors driving one load (dual-motor drive, ganged motors, dual-motor gantry)
    category: gear trains, gearboxes & transmissions
    description: Two or more motors geared to the same gear, shaft or axis so they add their power, share the load or hold each other against play, as in two-motor robot drive gearboxes, CNC gantries driven at both ends and 3D printers with two Z motors
    notes: "Also covers gearing motors so their speed-torque curves match and they share the load, two steppers on one driver versus one driver each, auto-squaring a gantry with two endstops, electrical preload (two pinions on one rack pulling against each other to remove backlash), and one-way clutches that let either a motor or a hand crank drive. Safety: motors fighting each other or out of step can twist a frame, snap a shaft or tear a machine apart; turn the power off before swapping a motor's plug. Also list powered & active connectors in other_families"
  # 452
  - name: Cable splitter (cable doubler, one-into-two cable junction, dual-control brake splitter)
    category: gear trains, gearboxes & transmissions
    description: A small block or lever plate that joins one control cable to two, or two to one, so one lever works two brakes, one throttle opens two carburettors, or either of two levers works the same brake
    notes: "Also covers motorcycle throttle and oil-pump junction boxes, tandem and trike brake splitters, home-made two-cable brake-lever plates, two-lever dual-control splitters, and setting each cable's slack with barrel adjusters. A splitter moves every cable the same distance but does not even out their pull (compare Whippletree). Safety: if the lever, splitter or shared cable fails, every brake on it fails; some trike race rules require two separate brake systems; a binding junction can hold a throttle open. Also list motion conversion in other_families"

execution:
  batch_size: 6
  items_per_agent: 3
  output_dir: research/connection-types/results

# Families (the `family` field), each with a plain-English label for the flow chart.
# Changes from the starting list in research/prompts/02-connection-types.md, based on run 1's
# classification schemes and the web-search pass:
# - NEW "seals & pass-throughs": the `seal` finder field had no entries that actually seal;
#   also holds slip rings and cable carriers (carrying cables or fluid across a moving joint)
# - NEW "brakes, dampers & speed control": dampers, brakes and governors had no home
# - "sliding & telescoping locks" -> "sliding, telescoping & linear motion" (also screws and slides)
# - "magnetic & friction connections" -> "clamping, magnetic & friction connections" (DIN 8593's
#   force-fit group: clamping, press and taper fits, suction; holds the screw-joint baseline)
# - "cord, strap & webbing hardware" -> "cord, strap, webbing & textile hardware"
# - "motion conversion" explicitly includes stepping (intermittent) motion: Geneva, escapements
# - Cross-cutting axes from run 1 (by job, by holding principle) are finder fields
#   (`job`, `holding_principle`) rather than extra families.
# - NEW (2026-09-30, R20): "hydraulics, pneumatics & vacuum"
# - NEW (2026-10-03, R22, wider scope): "electrical connections", "everyday fasteners & fixings",
#   "knots, lashings & sewn joints", "adjusters, levellers & spacers" and "welding, brazing &
#   soldering", added last so existing report pages keep their numbers. The cord family's label
#   changed (its key did not) now that knots and sewing have their own family.
# - NEW (2026-10-22, R37): "pop-up & movable paper mechanisms" for the paper pop-up types (items
#   419-423). The other new paper, foam, clay, composite and glass joints fit existing families; the
#   finder's "Made of" filter (the made_of tag) gives the view by material.
families:
  - key: torque limiting & slip
    label: Slips or lets go when overloaded
  - key: one-way & ratchet
    label: Moves one way only
  - key: self-locking & anti-back-drive
    label: Holds against a load until you release it
  - key: tensioning, reels & take-up
    label: Tightens and holds tension
