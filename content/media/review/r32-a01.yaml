# R32 picture choices, batch a01 (see the pick brief). Candidate numbers refer to the R32 contact sheets.
conductive-tape:
  pictures:
    - commons: "File:5mm copper tape.jpg"
      kind: photo
      alt: A narrow roll of shiny copper foil tape, partly unrolled on a table.
  needs_animation: false
  needs_photo: false
  note: only a photo of the roll; a photo of tape used as wires on a paper circuit would show how it works better.
conductive-thread:
  pictures:
    - commons: "File:Conductive thread.jpg"
      kind: photo
      alt: A small bobbin of grey conductive thread with a loose end lying on a table.
    - candidate: 7
      kind: how-it-works
      alt: A round sewable circuit board and small LED boards sewn onto blue fabric, joined by lines of silver conductive stitching.
    - candidate: 4
      kind: photo
      alt: Pads and wavy lines embroidered in silvery conductive thread on black fabric, forming a fabric touch sensor.
  needs_animation: true
  needs_photo: false
constant-force-spring:
  pictures:
    - drawn
    - candidate: 8
      kind: photo
      alt: A clear plastic walking toy robot with blue feet, driven by a coiled steel strip spring visible inside it.
  needs_animation: false
  needs_photo: false
  note: the only photo is a toy powered by the spring; a plain photo of a constant-force spring coil being pulled out would be better.
constant-velocity-joint:
  pictures:
    - candidate: 9
      kind: animation
      alt: A turning animation of a ball-type CV joint, with arrows showing the bent input and output shafts spinning together while the balls stay between them.
    - candidate: 10
      kind: how-it-works
      alt: A hand holding a car CV joint taken off its axle, showing the outer housing, the inner hub and the steel balls between them.
    - candidate: 7
      kind: photo
      alt: A car half-axle with the ribbed rubber boots that cover the CV joints at each end.
  needs_animation: false
  needs_photo: false
crimp-terminals:
  pictures:
    - commons: "File:Kabelschuh verschiedene commons.jpg"
      kind: photo
      alt: Many kinds of crimp terminals (rings, forks, blades and pins) crimped onto the ends of coloured wires.
    - candidate: 17
      kind: cross-section
      alt: A crimped terminal sawn across, showing the copper wire strands squashed into one solid mass inside the metal barrel.
    - candidate: 24
      kind: how-it-works
      alt: Three steps of crimping a red ring terminal onto a wire, from loose terminal to finished, squeezed barrel.
  needs_animation: false
  needs_photo: false
crush-ribs-and-spring-fit-features:
  pictures:
    - drawn
  needs_animation: false
  needs_photo: true
  note: the contact sheet had no candidates.
cyanoacrylate:
  pictures:
    - commons: "File:Super glue.jpg"
      kind: photo
      alt: A small tube of superglue with a pointed nozzle cap, lying on a wooden table.
    - candidate: 9
      kind: how-it-works
      alt: Superglue being squeezed from a tube in a thin line around the rim of a white plastic part before the parts are pressed together.
  needs_animation: false
  needs_photo: false
cycloidal-drive:
  pictures:
    - commons: "File:Cycloidal drive.gif"
      kind: animation
      alt: An animation of a cycloidal drive, where the lobed yellow disc wobbles round inside a ring of pins and slowly turns the output pins.
    - candidate: 6
      kind: how-it-works
      alt: A plastic model of a cycloidal drive seen from above, with the blue lobed disc sitting inside a ring of white pins.
    - candidate: 3
      kind: photo
      alt: A cycloidal drive 3D printed in clear resin, so the lobed disc and pins can be seen through the case.
  needs_animation: false
  needs_photo: false
detent-hinge:
  pictures:
    - drawn
  needs_animation: false
  needs_photo: true
  note: the only candidates were a chronometer box and an unrelated photo.
diaphragm-pump-and-squeeze-bulb:
  pictures:
    - candidate: 2
      kind: animation
      alt: An animated cut-through of a double diaphragm pump, with the diaphragms moving side to side and arrows showing liquid drawn in past ball valves and pushed out.
    - candidate: 4
      kind: photo
      alt: A small black electric diaphragm pump with two hose spouts for water in and out.
  needs_animation: false
  needs_photo: false
  note: the animation has only 2 frames (it flips between the two strokes); the animated SVG Membraanpomp.svg may not animate once copied; no squeeze-bulb photo was found.
differential-screw:
  pictures:
    - commons: "File:DifferentialScrew.gif"
      kind: animation
      alt: An animation of a screw with two threads of different pitch turning inside two nuts, so the gap between the nuts changes only a little each turn.
    - candidate: 7
      kind: photo
      alt: A differential micrometer screw, a precision adjusting screw with a graduated barrel and thimble.
    - candidate: 6
      kind: photo
      alt: The parts of a differential screw laid out in a row beside a ruler, a threaded shaft with the two nuts that fit it.
  needs_animation: false
  needs_photo: false
differential:
  pictures:
    - commons: "File:Differential free.png"
      kind: diagram
      alt: A coloured drawing of a differential, with arrows showing the input gear turning the cage and the two output shafts turning out of the sides.
    - candidate: 23
      kind: cross-section
      alt: A modern car differential cut open, showing the large ring gear and the small bevel gears inside the housing.
    - candidate: 22
      kind: cross-section
      alt: A sectioned rear axle in a museum car, with a window cut in the casing to show the differential gears inside.
  needs_animation: true
  needs_photo: false
double-sided-foam-tape:
  pictures:
    - commons: "File:Двухсторонний скотч f003.jpg"
      kind: photo
      alt: Two rolls of double-sided tape, one yellow and one black foam tape, with their peel-off backing partly lifted.
  needs_animation: false
  needs_photo: false
  note: only a photo of the rolls; no photo of the tape holding two parts was found.
dovetail-joint:
  pictures:
    - commons: "File:Joinery-throughdovetail.svg"
      kind: diagram
      alt: A drawing of a through dovetail joint pulled apart, showing the flared tails on one board and the wedge-shaped pins on the other.
    - candidate: 11
      kind: photo
      alt: A small hand-cut dovetail corner joint in oak standing on a workbench beside a drill.
    - candidate: 5
      kind: photo
      alt: A close view of a large dovetail joint in pale timber, the tails fitted tightly between the pins at the corner.
  needs_animation: false
  needs_photo: false
dovetail-slide-with-gib-strip:
  pictures:
    - drawn
    - candidate: 1
      kind: photo
      alt: The angled dovetail track on a cast-iron machine bed, with the sloping sides that a carriage wraps round.
  needs_animation: false
  needs_photo: false
  note: the photo shows only the dovetail track, not the carriage or the gib strip.
dowel-and-biscuit-joints:
  pictures:
    - commons: "File:Woodworking-joint-butt-dowel.gif"
      kind: diagram
      alt: A drawing of two boards pulled apart at a butt joint, with two wooden dowels ready to go into matching holes in both ends.
    - candidate: 3
      kind: how-it-works
      alt: A flat oval wooden biscuit sitting half in a slot cut in the edge of a board, ready for the matching board.
    - candidate: 4
      kind: photo
      alt: Four wooden dowels with fluted (grooved) sides, which let glue and air escape as they are pushed in.
  needs_animation: false
  needs_photo: false
draw-latch:
  pictures:
    - commons: "File:BuegelVS-Kniehebel2.JPG"
      kind: photo
      alt: A draw latch on a metal box shown open, with its loop off the keeper, and closed, with the lever pressed flat.
    - candidate: 3
      kind: how-it-works
      alt: A finger lifting the lever of the draw latch on a springform cake tin, with the loop pivot swinging back over centre.
    - candidate: 2
      kind: photo
      alt: A black plastic lever latch on a tool case, its lever folded down over the keeper.
  needs_animation: true
  needs_photo: false
drawer-slide:
  pictures:
    - commons: "File:Light Rail.jpg"
      kind: photo
      alt: Several metal ball-bearing drawer slides, some pulled out to show their nested channels.
    - candidate: 1
      kind: how-it-works
      alt: A telescopic drawer slide fitted between a wooden drawer side and the cabinet, seen from the front with the drawer open.
  needs_animation: true
  needs_photo: false
eccentric-adjuster:
  pictures:
    - drawn
    - candidate: 1
      kind: photo
      alt: An eccentric bottom bracket on a bicycle, an off-centre insert in the frame that is turned to move the chainset and tighten the chain.
  needs_animation: false
  needs_photo: false
eccentric-cam-lever:
  pictures:
    - commons: "File:Quick release scewer.JPG"
      kind: photo
      alt: A bicycle quick-release skewer, a long thin rod with a nut at one end and a curved cam lever at the other.
  needs_animation: true
  needs_photo: false
  note: no photo shows the cam itself or the lever being closed; a close-up would explain it better.
eddy-current-brake:
  pictures:
    - commons: "File:Eddy current brake diagram.svg"
      kind: diagram
      alt: A drawing of a spinning metal disc passing between the poles of a magnet, with red loops showing the swirling eddy currents that drag on it.
    - candidate: 3
      kind: how-it-works
      alt: Inside an old electricity meter, an adjustable permanent magnet sits over the edge of the thin aluminium disc to brake it without touching.
    - candidate: 5
      kind: photo
      alt: A bullet-train wheel set with a large eddy-current disc brake fitted on the axle, its electromagnet unit beside the disc.
  needs_animation: true
  needs_photo: false
elastic-averaging:
  pictures:
    - drawn
  needs_animation: false
  needs_photo: true
  note: no candidate shows elastic averaging (a photo of many flexing ribs or a LEGO-style stud fit would do).
elastomer-isolation-mount:
  pictures:
    - commons: "File:Schwingungsdämpfer Aufbau.jpg"
      kind: photo
      alt: A rubber anti-vibration mount, a rubber core bonded to metal fittings, shown on a dark background.
    - candidate: 1
      kind: how-it-works
      alt: A computer hard drive held in its case on soft silicone grommets, so the screws never touch the metal frame directly.
    - candidate: 4
      kind: photo
      alt: A home-made vibration isolation platform, a metal plate resting on four squash balls held in small brackets.
  needs_animation: true
  needs_photo: false
elastomeric-solvent-glue:
  pictures:
    - commons: "File:Repairing snowboard boots with Shoe Goo.jpg"
      kind: how-it-works
      alt: A pair of snowboard boots tied tightly with string while the rubbery shoe glue squeezed into their worn soles sets, with the tube beside them.
  needs_animation: true
  needs_photo: false
electro-permanent-magnet:
  pictures:
    - commons: "File:Electropermanent magnet switching simulation.gif"
      kind: animation
      alt: A simulation of an electro-permanent magnet switching on and off, with the magnetic field lines reaching out into the steel below when on and staying inside the magnet when off.
  needs_animation: false
  needs_photo: true
  note: all candidates are diagrams or simulations; no real photo of an electro-permanent magnet was found.
electromagnetic-clutch:
  pictures:
    - commons: "File:B-1 electromagnetic-clutch1.png"
      kind: diagram
      alt: A half cross-section drawing of an electromagnetic clutch, labelling the coil, the spinning rotor, the armature plate and the hub.
    - candidate: 15
      kind: cross-section
      alt: A cut-away render of an electromagnetic clutch with a slice removed, showing the coil in its housing and the armature plate beside the rotor.
    - candidate: 8
      kind: how-it-works
      alt: Two small electromagnetic clutches beside a ruler, one whole and one taken apart into its coil, rotor and armature.
  needs_animation: true
  needs_photo: false
epoxy-putty:
  pictures:
    - commons: "File:Epoxy putty.jpg"
      kind: photo
      alt: Two blocks of epoxy putty, a light brown resin part and a dark brown hardener part, before they are kneaded together.
    - candidate: 2
      kind: how-it-works
      alt: Two people at a workbench pressing epoxy putty by hand along the gum line of a cast skull to fix the teeth in place.
  needs_animation: false
  needs_photo: false
escapement:
  pictures:
    - candidate: 14
      kind: animation
      alt: An animation of an anchor escapement, where the swinging anchor lets the toothed escape wheel turn one tooth at a time.
    - candidate: 5
      kind: how-it-works
      alt: A slow-motion clip of a real mantel-clock escapement, with the balance swinging and the escape wheel stepping on one tooth at a time.
    - candidate: 13
      kind: photo
      alt: The opened movement of an 1845 pocket watch, showing the gear train and the verge escapement on top.
  needs_animation: false
  needs_photo: false
  note: candidate 14 is a larger copy of the current anchor animation.
expanding-internal-grip:
  pictures:
    - drawn
    - candidate: 2
      kind: photo
      alt: The end of an air shaft, a metal shaft with an air valve that is pumped up so strips along its length push out and grip the inside of a roll's core.
  needs_animation: false
  needs_photo: false
  note: the air shaft's gripping strips are not clearly visible; a photo of an expanding mandrel or a lathe expanding arbor would be clearer.
eyelets-and-grommets:
  pictures:
    - commons: "File:Eyelet.jpg"
      kind: photo
      alt: A pair of eyelet pliers with a few small metal eyelets beside them.
    - candidate: 6
      kind: photo
      alt: Yellow-handled eyelet setting pliers with brass eyelets, used to fit eyelets through a stack of papers.
    - candidate: 2
      kind: photo
      alt: Large curtain grommets in round, square and hexagon shapes set into red fabric.
  needs_animation: false
  needs_photo: false
