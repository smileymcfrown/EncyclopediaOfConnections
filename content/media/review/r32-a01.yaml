      alt: A 3D render of a motorcycle basket clutch, whole and pulled apart to show the stack of friction plates between the basket and the hub.
  needs_animation: true
  needs_photo: true
  note: the only non-diagram candidates are CAD renders (Basket clutch.png, Car clutch.png); no real photo of a friction clutch was found.
