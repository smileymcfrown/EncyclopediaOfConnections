  needs_photo: true
  note: all candidates are diagrams or animations; no photo of a real four-bar linkage was found.
friction-clutch:
  pictures:
    - commons: "File:Cone clutch.svg"
      kind: diagram
      alt: A drawing of a cone clutch, where a spring pushes a cone-shaped part into a matching cup so friction makes them turn together, and a lever pulls it out.
    - candidate: 3
