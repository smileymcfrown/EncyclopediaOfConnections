# R32 picture choices, batch b01 (see the pick brief). Per page: ordered pictures (at most 3).
friction-welded-plastic:
  pictures:
    - drawn
  needs_animation: false
  needs_photo: true
  note: no candidates on the sheet
gas-spring:
  pictures:
    - commons: "File:Gas-spring simplified numbered 120.png"
      kind: cross-section
      alt: A gas spring cut open lengthways, showing the rod, its seal and guide, and the piston inside the gas-filled tube.
    - candidate: 2
      kind: how-it-works
      alt: An office-chair gas spring taken apart on a wooden table, with its long rod, black outer tube, seals and washers laid out.
    - candidate: 8
      kind: photo
      alt: A gas spring fitted to a red lifting barrier, its rod pushed out to hold the barrier open.
  needs_animation: true
  needs_photo: false
  note: no candidate animation of a gas spring and no drawn diagram, so the cut-away render stays first
gear-pump:
  pictures:
    - commons: "File:Gear pump animation.gif"
      kind: animation
      alt: An animation of two meshing gears, one blue and one orange, turning in a close-fitting case and carrying liquid round the outside from one side to the other.
    - candidate: 11
      kind: cross-section
      alt: A blue internal gear pump with part of its case cut away, showing the small gear turning inside the ring gear.
    - candidate: 8
      kind: photo
      alt: A rendered gear pump pulled apart, showing the two gears, their shafts, bearings and the end covers with their bolts.
  needs_animation: false
  needs_photo: false
gearless-right-angle-drive:
  pictures:
    - commons: "File:ElbowEngine.gif"
      kind: animation
      alt: An animation of bent rods sliding in and out of holes in two hubs set at a right angle, carrying the turning round the corner.
  needs_animation: false
  needs_photo: true
  note: no candidates on the sheet
geneva-drive:
  pictures:
    - commons: "File:Geneva mechanism 6spoke animation.gif"
      kind: animation
      alt: An animation of a green drive wheel whose pin enters the slots of a red six-armed wheel, turning it one step each time round and holding it still in between.
  needs_animation: false
  needs_photo: true
  note: every candidate is an animation or chart; no real photo of a Geneva drive
guy-line-slider:
  pictures:
    - drawn
  needs_animation: false
  needs_photo: true
  note: no candidates on the sheet; drawn animation exists
hang-on-mounts:
