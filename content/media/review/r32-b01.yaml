hide-glue:
  pictures:
    - commons: "File:Glutinleime-warm.jpg"
      kind: photo
      alt: Three small glass jars of warm, runny animal glue in shades of amber, each with a wooden stirring stick.
    - candidate: 6
      kind: how-it-works
      alt: A brush lifting runny, honey-coloured hot hide glue out of a warmed glue pot.
    - candidate: 2
      kind: photo
      alt: An old cast-iron double glue pot, an outer water bath with an inner pot for the glue, shown with a lighter for size.
  needs_animation: false
  needs_photo: false
hirth-joint:
  pictures:
    - commons: "File:Hirth joint.jpg"
      kind: photo
      alt: A bicycle crank with its axle end showing a ring of V-shaped teeth on the end face that lock into the matching teeth on the other crank.
    - candidate: 3
      kind: photo
      alt: A rendered 3D-printable Hirth joint half in blue plastic, with V-shaped teeth on its end face and a hole for a pin.
  needs_animation: true
  needs_photo: false
  note: no animation and no drawn diagram; #2 (a Hirth ring) shows the teeth too small to see
hitches-to-a-post-rail-ring-or-eye:
