magnetic-assisted-buckle:
  photos:
  - candidate: 2
    kind: how-it-works
    alt: The two halves of a blue 3D-printed strap buckle laid apart, showing the round magnet set in the open frame and the
      square plug that drops into it, beside a strap slider.
  - candidate: 1
    kind: photo
    alt: A blue 3D-printed magnetic buckle clipped shut on a black elastic strap, with a strap slider beside it.
  note: Square plug seats inside the frame so the shape takes the strap's pull while the magnet pulls it in; slight doubt
    whether the maker intended a separate catch.
magnetic-detent:
  photos:
  - candidate: 1
    kind: how-it-works
    alt: The two halves of a 3D-printed rotary knob laid open, the rotor with a ring of twelve embedded magnets beside the
      housing that holds the matching magnets.
  - candidate: 2
    kind: photo
    alt: The assembled black 3D-printed magnetic detent knob, a flat disc with a ball bearing at its centre.
  note: '#3 is a Tinkercad render, turned down.'
mechanical-metamaterial-mechanism:
  photos:
  - candidate: 2
    kind: how-it-works
    alt: Several 3D-printed one-piece pliers on a wooden table, two of them with the grid of small shearing cells that forms
      the hinge clearly visible at the joint.
  - candidate: 1
    kind: photo
    alt: A blue 3D-printed pair of one-piece metamaterial pliers lying on a wooden table.
  note: '#3 and #5 are renders and #4 (mini pliers beside a coin) is a fair alternative; the auxetic sheets (#6-#9) are a
    metamaterial but not a mechanism, and #6, #8, #9 are renders.'
mid-print-embedding:
  photos:
  - candidate: 4
    kind: how-it-works
    alt: A half-finished 3D-printed test block, with a hex nut sitting in its pocket at the paused layer, ready to be printed
      over.
  - candidate: 2
    kind: photo
    alt: A small finished 3D-printed block with a bolt screwed into the nut sealed inside it.
  note: Turned down
