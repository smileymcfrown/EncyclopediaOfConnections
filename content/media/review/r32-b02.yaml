# R32 picture choices, batch b02 (see the pick brief). Per page: ordered pictures (at most 3).
pulley-system:
  pictures:
    - commons: "File:Tackles.png"
      kind: diagram
      alt: A drawing of several pulley set-ups side by side, each with one rope threaded round more pulleys so the load hangs on more rope parts.
    - candidate: 7
      kind: how-it-works
      alt: A museum display of wooden pulley blocks with a rope threaded between them, above a drawing of the same set-up.
    - candidate: 2
      kind: photo
      alt: An old wooden pulley block hanging from a stone wall inside a windmill, with its rope running down.
  needs_animation: true
  needs_photo: false
  note: no drawn diagram or candidate animation; the two photos are older pulley blocks, not a modern block and tackle
push-and-turn-child-resistant-cap:
  pictures:
