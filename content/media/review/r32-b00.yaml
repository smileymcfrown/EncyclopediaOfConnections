  needs_photo: false
bowden-cable:
  pictures:
    - commons: "File:Bowden.jpg"
      kind: cross-section
      alt: A Bowden cable cut away in layers, showing the plastic coating, the coiled steel outer, a low-friction liner and the inner wire.
    - candidate: 4
      kind: how-it-works
      alt: A bicycle gear cable running in its black outer sleeve to a rear derailleur, where the inner wire leaves the sleeve and is clamped to the derailleur arm.
    - candidate: 2
      kind: photo
      alt: The end of a Bowden cable fitted with a barrel adjuster, a threaded sleeve stop with the inner wire coming out of it.
  needs_animation: true
  needs_photo: false
