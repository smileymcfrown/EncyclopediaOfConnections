# R32 picture choices, batch b00 (see the pick brief). Per page: ordered pictures (at most 3).
air-bearing-and-air-caster:
  pictures:
    - commons: "File:Aircaster.gif"
      kind: animation
      alt: An animated cut-away of an air caster under a load, its ring-shaped bags filling with air until the load lifts on a thin film of air above the floor.
  needs_animation: false
  needs_photo: true
  note: the only other candidate (#2) is a line drawing of a nozzle air bearing, not a photo
air-logic-valve:
  pictures:
    - commons: "File:Shuttle valve action principle cross section.gif"
      kind: animation
      alt: An animated cut-away of a shuttle valve, a ball pushed from side to side by air arriving at either inlet so the air always reaches the one outlet.
  needs_animation: false
  needs_photo: true
  note: the only other candidate (#2) is a flat diagram of a fluidic AND/XOR gate
air-or-hydraulic-cylinder:
  pictures:
    - commons: "File:Einfachwirkender Zylinder funktionsprinziep.gif"
      kind: animation
      alt: An animated cut-away of a single-acting cylinder, air let in behind the piston pushing the rod out and a spring pushing it back when the air is let out.
    - candidate: 1
      kind: how-it-works
      alt: A silver telescoping air cylinder shown twice, squashed down into a short can and stretched out into a tall stack of eight nested tubes.
    - candidate: 2
      kind: photo
      alt: A flight simulator cabin standing on six long hydraulic cylinders that push and tilt it.
  needs_animation: false
  needs_photo: false
  note: "#2 shows the cylinders as legs of a whole machine; no close photo of a plain cylinder among the candidates"
anti-twister-mechanism:
  pictures:
    - drawn
  needs_animation: false
  needs_photo: true
  note: the only candidate (#1, the belt trick) is a related demonstration, not this mechanism; drawn animation used instead
ball-and-socket-joint:
  pictures:
    - commons: "File:KugelgelenkSchnitt.jpg"
      kind: cross-section
      alt: A car ball joint with its socket cut open, showing the round ball on the end of a threaded stud sitting in a cup inside the housing.
    - candidate: 3
      kind: photo
      alt: A black camera tripod ball head, its ball clamped in a socket by a big locking knob, with a quick-release plate on top.
  needs_animation: true
  needs_photo: false
ball-caster:
  pictures:
    - commons: "File:BallTransferUnitCrossSection.png"
      kind: cross-section
      alt: A rendered ball transfer unit cut in half, a big steel ball riding on a bed of small balls inside a steel cup, held in by a blue lip.
    - candidate: 5
      kind: cross-section
      alt: A real pressed-steel ball transfer unit sawn in half, showing the large ball resting on a ring of small balls in its cup.
    - candidate: 13
      kind: how-it-works
      alt: The underside of a small two-wheeled robot, with a little metal ball caster at the front acting as its third wheel.
  needs_animation: true
  needs_photo: false
basic-knots:
  pictures:
    - commons: "File:Square knot.svg"
      kind: diagram
      alt: A drawing of a reef knot, a red cord and a blue cord each folded back and looped through the other.
    - candidate: 6
      kind: how-it-works
      alt: Four white macrame cords hanging from a wooden rod, each tied with a basic knot, the top row finished and the bottom row loosened to show how it is made.
    - candidate: 11
      kind: photo
      alt: White cords tied in chains of half hitches, hanging from a wooden rod.
  needs_animation: false
  needs_photo: false
basic-latches:
  pictures:
    - commons: "File:Öffnen eines Riegels.gif"
      kind: animation
      alt: An animation of a slide bolt being opened, the bolt turned up out of its slot and slid back out of the catch.
    - candidate: 1
      kind: photo
      alt: A metal slide bolt screwed to a wooden door, its bar pushed across into a catch on the frame.
  needs_animation: false
  needs_photo: false
  note: the other candidates are electronic latch chips, insects and unrelated photos
bellows-boot-and-way-cover:
  pictures:
    - commons: "File:2008-04-23 Cracked CV boot.jpg"
      kind: photo
      alt: The black pleated rubber boot on a car drive shaft joint, held on by a metal band clamp, with a split in one of its folds.
    - candidate: 2
      kind: photo
      alt: A car's front wheel hub with the wheel removed, showing the pleated rubber boot covering the drive shaft joint where it meets the hub.
  needs_animation: true
  needs_photo: false
  note: "#3 is a train's gangway bellows between carriages, left out as a different use"
belt-drives:
  pictures:
    - commons: "File:Power transmission belt.gif"
      kind: animation
      alt: An animation of a belt running round two pulleys, the driving pulley turning the other one through the belt.
    - candidate: 11
      kind: how-it-works
      alt: An old milling machine driven by wide flat belts running over a set of stepped pulleys.
    - candidate: 8
      kind: photo
      alt: Black toothed (timing) belts hanging on a rack, their teeth on the inside where they mesh with the pulleys.
  needs_animation: false
  needs_photo: false
belt-tensioner:
  pictures:
    - commons: "File:Kettenspanner für Singlespeed-Räder.jpg"
      kind: photo
      alt: A bicycle chain tensioner bolted to the back of the frame, its spring-loaded arm pressing a small red wheel against the slack lower run of the chain.
    - candidate: 3
      kind: photo
      alt: A car engine's automatic belt tensioner, a smooth idler pulley on a spring-loaded arm pressing on the ribbed drive belt.
  needs_animation: true
  needs_photo: false
bent-or-twisted-tab-through-a-slot:
  pictures:
    - drawn
  needs_animation: false
  needs_photo: true
  note: both candidates are archaeological finds (a handle, a bead), not tab-and-slot joints
bernoulli-gripper:
  pictures:
    - commons: "File:Bernoulli Gripper.png"
      kind: diagram
      alt: A diagram of a Bernoulli gripper, air blown down the middle of the pad and out sideways in a thin stream, with arrows showing the object below being lifted.
    - candidate: 3
      kind: how-it-works
      alt: Three photos of a gripper blowing smoke-filled air, showing the thin jet of air spreading out sideways from under the pad.
  needs_animation: false
  needs_photo: false
  note: "#3 is a modified jet gripper for textiles; the only photo on the sheet, the rest are diagrams"
bevel-gears:
  pictures:
    - commons: "File:Gear - Bevel (PSF).png"
      kind: diagram
      alt: A drawing of two bevel gears meshing at a right angle, their cone-shaped toothed faces meeting at one corner.
    - candidate: 18
      kind: cross-section
      alt: A loader axle cut open at a trade show, showing the bevel gears inside that turn the drive from the prop shaft through a right angle to the wheels.
    - candidate: 4
      kind: photo
      alt: A pair of big red-painted bevel gears on an old grain mill, one gear's teeth fitted with wooden inserts, meshing at a right angle.
  needs_animation: true
  needs_photo: false
binding-knots-and-seizings:
  pictures:
    - commons: "File:Constrictor-ABOK-1249.jpg"
      kind: how-it-works
      alt: Four photos in a row showing the steps of tying a constrictor knot in blue cord round a rope.
    - candidate: 2
      kind: photo
      alt: The eye at the end of a sailing boat's forestay, its two ropes bound together by three tight round seizings of thin cord.
    - candidate: 4
      kind: photo
      alt: Blue cables bundled together with neat spot ties of white lacing tape knotted at intervals.
  needs_animation: false
  needs_photo: false
binding-post-and-banana-plug:
  pictures:
    - commons: "File:BindingPostRed.jpg"
      kind: photo
      alt: A red binding post with its knurled plastic cap screwed onto a threaded metal post, a solder tag on the back.
    - candidate: 4
      kind: how-it-works
      alt: A red and a black banana plug pushed into the binding posts on the back of a loudspeaker.
    - candidate: 2
      kind: photo
      alt: A red and a blue stackable banana plug on test leads, each with a springy metal pin and a socket in its side for another plug.
