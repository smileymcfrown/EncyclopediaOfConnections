# R32 picture choices, batch a03
multi-point-bolt:
  pictures:
    - commons: "File:Crémone.jpg"
      kind: how-it-works
      alt: A crémone bolt on a window frame with its cover off, showing the small gear between two toothed rods that slide up and down.
    - candidate: 5
      kind: how-it-works
      alt: A multipoint mortice lock opened up on a cutting mat, showing the bolts that shoot out sideways and the rod connections that throw bolts up and down.
    - candidate: 2
      kind: photo
      alt: An espagnolette on a pair of shutters, a long rod with a hook at each end that turns to lock the top and bottom at once.
  needs_animation: true
  needs_photo: false
multi-turn-rotation-limiter:
  pictures:
    - drawn
  needs_animation: false
  needs_photo: true
  note: no candidate photos; the Geneva stop drawing is a tiny old diagram and the jukebox is unrelated.
nails-brads-and-tacks:
  pictures:
    - commons: "File:Spijkers (Nails).jpg"
      kind: photo
      alt: Seven different nails laid side by side on wood, from short broad-headed roofing nails to long thin steel nails.
    - candidate: 2
      kind: how-it-works
      alt: A hammer driving a nail at an angle through the foot of an upright piece of wood into the board below (toenailing).
  needs_animation: false
  needs_photo: false
non-circular-gears:
  pictures:
    - candidate: 1
      kind: animation
      alt: Two oval gears turning together, the driven one speeding up and slowing down, with the equivalent crossed linkage moving below them.
    - candidate: 11
      kind: photo
      alt: Red oval gears meshing in pairs inside an old Girodias pump, so the pump strokes speed up and slow down each turn.
    - candidate: 7
      kind: photo
      alt: A toy made of white square and four-lobed gears that mesh and turn together on a black board.
  needs_animation: false
  needs_photo: false
o-ring-seal:
  pictures:
    - commons: "File:O-ring static seal usage example.png"
      kind: diagram
      alt: A cut-through drawing of a cap bolted onto a fluid-filled body, with black O-rings squashed in grooves where the parts meet.
    - candidate: 7
      kind: photo
      alt: A steel shaft with several O-rings sitting in grooves around it, beside a small centimetre scale.
    - candidate: 3
      kind: photo
      alt: A bag of assorted black rubber O-rings of different sizes.
  needs_animation: false
  needs_photo: false
oldham-coupling:
  pictures:
    - candidate: 13
      kind: animation
      alt: Two slotted circles on offset centres turning together while the green cross-shaped middle piece slides back and forth in both slots.
    - candidate: 2
      kind: how-it-works
      alt: An Oldham coupling taken apart, two metal hubs each with a raised bar and a black middle disc with crossed slots that fits between them.
    - candidate: 3
      kind: photo
      alt: An Oldham coupling in use on a telescope mount, joining the motor shaft to the drive shaft with a white middle disc between two metal hubs.
  needs_animation: false
  needs_photo: false
  note: the current animation (File:Oldham coupler animated small.gif) is only 160x120, so the larger 2D animation goes first.
origami-mechanisms:
  pictures:
