  needs_photo: false
peristaltic-pump:
  pictures:
    - commons: "File:Peristaltic pump.gif"
      kind: animation
      alt: Inside a peristaltic pump, a rotor with two rollers turns and squeezes a blue tube against a curved track, pushing the liquid along.
    - candidate: 5
      kind: how-it-works
      alt: The head of a peristaltic pump with its cover off, showing the rollers on the rotor pressing a clear tube against the curved housing.
    - candidate: 8
      kind: photo
      alt: A small hobby peristaltic pump on a desk, with clear tubes running from one mug to another.
  needs_animation: false
  needs_photo: false
pin-tumbler-lock:
  pictures:
    - commons: "File:Pin tumbler no key.svg"
      kind: cross-section
      alt: A cut-away drawing of a pin-tumbler lock with no key, the spring-loaded pin stacks crossing the gap between the core and the body so the core cannot turn.
    - candidate: 7
      kind: photo
      alt: A brass Euro cylinder lock fitted in a door, showing the keyway in the round core.
  needs_animation: true
  needs_photo: false
  note: the only animation (#3) is a lever tumbler lock, a different kind of tumbler, so a pin-tumbler animation is still wanted.
planetary-gear-set:
  pictures:
    - commons: "File:Epicyclic Gearing Stationary Ring.gif"
      kind: animation
      alt: A yellow sun gear turning four blue planet gears inside a fixed red ring gear, with the green carrier going round slowly.
  needs_animation: false
  needs_photo: true
  note: all candidates are diagrams or computer animations; a 3D animation (#2, #12) could be added but no real photo exists on the sheet.
pogo-pin:
