      kind: cross-section
      alt: Three pogo pins cut in half, showing the coil spring inside each barrel under the plunger, one with a small ball between them.
    - candidate: 5
      kind: photo
      alt: Many gold-plated pogo pins and pogo pin connector strips scattered on a white surface.
  needs_animation: false
  needs_photo: false
pole-lashings:
