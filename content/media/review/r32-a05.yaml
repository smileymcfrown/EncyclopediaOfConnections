tamper-evident-breakaway-bridge:
  pictures:
    - drawn
    - candidate: 1
      kind: photo
      alt: A plastic drink bottle with its cap unscrewed but still held to the ring left round the bottle neck.
    - candidate: 2
      kind: how-it-works
      alt: A pill bottle whose tear-off seal strip has been pulled away from the cap, showing it has been opened.
  needs_animation: false
  needs_photo: false
tamper-resistant-fasteners:
  pictures:
    - commons: "File:Screws - tamper resistant slotted.jpg"
      kind: photo
      alt: A one-way screw head whose slot has ramped sides, so a screwdriver can turn it in but slips out when turned the other way.
    - candidate: 2
      kind: photo
      alt: A shear-off security screw whose star-shaped top is gripped to tighten it and then snaps off, leaving a head no tool can grip.
    - candidate: 3
      kind: photo
      alt: A set of security screwdriver bits, including star and hex bits with a hole drilled in the tip to fit pinned screws.
  needs_animation: false
  needs_photo: false
  note: candidate 2 is filed as a shear-off screw (Abreißschraube) with an external star top; check the alt against the full photo.
