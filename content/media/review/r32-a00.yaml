# R32 picture choices, batch a00 (see the pick brief). Per page: ordered pictures (at most 3).
air-tank-and-hydraulic-accumulator:
  pictures:
    - commons: "File:Hydraulic accumulator.svg"
      kind: cross-section
      alt: A cut-away drawing of a bladder accumulator, a rounded steel bottle with a rubber bag of gas inside that oil squeezes from below.
    - candidate: 5
      kind: photo
      alt: A small yellow hydraulic accumulator fitted with hoses in a boat's autopilot system.
  needs_animation: false
  needs_photo: false
  note: only one real photo, of a hydraulic accumulator; no plain air tank photo among the candidates
aluminium-extrusion-connectors:
  pictures:
    - commons: "File:T-Nut - Installed in a T-Slot.png"
      kind: diagram
      alt: A rendered T-nut, coloured red, sitting in the T-shaped groove of a bar, held under the groove's lips.
  needs_animation: false
  needs_photo: true
  note: the spring nut photo (#2) is steel strut channel, not aluminium extrusion, so left out
anaerobic-adhesive:
