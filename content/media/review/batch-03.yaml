# Picture review R30, batch 03 (sheets 11-15)
# sheet11
friction-clutch:
  verdict: keep
  reason: labelled cone clutch shows the friction faces pressed together by a spring
friction-drives-and-cvts:
  verdict: drawn
  reason: old textile-machine photo is dark and cluttered; a drawing of a wheel moved across a disc shows the variable ratio
friction-hinge:
  verdict: drawn
  reason: photo shows small laptop hinges on a scale, not how the friction pack holds the lid
friction-slip-clutch:
  verdict: drawn
  reason: loose parts on a mat don't show how the spring presses the gear between friction pads
friction-welded-plastic:
  verdict: drawn
  reason: current picture is an industrial metal friction-welding drawing with tiny labels, not plastic spin or rotary-tool welding
gas-spring:
  verdict: keep
  reason: cutaway shows the rod, seal, piston and gas-filled cylinder
gasket:
  verdict: keep
  reason: clear diagram of a gasket squeezed between two flanges
gear-pump:
  verdict: keep
  reason: animation shows liquid carried round between the teeth and the case
geared-hinge:
  verdict: swap
  use: "File:Continuoushinge.jpg"
  alt: An aluminium continuous geared hinge opened to a V, with the meshing gear teeth visible at the top end under the cap.
  reason: current stored picture is a page of text, not the hinge
gearless-right-angle-drive:
  verdict: keep
  reason: animation shows the bent rods sliding in the two hubs at right angles
genderless-connector:
  verdict: keep
  reason: clear face of a Storz coupling showing the hooks and slots that mate with an identical copy
geneva-drive:
  verdict: keep
  reason: animation shows the pin stepping the slotted wheel and the locking disc
