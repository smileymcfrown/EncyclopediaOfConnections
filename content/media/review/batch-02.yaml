# Picture review, batch 02 (sheets 06-10)

# --- sheet06 ---
clip-on-concealed-hinge:
  verdict: keep
  reason: animation shows the cup hinge in a door and how the door swings out as it opens (German labels are small)
coil-spring:
  verdict: keep
  reason: clear drawing of a compression coil spring; a photo of all three spring types would be nicer
collet:
  verdict: keep
  reason: animation shows the collet pulled into its cone and gripping the shaft
combination-lock:
  verdict: keep
  reason: exploded view of the notched number wheels, which is the mechanism
compliant-gripper-and-force-amplifier:
  verdict: keep
  reason: one-piece compliant pliers, the item itself
compliant-ratchet-and-overrunning-clutch:
  verdict: drawn
  reason: cable-tie cutaway is a linear example and hard to read; new diagram shows a one-piece hub with springy pawl arms clicking one way and locking the other
compression-fitting:
  verdict: keep
  reason: cut-away drawing of nut, ring and tube shows how it grips and seals
conductive-glue-paint-and-ink:
  verdict: drawn
  reason: microscope image of silver flakes means nothing to a beginner; new diagram shows a glue blob joining a leg to a track and a pen drawing a track
conductive-tape:
  verdict: keep
  reason: clear photo of a roll of copper tape
conductive-thread:
  verdict: keep
  reason: clear photo of a bobbin of conductive thread
constant-force-spring:
  verdict: drawn
  reason: current picture is only a force graph; new diagram shows the coiled strip pulled out to different lengths with the same pull, plus a small graph
constant-velocity-joint:
  verdict: keep
  reason: animation of a CV joint turning while bent

# --- sheet07 ---
contact-adhesive:
  verdict: keep
  reason: clear photo of a can of contact cement, with its uses printed on the label
cord-lock:
