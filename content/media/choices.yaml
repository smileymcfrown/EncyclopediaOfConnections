# Picture choices (R30): which picture each entry page shows, where the research's first usable
# Commons file was not the best one for showing what the thing is and how it works.
#   use: "File:..."  copy this Commons file instead (tools/fetch_images.py checks its licence)
#   use: drawn       show the diagram drawn for the encyclopaedia (content/media/drawn/<page>.svg)
# Pages not listed keep the research's first usable Commons file, or the drawn diagram if none.
# Made from the picture review in content/media/review/ (one verdict and reason per picture).
anti-backlash-gear:
  use: drawn
  reason: current picture only shows the backlash gap (the problem), not the split, spring-loaded gear; no Commons
    picture of one found
anti-twister-mechanism:
  use: drawn
  reason: belt-trick animation shows the underlying principle, not the mechanism (cable loop on a half-speed carrier);
    no Commons picture of the device found
automatic-siphon:
  use: drawn
  reason: current picture is a Pythagorean cup, a different item; the only Commons bell-siphon file is a CAD render
    of a media guard that hides the bell
ball-detent-torque-limiter:
  use: drawn
  reason: photo of an industrial unit hides the balls and dimples and is hard to read; drawing shows balls seated
    and rolling out under overload
band-flange-clamp:
  use: File:HTML research (9067215099), clamp.jpg
  alt: A hinged metal band clamp with a wing nut being closed round the lipped ends of two pipe fittings.
  reason: current picture is a small-text technical drawing; this photo shows a real clamp gripping two flanges
bead-in-groove-fabric-edge:
  use: drawn
  reason: caravan keder-rail photo is too small to show the bead in the groove; drawing shows a keder in a C-rail
    and a screen spline in cross-section
bell-crank:
  use: File:Chambers 1908 Bell Crank.png
  alt: An old drawing of a right-angled bell crank on a pivot, with a wire pulled sideways at one arm and the other
    arm pulling a wire downwards.
  reason: steering-linkage animation shows the bell crank tiny in a lot of white space; this drawing shows the classic
    part and both pull directions
belt-tensioner:
  use: File:Kettenspanner für Singlespeed-Räder.jpg
  alt: A bicycle chain tensioner, a small red pulley on a sprung arm pressing on the slack lower run of the chain.
  reason: car-engine photo is cluttered and the tensioner is hard to pick out; the bike tensioner clearly presses
    on the slack side
bevel-gears:
  use: File:Gear - Bevel (PSF).png
  alt: A drawing of two cone-shaped bevel gears meshing at a right angle, each on its own shaft.
  reason: current picture is an abstract pitch-cone diagram; this drawing shows the actual pair of bevel gears
burn-wire-and-fusible-link-release:
  use: drawn
  reason: photo of a specific underwater release is cluttered and the burning wire is hard to see; drawing shows
    the cord held, burnt and the lid springing open
cable-gland-and-strain-relief:
  use: File:M16 cable gland.jpg
  alt: A white plastic cable gland, assembled and taken apart, showing its thread, the ring of gripping fingers
    with the rubber seal inside, and the dome nut.
  reason: exploded armoured-cable gland is an industrial special case; this photo shows the common plastic gland
    with its fingers and seal
cable-through-a-hinge:
  use: drawn
  reason: car steering-column photo does not show the idea; the phone flat-cable photo is unclear; drawing shows
    a cable through a hollow pin and a slack loop
capstan-and-windlass:
