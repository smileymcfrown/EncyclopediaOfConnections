# The pictures each entry page shows, in order (R32). The first is the big one at the top; for an
# entry that moves it should show the movement (an animation). Then real photos: a cross-section or
# cut-away first, then one that shows how it works, then a clear photo of the part or a 3D print.
#   - drawn                        the diagram drawn for the encyclopaedia, content/media/drawn/<page>.svg
#                                  (animated from content/media/drawn/anim/<page>.svg when that exists)
#   - commons: "File:..."          a Wikimedia Commons file; tools/fetch_images.py checks its licence
#   - openverse: <id>              a CC-licensed photo found through Openverse (e.g. from Flickr), with its
#     url, title, author, license, license_url, source   (credit details, from Openverse)
# Each item may have `kind` (animation, diagram, cross-section, how-it-works or photo) and `alt`
# (what the picture shows, for people who can't see it). Licences allowed: public domain, CC0,
# CC BY, CC BY-SA (D29). Change a page's pictures here, then run the Fetch pictures workflow.
