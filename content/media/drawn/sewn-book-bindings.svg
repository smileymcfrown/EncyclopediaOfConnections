<g font-family="Arial, Helvetica, sans-serif" fill="#222"><text x="133" y="36" font-size="20" text-anchor="middle" font-weight="bold">Pamphlet stitch</text><text x="400" y="36" font-size="20" text-anchor="middle" font-weight="bold">Sections, kettle stitch</text><text x="667" y="36" font-size="20" text-anchor="middle" font-weight="bold">Stab binding</text><text x="133" y="222" font-size="18" text-anchor="middle">thread along the fold</text><text x="400" y="222" font-size="18" text-anchor="middle">kettle stitches link them</text><text x="667" y="222" font-size="18" text-anchor="middle">thread round the spine</text><text x="133" y="406" font-size="18" text-anchor="middle">opens flat</text><text x="400" y="406" font-size="18" text-anchor="middle">opens flat</text><text x="667" y="406" font-size="18" text-anchor="middle">won't open flat</text><text x="400" y="438" font-size="17" text-anchor="middle">Seen from above (top row) and from the end (bottom row) · pages (paper) turn about the stitches</text></g>
