<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Three sewn bindings, each seen from above and from the end: a pamphlet stitch with thread along the fold through three holes, tied at the middle; folded sections sewn through their folds and linked at head and tail by kettle stitches; and a stab binding sewn through the whole stack near the edge with the thread wrapped round the spine. The pamphlet and the sewn sections open flat; the stab-bound pages bend at the stitches and do not.</title>
