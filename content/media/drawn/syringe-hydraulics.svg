</g>
<g fill="none" stroke="#d1495b" stroke-width="5" marker-end="url(#ah)">
<line x1="190" y1="40" x2="190" y2="140"/><line x1="650" y1="168" x2="650" y2="140"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle">
<g text-anchor="start"><text x="206" y="80">small force,</text><text x="206" y="102">long push</text><text x="668" y="150">big force,</text><text x="668" y="172">short lift</text></g>
<text x="470" y="142" text-anchor="end">heavy load</text>
<text x="360" y="320">same pressure</text><text x="360" y="342">at both ends</text>
<text x="722" y="346">a bubble squashes</text><text x="722" y="368">and feels spongy</text>
<text x="360" y="417">the liquid cannot squash, so it pushes the other piston</text>
<text x="400" y="440">The fat piston has about 6 times the area: 6 times the force, 1/6 the distance</text>
</g>
