<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>A thin syringe and a fat syringe joined by a liquid-filled tube: a small force pushes the thin plunger a long way while the fat plunger lifts a heavy load a short way, a pressure gauge at each end reads the same, and an inset shows an air bubble squashing, which makes the system feel spongy.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#222" stroke-width="2"/></pattern>
</defs>
<g stroke="#222" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
<path d="M140,336 V362 Q140,386 164,386 H556 Q580,386 580,362 V336" fill="none" stroke-width="18"/>
<path d="M140,336 V362 Q140,386 164,386 H556 Q580,386 580,362 V336" fill="none" stroke="#cfe3f5" stroke-width="12"/>
