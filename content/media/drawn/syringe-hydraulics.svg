<circle cx="480" cy="330" r="25" fill="#ffffff"/>
<path d="M480,330 m-17,0 a17,17 0 0 1 34,0" fill="none" stroke="#999" stroke-width="2"/>
<line x1="480" y1="330" x2="464.4" y2="321" stroke="#d1495b" stroke-width="3"/>
<circle cx="480" cy="330" r="4" fill="#222"/>
<rect x="126" y="150" width="28" height="170" fill="#ffffff" stroke="none"/>
<rect x="127" y="174" width="26" height="146" fill="#cfe3f5" stroke="none"></rect>
<g><rect x="136" y="35" width="8" height="125" fill="#e8e8e8"/><rect x="114" y="23" width="52" height="12" rx="4" fill="#e8e8e8"/><rect x="127" y="160" width="26" height="14" rx="2" fill="#555"/></g>
<path d="M126,150 V320 H154 V150 M112,150 H168" fill="none"/>
<rect x="134" y="320" width="12" height="18" fill="#cfe3f5"/>
<rect x="545" y="200" width="70" height="120" fill="#ffffff" stroke="none"/>
<rect x="546" y="298" width="68" height="22" fill="#cfe3f5" stroke="none"></rect>
<g><rect x="574" y="182" width="12" height="100" fill="#e8e8e8"/><rect x="530" y="172" width="100" height="10" rx="3" fill="#e8e8e8"/><rect x="540" y="102" width="80" height="70" rx="4" fill="#fde2c4"/><rect x="546" y="282" width="68" height="16" rx="2" fill="#555"/></g>
<path d="M545,200 V320 H615 V200 M531,200 H629" fill="none"/>
<rect x="574" y="320" width="12" height="18" fill="#cfe3f5"/>
