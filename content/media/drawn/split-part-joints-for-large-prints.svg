<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>A tall printed model cut into two pieces, with the top piece lifted to show pegs on the lower cut face and matching holes in the upper one, and three close-ups of joint features: a peg entering a hole, loose dowels in holes on both faces, and a dovetail tail that fits a matching groove.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
</defs>

<g stroke-linejoin="round" stroke-linecap="round">
<line x1="300" y1="60" x2="300" y2="400" stroke="#cccccc" stroke-width="2"/>
<path d="M95,395 H245 L252,372 Q262,312 232,262 H108 Q78,312 88,372 Z" fill="#fde2c4" stroke="#222" stroke-width="3"/>
<rect x="132" y="244" width="16" height="18" fill="#fde2c4" stroke="#222" stroke-width="2.5"/>
<rect x="192" y="244" width="16" height="18" fill="#fde2c4" stroke="#222" stroke-width="2.5"/>
<path d="M108,212 H232 Q256,168 228,118 Q214,86 170,72 Q126,86 112,118 Q84,168 108,212 Z" fill="#cfe3f5" stroke="#222" stroke-width="3"/>
<rect x="131" y="190" width="18" height="22" fill="#ffffff" stroke="#222" stroke-width="2" stroke-dasharray="5 4"/>
<rect x="191" y="190" width="18" height="22" fill="#ffffff" stroke="#222" stroke-width="2" stroke-dasharray="5 4"/>
<line x1="60" y1="190" x2="60" y2="240" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<line x1="280" y1="190" x2="280" y2="240" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<rect x="325" y="150" width="120" height="56" fill="#cfe3f5" stroke="#222" stroke-width="3"/>
<rect x="325" y="262" width="120" height="56" fill="#fde2c4" stroke="#222" stroke-width="3"/>
<rect x="373" y="232" width="24" height="30" fill="#fde2c4" stroke="#222" stroke-width="2.5"/>
<rect x="372" y="176" width="26" height="30" fill="#ffffff" stroke="#222" stroke-width="2.5"/>
<rect x="480" y="150" width="120" height="56" fill="#cfe3f5" stroke="#222" stroke-width="3"/>
<rect x="480" y="262" width="120" height="56" fill="#fde2c4" stroke="#222" stroke-width="3"/>
<rect x="527" y="176" width="26" height="30" fill="#ffffff" stroke="#222" stroke-width="2.5"/>
<rect x="527" y="262" width="26" height="30" fill="#ffffff" stroke="#222" stroke-width="2.5"/>
<rect x="529" y="212" width="22" height="44" rx="4" fill="#e8e8e8" stroke="#222" stroke-width="2.5"/>
<path d="M635,262 H680 L672,286 H718 L710,262 H755 V318 H635 Z" fill="#fde2c4" stroke="#222" stroke-width="3"/>
<path d="M635,150 H755 V206 H710 L718,230 H672 L680,206 H635 Z" fill="#cfe3f5" stroke="#222" stroke-width="3"/>
<circle cx="695" cy="246" r="9" fill="#ffffff" stroke="#d1495b" stroke-width="3"/><circle cx="695" cy="246" r="3" fill="#d1495b"/>
<line x1="425" y1="214" x2="425" y2="250" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<line x1="580" y1="214" x2="580" y2="250" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222">
<text x="170" y="40" font-size="20" text-anchor="middle" font-weight="bold">Big model, printed in two</text>
<text x="545" y="40" font-size="20" text-anchor="middle" font-weight="bold">Matching features on the cut faces</text>
<text x="170" y="425" font-size="18" text-anchor="middle">pegs below, holes above</text>
<text x="385" y="350" font-size="18" text-anchor="middle">(a) peg and hole</text>
<text x="540" y="350" font-size="18" text-anchor="middle">(b) loose dowels</text>
<text x="695" y="350" font-size="18" text-anchor="middle">(c) dovetail</text>
<text x="695" y="374" font-size="16" text-anchor="middle">slides in from the side</text>
<text x="545" y="110" font-size="16" text-anchor="middle">line the pieces up · stop sliding and twisting</text>
<text x="545" y="440" font-size="18" text-anchor="middle" font-weight="bold">Glue, a clip or a screw then holds the pieces together</text>
</g>
</svg>
