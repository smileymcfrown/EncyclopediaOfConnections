<text x="51" y="146">motor</text>
<text x="770" y="134" text-anchor="end">line shaft</text>
<text x="230" y="380">small pulley:</text><text x="230" y="401">twice as fast</text>
<text x="430" y="380">crossed belt:</text><text x="430" y="401">turns the other way</text>
<text x="640" y="380">big pulley:</text><text x="640" y="401">half as fast</text>
<text x="400" y="436" font-size="17">To stop one machine, its belt is slid onto a free-spinning (loose) pulley beside it</text>
