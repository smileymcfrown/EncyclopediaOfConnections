<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>A line shaft: one long shaft under the ceiling, turned by a motor at one end, carries three pulleys, and each pulley drives a belt down to its own machine: a big pulley driving a small one makes the first machine turn twice as fast, a crossed belt makes the second turn the other way, and a small pulley driving a big one makes the third turn at half speed.</title>
