<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>A panel standoff pulled apart in side view: a metal barrel is screwed to the wall through a wall plug, and its length sets the gap behind the panel; the drilled glass panel, with a clear washer on each side, goes over the threaded stud of the cap, which screws into the front of the barrel and pinches the panel. A small front view shows four standoffs, one near each corner, with the holes kept at least 1 inch from the edges.</title>
<rect width="800" height="450" fill="#ffffff"/>
