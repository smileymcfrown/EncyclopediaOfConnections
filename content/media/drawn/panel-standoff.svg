<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle">
<text x="230" y="38" font-size="21" font-weight="bold">Side view, pulled apart</text>
<text x="650" y="38" font-size="21" font-weight="bold">From the front</text>
<text x="43" y="60">wall</text>
<text x="130" y="182">barrel</text>
<text x="130" y="310">barrel length</text><text x="130" y="331">sets the gap</text>
<text x="60" y="404" text-anchor="start">screw into a wall plug</text>
<text x="267" y="60">glass panel</text>
<text x="304" y="272" text-anchor="start">clear washer</text><text x="304" y="293" text-anchor="start">each side</text>
<text x="380" y="150">cap: screw it in</text>
