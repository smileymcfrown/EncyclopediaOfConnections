<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Cut-away of a tank with a float valve: the water is low, so the float has dropped, the long arm has swung down about its pivot and its short end has pulled the rubber washer off the inlet, letting water pour in; a dashed line marks the set water line, with the overflow pipe just above it.</title>
