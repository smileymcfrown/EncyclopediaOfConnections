<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Two grippers built like nutcrackers, with long handles and the jaws close to the hinge: the top one is two arms joined by a pin, the bottom one is a single piece where the pin is replaced by a thin bending section; thin arrows show a small push at the handles and thick arrows a big grip at the jaws.</title>
