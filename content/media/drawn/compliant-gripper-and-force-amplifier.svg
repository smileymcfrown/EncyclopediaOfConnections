<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle">
<g text-anchor="start"><text x="20" y="34" font-size="21" font-weight="bold">Two pieces with a pin</text><text x="20" y="214" font-size="21" font-weight="bold">One piece that bends</text><text x="535" y="50">small push,</text><text x="535" y="72">long way</text><text x="270" y="40" font-size="17">big grip, short way</text></g><g text-anchor="end"><text x="106" y="106">pin</text><text x="106" y="276">thin</text><text x="106" y="298">bending</text><text x="106" y="320">section</text></g><text x="400" y="424" font-size="19">Long handles, short jaws: a small push becomes a big grip.</text><text x="400" y="446" font-size="19">In one piece, a thin section bends instead of a pin, and springs it open again.</text>
</g>
</svg>
