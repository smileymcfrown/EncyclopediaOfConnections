<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>A clam cleat in side and end view: the rope lies in a narrow V-shaped groove whose walls carry ridges sloping toward the load, so the load drags the rope down into the V where it jams; pulling the tail up and back lifts it out.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
<marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#e8e8e8"/><line x1="0" y1="0" x2="0" y2="10" stroke="#222" stroke-width="2"/></pattern>
<clipPath id="wall"><rect x="80" y="200" width="280" height="100"/></clipPath>
</defs>
<g stroke-linejoin="round" stroke-linecap="round">
<rect x="50" y="300" width="340" height="24" rx="6" fill="#e8e8e8" stroke="#222" stroke-width="3"/>
<path d="M80,300 L80,215 Q80,200 95,200 L345,200 Q360,200 360,215 L360,300 Z" fill="#e8e8e8" stroke="#222" stroke-width="3"/>
<g clip-path="url(#wall)"><line x1="100" y1="200" x2="0" y2="300" stroke="#999" stroke-width="4"/><line x1="126" y1="200" x2="26" y2="300" stroke="#999" stroke-width="4"/><line x1="152" y1="200" x2="52" y2="300" stroke="#999" stroke-width="4"/><line x1="178" y1="200" x2="78" y2="300" stroke="#999" stroke-width="4"/><line x1="204" y1="200" x2="104" y2="300" stroke="#999" stroke-width="4"/><line x1="230" y1="200" x2="130" y2="300" stroke="#999" stroke-width="4"/><line x1="256" y1="200" x2="156" y2="300" stroke="#999" stroke-width="4"/><line x1="282" y1="200" x2="182" y2="300" stroke="#999" stroke-width="4"/><line x1="308" y1="200" x2="208" y2="300" stroke="#999" stroke-width="4"/><line x1="334" y1="200" x2="234" y2="300" stroke="#999" stroke-width="4"/><line x1="360" y1="200" x2="260" y2="300" stroke="#999" stroke-width="4"/><line x1="386" y1="200" x2="286" y2="300" stroke="#999" stroke-width="4"/><line x1="412" y1="200" x2="312" y2="300" stroke="#999" stroke-width="4"/><line x1="438" y1="200" x2="338" y2="300" stroke="#999" stroke-width="4"/><line x1="464" y1="200" x2="364" y2="300" stroke="#999" stroke-width="4"/></g>
<line x1="80" y1="276" x2="360" y2="276" stroke="#222" stroke-width="2" stroke-dasharray="6 6"/>
<circle cx="65" cy="312" r="5" fill="#fff" stroke="#222" stroke-width="2"/><circle cx="375" cy="312" r="5" fill="#fff" stroke="#222" stroke-width="2"/>
<path d="M10,252 L80,262 L360,262 L510,270" fill="none" stroke="#222" stroke-width="22"></path>
<path d="M10,252 L80,262 L360,262 L510,270" fill="none" stroke="#cfe3f5" stroke-width="16"></path>
<line x1="80" y1="232" x2="20" y2="232" stroke="#d1495b" stroke-width="5" marker-end="url(#ah)"></line>
<path d="M520,250 Q520,150 450,100" fill="none" stroke="#d1495b" stroke-width="5" marker-end="url(#ah)"/>
<line x1="560" y1="60" x2="560" y2="400" stroke="#cccccc" stroke-width="2"/>
<path d="M590,330 L590,190 L650,190 L654,196.5 L653.1,203 L657.1,209.5 L656.2,216 L660.2,222.5 L659.4,229 L663.4,235.5 L662.5,242 L666.5,248.5 L665.6,255 L669.6,261.5 L668.7,268 L672.7,274.5 L671.8,281 L675.8,287.5 L675,294 L679,300.5 L675,300 L685,300 L681,300.5 L685,294 L684.2,287.5 L688.2,281 L687.3,274.5 L691.3,268 L690.4,261.5 L694.4,255 L693.5,248.5 L697.5,242 L696.6,235.5 L700.6,229 L699.8,222.5 L703.8,216 L702.9,209.5 L706.9,203 L706,196.5 L710,190 L770,190 L770,330 Z" fill="#e8e8e8" stroke="#222" stroke-width="3"/>
<ellipse cx="680" cy="268" rx="13" ry="19" fill="#cfe3f5" stroke="#222" stroke-width="3"></ellipse>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#222">
<g font-weight="bold" text-anchor="middle"><text x="270" y="40">Side view (near wall cut away)</text><text x="680" y="40">End view</text></g>
<text x="12" y="192">load pulls</text>
<text x="220" y="356" text-anchor="middle">ridges slope toward the load</text>
<text x="230" y="110" text-anchor="middle">pull the tail up and back:</text><text x="230" y="134" text-anchor="middle">the rope rides up and out</text>
<text x="680" y="356" text-anchor="middle">the V narrows:</text><text x="680" y="380" text-anchor="middle">rope wedged deeper</text>
<text x="400" y="434" text-anchor="middle" font-size="18">The harder the load pulls, the deeper the rope is dragged into the V and the firmer the grip</text>
</g>
</svg>
