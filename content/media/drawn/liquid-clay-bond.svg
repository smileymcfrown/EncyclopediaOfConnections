<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Three ways to join polymer clay with liquid clay: two raw pieces, a raw piece to a baked piece, and two baked pieces with a thin snake of raw clay laid in the joint as a bridge, each with a thin layer of liquid clay between the parts. All three go into the oven and come out as one solid piece of plastic.</title>
