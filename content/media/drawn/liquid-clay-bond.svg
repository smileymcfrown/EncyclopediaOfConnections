<rect x="405.0" y="78" width="96" height="100" rx="3" fill="#fde2c4"/>
<rect x="652.0" y="82" width="26" height="92" fill="#cfe3f5" stroke-width="2"/>
<rect x="659" y="82" width="12" height="92" rx="6" fill="#fde2c4" stroke-width="2"/>
