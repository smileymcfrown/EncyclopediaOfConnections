<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>A block held in a corner jig by exactly six small touching points: three under its bottom face, two on the long back wall and one on the end wall, with a spring pushing it diagonally into the corner so it always settles in the same place.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#222" stroke-width="2"/></pattern></defs>
<g stroke-linejoin="round" stroke-linecap="round">
<line x1="505" y1="20" x2="505" y2="400" stroke="#cccccc" stroke-width="2"/>
<rect x="46" y="96" width="420" height="14" fill="url(#hatch)" stroke="#222" stroke-width="3"/>
<rect x="46" y="110" width="14" height="270" fill="url(#hatch)" stroke="#222" stroke-width="3"/>
<rect x="84" y="134" width="320" height="170" fill="#cfe3f5" stroke="#222" stroke-width="3"/>
<path d="M138,110 A12,12 0 0 0 162,110 Z" fill="#fde2c4" stroke="#222" stroke-width="3"/>
<circle cx="150" cy="122" r="12" fill="#fde2c4" stroke="#222" stroke-width="3"/>
<path d="M328,110 A12,12 0 0 0 352,110 Z" fill="#fde2c4" stroke="#222" stroke-width="3"/>
<circle cx="340" cy="122" r="12" fill="#fde2c4" stroke="#222" stroke-width="3"/>
<circle cx="72" cy="219" r="12" fill="#fde2c4" stroke="#222" stroke-width="3"/>
<circle cx="140" cy="175" r="12" fill="none" stroke="#222" stroke-width="2.5" stroke-dasharray="5 4"/>
<circle cx="140" cy="265" r="12" fill="none" stroke="#222" stroke-width="2.5" stroke-dasharray="5 4"/>
<circle cx="350" cy="220" r="12" fill="none" stroke="#222" stroke-width="2.5" stroke-dasharray="5 4"/>
<rect x="452" y="346" width="40" height="40" fill="url(#hatch)" stroke="#222" stroke-width="3"/>
<polyline points="456.0,350.0 455.5,336.2 435.1,344.9 441.2,323.6 420.8,332.4 426.9,311.1 406.5,319.8 406.0,306.0" fill="none" stroke="#222" stroke-width="3"/>
<line x1="478" y1="312" x2="430" y2="268" stroke="#d1495b" stroke-width="5" marker-end="url(#ah)"/>
<rect x="525" y="330" width="250" height="14" fill="url(#hatch)" stroke="#222" stroke-width="3"/>
<rect x="525" y="190" width="14" height="140" fill="url(#hatch)" stroke="#222" stroke-width="3"/>
<rect x="563" y="220" width="190" height="90" fill="#cfe3f5" stroke="#222" stroke-width="3"/>
<circle cx="600" cy="320" r="10" fill="#fde2c4" stroke="#222" stroke-width="3"/>
<circle cx="720" cy="320" r="10" fill="#fde2c4" stroke="#222" stroke-width="3"/>
<circle cx="551" cy="265" r="12" fill="#fde2c4" stroke="#222" stroke-width="3"/>
<line x1="660" y1="176" x2="660" y2="214" stroke="#d1495b" stroke-width="5" marker-end="url(#ah)"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle">
<text x="255" y="34" font-size="21" font-weight="bold">From above</text>
<text x="650" y="34" font-size="21" font-weight="bold">From the side</text>
<text x="255" y="80">2 points on the long wall</text>
<text x="244" y="200">part</text>
<text x="244" y="294" font-size="17">dashed circles: 3 points underneath</text>
<text x="100" y="400" text-anchor="start">1 point on the end wall</text>
<line x1="96" y1="384" x2="74" y2="234" stroke="#222" stroke-width="1.5"/>
<text x="650" y="132">a gentle push holds</text><text x="650" y="153">it on the points</text>
<text x="650" y="372">sits on the 3 points, not the flat</text>
<text x="400" y="436" font-size="19">3 + 2 + 1 = 6 points, one for each way it could move: it lands in the same place every time</text>
</g></svg>
