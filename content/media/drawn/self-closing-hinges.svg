<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Two self-closing hinges: a spring hinge seen from above, whose coiled spring in the barrel winds up as the door is pushed open, and a rising butt seen from the front, whose door climbs a spiral ramp between the two knuckles as it opens.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#222" stroke-width="2"/></pattern>
</defs>
<g stroke="#222" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
<rect x="20" y="304" width="52" height="40" fill="url(#hatch)"/><rect x="286" y="304" width="44" height="40" fill="url(#hatch)"/>
<path d="M286,300 A196,196 0 0 0 107.1,104.7" fill="none" stroke="#999999" stroke-width="2" stroke-dasharray="6 6"/>
<g>
<rect x="90" y="293" width="194" height="14" fill="#fde2c4"/>
</g>
<circle cx="90" cy="300" r="34" fill="#e8e8e8"/>
<path d="M90,293 L93.2,293.1 L96.3,294.8 L98.5,297.7 L99.2,301.6 L98.1,305.7 L95.2,309.1 L91,311 L86,311 L81.3,308.7 L77.9,304.4 L76.6,298.8 L77.9,293 L81.6,288.1 L87.4,285.1 L94.1,284.8 L100.5,287.5 L105.3,292.9 L107.5,300 L106.4,307.6 L102,314.3 L95,318.6 L86.6,319.5 L78.3,316.7 L71.8,310.5 L68.5,301.9 L69.2,292.4 L73.9,283.9 L82,278.1 L92.1,276.2 L102.2,278.8 L110.5,285.6 L115.3,295.5 L115.4,306.8 L110.6,317.2 L101.6,324.8 L90,328" fill="none" stroke="#2f6f3f" stroke-width="2.5"></path>
<circle cx="90" cy="300" r="5" fill="#222"/>
<rect x="420" y="120" width="44" height="240" fill="url(#hatch)" stroke="none"/><line x1="464" y1="120" x2="464" y2="360"/>
<path d="M462,350 L462,262 L498,240 L498,350 Z" fill="#e8e8e8"/>
<g>
<g transform="translate(498 0)"><g><g transform="translate(0 0)"><rect x="0" y="130" width="262" height="218" fill="#cfe3f5" vector-effect="non-scaling-stroke"/><circle cx="232" cy="240" r="8" fill="#e8e8e8" vector-effect="non-scaling-stroke"/></g></g></g>
<path d="M462,258 L498,236 L498,140 L462,140 Z" fill="#fde2c4"/>
</g>
</g>
<g fill="none" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)">
<g opacity="1"><path d="M297.6,248.2 A214,214 0 0 0 233.2,141"/></g>
<line x1="520" y1="128" x2="520" y2="98" stroke-width="3"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222">
<text x="20" y="34" font-size="20" font-weight="bold">Spring hinge, seen from above</text>
<text x="430" y="34" font-size="20" font-weight="bold">Rising butt, seen from the front</text>
<g stroke="#222" stroke-width="1.5"><line x1="70" y1="372" x2="84" y2="330"/><line x1="560" y1="392" x2="498" y2="250"/></g>
<text x="20" y="392">coiled spring in the barrel</text><text x="20" y="413">winds up as the door opens</text>
<text x="190" y="330">door</text>
<text x="215" y="70">push it open;</text><text x="215" y="91">let go and the</text><text x="215" y="112">spring shuts it</text>
<text x="532" y="102">door rises as it opens</text>
<text x="566" y="392">spiral ramp between</text><text x="566" y="413">the knuckles: its weight</text><text x="566" y="434">slides it back down, shut</text>
<text x="20" y="440">Opening stores energy; letting go gives it back</text>
</g></svg>
