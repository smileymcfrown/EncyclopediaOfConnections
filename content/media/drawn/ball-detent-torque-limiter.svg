<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Ball-detent torque limiter drawn unrolled flat: on the left, springs press a plate so steel balls sit in cone-shaped dimples in the drive plate and both sides turn together; on the right, too much torque makes the balls roll up out of the dimples, pushing the plate back against the springs, so the drive side slips past.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
<pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0,12 L12,0" stroke="#222" stroke-width="2"/></pattern></defs>
<line x1="400" y1="20" x2="400" y2="400" stroke="#cccccc" stroke-width="2"/>
<g stroke="#222" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><rect x="40" y="96" width="320" height="18" fill="url(#hatch)"/><path d="M65,114 L65,120 L78,124.2 L52,132.6 L78,140.9 L52,149.3 L78,157.7 L52,166.1 L78,174.4 L52,182.8 L65,187 L65,193" fill="none"/><path d="M155,114 L155,120 L168,124.2 L142,132.6 L168,140.9 L142,149.3 L168,157.7 L142,166.1 L168,174.4 L142,182.8 L155,187 L155,193" fill="none"/><path d="M245,114 L245,120 L258,124.2 L232,132.6 L258,140.9 L232,149.3 L258,157.7 L232,166.1 L258,174.4 L232,182.8 L245,187 L245,193" fill="none"/><path d="M335,114 L335,120 L348,124.2 L322,132.6 L348,140.9 L322,149.3 L348,157.7 L322,166.1 L348,174.4 L322,182.8 L335,187 L335,193" fill="none"/><rect x="40" y="193" width="320" height="50" fill="#cfe3f5"/><rect x="91" y="221" width="38" height="22" fill="#ffffff"/><rect x="181" y="221" width="38" height="22" fill="#ffffff"/><rect x="271" y="221" width="38" height="22" fill="#ffffff"/><path d="M30,310 L30,250 L88,250 L110,264 L132,250 L178,250 L200,264 L222,250 L268,250 L290,264 L312,250 L370,250 L370,310 Z" fill="#fde2c4"/><circle cx="110" cy="243" r="18" fill="#e8e8e8"/><circle cx="200" cy="243" r="18" fill="#e8e8e8"/><circle cx="290" cy="243" r="18" fill="#e8e8e8"/></g>
<g stroke="#222" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><rect x="440" y="96" width="320" height="18" fill="url(#hatch)"/><path d="M465,114 L465,120 L478,123.2 L452,129.6 L478,135.9 L452,142.3 L478,148.7 L452,155.1 L478,161.4 L452,167.8 L465,171 L465,177" fill="none"/><path d="M555,114 L555,120 L568,123.2 L542,129.6 L568,135.9 L542,142.3 L568,148.7 L542,155.1 L568,161.4 L542,167.8 L555,171 L555,177" fill="none"/><path d="M645,114 L645,120 L658,123.2 L632,129.6 L658,135.9 L632,142.3 L658,148.7 L632,155.1 L658,161.4 L632,167.8 L645,171 L645,177" fill="none"/><path d="M735,114 L735,120 L748,123.2 L722,129.6 L748,135.9 L722,142.3 L748,148.7 L722,155.1 L748,161.4 L722,167.8 L735,171 L735,177" fill="none"/><rect x="440" y="177" width="320" height="50" fill="#cfe3f5"/><rect x="491" y="205" width="38" height="22" fill="#ffffff"/><rect x="581" y="205" width="38" height="22" fill="#ffffff"/><rect x="671" y="205" width="38" height="22" fill="#ffffff"/><path d="M430,310 L430,250 L450,250 L472,264 L494,250 L540,250 L562,264 L584,250 L630,250 L652,264 L674,250 L770,250 L770,310 Z" fill="#fde2c4"/><circle cx="510" cy="232" r="18" fill="#e8e8e8"/><circle cx="600" cy="232" r="18" fill="#e8e8e8"/><circle cx="690" cy="232" r="18" fill="#e8e8e8"/></g>
<g stroke="#d1495b" stroke-width="4" fill="none" stroke-linecap="round" marker-end="url(#ah)"><line x1="140" y1="335" x2="260" y2="335"/><line x1="500" y1="335" x2="700" y2="335"/><line x1="600" y1="170" x2="600" y2="134"/></g>
<g font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222" text-anchor="middle">
<text x="200" y="40" font-size="21" font-weight="bold">Normal: balls seated</text>
<text x="600" y="40" font-size="21" font-weight="bold">Too much torque: slips</text>
<text x="200" y="76">springs press the plate down</text>
<text x="600" y="76">balls roll out, plate pushed up</text>
<text x="200" y="290">drive plate with dimples</text>
<text x="200" y="368">both sides turn together</text>
<text x="600" y="368">drive side slips past</text>
<text x="200" y="214">steel balls in holes</text>
<text x="400" y="432" font-size="18">Shown unrolled flat · stronger springs or steeper dimples slip at a higher torque</text>
</g></svg>
