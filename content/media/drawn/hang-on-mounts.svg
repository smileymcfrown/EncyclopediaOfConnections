<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Two lift-off wall mounts: on the left a keyhole slot in the back of an object, where a screw head goes in through the round end and the object then drops so the head sits behind the narrow slot; on the right a French cleat seen from the side, where a bevelled strip on the object hooks over a bevelled strip on the wall and its weight wedges it in.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#222" stroke-width="2"/></pattern>
</defs>
<g stroke-linejoin="round" stroke-linecap="round" stroke="#222" stroke-width="3">
<line x1="400" y1="20" x2="400" y2="400" stroke="#cccccc" stroke-width="2"/>
<!-- keyhole: back view -->
<rect x="40" y="90" width="140" height="250" fill="#fde2c4"/>
<path d="M103,250 L103,160 A7,7 0 0 1 117,160 L117,250 A22,22 0 1 1 103,250 Z" fill="#ffffff"/>
<circle cx="110" cy="270" r="15" fill="none" stroke-width="2" stroke-dasharray="5 4"/>
<circle cx="110" cy="168" r="15" fill="#e8e8e8"/>
<line x1="102" y1="168" x2="118" y2="168" stroke-width="2"/>
<line x1="155" y1="160" x2="155" y2="230" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<!-- keyhole: section -->
<rect x="250" y="90" width="100" height="250" fill="#fde2c4"/>
<rect x="290" y="140" width="40" height="80" fill="#ffffff"/>
<rect x="328" y="174" width="24" height="12" fill="#ffffff" stroke="none"/>
<line x1="330" y1="174" x2="350" y2="174" stroke-width="2"/>
<line x1="330" y1="186" x2="350" y2="186" stroke-width="2"/>
<rect x="352" y="70" width="20" height="290" fill="url(#hatch)" stroke-width="2"/>
<rect x="314" y="175" width="66" height="10" fill="#e8e8e8" stroke-width="2"/>
<rect x="300" y="160" width="14" height="40" fill="#e8e8e8"/>
<!-- French cleat -->
<rect x="760" y="60" width="18" height="350" fill="url(#hatch)" stroke-width="2"/>
<rect x="610" y="110" width="30" height="290" fill="#fde2c4"/>
<polygon points="700,200 760,260 760,300 700,300" fill="#cfe3f5"/>
<polygon points="640,140 750,140 750,250 690,190 640,190" fill="#fde2c4"/>
<rect x="640" y="355" width="120" height="30" fill="#fde2c4"/>
<line x1="585" y1="230" x2="585" y2="300" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<line x1="700" y1="168" x2="735" y2="203" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle">
<text x="200" y="40" font-size="21" font-weight="bold">Keyhole slot</text>
<text x="600" y="40" font-size="21" font-weight="bold">French cleat (side view)</text>
<text x="110" y="70">back of object</text>
<text x="300" y="70">cut through</text>
<text x="110" y="370">push on at the round end,</text>
<text x="110" y="392">then let the object drop</text>
<text x="300" y="370">head hooks</text>
<text x="300" y="392">behind the slot</text>
<text x="580" y="90">object</text>
<text x="700" y="330">wall strip</text>
<text x="695" y="128">object strip</text>
<text x="565" y="270" text-anchor="end">weight</text>
<text x="700" y="415">spacer strip</text>
<text x="600" y="440">weight wedges it down and in</text>
</g>
</svg>
