<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222">
<text x="345" y="58">pushed back along its shaft</text>
<text x="664" y="262">pushed</text><text x="664" y="284">back</text>
<text x="486" y="134">cone tips meet</text>
<text x="20" y="232">20-tooth pinion:</text><text x="20" y="254">turns twice as fast</text>
<text x="550" y="352">40-tooth gear:</text><text x="550" y="374">half speed</text>
<text x="55" y="105" text-anchor="middle">motor</text>
<text x="400" y="438" text-anchor="middle" font-size="17">The teeth roll together on two cones, carrying the turn round the corner</text>
</g>
