<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Two bevel gears seen from the side: a 20-tooth pinion on a horizontal shaft meshes with a 40-tooth gear on a vertical shaft; their teeth are cut on cones whose tips meet where the shafts cross, the gear turns at half the pinion's speed, and the load pushes each gear back along its shaft, away from the tip.</title>
