<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Cross-section through a copper foil joint between two pieces of glass: sticky copper foil is wrapped round each glass edge with a small lip on both faces, the foil is fluxed and given a thin coat of solder, and then a rounded solder bead fills the gap between the pieces and wraps over the foil on both faces, locking the two pieces together.</title>
