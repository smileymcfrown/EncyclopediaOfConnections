<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Two hidden latches: a cupboard door seen from above, whose spring-loaded hook inside catches on the cabinet until a key magnet held on the outside pulls it back through the wood; and a cut-away box whose lid post is held by two pins in side channels until spinning the box flings the pins outwards.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#222" stroke-width="2"/></pattern>
</defs>
<g stroke="#222" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
<line x1="400" y1="20" x2="400" y2="400" stroke="#cccccc" stroke-width="2"/>
<rect x="300" y="150" width="40" height="240" fill="#fde2c4"/>
<rect x="300" y="150" width="40" height="240" fill="url(#hatch)" opacity="0.35" stroke="none"/>
<rect x="268" y="214" width="32" height="18" fill="#e8e8e8"/>
<g>
<rect x="-10" y="120" width="350" height="30" fill="#fde2c4"/>
<rect x="228" y="150" width="24" height="22" fill="#e8e8e8"/>
<polyline points="200,150 206,154 194,158 206,162 194,166 206,170 200,174" fill="none" stroke-width="2.5"></polyline>
<g transform="rotate(0 240 180)">
<path d="M168,180 H240 L244,246 H276 V236" fill="none" stroke-width="9"/>
<path d="M168,180 H240 L244,246 H276 V236" fill="none" stroke="#cfe3f5" stroke-width="3"/>
<rect x="156" y="168" width="30" height="16" fill="#cfe3f5"/>
</g>
<circle cx="240" cy="180" r="5" fill="#ffffff" stroke-width="2.5"/><circle cx="240" cy="180" r="1.5" fill="#222" stroke="none"/>
</g>
<g transform="translate(0,-55)"><rect x="150" y="90" width="23" height="30" fill="#f5d0d0"/><rect x="173" y="90" width="23" height="30" fill="#cfe3f5"/></g>
<line x1="322" y1="74" x2="322" y2="40" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)" opacity="0"></line>
<line x1="173" y1="20" x2="173" y2="56" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<line x1="600" y1="162" x2="600" y2="412" stroke="#999999" stroke-width="2" stroke-dasharray="8 6"/>
<path d="M470,230 H588 V292 H515 V306 H588 V330 H612 V306 H685 V292 H612 V230 H730 V380 H470 Z" fill="#fde2c4"/>
<g><rect x="557" y="294" width="40" height="10" rx="3" fill="#cfe3f5"/></g>
<g><rect x="603" y="294" width="40" height="10" rx="3" fill="#cfe3f5"/></g>
<g><rect x="460" y="200" width="280" height="30" fill="#fde2c4"/><path d="M590,230 V292 H597 V306 H590 V322 H610 V306 H603 V292 H610 V230" fill="#fde2c4"/></g>
<path d="M530,404 A70,12 0 0 0 676,402" fill="none" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)" stroke-dasharray="10 6" opacity="0"></path>
<path d="M530,404 A70,12 0 0 0 676,402" fill="none" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/><line x1="548" y1="320" x2="522" y2="320" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/><line x1="652" y1="320" x2="678" y2="320" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222">
<text x="14" y="34" font-size="21" font-weight="bold">Magnet key</text>
<text x="418" y="34" font-size="21" font-weight="bold">Spin lock</text>
<text x="206" y="58">key magnet</text>
<text x="14" y="204">door (from above)</text>
<text x="160" y="290" text-anchor="middle">spring-loaded hook</text>
<text x="350" y="210">catch</text>
<text x="455" y="222" text-anchor="end">lid</text>
<text x="460" y="304" text-anchor="end">pins</text>
<g text-anchor="middle">
<text x="200" y="400">a magnet outside pulls</text><text x="200" y="422">the hook off the catch</text>
<text x="600" y="150">spin it: pins fly out, lid lifts</text>
</g></g>
</svg>
