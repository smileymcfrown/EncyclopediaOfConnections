<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Three glued tab joints in card. Left, seen end-on: a tab folded down from one panel on a scored line is glued behind the next panel, whose cut edge then shows as a small step at the corner. Middle: the tabless way, with the two edges bevelled to meet cleanly and a hidden paper strip glued behind both. Right: a card tube with a ring of short flanges cut round its end, folded outwards and glued flat to a card base.</title>
