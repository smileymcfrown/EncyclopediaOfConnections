<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Two foam floor tiles joined by a jigsaw-puzzle edge. Seen from above on the left, each knob is wider at its head than at its neck, so pulling the tiles apart sideways, in any direction along the floor, is blocked. On the right, one tile lifted straight up: its knob slips out of the socket, because only friction holds it that way.</title>
