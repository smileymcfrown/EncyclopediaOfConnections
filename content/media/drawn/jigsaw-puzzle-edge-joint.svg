<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222">
<text x="200" y="40" font-size="21" font-weight="bold" text-anchor="middle">From above: locked sideways</text>
<text x="600" y="40" font-size="21" font-weight="bold" text-anchor="middle">Lifted: slips straight out</text>
<text x="200" y="362" text-anchor="middle">knob head wider than its neck,</text><text x="200" y="384" text-anchor="middle">so a sideways pull can't open it</text>
<text x="120" y="110" text-anchor="middle">foam tile</text><text x="290" y="110" text-anchor="middle">foam tile</text>
<text x="640" y="140">only friction</text><text x="640" y="162">holds it this way</text>
<text x="690" y="322">socket</text><line x1="686" y1="316" x2="610" y2="298" stroke="#222" stroke-width="1.5"/>
<text x="400" y="436" text-anchor="middle">Strong against sideways pulls, weak against lifting, which is why tiles part on uneven floors</text>
</g>
</svg>
