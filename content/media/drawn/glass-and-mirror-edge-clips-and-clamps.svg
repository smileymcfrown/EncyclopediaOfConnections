<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Left: side view of a mirror on a wall held by plastic clips with no holes in the glass; a fixed bottom clip carries its weight on a ledge and a top clip, screwed through a plastic washer into a wall plug, slides up (shown dashed) to let the mirror in and drops down over its front face. Right: a cut-away of a clamp holding a glass shelf, where a screw squeezes the glass between two rubber pads so no metal touches it.</title>
<rect width="800" height="450" fill="#ffffff"/>
