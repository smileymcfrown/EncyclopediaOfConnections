</g>
<g stroke="#d1495b" stroke-width="4" fill="none" stroke-linecap="round" marker-end="url(#ah)">
<line x1="170" y1="66" x2="170" y2="112"/>
<line x1="170" y1="398" x2="170" y2="370"/>
<line x1="569" y1="104" x2="569" y2="142"/>
