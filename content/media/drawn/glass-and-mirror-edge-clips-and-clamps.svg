<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222">
<text x="220" y="34" font-size="21" font-weight="bold" text-anchor="middle">Mirror clips</text>
<text x="600" y="34" font-size="21" font-weight="bold" text-anchor="middle">Shelf clamp, cut open</text>
<text x="188" y="80">top clip slides up to let</text><text x="188" y="102">the mirror in, then drops</text><text x="188" y="124">over its front face</text>
<text x="170" y="241">mirror (glass)</text>
<text x="188" y="378">bottom clip carries</text><text x="188" y="400">the weight on a ledge</text>
<text x="660" y="150" text-anchor="middle">metal clamp</text>
<text x="590" y="94" text-anchor="middle">tighten the clamp screw</text>
<text x="700" y="268" text-anchor="middle">glass shelf</text>
<text x="620" y="310" text-anchor="middle">rubber pads: no metal</text><text x="620" y="332" text-anchor="middle">touches the glass</text>
<text x="456" y="372" text-anchor="middle">wall</text>
</g>
<g stroke="#222" stroke-width="1.5"><line x1="560" y1="294" x2="560" y2="258"/><line x1="166" y1="235" x2="130" y2="235"/><line x1="640" y1="156" x2="608" y2="174"/></g>
<text x="400" y="438" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222">Clips hold by shape, clamps by squeezing through rubber · the glass is never drilled</text>
</svg>
