<rect x="36" y="377" width="44" height="18" fill="#fde2c4"/><rect x="42" y="382" width="58" height="8" fill="#e8e8e8"/><rect x="100" y="374" width="6" height="24" fill="#ffffff" stroke-width="2"/><rect x="106" y="376" width="10" height="20" rx="2" fill="#e8e8e8"/>
