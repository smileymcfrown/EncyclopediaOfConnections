<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Two speed governors: on the left a spring barrel drives ever-smaller gears up to a two-bladed fan that beats the air, with air-drag arrows; on the right two weights on flat springs spin inside a fixed drum lined with felt, and fly outwards to rub on it as the speed rises.</title>
