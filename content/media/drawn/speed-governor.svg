<text x="200" y="30" font-size="21" font-weight="bold">Fan fly</text>
<text x="600" y="30" font-size="21" font-weight="bold">Spinning weights</text>
<text x="335" y="70">air drag grows</text><text x="335" y="92">with speed</text>
<text x="100" y="392">spring barrel</text>
<text x="305" y="320">speed</text>
