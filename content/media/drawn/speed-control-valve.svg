<path d="M590,320 L599,320 M620,320 L611,320" stroke="#222" stroke-width="4"/>
<circle cx="605" cy="311" r="9" fill="#cfe3f5" stroke="#222" stroke-width="2.5"/>
<polyline points="605,302 599,300 611,296 599,292 611,288 599,284 611,280 599,276 611,272 599,268 605,252" fill="none" stroke="#222" stroke-width="2"/>
<line x1="535" y1="276" x2="535" y2="296" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<line x1="535" y1="318" x2="535" y2="346" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<line x1="570" y1="198" x2="570" y2="222" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<line x1="570" y1="378" x2="570" y2="398" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222">
<text x="435" y="80" font-size="18" text-anchor="middle">piston extends</text>
<text x="230" y="420" font-size="18" text-anchor="middle">supply air</text>
<text x="320" y="300" font-size="18">check valve</text>
<text x="320" y="322" font-size="18">opens: free flow</text>
<text x="570" y="420" font-size="18" text-anchor="middle">exhaust, slowed</text>
<text x="660" y="300" font-size="18">check valve shut:</text>
<text x="660" y="322" font-size="18">air squeezes</text>
<text x="660" y="344" font-size="18">past the needle</text>
<text x="88" y="258" font-size="18" text-anchor="middle">turn needle in</text>
<text x="88" y="280" font-size="18" text-anchor="middle">= slower</text>
<text x="400" y="444" font-size="18" text-anchor="middle" font-weight="bold">Throttling the air that leaves (meter-out) gives smooth, steady motion</text>
</g>
</svg>
