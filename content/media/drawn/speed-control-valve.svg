<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>A double-acting air cylinder with a speed controller on each port, shown as it extends: on the inlet side air pushes the one-way check valve open and flows in freely; on the outlet side the check valve is pushed shut, so the escaping air must squeeze past an adjustable needle, which sets how fast the piston moves.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
</defs>

<g stroke-linejoin="round" stroke-linecap="round">
<rect x="190" y="110" width="420" height="80" rx="6" fill="#e8e8e8" stroke="#222" stroke-width="3"/>
<rect x="600" y="140" width="150" height="20" fill="#e8e8e8" stroke="#222" stroke-width="3"/>
<rect x="330" y="114" width="30" height="72" fill="#cfe3f5" stroke="#222" stroke-width="3"/>
<rect x="360" y="140" width="245" height="20" fill="#e8e8e8" stroke="#222" stroke-width="2.5"/>
<line x1="390" y1="92" x2="480" y2="92" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<rect x="222" y="190" width="16" height="50" fill="#ffffff" stroke="#222" stroke-width="2.5"/>
<rect x="150" y="240" width="160" height="130" rx="6" fill="#fde2c4" stroke="#222" stroke-width="3"/>
<path d="M180,252 H280 V358 H180 Z M210,270 V340 H250 V270 Z" fill="#ffffff" stroke="#222" stroke-width="2.5" fill-rule="evenodd"/>
<rect x="222" y="236" width="16" height="18" fill="#ffffff"/>
<rect x="222" y="356" width="16" height="30" fill="#ffffff" stroke="none"/>
<path d="M222,370 V392 M238,370 V392" stroke="#222" stroke-width="2.5"/>
<polygon points="136,298 180,298 208,305 180,312 136,312" fill="#e8e8e8" stroke="#222" stroke-width="2.5"/>
<rect x="120" y="290" width="16" height="30" rx="3" fill="#e8e8e8" stroke="#222" stroke-width="2.5"/>
<path d="M250,320 L259,320 M280,320 L271,320" stroke="#222" stroke-width="4"/>
<circle cx="265" cy="296" r="9" fill="#cfe3f5" stroke="#222" stroke-width="2.5"/>
<polyline points="265,287 259,285 271,281 259,277 271,273 259,269 271,265 259,261 271,257 259,253 265,252" fill="none" stroke="#222" stroke-width="2"/>
<line x1="265" y1="350" x2="265" y2="330" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<line x1="230" y1="215" x2="230" y2="196" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<line x1="230" y1="398" x2="230" y2="378" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<rect x="562" y="190" width="16" height="50" fill="#ffffff" stroke="#222" stroke-width="2.5"/>
<rect x="490" y="240" width="160" height="130" rx="6" fill="#fde2c4" stroke="#222" stroke-width="3"/>
<path d="M520,252 H620 V358 H520 Z M550,270 V340 H590 V270 Z" fill="#ffffff" stroke="#222" stroke-width="2.5" fill-rule="evenodd"/>
<rect x="562" y="236" width="16" height="18" fill="#ffffff"/>
<rect x="562" y="356" width="16" height="30" fill="#ffffff" stroke="none"/>
<path d="M562,370 V392 M578,370 V392" stroke="#222" stroke-width="2.5"/>
<polygon points="476,298 520,298 548,305 520,312 476,312" fill="#e8e8e8" stroke="#222" stroke-width="2.5"/>
