<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222">
<text x="132" y="44" text-anchor="middle" font-weight="bold" font-size="17">two wires, twisted: stiffer</text>
<text x="300" y="78" font-size="17">clay: a thin, even layer</text><line x1="370" y1="84" x2="372" y2="160" stroke="#222" stroke-width="1.5"/>
<text x="22" y="246" font-size="17">crumpled foil,</text><text x="22" y="266" font-size="17">taped on</text>
<line x1="140" y1="252" x2="318" y2="228" stroke="#222" stroke-width="1.5"/>
<text x="640" y="214" font-size="17">twisted wire</text><text x="640" y="234" font-size="17">through legs,</text><text x="640" y="254" font-size="17">neck and tail</text>
<line x1="636" y1="222" x2="506" y2="168" stroke="#222" stroke-width="1.5"/>
<text x="512" y="292" font-size="17">pushed into a hole</text><text x="512" y="312" font-size="17">just big enough</text>
<line x1="510" y1="306" x2="480" y2="346" stroke="#222" stroke-width="1.5"/>
<text x="668" y="364" font-size="17">wooden base</text>
<text x="400" y="420" text-anchor="middle" font-size="17">Foil fills out the body so the clay stays thin · the wire stops thin legs, necks</text>
<text x="400" y="441" text-anchor="middle" font-size="17">and tails drooping or snapping off, and holds the figure upright</text>
