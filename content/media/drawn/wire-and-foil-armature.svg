<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Cut-away of a small clay animal standing on a wooden base. A twisted wire skeleton runs from holes drilled in the base up through both legs, along the body and up the neck into the head, and out into the tail; crumpled foil, taped on, fills out the body and head, and a thin, even layer of clay covers it all. An inset shows two wires twisted together.</title>
