<path d="M587,88 594,91 587,94 594,97 587,100 594,103 587,106 594,109 587,112 L645,112 A48,48 0 0 1 645,208 L587,208 594,211 587,214 594,217 587,220 594,223 587,226 594,229 587,232 L645,232 A72,72 0 0 0 645,88 Z" fill="#fde2c4"/>
<circle cx="592" cy="80" r="8" fill="#fde2c4" stroke-width="2"/>
<circle cx="592" cy="120" r="8" fill="#fde2c4" stroke-width="2"/>
<circle cx="592" cy="200" r="8" fill="#fde2c4" stroke-width="2"/>
