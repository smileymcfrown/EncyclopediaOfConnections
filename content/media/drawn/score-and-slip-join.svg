<rect x="339" y="86" width="6" height="28" fill="#cfe3f5" stroke-width="2"/>
<rect x="319" y="206" width="6" height="28" fill="#cfe3f5" stroke-width="2"/>
<rect x="339" y="206" width="6" height="28" fill="#cfe3f5" stroke-width="2"/>
<path d="M345,88 352,91 345,94 352,97 345,100 352,103 345,106 352,109 345,112 L403,112 A48,48 0 0 1 403,208 L345,208 352,211 345,214 352,217 345,220 352,223 345,226 352,229 345,232 L403,232 A72,72 0 0 0 403,88 Z" fill="#fde2c4"/>
<polygon points="560,55 584,55 584,88 577,91 584,94 577,97 584,100 577,103 584,106 577,109 584,112 584,208 577,211 584,214 577,217 584,220 577,223 584,226 577,229 584,232 584,290 560,290" fill="#fde2c4"/>
