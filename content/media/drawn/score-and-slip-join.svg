</g>
<g stroke="#d1495b" stroke-width="4" fill="none" marker-end="url(#ah)">
<line x1="790" y1="160" x2="752" y2="160"/>
<line x1="230" y1="373" x2="200" y2="373"/><line x1="312" y1="373" x2="340" y2="373"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222">
<text x="133" y="36" font-size="20" font-weight="bold" text-anchor="middle">Score both faces</text>
<text x="400" y="36" font-size="20" font-weight="bold" text-anchor="middle">Brush on slip</text>
<text x="667" y="36" font-size="20" font-weight="bold" text-anchor="middle">Press, blend, add coils</text>
<text x="36" y="316">mug wall</text>
<text x="150" y="76">handle</text>
<text x="160" y="316">criss-cross scratches</text>
<line x1="170" y1="300" x2="76" y2="232" stroke="#222" stroke-width="1.5"/>
<text x="395" y="316">slip: clay and water paste</text>
<line x1="420" y1="300" x2="342" y2="232" stroke="#222" stroke-width="1.5"/>
<text x="610" y="316">coil in each corner</text>
<line x1="626" y1="300" x2="596" y2="244" stroke="#222" stroke-width="1.5"/>
<text x="360" y="365">parts at different dampness</text><text x="360" y="388">shrink apart and crack</text>
<text x="400" y="440" text-anchor="middle" font-size="17">Join both parts at the same dampness (leather-hard) and let the piece dry slowly and evenly</text>
</g>
</svg>
