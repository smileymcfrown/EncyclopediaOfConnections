<title>Magnified cut-away of a clamped PVA glue line between two boards, with the glue reaching into the open wood cells and its water soaking into the wood and drying into the air; beside it, a strong side-grain joint compared with a weak end-grain butt joint where the glue soaks away into the wood.</title>
