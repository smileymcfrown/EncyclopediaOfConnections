<text x="220" y="30" font-weight="bold">water dries into the air</text>
<text x="220" y="352">glue reaches into the open wood cells;</text>
<text x="220" y="374">its water soaks into the wood</text>
<text x="620" y="60" font-weight="bold">Side grain: strong</text>
<text x="620" y="192">long glue area along the fibres</text>
<text x="620" y="236" font-weight="bold">End grain: weak</text>
<text x="620" y="336">glue soaks away</text>
<text x="620" y="358">into the open ends</text>
<text x="400" y="432">PVA hardens as its water leaves: clamp the joint and use side grain</text>
</g></svg>
