<text x="100" y="370">plain fishing line</text>
<text x="300" y="370">heater wire wound on</text>
<text x="500" y="378">baked into a coil</text>
<text x="635" y="136">heat</text>
<text x="700" y="378">shorter: lifts weight</text>
<text x="400" y="425">Heat: fibre untwists a little and the coil pulls shorter · Cool: it stretches back</text>
