<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Cut-away side view of the back edge of a model plane's wing and the front of its aileron, both balsa. A flat hinge is pushed half into a slot in each and glued, with a toothpick peg through each half so it can't pull out; the edges are bevelled and the hinge bends in the gap between them. Below, seen from above, three hinges share each hinge line, and beside it a round hinge point turns on a pin in drilled holes.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#e8e8e8"/><line x1="0" y1="0" x2="0" y2="10" stroke="#222" stroke-width="2"/></pattern></defs>
<g stroke="#222" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
<path d="M40,128 Q220,138 394,150 L394,194 Q220,206 40,216 Z" fill="#fde2c4"/>
<rect x="330" y="169" width="64" height="6" fill="#cfe3f5" stroke-width="2"/>
<rect x="352" y="147" width="9" height="50" fill="#e8e8e8" stroke-width="2"/>
<g transform="translate(400 172)"><path d="M6,0 L28,-22 Q140,-16 300,-3 L300,3 Q140,16 28,22 Z" fill="#fde2c4"/><text x="80" y="6" stroke="none" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="17">aileron (moves)</text><rect x="6" y="-3" width="64" height="6" fill="#cfe3f5" stroke-width="2"/><rect x="40" y="-20" width="9" height="40" fill="#e8e8e8" stroke-width="2"/></g>
<path d="M394,172 C399,172 401,172 406,172" fill="none" stroke="#222" stroke-width="8" stroke-linecap="butt"/>
<path d="M394,172 C399,172 401,172 406,172" fill="none" stroke="#cfe3f5" stroke-width="4" stroke-linecap="butt"/>
<rect x="40" y="300" width="380" height="40" fill="#fde2c4"/><rect x="40" y="352" width="380" height="34" fill="#fde2c4"/><rect x="98" y="337" width="24" height="18" fill="#cfe3f5" stroke-width="2"/><rect x="218" y="337" width="24" height="18" fill="#cfe3f5" stroke-width="2"/><rect x="338" y="337" width="24" height="18" fill="#cfe3f5" stroke-width="2"/>
<path d="M470,316 L600,322 L600,358 L470,364 Z" fill="#fde2c4"/><path d="M612,340 L626,326 L760,336 L760,344 L626,354 Z" fill="#fde2c4"/><path d="M548,336 L600,336 L600,344 L548,344 Z" fill="#cfe3f5" stroke-width="2"/><path d="M612,336 L664,336 L664,344 L612,344 Z" fill="#cfe3f5" stroke-width="2"/><path d="M560,336 L566,331 M574,336 L580,331 M588,336 L594,331 M560,344 L566,349 M574,344 L580,349 M588,344 L594,349 M640,336 L634,331 M654,336 L648,331 M626,336 L620,331 M640,344 L634,349 M654,344 L648,349 M626,344 L620,349" fill="none" stroke-width="2"/><circle cx="606" cy="340" r="8" fill="#cfe3f5" stroke-width="2"/><circle cx="606" cy="340" r="2.5" fill="#222" stroke="none"/>
</g>
<path d="M713.8,70 A330,330 0 0 1 713.8,274" stroke="#d1495b" stroke-width="4" fill="none" marker-start="url(#ah)" marker-end="url(#ah)"/>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222">
<text x="60" y="178">wing (balsa, fixed)</text>
<text x="190" y="252">flat hinge, half in each slot, glued</text>
<line x1="345" y1="236" x2="372" y2="177" stroke="#222" stroke-width="1.5"/>
<text x="300" y="62">toothpick peg</text>
<line x1="352" y1="68" x2="356" y2="142" stroke="#222" stroke-width="1.5"/>
<text x="420" y="62">bevelled edges: hinge</text><text x="420" y="84">bends in the gap</text>
<line x1="418" y1="92" x2="402" y2="160" stroke="#222" stroke-width="1.5"/>
<text x="40" y="414">from above: 3 or more hinges</text><text x="40" y="436">share each hinge line</text>
<text x="470" y="296">or a round hinge point</text>
<text x="470" y="392">in drilled holes, on a pin</text>
</g>
</svg>
