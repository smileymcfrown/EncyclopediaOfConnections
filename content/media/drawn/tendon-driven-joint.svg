<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Side view of a tendon-driven finger: three hinged pieces on a fixed palm, a string running along the palm side through holes a little below each hinge and tied at the fingertip, and an elastic cord along the back. The small offset of the string below each hinge (the moment arm) turns a straight pull into a turning force at every joint.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#e8e8e8"/><line x1="0" y1="0" x2="0" y2="10" stroke="#222" stroke-width="2"/></pattern>
</defs>
<g stroke="#222" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
<rect x="80" y="84" width="122" height="16" fill="url(#hatch)"/>
<polygon points="80,100 208,100 208,130 196,160 80,160" fill="#e8e8e8"/>
<g><polygon points="212,112 338,112 338,130 326,148 224,148 212,130" fill="#fde2c4"/><g><polygon points="342,112 443,112 443,130 431,148 354,148 342,130" fill="#fde2c4"/><g><path d="M447,112 L512,112 A18,18 0 0 1 512,148 L459,148 L447,130 Z" fill="#fde2c4"/></g><circle cx="445" cy="130" r="7" fill="#ffffff"/><circle cx="445" cy="130" r="2" fill="#222"/></g><circle cx="340" cy="130" r="7" fill="#ffffff"/><circle cx="340" cy="130" r="2" fill="#222"/></g>
<circle cx="210" cy="130" r="7" fill="#ffffff"/><circle cx="210" cy="130" r="2" fill="#222"/>
<polyline points="60,142 80,142 192,142 226,142 324,142 356,142 429,142 461,142 516,139" fill="none" stroke="#9a5b2a" stroke-width="4"></polyline>
<polyline points="186,118 226,118 324,118 356,118 429,118 461,118 516,121" fill="none" stroke="#3d8b3d" stroke-width="4"></polyline>
<circle cx="516" cy="139" r="4" fill="#9a5b2a" stroke="none"></circle>
<circle cx="51" cy="142" r="9" fill="none" stroke-width="3"></circle>
<line x1="72" y1="182" x2="22" y2="182" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"></line>
<g stroke-width="2"><line x1="186" y1="130" x2="214" y2="130" stroke-dasharray="3 3"/><line x1="200" y1="131" x2="200" y2="141"/><line x1="180" y1="196" x2="198" y2="150"/></g>
<line x1="560" y1="330" x2="600" y2="330" stroke="#9a5b2a" stroke-width="5"/><line x1="560" y1="370" x2="600" y2="370" stroke="#3d8b3d" stroke-width="5"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" fill="#222" font-size="18">
<text x="20" y="214">pull</text>
<text x="110" y="216">moment arm</text>
<text x="610" y="336">string (tendon)</text>
<text x="610" y="376">elastic cord</text>
<text x="610" y="356" font-size="16">pulls the joints closed</text>
<text x="610" y="396" font-size="16">pulls them straight</text>
<text x="20" y="40" font-size="20" font-weight="bold">A finger of three hinged pieces</text>
<text x="400" y="436" text-anchor="middle">Pull the string a little: every joint curls · let go: the elastic straightens it</text>
</g>
</svg>
