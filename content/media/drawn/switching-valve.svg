</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222">
<text x="370" y="56" text-anchor="middle">double-acting cylinder</text>
<text x="130" y="242">spring</text>
<text x="380" y="242" text-anchor="middle">spool</text>
<text x="685" y="250" text-anchor="middle">coil</text>
<g font-weight="bold"><text x="296" y="232">4</text><text x="458" y="232">2</text><text x="236" y="378">5</text><text x="356" y="378">1</text><text x="476" y="378">3</text></g>
<text x="232" y="420" text-anchor="middle">exhaust</text>
<text x="380" y="432" text-anchor="middle">supply air in</text>
<text x="528" y="420" text-anchor="middle">exhaust</text>
<text x="20" y="28" font-size="19" font-weight="bold">Coil off: spring holds spool left · 1 feeds 2, rod pulls in</text>
<text x="610" y="52">coil on:</text>
<text x="610" y="74">spool slides right,</text>
<text x="610" y="96">1 feeds 4, rod out</text>
</g>
</svg>
