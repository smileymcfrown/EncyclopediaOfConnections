<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Cut-away of a 5/2 solenoid switching valve driving a double-acting air cylinder: with the coil off a spring holds the sliding spool to the left, so supply port 1 feeds port 2 and the rod pulls in while port 4 vents through 5; with the coil on the spool slides right, so 1 feeds 4 and the rod pushes out while 2 vents through 3.</title>
