<path d="M440,291 V205 H500 V158" fill="none" stroke="#222" stroke-width="16" stroke-linejoin="round"/><path d="M440,291 V205 H500 V158" fill="none" stroke="#ffffff" stroke-width="10" stroke-linejoin="round"/><path d="M440,291 V205 H500 V158" fill="none" stroke="#cfe3f5" stroke-width="10" stroke-linejoin="round" opacity="1"></path>
