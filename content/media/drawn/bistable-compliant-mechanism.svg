<path d="M548,248 Q590,170 618,182" fill="none" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<path d="M650,188 Q690,200 712,268" fill="none" stroke="#d1495b" stroke-width="4" stroke-dasharray="7 6" marker-end="url(#ah)"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#222">
<text x="75" y="160" text-anchor="middle">clamped</text>
<text x="330" y="335" font-size="17" fill="#666" text-anchor="middle">other stable shape</text>
<text x="255" y="124">push</text>
<text x="240" y="62" text-anchor="middle">pre-curved springy beam</text>
<text x="625" y="150" text-anchor="middle">tipping point</text>
<text x="520" y="354" text-anchor="middle">stable</text><text x="730" y="354" text-anchor="middle">stable</text>
<text x="555" y="215" text-anchor="end" font-size="18">push</text><text x="700" y="215" font-size="18">snap!</text>
<text x="466" y="240" text-anchor="middle" transform="rotate(-90 466 240)" font-size="18">stored energy</text>
<text x="400" y="420" text-anchor="middle" font-size="18">Push it past the tipping point and it snaps into its other shape by itself,</text>
<text x="400" y="442" text-anchor="middle" font-size="18">then stays there with no latch, spring or power holding it</text>
</g>
</svg>
