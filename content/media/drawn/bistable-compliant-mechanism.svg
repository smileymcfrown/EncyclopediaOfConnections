<path d="M100,240 L110,239.3 L120,237.3 L130,234 L140,229.6 L150,224.4 L160,218.6 L170,212.5 L180,206.4 L190,200.6 L200,195.4 L210,191 L220,187.7 L230,185.7 L240,185 L250,185.7 L260,187.7 L270,191 L280,195.4 L290,200.6 L300,206.4 L310,212.5 L320,218.6 L330,224.4 L340,229.6 L350,234 L360,237.3 L370,239.3 L380,240" fill="none" stroke="#222" stroke-width="13" stroke-linecap="butt"></path>
<path d="M100,240 L110,239.3 L120,237.3 L130,234 L140,229.6 L150,224.4 L160,218.6 L170,212.5 L180,206.4 L190,200.6 L200,195.4 L210,191 L220,187.7 L230,185.7 L240,185 L250,185.7 L260,187.7 L270,191 L280,195.4 L290,200.6 L300,206.4 L310,212.5 L320,218.6 L330,224.4 L340,229.6 L350,234 L360,237.3 L370,239.3 L380,240" fill="none" stroke="#d8f0d2" stroke-width="7" stroke-linecap="butt"></path>
<line x1="240" y1="96" x2="240" y2="176" stroke="#d1495b" stroke-width="6" marker-end="url(#ah)"/>
<line x1="470" y1="330" x2="780" y2="330" stroke="#222" stroke-width="2"/><line x1="480" y1="340" x2="480" y2="150" stroke="#222" stroke-width="2" marker-end="url(#ak)"/>
<path d="M483.2,238.8 L488,260.7 L492.7,278.6 L497.4,292.8 L502.1,303.7 L506.9,311.5 L511.6,316.7 L516.3,319.4 L521,320 L525.8,318.6 L530.5,315.7 L535.2,311.3 L540,305.8 L544.7,299.4 L549.4,292.2 L554.1,284.4 L558.9,276.4 L563.6,268.1 L568.3,259.8 L573,251.6 L577.8,243.7 L582.5,236.1 L587.2,229.1 L591.9,222.6 L596.6,216.9 L601.4,211.8 L606.1,207.7 L610.8,204.3 L615.6,201.9 L620.3,200.5 L625,200 L629.7,200.5 L634.5,201.9 L639.2,204.3 L643.9,207.7 L648.6,211.8 L653.4,216.9 L658.1,222.6 L662.8,229.1 L667.5,236.1 L672.2,243.7 L677,251.6 L681.7,259.8 L686.4,268.1 L691.1,276.4 L695.9,284.4 L700.6,292.2 L705.3,299.4 L710.1,305.8 L714.8,311.3 L719.5,315.7 L724.2,318.6 L729,320 L733.7,319.4 L738.4,316.7 L743.1,311.5 L747.9,303.7 L752.6,292.8 L757.3,278.6 L762,260.7 L766.8,238.8" fill="none" stroke="#222" stroke-width="3"/>
