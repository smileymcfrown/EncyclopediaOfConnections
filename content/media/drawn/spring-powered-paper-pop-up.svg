<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>A snap-up card cube: four card sides hinged at their corners, with a rubber band inside hooked on two opposite corners; pressed flat, the corners are pulled apart and the band is stretched, and let go, the band shortens and pulls the box back into a cube. A second drawing shows a paper spring made of two strips folded over each other, holding up a figure.</title>
