<g opacity="1"><g><path d="M358,298 A26,26 0 0 1 306,298" fill="none" stroke="#d1495b" stroke-width="3.5" marker-end="url(#ah)"/><path d="M306,298 A26,26 0 0 1 358,298" fill="none" stroke="#d1495b" stroke-width="3.5" marker-end="url(#ah)"/></g></g>
