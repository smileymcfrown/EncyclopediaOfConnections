</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle">
<text x="225" y="415">aluminium disc, spinning</text><text x="398" y="232" font-size="17" text-anchor="start">magnet</text><g text-anchor="start" font-size="17"><text x="386" y="124">swirling</text><text x="386" y="144">currents</text><text x="278" y="258" text-anchor="end">drag</text><text x="490" y="122">drag</text><text x="488" y="358">no drag when stopped</text></g><text x="730" y="358" font-size="17">speed</text><text x="590" y="415" font-size="19">Faster spin, stronger drag;</text><text x="590" y="439" font-size="19">it can slow things but never hold them</text>
