<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>On the left, a cut-away of a model figure's arm pulled slightly away from its body: a wire pin sits half in a drilled hole in each part, each hole a little bigger than the pin and filled with glue, so a knock on the arm is carried by the pin rather than the thin glue line. On the right, two toothpicks pushed through two layers of foam board stop the layers sliding apart.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#e8e8e8"/><line x1="0" y1="0" x2="0" y2="10" stroke="#222" stroke-width="2"/></pattern></defs>
<line x1="400" y1="20" x2="400" y2="400" stroke="#cccccc" stroke-width="2"/>
<g stroke="#222" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
<path d="M40,340 L40,112 Q40,82 70,82 L140,82 Q170,82 170,112 L170,340 Z" fill="url(#hatch)"/>
<path d="M192,118 L350,118 Q372,118 372,140 L372,176 Q372,198 350,198 L192,198 Z" fill="url(#hatch)"/>
<rect x="112" y="149" width="58" height="22" fill="#d8f0d2"/>
<rect x="192" y="149" width="58" height="22" fill="#d8f0d2"/>
<rect x="118" y="154" width="126" height="12" fill="#fde2c4"/>
<rect x="460" y="140" width="240" height="7" fill="#ffffff"/><rect x="460" y="147" width="240" height="34" fill="#cfe3f5"/><rect x="460" y="181" width="240" height="7" fill="#ffffff"/><rect x="460" y="188" width="240" height="7" fill="#ffffff"/><rect x="460" y="195" width="240" height="34" fill="#cfe3f5"/><rect x="460" y="229" width="240" height="7" fill="#ffffff"/>
<polygon points="540,118 550,118 550,252 545,266 540,252" fill="#fde2c4"/><polygon points="620,118 630,118 630,252 625,266 620,252" fill="#fde2c4"/>
</g>
<g stroke="#d1495b" stroke-width="4" fill="none" marker-end="url(#ah)">
<line x1="335" y1="58" x2="335" y2="108"/>
<line x1="708" y1="164" x2="768" y2="164"/>
<line x1="452" y1="212" x2="412" y2="212"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222">
<text x="200" y="40" font-size="21" font-weight="bold" text-anchor="middle">Pinned arm, cut away</text>
<text x="600" y="40" font-size="21" font-weight="bold" text-anchor="middle">Toothpicks in foam board</text>
<text x="342" y="72">knock</text>
<text x="300" y="100" text-anchor="middle">arm</text>
<text x="105" y="366" text-anchor="middle">body</text>
<text x="190" y="306">wire pin, half in each</text><text x="190" y="328">part, takes the knock</text>
<line x1="181" y1="330" x2="181" y2="168" stroke="#222" stroke-width="1.5"/>
<text x="262" y="244" font-size="17">hole a bit bigger,</text><text x="262" y="265" font-size="17">filled with glue</text>
<line x1="272" y1="228" x2="244" y2="173" stroke="#222" stroke-width="1.5"/>
<text x="585" y="100" text-anchor="middle">toothpick or skewer</text>
<text x="580" y="300" text-anchor="middle">two layers of foam board:</text><text x="580" y="322" text-anchor="middle">the pins stop them sliding</text>
<text x="400" y="436" text-anchor="middle">The pin carries the knock and the bend; the glue only has to keep the pin in</text>
</g>
</svg>
