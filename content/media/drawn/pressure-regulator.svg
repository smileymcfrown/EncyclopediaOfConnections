<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222">
<text x="340" y="60" text-anchor="end">knob sets the</text><text x="340" y="82" text-anchor="end">spring force</text>
<text x="258" y="150" text-anchor="end">big spring</text><text x="258" y="172" text-anchor="end">pushes down</text>
<text x="548" y="116">outlet pressure</text><text x="548" y="138">pushes the</text><text x="548" y="160">diaphragm up</text>
<text x="400" y="408" text-anchor="middle">poppet valve</text>
<text x="90" y="384" text-anchor="middle">from the tank</text><text x="90" y="406" text-anchor="middle">(high pressure)</text>
<text x="690" y="318" text-anchor="middle">to the tool:</text><text x="690" y="340" text-anchor="middle">steady, lower</text>
<text x="400" y="440" text-anchor="middle" font-size="17">Pressure drops: spring wins, valve opens · pressure builds: diaphragm lifts, valve closes</text>
</g>
</svg>
