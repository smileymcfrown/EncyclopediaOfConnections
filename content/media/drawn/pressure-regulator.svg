<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Cutaway of a pressure regulator between a high-pressure tank and an air tool: a knob squeezes a big spring onto a diaphragm, which pushes a small poppet valve open; outlet pressure under the diaphragm pushes back, so the poppet closes once the set pressure is reached and opens a little again whenever air is used.</title>
