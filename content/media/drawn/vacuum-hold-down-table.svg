<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle">
<text x="400" y="60" font-size="21" font-weight="bold">Room air presses the sheet down</text>
<text x="400" y="88">and friction stops it sliding</text>
<text x="385" y="138">cutter pushes sideways</text>
<text x="104" y="208" text-anchor="start">sheet</text>
<text x="610" y="362">down through the holes</text>
<text x="400" y="392">vacuum pump</text>
<text x="190" y="362">air sucked out</text>
<text x="400" y="436">Holding force = vacuum × area under the sheet</text>
</g></svg>