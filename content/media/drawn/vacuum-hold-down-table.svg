<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>A side cut-away of a vacuum table: a flat sheet lies on a plate full of small holes over a sealed chamber; a pump sucks the air out of the chamber through a hose, so the room air pressing on top pushes the sheet down hard and friction stops the cutter dragging it sideways.</title>
