<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222">
<text x="200" y="40" font-size="20" text-anchor="middle" font-weight="bold">Before: plain pilot hole</text>
<text x="600" y="40" font-size="20" text-anchor="middle" font-weight="bold">After: thread formed in plastic</text>
<text x="270" y="128" font-size="18">self-tapping</text>
<text x="270" y="150" font-size="18">screw</text>
<text x="262" y="262" font-size="18">pilot hole a bit</text>
<text x="262" y="284" font-size="18">narrower than screw</text>
<text x="200" y="414" font-size="18" text-anchor="middle">printed post (boss) about 2 × screw wide</text>
<text x="470" y="150" font-size="18">part being clamped</text>
<text x="658" y="290" font-size="18">plastic pushed</text>
<text x="658" y="312" font-size="18">into the thread</text>
<text x="400" y="442" font-size="18" text-anchor="middle" font-weight="bold">Do not over-tighten: the plastic thread strips</text>
</g>
