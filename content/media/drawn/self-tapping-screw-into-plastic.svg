<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Cut-away of a printed plastic screw post before and after a self-tapping screw is driven: on the left a plain pilot hole a little narrower than the screw, on the right the screw in place with the plastic pushed into its thread, clamping a part under the screw head.</title>
