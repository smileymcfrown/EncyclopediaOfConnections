<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Three side cut-away steps of a 3D print: the printer pauses at the top of a pocket, a nut is dropped into the pocket, and printing resumes over it, sealing the nut inside with a bolt hole left above it.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="10" stroke="#222" stroke-width="2"/></pattern>
<g id="bed"><rect x="10" y="340" width="190" height="16" fill="url(#hatch)" stroke="#222" stroke-width="3"/></g>
<g id="lower">
<path d="M20,340 L20,240 L75,240 L75,290 L135,290 L135,240 L190,240 L190,340 Z" fill="#e8e8e8" stroke="#222" stroke-width="3"/>
<g stroke="#b5b5b5" stroke-width="1.5"><line x1="22" y1="300" x2="188" y2="300"/><line x1="22" y1="320" x2="188" y2="320"/><line x1="22" y1="265" x2="73" y2="265"/><line x1="137" y1="265" x2="188" y2="265"/></g>
</g>
<g id="nut" fill="#cfe3f5" stroke="#222" stroke-width="3"><rect x="78" y="247" width="18" height="41"/><rect x="114" y="247" width="18" height="41"/></g>
<g id="nozzle" fill="#f5d0d0" stroke="#222" stroke-width="3"><rect x="0" y="0" width="40" height="32"/><polygon points="12,32 28,32 20,48"/></g>
</defs>
<g stroke-linejoin="round" stroke-linecap="round">
<line x1="265" y1="20" x2="265" y2="390" stroke="#cccccc" stroke-width="2"/>
<line x1="530" y1="20" x2="530" y2="390" stroke="#cccccc" stroke-width="2"/>
<!-- step 1 -->
<use href="#bed"/>
<use href="#lower"/>
<use href="#nozzle" transform="translate(140,118)"/>
<!-- step 2 -->
<g transform="translate(265,0)">
<use href="#bed"/>
<use href="#lower"/>
<use href="#nut"/>
<line x1="105" y1="140" x2="105" y2="228" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
</g>
<!-- step 3 -->
<g transform="translate(530,0)">
<use href="#bed"/>
<path d="M20,340 L20,180 L96,180 L96,240 L114,240 L114,180 L190,180 L190,340 Z" fill="#e8e8e8" stroke="#222" stroke-width="3"/>
<g stroke="#b5b5b5" stroke-width="1.5"><line x1="22" y1="300" x2="188" y2="300"/><line x1="22" y1="320" x2="188" y2="320"/><line x1="22" y1="200" x2="94" y2="200"/><line x1="116" y1="200" x2="188" y2="200"/><line x1="22" y1="220" x2="94" y2="220"/><line x1="116" y1="220" x2="188" y2="220"/></g>
<path d="M96,240 L75,240 L75,290 L135,290 L135,240 L114,240" fill="#ffffff" stroke="#222" stroke-width="3"/>
<use href="#nut"/>
<line x1="20" y1="240" x2="75" y2="240" stroke="#222" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="135" y1="240" x2="196" y2="240" stroke="#222" stroke-width="2" stroke-dasharray="6 5"/>
<use href="#nozzle" transform="translate(150,124)"/>
<line x1="140" y1="108" x2="70" y2="108" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
</g>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle">
<text x="105" y="45" font-size="21" font-weight="bold">1. Pause</text>
<text x="370" y="45" font-size="21" font-weight="bold">2. Drop nut in</text>
<text x="635" y="45" font-size="21" font-weight="bold">3. Print over it</text>
<text x="132" y="142" text-anchor="end">nozzle waits</text>
<text x="105" y="230">pocket</text>
<text x="383" y="200" text-anchor="start">nut or magnet</text>
<text x="625" y="170">bolt hole</text>
<text x="730" y="236" text-anchor="start">pause</text>
<text x="730" y="256" text-anchor="start">here</text>
<text x="400" y="420" font-size="19">The nut ends up sealed in plastic on every side, held by its shape</text>
</g>
</svg>
