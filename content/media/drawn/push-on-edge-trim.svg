<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222">
<text x="230" y="40" font-size="21" font-weight="bold" text-anchor="middle">Edge trim (cut-away end)</text>
<text x="40" y="122">plastic or rubber U</text>
<text x="60" y="326">metal clip inside</text>
<line x1="80" y1="310" x2="78" y2="272" stroke="#222" stroke-width="2"/>
<text x="150" y="360">angled tongues grip both faces</text>
<line x1="180" y1="344" x2="176" y2="256" stroke="#222" stroke-width="2"/>
<text x="276" y="122">grip range</text>
<text x="330" y="166">easy on</text>
<text x="380" y="256">hard off</text>
<text x="300" y="222">panel</text>
<text x="640" y="100">grommet</text>
<text x="640" y="122">edging</text>
<text x="640" y="170">cable rests</text>
<text x="640" y="192">on plastic</text>
<text x="570" y="256" text-anchor="middle">door closes</text>
<text x="660" y="415" text-anchor="middle">bulb squashes: seals the gap</text>
