<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>A cut-away end view of U-shaped push-on edge trim gripping a sheet edge, with a metal clip inside the plastic and angled tongues pressing on both faces like barbs so it pushes on easily but resists pulling off; beside it, a hole in a panel lined with serrated grommet edging around a cable, and a trim seal whose hollow bulb is squashed by a closing door.</title>
