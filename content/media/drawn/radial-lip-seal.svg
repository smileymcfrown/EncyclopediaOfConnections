<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Cross-section of a radial lip seal: a metal ring pressed into the housing hole carries a rubber lip, squeezed onto the shaft by a garter spring and pointing at the oil inside the box; a close-up shows the thin oil film under the lip.</title>
