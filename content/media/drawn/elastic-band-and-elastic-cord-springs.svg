<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>A hinged arm held down by a rubber band looped between a peg on the arm and a peg on the base: on the left it rests closed with the band short, and on the right the arm is lifted, the band is stretched longer and thinner, and it pulls the arm back down.</title>
