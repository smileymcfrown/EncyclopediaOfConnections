<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Two side views of tape joints. Left: two card panels butted with a small gap and a strip of tape across the top; pulled apart along the surface the tape holds, but once one end of the strip is lifted it peels off. Right: a tape hinge between a foam board part and a flap, with one strip on the top face and one on the bottom face across a small gap, so the flap swings up and down about the gap.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker></defs>
<line x1="400" y1="20" x2="400" y2="400" stroke="#cccccc" stroke-width="2"/>
<g stroke="#222" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
<rect x="70" y="140" width="126" height="16" fill="#fde2c4"/><rect x="206" y="140" width="126" height="16" fill="#fde2c4"/>
<rect x="70" y="304" width="126" height="16" fill="#fde2c4"/><rect x="206" y="304" width="126" height="16" fill="#fde2c4"/>
<rect x="110" y="134" width="182" height="6" fill="#cfe3f5" stroke-width="2"/>
<g stroke="#d1495b" stroke-width="4"><line x1="66" y1="148" x2="28" y2="148" marker-end="url(#ah)"/><line x1="336" y1="148" x2="374" y2="148" marker-end="url(#ah)"/></g>
<path d="M110,298 L240,298 Q262,298 282,272 L300,248 L305,252 L287,276 Q266,304 240,304 L110,304 Z" fill="#cfe3f5" stroke-width="2"/>
<line x1="308" y1="244" x2="328" y2="218" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<g fill="none" stroke="#999" stroke-width="2" stroke-dasharray="6 5"><rect x="598" y="200" width="150" height="24" transform="rotate(28 593 224)"/><rect x="598" y="200" width="150" height="24" transform="rotate(-28 593 200)"/></g>
<rect x="430" y="200" width="158" height="24" fill="#ffffff"/><g stroke-width="1.5" fill="#fdf3c4"><rect x="430" y="200" width="158" height="4"/><rect x="430" y="220" width="158" height="4"/></g>
<rect x="598" y="200" width="150" height="24" fill="#ffffff"/><g stroke-width="1.5" fill="#fdf3c4"><rect x="598" y="200" width="150" height="4"/><rect x="598" y="220" width="150" height="4"/></g>
<rect x="548" y="194" width="90" height="6" fill="#cfe3f5" stroke-width="2"/>
<rect x="548" y="224" width="90" height="6" fill="#cfe3f5" stroke-width="2"/>
<path d="M756.2,146.1 A176,176 0 0 1 756.2,277.9" fill="none" stroke="#d1495b" stroke-width="4" marker-start="url(#ah)" marker-end="url(#ah)"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222">
<g font-size="19" font-weight="bold" text-anchor="middle"><text x="200" y="44">Tape across a seam</text><text x="600" y="44">Tape hinge</text></g>
<text x="214" y="112">tape</text><line x1="226" y1="116" x2="226" y2="132" stroke="#222" stroke-width="1.5"/>
<text x="24" y="317">card</text>
<text x="200" y="200" text-anchor="middle">pulled along the surface: holds</text>
<text x="200" y="354" text-anchor="middle">one end lifted: it peels off</text>
<text x="430" y="106">top strip: stuck on</text><text x="430" y="126">with the flap down</text><line x1="530" y1="134" x2="566" y2="192" stroke="#222" stroke-width="1.5"/>
<text x="430" y="300">bottom strip: stuck on</text><text x="430" y="320">with the flap up</text><line x1="530" y1="282" x2="566" y2="232" stroke="#222" stroke-width="1.5"/>
<text x="430" y="252">foam board</text>
<text x="600" y="370" text-anchor="middle">leave a small gap: too little binds,</text><text x="600" y="392" text-anchor="middle">too much lets the flap wobble</text>
<text x="400" y="438" text-anchor="middle">Press tape down firmly · round the corners of each strip, because points lift first</text>
</g></svg>
