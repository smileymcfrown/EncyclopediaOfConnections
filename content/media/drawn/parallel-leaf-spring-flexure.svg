<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Side view of a platform held above a fixed base by two thin parallel blades: at rest the blades are straight, and when the platform is pushed sideways both blades bend into the same S shape so the platform slides along while staying level, dipping only very slightly.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#222" stroke-width="2"/></pattern>
</defs>
<g stroke-linejoin="round" stroke-linecap="round">
<line x1="400" y1="20" x2="400" y2="390" stroke="#cccccc" stroke-width="2"/>
<!-- at rest -->
<rect x="50" y="320" width="300" height="26" fill="url(#hatch)" stroke="#222" stroke-width="3"/>
<rect x="100" y="140" width="10" height="180" fill="#d8f0d2" stroke="#222" stroke-width="3"/>
<rect x="290" y="140" width="10" height="180" fill="#d8f0d2" stroke="#222" stroke-width="3"/>
<rect x="80" y="110" width="240" height="32" fill="#cfe3f5" stroke="#222" stroke-width="3"/>
<!-- pushed -->
<rect x="450" y="320" width="300" height="26" fill="url(#hatch)" stroke="#222" stroke-width="3"/>
<path d="M505,320 C505,230 555,232 555,146" fill="none" stroke="#222" stroke-width="12"/>
<path d="M505,320 C505,230 555,232 555,146" fill="none" stroke="#d8f0d2" stroke-width="5"/>
<path d="M695,320 C695,230 745,232 745,146" fill="none" stroke="#222" stroke-width="12"/>
<path d="M695,320 C695,230 745,232 745,146" fill="none" stroke="#d8f0d2" stroke-width="5"/>
<rect x="530" y="116" width="240" height="32" fill="#cfe3f5" stroke="#222" stroke-width="3"/>
<rect x="480" y="110" width="240" height="32" fill="none" stroke="#999999" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="430" y1="132" x2="470" y2="132" stroke="#d1495b" stroke-width="5" marker-end="url(#ah)"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle">
<text x="200" y="40" font-size="21" font-weight="bold">At rest</text>
<text x="600" y="40" font-size="21" font-weight="bold">Pushed sideways</text>
<text x="200" y="132">platform</text>
<text x="200" y="240">two equal thin blades</text>
<text x="200" y="372">fixed base</text>
<text x="600" y="72">slides along and stays level,</text>
<text x="600" y="96">dipping only very slightly</text>
<text x="625" y="240">blades bend</text>
<text x="625" y="262">into S shapes</text>
<text x="600" y="372">fixed base</text>
<text x="400" y="425">Nothing slides or rubs: no friction, no play, no wear</text>
</g>
</svg>
