<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Three-quarter view of a V-fold pop-up on a card opened flat: a V-shaped card piece is folded down its middle and its two halves are glued to the two pages at a slant, so its middle crease and both glue lines meet at one point on the centre fold; a view from above shows the matching glue angles on each side, and the piece laid flat shows that its own angle must be bigger than the glue angle.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker></defs>
<line x1="520" y1="20" x2="520" y2="400" stroke="#cccccc" stroke-width="2"/>
<path fill="#fdf3c4" stroke="#222" stroke-width="3" stroke-linejoin="round" d="M319.4,294.6 L213,343.4 L96.7,255.9 L203,207Z"/>
<path fill="#fdf3c4" stroke="#222" stroke-width="3" stroke-linejoin="round" d="M319.4,294.6 L425.8,245.7 L309.4,158.2 L203,207Z" visibility="visible"/>
<path d="M319.4,294.6 L203,207" stroke="#222" stroke-width="2" stroke-dasharray="8 6" fill="none"/>
<path fill="#9ec5e8" stroke="#222" stroke-width="3" stroke-linejoin="round" d="M300,280 L296.4,219.2 L261,162.5Z"/>
<path fill="#cfe3f5" stroke="#222" stroke-width="3" stroke-linejoin="round" d="M300,280 L200.5,263.2 L261,162.5Z"/>
<path fill="#fdf3c4" stroke="#222" stroke-width="3" stroke-linejoin="round" d="M319.4,294.6 L425.8,245.7 L309.4,158.2 L203,207Z" visibility="hidden"/>
<circle cx="300" cy="280" r="5.5" fill="#d1495b" stroke="#222" stroke-width="2"/>
<path d="M222.6,195.3 L224.7,188.5 L226.8,182 L229,175.8 L231.3,169.8 L233.5,164.1 L235.8,158.8 L238.1,153.8 L240.4,149.3 L242.7,145.2 L244.9,141.5 L247.1,138.3 L249.2,135.5 L251.2,133.2" fill="none" stroke="#d1495b" stroke-width="3.5" marker-end="url(#ah)"/>
<g><rect x="540" y="85" width="240" height="150" fill="#fdf3c4" stroke="#222" stroke-width="3"/><line x1="660" y1="85" x2="660" y2="235" stroke="#222" stroke-width="2" stroke-dasharray="8 6"/><line x1="660" y1="205" x2="595.3" y2="116" stroke="#222" stroke-width="3"/><line x1="660" y1="205" x2="724.7" y2="116" stroke="#222" stroke-width="3"/><path d="M660,155 A50,50 0 0 0 630.6,164.5" fill="none" stroke="#d1495b" stroke-width="3"/><path d="M660,155 A50,50 0 0 1 689.4,164.5" fill="none" stroke="#d1495b" stroke-width="3"/><circle cx="660" cy="205" r="5.5" fill="#d1495b" stroke="#222" stroke-width="2"/></g>
<path d="M600,385 L536.1,356.5 L600,315 L663.9,356.5Z" fill="#cfe3f5" stroke="#222" stroke-width="3" stroke-linejoin="round"/>
<line x1="600" y1="385" x2="600" y2="315" stroke="#222" stroke-width="2" stroke-dasharray="6 5"/>
<path d="M600,355 A30,30 0 0 1 627.4,372.8" fill="none" stroke="#d1495b" stroke-width="3"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#222"><text x="260" y="36" font-size="21" text-anchor="middle" font-weight="bold">Card opening, piece rising</text><text x="660" y="36" font-size="20" text-anchor="middle" font-weight="bold">Seen from above, open flat</text><text x="30" y="338" font-size="19">base card</text><text x="30" y="78" font-size="19">V piece (card)</text><line x1="80" y1="86" x2="232" y2="222" stroke="#222" stroke-width="1.5"/><text x="340" y="340" font-size="18">all three creases meet</text><text x="340" y="362" font-size="18">at one point on the fold</text><line x1="358" y1="324" x2="306" y2="287" stroke="#222" stroke-width="1.5"/><text x="690" y="74" font-size="18" text-anchor="middle">glue angle</text><line x1="672" y1="80" x2="672" y2="155" stroke="#222" stroke-width="1.5"/><text x="680" y="352" font-size="17">piece angle:</text><text x="680" y="373" font-size="17">must be bigger</text><text x="400" y="438" font-size="18" text-anchor="middle">The angles must match on both sides of the fold, or the card will not close flat</text></g>
</svg>
