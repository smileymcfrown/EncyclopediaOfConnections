<g><circle cx="250" cy="232" r="110" fill="#ffffff" stroke="#222" stroke-width="2"/><path d="M351.6,274.1 A110,110 0 0 1 292.1,333.6 L282.1,309.6 A84,84 0 0 0 327.6,264.1 Z" fill="#f5d0d0" stroke="#222" stroke-width="2"/><text x="318.6" y="306.6" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#222">N</text><path d="M292.1,333.6 A110,110 0 0 1 207.9,333.6 L217.9,309.6 A84,84 0 0 0 282.1,309.6 Z" fill="#cfe3f5" stroke="#222" stroke-width="2"/><text x="250" y="335" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#222">S</text><path d="M207.9,333.6 A110,110 0 0 1 148.4,274.1 L172.4,264.1 A84,84 0 0 0 217.9,309.6 Z" fill="#f5d0d0" stroke="#222" stroke-width="2"/><text x="181.4" y="306.6" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#222">N</text><path d="M148.4,274.1 A110,110 0 0 1 148.4,189.9 L172.4,199.9 A84,84 0 0 0 172.4,264.1 Z" fill="#cfe3f5" stroke="#222" stroke-width="2"/><text x="153" y="238" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#222">S</text><path d="M148.4,189.9 A110,110 0 0 1 207.9,130.4 L217.9,154.4 A84,84 0 0 0 172.4,199.9 Z" fill="#f5d0d0" stroke="#222" stroke-width="2"/><text x="181.4" y="169.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#222">N</text><path d="M207.9,130.4 A110,110 0 0 1 292.1,130.4 L282.1,154.4 A84,84 0 0 0 217.9,154.4 Z" fill="#cfe3f5" stroke="#222" stroke-width="2"/><text x="250" y="141" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#222">S</text><path d="M292.1,130.4 A110,110 0 0 1 351.6,189.9 L327.6,199.9 A84,84 0 0 0 282.1,154.4 Z" fill="#f5d0d0" stroke="#222" stroke-width="2"/><text x="318.6" y="169.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#222">N</text><path d="M351.6,189.9 A110,110 0 0 1 351.6,274.1 L327.6,264.1 A84,84 0 0 0 327.6,199.9 Z" fill="#cfe3f5" stroke="#222" stroke-width="2"/><text x="347" y="238" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#222">S</text><circle cx="250" cy="232" r="84" fill="#e8e8e8" stroke="#222" stroke-width="3"/><circle cx="282.7" cy="264.7" r="9" fill="#fff" stroke="#222" stroke-width="2"/><circle cx="217.3" cy="264.7" r="9" fill="#fff" stroke="#222" stroke-width="2"/><circle cx="217.3" cy="199.3" r="9" fill="#fff" stroke="#222" stroke-width="2"/><circle cx="282.7" cy="199.3" r="9" fill="#fff" stroke="#222" stroke-width="2"/><circle cx="250" cy="232" r="14" fill="#9a9a9a" stroke="#222" stroke-width="2.5"/></g>
<g opacity="1"><path d="M133,92.6 A182,182 0 0 1 281.6,52.8" fill="none" stroke="#d1495b" stroke-width="5" marker-end="url(#ah)"/></g>
<line x1="386.8" y1="153" x2="470" y2="120" stroke="#222" stroke-width="2"/><line x1="366.6" y1="221.8" x2="470" y2="200" stroke="#222" stroke-width="2"/><line x1="344" y1="266.2" x2="470" y2="280" stroke="#222" stroke-width="2"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222">
<text x="478" y="116">driver: outer magnets,</text><text x="478" y="138">turned by the motor</text>
<text x="478" y="196">thin sealed wall between</text><text x="478" y="218">(nothing touches)</text>
<text x="478" y="276">follower: inner magnets,</text><text x="478" y="298">drives the pump or load</text>
<text x="400" y="420" text-anchor="middle" font-weight="bold" font-size="20">In step: the follower trails a few degrees</text>
<text x="400" y="444" text-anchor="middle" font-size="16">A magnetic gear adds a ring of steel pole pieces between rotors with different pole counts</text>
</g>
</svg>
