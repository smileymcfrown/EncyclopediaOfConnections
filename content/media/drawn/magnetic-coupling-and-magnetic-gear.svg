e="16" font-weight="bold" fill="#222">N</text><path d="M308.2,91.6 A152,152 0 0 1 390.4,173.8 L364.6,184.5 A124,124 0 0 0 297.5,117.4 Z" fill="#cfe3f5" stroke="#222" stroke-width="2"/><text x="347.6" y="140.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#222">S</text></g>
