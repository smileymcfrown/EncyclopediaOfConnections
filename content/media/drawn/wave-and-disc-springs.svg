<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Side cut-aways on one base: a tall coil spring, a much shorter multi-turn wave spring, a stack of four cone-shaped disc springs facing each other on a rod (more travel), and four disc springs nested the same way up (more force), each with a plate on top being pushed down.</title>
