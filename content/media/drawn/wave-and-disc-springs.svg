</defs>
<g stroke="#222" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
<rect x="20" y="330" width="760" height="14" fill="url(#hatch)"/>
<use href="#cl" fill="none" stroke="#222" stroke-width="7"/><use href="#cl" fill="none" stroke="#cfe3f5" stroke-width="3"/>
<use href="#w0" fill="none" stroke-width="8"/><use href="#w0" fill="none" stroke="#d8f0d2" stroke-width="3.5"/>
