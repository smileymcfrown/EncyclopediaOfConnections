<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Three cut-away steps of fitting a heat-set insert: a knurled brass insert sits on a slightly smaller hole in a printed part with a hot soldering iron tip inside it; pushed down, it melts the plastic, which flows into its knurls; once flush and cool it holds a screw in its metal thread.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
<g id="insert" stroke="#222" stroke-width="3" stroke-linejoin="round">
<polygon points="108,0 152,0 152,8 158,16 152,24 158,32 152,40 158,48 152,56 158,64 152,72 158,80 108,80 102,80 108,72 102,64 108,56 102,48 108,40 102,32 108,24 102,16 108,8" fill="#fde2c4"/>
<rect x="118" y="0" width="24" height="80" fill="#ffffff" stroke-width="2"/>
<g stroke-width="1.5"><line x1="118" y1="14" x2="142" y2="8"/><line x1="118" y1="30" x2="142" y2="24"/><line x1="118" y1="46" x2="142" y2="40"/><line x1="118" y1="62" x2="142" y2="56"/><line x1="118" y1="78" x2="142" y2="72"/></g>
</g>
<g id="block" stroke="#222" stroke-width="3" stroke-linejoin="round">
<rect x="30" y="230" width="200" height="150" fill="#cfe3f5"/>
<rect x="110" y="230" width="40" height="120" fill="#ffffff"/>
</g>
<g id="iron" stroke="#222" stroke-width="3" stroke-linejoin="round">
<rect x="108" y="30" width="44" height="60" rx="6" fill="#e8e8e8"/>
<polygon points="122,90 138,90 138,160 130,176 122,160" fill="#f5d0d0"/>
</g>
</defs>
<g stroke-linejoin="round" stroke-linecap="round">
<line x1="267" y1="20" x2="267" y2="400" stroke="#cccccc" stroke-width="2"/>
<line x1="533" y1="20" x2="533" y2="400" stroke="#cccccc" stroke-width="2"/>
<!-- 1 -->
<g transform="translate(5,0)">
<use href="#block"/>
<use href="#insert" transform="translate(0,150)"/>
<use href="#iron" transform="translate(0,10)"/>
<line x1="185" y1="60" x2="185" y2="110" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
</g>
<!-- 2 -->
<g transform="translate(270,0)">
<use href="#block"/>
<rect x="96" y="230" width="68" height="62" fill="#fde2c4" stroke="#222" stroke-width="2"/>
<use href="#insert" transform="translate(0,212)"/>
<use href="#iron" transform="translate(0,72)"/>
<line x1="70" y1="262" x2="94" y2="262" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<line x1="190" y1="262" x2="166" y2="262" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<line x1="185" y1="120" x2="185" y2="170" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
</g>
<!-- 3 -->
<g transform="translate(537,0)">
<use href="#block"/>
<rect x="96" y="230" width="68" height="80" fill="#cfe3f5" stroke="none"/>
<use href="#insert" transform="translate(0,230)"/>
<rect x="40" y="200" width="180" height="30" fill="#d8f0d2" stroke="#222" stroke-width="3"/>
<rect x="121" y="198" width="18" height="107" fill="#e8e8e8" stroke="#222" stroke-width="3"/>
<rect x="100" y="182" width="60" height="18" rx="4" fill="#e8e8e8" stroke="#222" stroke-width="3"/>
</g>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle">
<g font-size="20" font-weight="bold">
<text x="135" y="30">1. Heat</text>
<text x="400" y="30">2. Press in</text>
<text x="667" y="30">3. Cool, then use</text>
</g>
<text x="210" y="160" text-anchor="start">brass</text>
<text x="210" y="182" text-anchor="start">insert</text>
<text x="70" y="88">hot iron</text>
<text x="135" y="410">hole a bit smaller</text>
<text x="400" y="410">melted plastic</text>
<text x="400" y="432">flows into the knurls</text>
<text x="667" y="170">screw</text>
<text x="667" y="410">plastic grips the knurls,</text>
<text x="667" y="432">screw bites metal thread</text>
</g>
</svg>
