<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Side cut-away of a pin-tumbler lock with the right key in: five stacks of spring, driver pin and key pin, each lifted so the gap between its two pins sits exactly on the shear line at the edge of the plug; an end view shows one pin stack.</title>
