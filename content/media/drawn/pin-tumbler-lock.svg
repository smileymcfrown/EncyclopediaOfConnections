<g font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222">
<text x="480" y="118">spring</text><text x="480" y="171">driver pin</text><text x="480" y="207">shear line</text><text x="480" y="246">key pin</text><text x="480" y="290">key</text>
<text x="690" y="48" text-anchor="middle" font-weight="bold">end view</text>
<g text-anchor="middle" font-size="20" font-weight="bold"><text x="400" y="380" opacity="1">Right key: every gap sits on the shear line, so the plug turns</text><text x="400" y="380" opacity="0">No key: driver pins cross the shear line, so the plug is blocked</text></g>
<text x="400" y="434" font-size="18" text-anchor="middle">A wrong key leaves at least one pin across the line: too high is as bad as too low</text>
</g>
