<g stroke="#222" stroke-width="3" stroke-linejoin="round"><polygon points="400,318 290.7,187.8 278.5,198.1 387.7,328.3" fill="#fde2c4"/><line x1="394" y1="319.1" x2="288.6" y2="193.5" stroke="#b08a60" stroke-width="1.5"/><line x1="389.9" y1="322.6" x2="284.5" y2="196.9" stroke="#b08a60" stroke-width="1.5"/><polygon points="400,318 509.3,187.8 521.5,198.1 412.3,328.3" fill="#fde2c4"/><line x1="406" y1="319.1" x2="511.4" y2="193.5" stroke="#b08a60" stroke-width="1.5"/><line x1="410.1" y1="322.6" x2="515.5" y2="196.9" stroke="#b08a60" stroke-width="1.5"/><path d="M360.2,270.5 L400,318 L439.8,270.5 A52,52 0 0 1 360.2,270.5 Z" fill="#d8f0d2"/></g>
<g stroke="#222" stroke-width="3" stroke-linejoin="round"><polygon points="667,318 557.7,187.8 545.5,198.1 654.7,328.3" fill="#fde2c4"/><line x1="661" y1="319.1" x2="555.6" y2="193.5" stroke="#b08a60" stroke-width="1.5"/><line x1="656.9" y1="322.6" x2="551.5" y2="196.9" stroke="#b08a60" stroke-width="1.5"/><polygon points="667,318 776.3,187.8 788.5,198.1 679.3,328.3" fill="#fde2c4"/><line x1="673" y1="319.1" x2="778.4" y2="193.5" stroke="#b08a60" stroke-width="1.5"/><line x1="677.1" y1="322.6" x2="782.5" y2="196.9" stroke="#b08a60" stroke-width="1.5"/><path d="M627.2,270.5 L667,318 L706.8,270.5 A52,52 0 0 1 627.2,270.5 Z" fill="#d8f0d2"/></g><path d="M598.1,229.6 L630.2,268 A48,48 0 0 0 703.8,268 L735.9,229.6" fill="none" stroke="#222" stroke-width="10" stroke-linecap="butt" stroke-linejoin="round"/><path d="M598.7,230.4 L630.2,268 A48,48 0 0 0 703.8,268 L735.3,230.4" fill="none" stroke="#cfe3f5" stroke-width="5" stroke-linecap="butt" stroke-linejoin="round"/><path d="M600.3,204.3 L644,256.4 A30,30 0 0 0 690,256.4 L733.7,204.3" fill="none" stroke="#d1495b" stroke-width="4" marker-start="url(#ah)" marker-end="url(#ah)"/>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222">
<g font-size="20" font-weight="bold" text-anchor="middle"><text x="133" y="40">1. Stitch</text><text x="400" y="40">2. Fillet</text><text x="667" y="40">3. Tape</text></g>
<g text-anchor="middle" font-size="17"><text x="133" y="384">wire twists hold the</text><text x="133" y="405">panels in shape</text><text x="400" y="384">curved ramp of thick</text><text x="400" y="405">epoxy fills the corner</text><text x="667" y="384">glass tape, wet with epoxy,</text><text x="667" y="405">bridges both panels</text></g>
<text x="14" y="300" font-size="17">plywood</text><line x1="50" y1="286" x2="76.7" y2="275.7" stroke="#222" stroke-width="1.5"/>
<text x="133" y="214" font-size="17" text-anchor="middle">wire</text><line x1="133" y1="220" x2="133" y2="248" stroke="#222" stroke-width="1.5"/>
<text x="667" y="150" text-anchor="middle" font-size="17">load flows round</text><text x="667" y="170" text-anchor="middle" font-size="17">the curve</text>
<text x="400" y="440" text-anchor="middle" font-size="17">The stitches only hold the shape · the fillet and tape make the joint</text>
</g>
</svg>
