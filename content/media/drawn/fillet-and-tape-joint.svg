<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Three cross-sections of a stitch-and-glue seam where two plywood panels meet in a V. First, a twist of wire through holes near both edges holds the panels in shape. Second, with the wire snipped off, a curved fillet of thick epoxy fills the inside corner. Third, glass tape wet with epoxy is laid over the fillet and onto both panels, so load flows round the curve from one panel to the other instead of through a sharp corner.</title>
<rect width="800" height="450" fill="#ffffff"/>
