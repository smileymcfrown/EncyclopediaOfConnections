<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Two top views of a one-piece plastic ratchet: a hub with two curved springy arms sits inside a ring of saw-shaped teeth; turned one way the catches on the ends of the arms ride up the sloped tooth backs and click into the next gap, and turned the other way the catch tips butt against the steep tooth faces so the push runs along the arms into the hub and it locks.</title>
