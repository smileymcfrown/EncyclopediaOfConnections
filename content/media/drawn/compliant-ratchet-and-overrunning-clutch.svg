<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle">
<text x="200" y="34" font-size="21" font-weight="bold">Turned this way: clicks round</text>
<text x="560" y="34" font-size="21" font-weight="bold">Turned that way: locks</text>
<text x="60" y="84" text-anchor="start">toothed ring</text>
<text x="335" y="255" text-anchor="start">springy</text><text x="335" y="276" text-anchor="start">arm</text>
