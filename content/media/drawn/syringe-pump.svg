<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Side view of a syringe pump: a stepper motor turns a lead screw, the nut in a carriage riding on a guide rod moves along it, and the carriage pushes the syringe plunger a precise distance, so a set volume of liquid (travel times barrel area) is pushed out of the tube, or drawn back in when it runs the other way.</title>
