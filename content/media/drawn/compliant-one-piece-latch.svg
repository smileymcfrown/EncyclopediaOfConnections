<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Three side views of a one-piece plastic latch on a lid edge and a box lip: closing, the sloped face of the hook rides over the lip and the thin beam bends outward; latched, the beam is straight and pulling the lid meets the square back of the hook; opening, a thumb lifts the tab so the beam bends and the hook clears the lip, with the root of the beam circled as the part to make strong.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
<path id="box" d="M70,220 H140 V256 H150 L160,266 V280 H140 V330 H70 Z" fill="#e8e8e8" stroke="#222" stroke-width="2.3"/>
</defs>
<g stroke-linejoin="round" stroke-linecap="round">
<line x1="266" y1="60" x2="266" y2="400" stroke="#cccccc" stroke-width="2"/>
<line x1="532" y1="60" x2="532" y2="400" stroke="#cccccc" stroke-width="2"/>
<!-- 1: closing -->
<g transform="translate(-75,-85.6) scale(1.3)">
<use href="#box"/>
<path d="M70,170 H176 V194 Q176,234 188.5,272.2 L237.8,264.4 L239.7,276.3 L180.5,285.6 L156,259.1 L155.7,257.2 L175.4,254 Q166,229 166,204 Q166,194 156,194 H70 Z" fill="#cfe3f5" stroke="#222" stroke-width="2.3"/>
<line x1="90" y1="112" x2="90" y2="156" stroke="#d1495b" stroke-width="3.1" marker-end="url(#ah)"/>
<line x1="194" y1="232" x2="222" y2="232" stroke="#d1495b" stroke-width="3.1" marker-end="url(#ah)"/>
</g>
<!-- 2: latched -->
<g transform="translate(191,-85.6) scale(1.3)">
<use href="#box"/>
<path d="M70,196 H176 V300 H226 V312 H166 L146,282 V280 H166 V230 Q166,220 156,220 H70 Z" fill="#cfe3f5" stroke="#222" stroke-width="2.3"/>
<line x1="90" y1="186" x2="90" y2="132" stroke="#d1495b" stroke-width="3.1" marker-end="url(#ah)"/>
<line x1="139" y1="280" x2="167" y2="280" stroke="#d1495b" stroke-width="4"/>
</g>
<!-- 3: opening -->
<g transform="translate(457,-85.6) scale(1.3)">
<use href="#box"/>
<path d="M70,196 H176 V220 Q176,262 199.2,295 L247,280.4 L250.5,291.9 L193.1,309.4 L165.2,286.6 L164.6,284.7 L183.8,278.8 Q166,256 166,230 Q166,220 156,220 H70 Z" fill="#cfe3f5" stroke="#222" stroke-width="2.3"/>
<circle cx="168" cy="224" r="20" fill="none" stroke="#222" stroke-width="2" stroke-dasharray="5 4"/>
<ellipse cx="224" cy="316" rx="20" ry="13" fill="#fde2c4" stroke="#222" stroke-width="2.3"/>
<line x1="254" y1="334" x2="254" y2="300" stroke="#d1495b" stroke-width="3.1" marker-end="url(#ah)"/>
</g>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle">
<g font-size="21" font-weight="bold">
<text x="133" y="40">1. Closing</text>
<text x="399" y="40">2. Latched</text>
<text x="665" y="40">3. Opening</text>
</g>
<g font-size="17">
<text x="133" y="376">sloped face rides over</text>
<text x="133" y="398">the lip, beam bends out</text>
<text x="399" y="376">pull meets the hook's</text>
<text x="399" y="398">square back: stays shut</text>
<text x="665" y="376">lift the tab: hook clears</text>
<text x="665" y="398">circled root: make it strong</text>
</g>
<text x="400" y="432">Hook, spring and handle are all one bendy piece of the lid</text>
</g>
</svg>
