<text x="20" y="34" font-size="20" font-weight="bold">Three-jaw chuck, front cut away</text>
<g stroke="#222" stroke-width="1.5"><line x1="505" y1="98" x2="372" y2="150"/><line x1="505" y1="190" x2="262" y2="90"/><line x1="505" y1="282" x2="262" y2="240"/><line x1="505" y1="360" x2="322" y2="279"/></g>
<text x="510" y="96">scroll plate with a spiral</text><text x="510" y="117">ridge: the key turns it</text>
<text x="510" y="188">jaws can only slide</text><text x="510" y="209">in and out of their slots</text>
<text x="510" y="280">round bar ends up</text><text x="510" y="301">in the centre</text>
<text x="510" y="358">teeth on each jaw's back</text><text x="510" y="379">sit in the spiral</text>
<text x="400" y="440" text-anchor="middle">Turn the scroll: all three jaws move in by the same amount</text>
</g></svg>
