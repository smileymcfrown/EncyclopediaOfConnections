<g font-size="20" font-weight="bold" text-anchor="middle">
<text x="132" y="40">1. Straight</text>
<text x="397" y="40">2. Rolling up</text>
<text x="662" y="40">3. Further round</text>
</g>
<text x="60" y="360">fixed block</text>
<text x="20" y="220">contact point</text>
<text x="20" y="242">= moving pivot</text>
<line x1="95" y1="250" x2="140" y2="283" stroke="#222" stroke-width="2"/>
<text x="270" y="380">blue strap: over left, under right</text>
<text x="270" y="404">green strap: under left, over right</text>
<text x="400" y="438" text-anchor="middle" font-weight="bold">The blocks roll on each other: no pin, no sliding, no play</text>
</g>
</svg>