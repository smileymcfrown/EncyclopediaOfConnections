<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Cut-away of an indexing plunger screwed into a fixed bracket: on the left its spring pushes the pin down into a hole in a sliding bar, locking it; on the right the knob is pulled up, the spring is squashed and the bar slides along to the next hole.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#e8e8e8"/><line x1="0" y1="0" x2="0" y2="10" stroke="#222" stroke-width="2"/></pattern>
<g id="fixed" stroke="#222" stroke-width="3">
<rect x="20" y="150" width="20" height="110" fill="url(#hatch)"/>
<rect x="40" y="200" width="320" height="30" fill="#d8f0d2"/>
<rect x="170" y="130" width="60" height="110" fill="#e8e8e8"/>
<rect x="180" y="140" width="40" height="88" fill="#ffffff"/>
<rect x="192" y="226" width="16" height="16" fill="#ffffff" stroke="none"/>
</g>
<g id="bar" stroke="#222" stroke-width="3">
<rect x="0" y="270" width="320" height="40" fill="#fde2c4"/>
<rect x="51" y="270" width="18" height="40" fill="#ffffff"/>
<rect x="131" y="270" width="18" height="40" fill="#ffffff"/>
<rect x="211" y="270" width="18" height="40" fill="#ffffff"/>
<rect x="291" y="270" width="18" height="40" fill="#ffffff"/>
</g>
</defs>
<g stroke-linejoin="round" stroke-linecap="round">
<line x1="400" y1="20" x2="400" y2="390" stroke="#cccccc" stroke-width="2"/>
<!-- locked -->
<use href="#fixed"/>
<use href="#bar" x="60"/>
<g stroke="#222" stroke-width="3">
<rect x="192" y="118" width="16" height="182" fill="#cfe3f5"/>
<rect x="182" y="205" width="36" height="10" fill="#cfe3f5"/>
<polyline points="184,140 216,148 184,156 216,164 184,172 216,180 184,188 216,196 184,204" fill="none"/>
<rect x="160" y="90" width="80" height="30" rx="10" fill="#f5d0d0"/>
</g>
<!-- pulled -->
<g transform="translate(400,0)">
<use href="#fixed"/>
<use href="#bar" x="20"/>
<g stroke="#222" stroke-width="3">
<rect x="192" y="78" width="16" height="187" fill="#cfe3f5"/>
<rect x="182" y="165" width="36" height="10" fill="#cfe3f5"/>
<polyline points="184,140 216,143 184,146 216,149 184,152 216,155 184,158 216,161 184,164" fill="none"/>
<rect x="160" y="50" width="80" height="30" rx="10" fill="#f5d0d0"/>
</g>
<line x1="140" y1="125" x2="140" y2="62" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<line x1="300" y1="338" x2="180" y2="338" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
</g>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222">
<g font-size="21" font-weight="bold" text-anchor="middle">
<text x="200" y="32">Locked</text>
<text x="600" y="32">Pulled: free to slide</text>
</g>
<text x="250" y="112">knob</text>
<text x="240" y="168">spring pushes pin</text>
<text x="46" y="222">fixed bracket</text>
<text x="220" y="345" text-anchor="middle">pin in hole: bar locked</text>
<text x="432" y="100">pull knob</text>
<text x="640" y="160">spring squashed</text>
<text x="600" y="370" text-anchor="middle">bar slides to the next hole</text>
<text x="400" y="425" text-anchor="middle">The pin, not the spring, takes the load: the bar would have to cut through it</text>
</g>
</svg>
