<text x="228" y="152" font-size="17">thin, even</text><text x="228" y="172" font-size="17">glue gap</text>
<line x1="226" y1="160" x2="185" y2="160" stroke="#222" stroke-width="1.5"/>
<text x="228" y="290" font-size="17">bond length:</text><text x="228" y="310" font-size="17">2-3 × the</text><text x="228" y="330" font-size="17">inside width</text>
<text x="612" y="264" text-anchor="middle" font-size="17">bond length</text>
<text x="676" y="200" font-size="17">corner lug</text><text x="676" y="220" font-size="17">(metal or</text><text x="676" y="240" font-size="17">printed)</text>
<line x1="674" y1="206" x2="550" y2="230" stroke="#222" stroke-width="1.5"/>
<text x="400" y="446" text-anchor="middle" font-size="17">Pulls and twists slide the glue (shear), its strong way · never drill or bolt through the tube</text>
</g>
</svg>
