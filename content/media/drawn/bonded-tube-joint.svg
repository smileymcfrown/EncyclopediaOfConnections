<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Two cut-aways of glued tube joints. Left: two carbon tubes meet end to end over a sleeve glued inside both, with a thin, even glue gap all round and a bond length on each side of two to three times the tube's inside width. Right: two tubes glued into the sockets of a corner lug, each socket a little bigger than the tube so glue fills the gap.</title>
