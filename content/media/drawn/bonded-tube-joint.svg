<text x="228" y="36" font-weight="bold" font-size="19">Sleeve inside</text><text x="228" y="58" font-weight="bold" font-size="19">both tubes</text>
<text x="600" y="36" text-anchor="middle" font-weight="bold" font-size="19">Corner lug over the tubes</text>
<text x="18" y="82" font-size="17">inside width</text><line x1="112" y1="76" x2="134" y2="76" stroke="#222" stroke-width="1.5"/>
<text x="18" y="182" font-size="17">carbon tube</text><line x1="114" y1="176" x2="128" y2="176" stroke="#222" stroke-width="1.5"/>
<text x="18" y="290" font-size="17">sleeve, glued</text><text x="18" y="310" font-size="17">inside both</text>
