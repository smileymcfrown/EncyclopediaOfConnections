<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>A knuckle hinge: in front view the knuckles of the frame leaf and the door leaf alternate along one pin; in end view the door leaf swings about the pin through 180 degrees.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0,12 L12,0" stroke="#222" stroke-width="2"/></pattern></defs>
<line x1="400" y1="20" x2="400" y2="400" stroke="#cccccc" stroke-width="2"/>
<g stroke="#222" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
<rect x="70" y="92" width="130" height="274" rx="5" fill="#cfe3f5"/>
<circle cx="128" cy="150" r="9" fill="#ffffff"/><circle cx="128" cy="229" r="9" fill="#ffffff"/><circle cx="128" cy="308" r="9" fill="#ffffff"/>
<g transform="translate(200 0)"><g><g transform="translate(-200 0)"><rect x="200" y="92" width="130" height="274" rx="5" fill="#fde2c4"/><ellipse cx="272" cy="150" rx="9" ry="9" fill="#ffffff"/><ellipse cx="272" cy="229" rx="9" ry="9" fill="#ffffff"/><ellipse cx="272" cy="308" rx="9" ry="9" fill="#ffffff"/></g></g></g>
<rect x="185" y="90" width="30" height="54" rx="4" fill="#cfe3f5"/><rect x="185" y="146" width="30" height="54" rx="4" fill="#fde2c4"/><rect x="185" y="202" width="30" height="54" rx="4" fill="#cfe3f5"/><rect x="185" y="258" width="30" height="54" rx="4" fill="#fde2c4"/><rect x="185" y="314" width="30" height="54" rx="4" fill="#cfe3f5"/>
<rect x="182" y="78" width="36" height="12" rx="3" fill="#e8e8e8"/><line x1="200" y1="96" x2="200" y2="372" stroke-dasharray="8 7" stroke-width="2.5"/>
<rect x="440" y="265" width="145" height="40" fill="url(#hatch)"/><rect x="440" y="265" width="145" height="40" fill="none"/>
<rect x="470" y="253" width="120" height="12" fill="#cfe3f5"/>
<g><rect x="595" y="265" width="165" height="40" rx="3" fill="#d8f0d2"/><rect x="590" y="253" width="120" height="12" fill="#fde2c4"/></g>
<circle cx="590" cy="250" r="16" fill="#e8e8e8"/><circle cx="590" cy="250" r="4" fill="#222"/>
</g>
<path d="M780.1,223.3 A192,192 0 0 0 399.9,223.3" stroke="#d1495b" stroke-width="4" fill="none" marker-start="url(#ah)" marker-end="url(#ah)"/>
<g font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222" text-anchor="middle">
<text x="200" y="40" font-size="21" font-weight="bold">Front view</text>
<text x="600" y="40" font-size="21" font-weight="bold">End view (down the pin)</text>
<text x="245" y="72" text-anchor="start">pin</text>
<text x="135" y="392">frame leaf</text>
<text x="275" y="392">door leaf</text>
<text x="512" y="328">frame</text>
<text x="678" y="328">door</text>
<text x="600" y="360">the door turns about the pin</text>
<text x="400" y="436" font-size="18">Knuckles of the two leaves take turns along one pin, so the leaves can only swing</text>
</g>
</svg>
