<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Four side-view steps of a granular jamming gripper: a soft bag of coffee grounds above a toy ball, the bag pressed down and flowing round the ball, the air pumped out so the grains pack solid and the ball is lifted, and air let back in so the bag softens and the ball drops.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0,10 L10,0" stroke="#222" stroke-width="2"/></pattern>
<pattern id="loose" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="3" fill="#a0703c"/><circle cx="12" cy="11" r="3" fill="#a0703c"/></pattern>
<pattern id="packed" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="2.6" fill="#7a5028"/><circle cx="6" cy="6" r="2.6" fill="#7a5028"/></pattern>
<g id="arm"><rect x="-12" y="96" width="24" height="34" fill="#e8e8e8" stroke="#222" stroke-width="3"/><path d="M-34,150 L-24,128 H24 L34,150 Z" fill="#e8e8e8" stroke="#222" stroke-width="3"/></g>
<path id="round" d="M-34,148 C-80,160 -82,262 0,268 C82,262 80,160 34,148 Z"/>
<path id="wrap" d="M-34,148 C-70,158 -80,280 -66,340 L-31,340 A31,31 0 0 1 31,340 L66,340 C80,280 70,158 34,148 Z"/>
</defs>
<g stroke-linejoin="round" stroke-linecap="round">
<line x1="200" y1="20" x2="200" y2="400" stroke="#cccccc" stroke-width="2"/>
<line x1="400" y1="20" x2="400" y2="400" stroke="#cccccc" stroke-width="2"/>
<line x1="600" y1="20" x2="600" y2="400" stroke="#cccccc" stroke-width="2"/>
<rect x="10" y="362" width="180" height="14" fill="url(#hatch)" stroke="none"/><line x1="10" y1="362" x2="190" y2="362" stroke="#222" stroke-width="3"/>
<rect x="210" y="362" width="180" height="14" fill="url(#hatch)" stroke="none"/><line x1="210" y1="362" x2="390" y2="362" stroke="#222" stroke-width="3"/>
<rect x="410" y="362" width="180" height="14" fill="url(#hatch)" stroke="none"/><line x1="410" y1="362" x2="590" y2="362" stroke="#222" stroke-width="3"/>
<rect x="610" y="362" width="180" height="14" fill="url(#hatch)" stroke="none"/><line x1="610" y1="362" x2="790" y2="362" stroke="#222" stroke-width="3"/>
<circle cx="100" cy="332" r="28" fill="#cfe3f5" stroke="#222" stroke-width="3"/>
<g transform="translate(100,0)"><use href="#round" fill="#fde2c4"/><use href="#round" fill="url(#loose)"/><use href="#round" fill="none" stroke="#222" stroke-width="3"/><use href="#arm"/></g>
<line x1="172" y1="252" x2="172" y2="302" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<circle cx="300" cy="332" r="28" fill="#cfe3f5" stroke="#222" stroke-width="3"/>
<g transform="translate(300,0)"><use href="#wrap" fill="#fde2c4"/><use href="#wrap" fill="url(#loose)"/><use href="#wrap" fill="none" stroke="#222" stroke-width="3"/><use href="#arm"/></g>
<circle cx="500" cy="282" r="28" fill="#cfe3f5" stroke="#222" stroke-width="3"/>
<g transform="translate(500,-50)"><use href="#wrap" fill="#fde2c4"/><use href="#wrap" fill="url(#packed)"/><use href="#wrap" fill="none" stroke="#222" stroke-width="3"/><use href="#arm"/></g>
<line x1="476" y1="112" x2="476" y2="60" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<line x1="418" y1="220" x2="440" y2="220" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<line x1="582" y1="220" x2="560" y2="220" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<line x1="430" y1="150" x2="448" y2="165" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<line x1="570" y1="150" x2="552" y2="165" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<circle cx="700" cy="320" r="28" fill="#cfe3f5" stroke="#222" stroke-width="3"/>
<g transform="translate(700,-40)"><use href="#round" fill="#fde2c4"/><use href="#round" fill="url(#loose)"/><use href="#round" fill="none" stroke="#222" stroke-width="3"/><use href="#arm"/></g>
<line x1="752" y1="56" x2="752" y2="108" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<line x1="760" y1="292" x2="760" y2="342" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle">
<g font-size="20" font-weight="bold">
<text x="100" y="36">1. Soft bag</text>
<text x="300" y="36">2. Press on</text>
<text x="500" y="36">3. Pump air out</text>
<text x="700" y="36">4. Let air in</text>
</g>
<text x="84" y="300">coffee grounds</text>
<text x="300" y="398">flows round the toy</text>
<text x="500" y="398">grains lock solid</text>
<text x="428" y="74">air out</text>
<text x="700" y="398">softens, toy drops</text>
<text x="650" y="80">air in</text>
<text x="400" y="434">Runny like sand when air is in · rigid when the air is sucked out</text>
</g>
</svg>
