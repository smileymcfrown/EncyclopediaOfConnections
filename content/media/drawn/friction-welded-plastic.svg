<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Two ways to friction-weld plastic: on the left a rotary tool spins a short piece of filament against the seam between two printed plates and leaves a melted bead behind as it moves along; on the right a drill press spins one round part pressed down on another held still, melting a thin layer where they touch.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#222" stroke-width="2"/></pattern>
</defs>
<g stroke-linejoin="round" stroke-linecap="round" stroke="#222" stroke-width="3">
<line x1="420" y1="20" x2="420" y2="400" stroke="#cccccc" stroke-width="2"/>
<!-- left: rotary tool -->
<rect x="30" y="300" width="350" height="40" fill="#cfe3f5"/>
<rect x="60" y="288" width="182" height="14" rx="7" fill="#fde2c4"/>
<g transform="rotate(20 250 300)">
<rect x="245" y="200" width="10" height="100" fill="#d8f0d2"/>
<rect x="236" y="178" width="28" height="24" fill="#e8e8e8"/>
<rect x="224" y="50" width="52" height="130" rx="14" fill="#e8e8e8"/>
<path d="M232,240 A18,8 0 0 0 268,240" fill="none" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
</g>
<line x1="180" y1="372" x2="310" y2="372" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<!-- right: spin welding -->
<rect x="500" y="380" width="200" height="16" fill="url(#hatch)" stroke-width="2"/>
<rect x="550" y="270" width="100" height="110" fill="#cfe3f5"/>
<ellipse cx="548" cy="266" rx="9" ry="6" fill="#fde2c4" stroke-width="2"/>
<ellipse cx="652" cy="266" rx="9" ry="6" fill="#fde2c4" stroke-width="2"/>
<rect x="550" y="262" width="100" height="8" fill="#fde2c4" stroke-width="2"/>
<rect x="550" y="160" width="100" height="102" fill="#d8f0d2"/>
<rect x="575" y="112" width="50" height="48" fill="#e8e8e8"/>
<rect x="590" y="60" width="20" height="52" fill="#e8e8e8"/>
<path d="M545,198 A55,14 0 0 0 655,198" fill="none" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<line x1="690" y1="90" x2="690" y2="150" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle">
<text x="210" y="36" font-size="21" font-weight="bold">Rotary tool + filament</text>
<text x="610" y="36" font-size="21" font-weight="bold">Spin welding</text>
<text x="368" y="150" text-anchor="start">rotary</text>
<text x="368" y="172" text-anchor="start">tool</text>
<text x="300" y="250" text-anchor="start">spinning filament</text>
<text x="150" y="278">melted bead</text>
<text x="205" y="327">two printed plates</text>
<text x="245" y="400">move along the seam</text>
<text x="706" y="126" text-anchor="start">press</text>
<text x="670" y="215" text-anchor="start">spun part</text>
<text x="670" y="335" text-anchor="start">held still</text>
<text x="532" y="273" text-anchor="end">melt layer</text>
<text x="400" y="438">Stop spinning, keep pressing until it cools</text>
</g>
</svg>
