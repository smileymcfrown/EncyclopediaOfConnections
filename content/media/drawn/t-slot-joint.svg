<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Two flat panels joined at a right angle with a T-slot: on the left the parts are apart, showing the T-shaped cut-out in the edge of the lower panel, the nut that drops into the crossbar of the T and the screw through the upper panel; on the right the screw runs down the stem of the T into the trapped nut and pulls the panels tight together.</title>
