<rect x="40.0" y="240" width="180" height="30" fill="#cfe3f5"/>
<line x1="100" y1="270" x2="220.0" y2="270" stroke="#666" stroke-width="3"/><ellipse cx="231.0" cy="270" rx="11" ry="5" fill="none" stroke="#666" stroke-width="3"/>
<rect x="90" y="210" width="50" height="30" fill="#d8f0d2"/>
<rect x="308.0" y="240" width="180" height="60" rx="7" fill="#cfe3f5"/>
<line x1="312.0" y1="270" x2="484.0" y2="270" stroke="#7fa6c8" stroke-width="2" stroke-dasharray="5 6"/>
<line x1="368" y1="270" x2="488.0" y2="270" stroke="#666" stroke-width="3"/><ellipse cx="499.0" cy="270" rx="11" ry="5" fill="none" stroke="#666" stroke-width="3"/>
<rect x="357" y="212" width="52" height="30" rx="8" fill="#d8f0d2"/>
<rect x="308.0" y="240" width="180" height="60" rx="7" fill="none"/>
<rect x="558.0" y="240" width="204" height="60" rx="18" fill="#cfe3f5"/>
<path d="M598,240 Q645,262 692,240 Z" fill="#d8f0d2" stroke-width="2.5"/>
<line x1="630" y1="270" x2="762.0" y2="270" stroke="#666" stroke-width="3"/><ellipse cx="773.0" cy="270" rx="11" ry="5" fill="none" stroke="#666" stroke-width="3"/>
</g>
<g stroke="#555" stroke-width="2"><line x1="540.0" y1="240" x2="540.0" y2="300"/><line x1="533.0" y1="240" x2="547.0" y2="240"/><line x1="533.0" y1="300" x2="547.0" y2="300"/></g>
<g stroke="#d1495b" stroke-width="4" fill="none" marker-end="url(#ah)"><line x1="242" y1="114" x2="282" y2="114"/><line x1="510" y1="114" x2="550" y2="114"/></g>
<g stroke="#222" stroke-width="1.5"><line x1="70" y1="196" x2="70" y2="240"/><line x1="230" y1="196" x2="230" y2="264"/></g>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle">
<text x="130" y="120" font-size="20" font-weight="bold">Before firing</text>
<text x="398" y="120" font-size="20" font-weight="bold">Tack fuse</text>
<text x="660" y="120" font-size="20" font-weight="bold">Full fuse (hotter)</text>
<text x="70" y="188">glass layers</text>
<text x="200" y="188">wire loop</text>
<text x="130" y="360">kiln shelf</text>
<text x="398" y="360">pieces stuck together,</text>
<text x="398" y="382">each keeps its shape</text>
<text x="660" y="360">flows into one smooth</text>
<text x="660" y="382">piece about 6 mm thick</text>
</g></g>
<text x="400" y="420" font-size="17" font-family="Arial, Helvetica, sans-serif" fill="#222" text-anchor="middle">Then it is cooled slowly (annealed) so no stress is locked in · fuse only glass sold as compatible</text>
</svg>
