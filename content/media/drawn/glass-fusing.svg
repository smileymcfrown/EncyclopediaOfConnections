<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Side views of the same stack of glass on a kiln shelf: two clear glass layers with a wire loop between them and a small green piece on top; after a tack fuse the pieces are stuck together but each keeps its shape; after a hotter full fuse they have flowed into one smooth, rounded slab about 6 mm thick with the green piece flush in its surface and the wire loop trapped inside.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#e8e8e8"/><line x1="0" y1="0" x2="0" y2="10" stroke="#222" stroke-width="2"/></pattern>
</defs>
<g transform="translate(0 -28)">
<g stroke="#222" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
<rect x="10" y="300" width="240" height="26" fill="#e8e8e8"/>
<rect x="278" y="300" width="240" height="26" fill="#e8e8e8"/>
<rect x="540" y="300" width="240" height="26" fill="#e8e8e8"/>
