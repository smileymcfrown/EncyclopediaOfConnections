<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle">
<text x="175" y="40" font-size="20" font-weight="bold">Vane type</text><text x="580" y="40" font-size="20" font-weight="bold">Rack-and-pinion type</text>
<text x="175" y="66">air swings the paddle 270°</text>
<text x="580" y="66">air pushes the pistons apart,</text><text x="580" y="88">the gear turns a quarter turn</text>
<text x="300" y="395" text-anchor="start">fixed stop</text>
<g stroke="#222" stroke-width="1.5"><line x1="295" y1="389" x2="182" y2="335"/><line x1="430" y1="355" x2="410" y2="292"/><line x1="610" y1="352" x2="590" y2="272"/></g>
