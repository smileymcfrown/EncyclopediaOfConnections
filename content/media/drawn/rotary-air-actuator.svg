<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Two rotary air actuators cut open: a vane type, where air on one side of a paddle on the shaft swings it about 270 degrees round a chamber up to a fixed stop, and a rack-and-pinion type, where air pushes two pistons apart so their toothed racks turn a central gear a quarter turn against return springs.</title>
