<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Two views of a series elastic actuator: a motor and gearbox drive a spring, and the spring drives the joint, with an angle sensor on each side of the spring so the force can be worked out from how far the spring is bent; below, a knock on the joint squashes the spring so the gear teeth feel only a gentle push.</title>
