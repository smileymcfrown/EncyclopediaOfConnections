<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222">
<text x="125" y="114" font-size="18" text-anchor="middle">motor +</text>
<text x="125" y="138" font-size="18" text-anchor="middle">gearbox</text>
