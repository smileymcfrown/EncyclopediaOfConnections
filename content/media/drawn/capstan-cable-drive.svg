<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>A small drum beside a large drum segment, joined by one cable clamped at both ends of the large drum and wrapped several times round the small drum, so eight fast turns of the small drum give one slow sweep of the large drum; insets show the wraps from the side and a graph of grip rising steeply with each extra wrap.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
</defs>
<g stroke-linejoin="round" stroke-linecap="round">
<line x1="490" y1="40" x2="490" y2="410" stroke="#cccccc" stroke-width="2"/>
<line x1="505" y1="225" x2="785" y2="225" stroke="#cccccc" stroke-width="2"/>
<!-- end view: big drum segment and small drum -->
<path d="M330,235 L300.5,67.6 A170,170 0 0 0 300.5,402.4 Z" fill="#cfe3f5" stroke="#222" stroke-width="3"/>
<circle cx="330" cy="235" r="9" fill="#ffffff" stroke="#222" stroke-width="3"/>
<circle cx="330" cy="235" r="2" fill="#222"/>
<circle cx="120" cy="235" r="21" fill="#fde2c4" stroke="#222" stroke-width="3"/>
<circle cx="120" cy="235" r="2" fill="#222"/>
<path d="M288.9,70.1 A170,170 0 0 0 209.4,115.2 L105.1,220.2 A21,21 0 0 0 105.1,249.8 L209.4,354.8 A170,170 0 0 0 288.9,399.9" fill="none" stroke="#222" stroke-width="4"/>
<circle cx="288.9" cy="70.1" r="6" fill="#e8e8e8" stroke="#222" stroke-width="2"/>
<circle cx="288.9" cy="399.9" r="6" fill="#e8e8e8" stroke="#222" stroke-width="2"/>
<path d="M102,266.2 A36,36 0 0 1 102,203.8" fill="none" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<path d="M221.2,285.7 A120,120 0 0 1 221.2,184.3" fill="none" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<!-- inset: small drum from the side -->
<rect x="530" y="120" width="30" height="20" fill="#e8e8e8" stroke="#222" stroke-width="3"/>
<rect x="710" y="120" width="30" height="20" fill="#e8e8e8" stroke="#222" stroke-width="3"/>
<rect x="560" y="100" width="150" height="60" fill="#fde2c4" stroke="#222" stroke-width="3"/>
<g fill="none" stroke="#222" stroke-width="4">
<path d="M585,64 V100 L605,160"/>
<path d="M625,100 L645,160"/>
<path d="M665,100 L685,160 V196"/>
</g>
<!-- inset: grip graph -->
<path d="M550,262 V390 H760" fill="none" stroke="#222" stroke-width="2"/>
<polyline points="550,382.5 582.5,378 615,370.7 647.5,359 680,340.5 712.5,311 728.8,290 745,263" fill="none" stroke="#222" stroke-width="3"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222">
<text x="80" y="150" text-anchor="middle">small drum:</text>
<text x="80" y="172" text-anchor="middle">8 fast turns</text>
<text x="348" y="228">big drum:</text>
<text x="348" y="250">1 slow sweep</text>
<text x="302" y="62">both ends clamped</text>
<text x="160" y="140" text-anchor="middle">cable</text>
<text x="645" y="52" text-anchor="middle" font-weight="bold">small drum from the side</text>
<text x="615" y="192" text-anchor="middle">3 to 5 wraps</text>
<text x="645" y="252" text-anchor="middle" font-weight="bold">grip grows with each wrap</text>
<text x="540" y="330" text-anchor="middle" transform="rotate(-90 540 330)">grip</text>
<g font-size="16" text-anchor="middle">
<text x="550" y="410">0</text><text x="615" y="410">1</text><text x="680" y="410">2</text><text x="745" y="410">3 wraps</text>
</g>
<text x="400" y="438" text-anchor="middle">Cable never slips, so there is no backlash, but the big drum turns only part of a turn</text>
</g>
</svg>
