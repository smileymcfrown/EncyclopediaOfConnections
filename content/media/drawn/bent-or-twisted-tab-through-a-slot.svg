<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Edge view and top view of a metal tab pushed through a slot, then either folded flat or twisted a quarter turn so it is too wide to pull back out.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#d1495b"/></marker>
</defs>
<g stroke="#ccc" stroke-width="2"><line x1="270" y1="80" x2="270" y2="395"/><line x1="530" y1="80" x2="530" y2="395"/></g>
<g stroke="#222" stroke-width="3" stroke-linejoin="round">
<!-- panel 1 side -->
<rect x="134" y="120" width="12" height="150" fill="#cfe3f5"/>
<rect x="30" y="170" width="102" height="14" fill="#e8e8e8"/>
<rect x="148" y="170" width="102" height="14" fill="#e8e8e8"/>
<!-- panel 2 side -->
<rect x="394" y="120" width="12" height="50" fill="none" stroke="#999" stroke-width="2" stroke-dasharray="5 4"/>
<path d="M394,270 L394,166 Q394,158 402,158 L460,158 L460,170 L406,170 L406,270 Z" fill="#cfe3f5"/>
<rect x="290" y="170" width="102" height="14" fill="#e8e8e8"/>
<rect x="408" y="170" width="102" height="14" fill="#e8e8e8"/>
<!-- panel 3 side -->
<path d="M654,270 L654,170 L635,150 L635,110 L685,110 L685,150 L666,170 L666,270 Z" fill="#cfe3f5"/>
<path d="M654,170 Q662,158 685,150 M666,170 Q658,160 635,150" fill="none" stroke-width="2"/>
<rect x="550" y="170" width="102" height="14" fill="#e8e8e8"/>
<rect x="668" y="170" width="102" height="14" fill="#e8e8e8"/>
<!-- top views -->
<rect x="60" y="305" width="160" height="85" fill="#e8e8e8"/>
<rect x="110" y="330" width="60" height="10" fill="#ffffff"/>
<rect x="112" y="332" width="56" height="6" fill="#cfe3f5" stroke-width="2"/>
<rect x="320" y="305" width="160" height="85" fill="#e8e8e8"/>
<rect x="370" y="330" width="60" height="10" fill="#ffffff"/>
<rect x="372" y="334" width="56" height="50" fill="#cfe3f5"/>
<rect x="580" y="305" width="160" height="85" fill="#e8e8e8"/>
<rect x="630" y="330" width="60" height="10" fill="#ffffff"/>
<rect x="657" y="310" width="6" height="50" fill="#cfe3f5" stroke-width="2"/>
</g>
<g stroke="#d1495b" stroke-width="4" fill="none" stroke-linecap="round">
<line x1="180" y1="262" x2="180" y2="205" marker-end="url(#ah)"/>
<path d="M388,128 Q398,96 452,140" marker-end="url(#ah)"/>
<path d="M618,126 A 42 13 0 0 0 702,126" marker-end="url(#ah)"/>
</g>
<line x1="80" y1="155" x2="130" y2="172" stroke="#222" stroke-width="2"/>
<g font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#222">
<text x="140" y="60" text-anchor="middle">1 Push tab through</text>
<text x="400" y="60" text-anchor="middle">2 Fold it flat</text>
<text x="660" y="60" text-anchor="middle">3 …or twist ¼ turn</text>
<text x="156" y="140">tab</text>
<text x="36" y="152">slot</text>
<text x="400" y="420" text-anchor="middle" font-size="18">Bottom row: the same joint seen from above</text>
<text x="400" y="443" text-anchor="middle" font-size="18">Bent or twisted, the tab is too wide to pull back through the slot</text>
</g>
</svg>
