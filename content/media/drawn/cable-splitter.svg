<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle">
<text x="50" y="66">pull</text>
<text x="390" y="176">junction box (cut open)</text>
<text x="390" y="322">one slider holds all</text><text x="390" y="343">three wire ends</text>
<text x="612" y="226">both pulled the</text><text x="612" y="247">same distance</text>
<text x="770" y="92">brake</text><text x="770" y="382">brake</text>
<text x="400" y="414" font-size="17">Springs at the brakes pull everything back · it copies distance, not force,</text>
<text x="400" y="436" font-size="17">so set each cable's slack with its adjuster to make both brakes bite together</text>
</g>
