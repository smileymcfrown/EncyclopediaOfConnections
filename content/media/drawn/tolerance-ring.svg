<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Three end-on cut-away views of a shaft in a hole with a wavy spring-steel ring between them: first the ring sits in the hole with its waves tall, then the shaft is pushed in and every wave squashes and pushes outwards on the hole and inwards on the shaft, and finally too much twist makes the shaft slip round inside the ring while the housing stays still.</title>
