<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Side cut-through of a ladder lock buckle: the strap goes up round the centre bar and back out under the gripping bar, where the pull of the load pinches the strap against its own tail.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0,12 L12,0" stroke="#222" stroke-width="2"/></pattern></defs>
<g transform="translate(150 200) scale(1.5) translate(-230 -200)">
<g fill="none" stroke-linejoin="round" stroke-linecap="round"><path d="M-100,184 L230,184 A16.5,16.5 0 0 1 230,217 L140,217" stroke="#222" stroke-width="9.5"/><path d="M-100,184 L230,184 A16.5,16.5 0 0 1 230,217 L140,217" stroke="#d8f0d2" stroke-width="5.5"/><path d="M152,180 L152,221 M162,180 L162,221 M172,180 L172,221 M182,180 L182,221" stroke="#222" stroke-width="1.5" stroke-dasharray="3 2"/></g>
<g stroke="#222" stroke-linejoin="round"><path d="M218,190 L424,190 L503,160 Q514,156 518,165 L520,170 Q522,177 514,180 L432,210 L218,210 Q208,210 208,200 Q208,190 218,190 Z" fill="#f2f2f2" stroke-width="2"/><circle cx="230" cy="200" r="12" fill="#e8e8e8" stroke-width="2"/><circle cx="330" cy="200" r="12" fill="#e8e8e8" stroke-width="2"/><circle cx="420" cy="200" r="12" fill="#e8e8e8" stroke-width="2"/></g>
<g fill="none" stroke-linejoin="round"><path d="M820,230 L420,226 L318,226 L312,219 L312,195 L316,186 L330,182.5 L344,186 L348,195 L350,206 L357,214 L375,217 L440,217 L820,208" stroke="#222" stroke-width="9.5"></path><path d="M820,230 L420,226 L318,226 L312,219 L312,195 L316,186 L330,182.5 L344,186 L348,195 L350,206 L357,214 L375,217 L440,217 L820,208" stroke="#cfe3f5" stroke-width="5.5"></path><path d="M820,230 L420,226 L318,226 L312,219 L312,195 L316,186 L330,182.5 L344,186 L348,195 L350,206 L357,214 L375,217 L440,217 L820,208" stroke="#4d6f94" stroke-width="1.5" stroke-dasharray="6 10" stroke-dashoffset="0"></path></g>
</g>
<g stroke="#d1495b" stroke-width="4" fill="none" marker-end="url(#ah)"><line x1="600" y1="292" x2="690" y2="292"/><g opacity="1"><line x1="435" y1="300" x2="435" y2="256"/><line x1="410" y1="118" x2="410" y2="170"/></g><g opacity="0"><line x1="592" y1="150" x2="592" y2="62"/></g></g>
<g font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222" text-anchor="middle">
<text x="20" y="112" text-anchor="start">fixed strap, sewn round the back bar</text>
<text x="630" y="122" text-anchor="start">tab</text>
<text x="748" y="160">free tail</text>
<text x="700" y="298" text-anchor="start">to the load</text>
<text x="435" y="324">gripping bar pinches here</text>
<text x="400" y="375" font-size="21" font-weight="bold" opacity="1">Load pulls: the strap pinches its own tail and holds</text>
<text x="400" y="375" font-size="21" font-weight="bold" opacity="0">Tab lifted: the pinch opens and the strap slides out</text>
<text x="400" y="436" font-size="18">Side cut-through · pull the free tail to tighten · a tri-glide has the same path but no tab and no pinch</text>
</g>
</svg>
