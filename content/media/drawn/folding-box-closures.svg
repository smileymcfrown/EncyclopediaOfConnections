<text x="20" y="72">tuck flap slides down</text><text x="20" y="92">inside the front</text><line x1="60" y1="98" x2="104" y2="138" stroke="#222" stroke-width="1.5"/>
<g font-size="17"><text x="504" y="172">held only by</text><text x="504" y="191">a tight fit</text><text x="654" y="172">slits catch the</text><text x="654" y="191">dust flaps</text><line x1="664" y1="156" x2="662" y2="112" stroke="#222" stroke-width="1.5"/></g>
<text x="477" y="326" font-size="17">glue</text><text x="477" y="345" font-size="17">flap</text>
<text x="400" y="438" text-anchor="middle">For heavier things, a snap-lock or crash-lock bottom replaces the bottom tuck</text>
