<g font-size="19" font-weight="bold"><text x="240" y="40" text-anchor="middle">Closing a tuck end</text><text x="635" y="40" text-anchor="middle">Friction tuck or slit lock</text><text x="635" y="232" text-anchor="middle">One flat blank, glued once</text></g>
<text x="345" y="236">dust flaps</text><text x="345" y="256">fold in first</text><line x1="341" y1="236" x2="296" y2="218" stroke="#222" stroke-width="1.5"/>
<text x="155" y="330" text-anchor="middle">card</text>
