<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Folding box closures. Left: the top of a card tuck-end box being closed: the two small dust flaps are folded in first, then the closure panel swings over from the back and its rounded tuck flap slides down inside the front wall. Top right: two tuck flaps compared, a plain friction tuck held only by a tight fit and a slit lock with small cuts at each end of its fold that catch the edges of the dust flaps. Bottom right: the whole box as one flat die-cut blank, front, back and two sides in a row with a glue flap at one end and the flaps at top and bottom, glued once down the side seam.</title>
