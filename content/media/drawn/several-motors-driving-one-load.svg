<text x="490" y="162">motor</text>
<text x="310" y="34" font-size="20" font-weight="bold">Two motors, one big gear</text>
<text x="310" y="404">both pinions push it the same way round</text>
<text x="590" y="120" text-anchor="start">12-tooth pinion</text><text x="590" y="142" text-anchor="start">on each motor</text>
