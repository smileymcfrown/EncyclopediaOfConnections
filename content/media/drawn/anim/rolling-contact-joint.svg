<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Three side views of a rolling-contact joint: two blocks with rounded ends touching at one point, tied by two crossed straps (blue over the left block and under the right, green the other way); as the right block swings up it rolls over the left block without sliding, and the contact point, which acts as the pivot, moves along the curved faces. Animated: views 2 and 3 roll back to straight and up again, the contact point moving along the curved faces.</title>
<rect width="800" height="450" fill="#ffffff"/>
