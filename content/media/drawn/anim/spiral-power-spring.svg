<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>A spiral power spring in its round case, animated: the centre shaft is turned three turns, wrapping the steel strip tighter around it while the click drops into each ratchet tooth and the turning force on the graph rises; then the click is lifted and the spring unwinds the shaft back again.</title>
