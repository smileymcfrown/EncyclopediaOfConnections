<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222">
<text x="200" y="40" font-size="20" text-anchor="middle" font-weight="bold">Locked</text>
<text x="600" y="40" font-size="20" text-anchor="middle" font-weight="bold">Open</text>
<text x="175" y="298" font-size="18" text-anchor="middle">servo</text>
<text x="240" y="192" font-size="18" text-anchor="end">bolt</text>
<text x="268" y="92" font-size="18" text-anchor="end">lid pulled up</text>
<text x="200" y="385" font-size="18" text-anchor="middle">the pull presses across the bolt:</text>
