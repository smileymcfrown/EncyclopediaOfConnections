<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Two cut-away side views of a box with a servo latch: when locked, the servo arm has pushed a bolt through an eyelet under the lid and into the box wall, so pulling the lid presses across the bolt and needs no power; when open, the servo arm has swung back and pulled the bolt clear so the lid lifts. Animated: the open view loops through the servo turning back, the bolt sliding clear, the lid lifting and closing again, and the bolt pushed back in.</title>
