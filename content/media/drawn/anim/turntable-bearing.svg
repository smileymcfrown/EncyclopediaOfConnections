<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>A turntable bearing: on the left a cross-section of a top ring bolted to a platform and a bottom ring bolted to a base, with balls in facing grooves between them, an off-centre weight pressing the balls on one side and trying to lift the other; on the right the bearing seen from above, with the top ring drawn see-through over the ring of balls. Animated: seen from above the top ring turns round once while the balls between the rings roll round at half its speed.</title>
<rect width="800" height="450" fill="#ffffff"/>
