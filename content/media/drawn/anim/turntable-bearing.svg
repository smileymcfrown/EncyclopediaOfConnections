<path d="M520.5,129.7 A156,156 0 0 1 759.5,129.7" fill="none" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" fill="#222" font-size="18">
<g font-size="20" font-weight="bold" text-anchor="middle"><text x="190" y="36">Cross-section</text><text x="640" y="36">Seen from above</text></g>
<text x="366" y="174">top ring</text><text x="366" y="210">balls</text><text x="366" y="242">bottom ring</text>
<text x="310" y="82">off-centre weight</text>
<text x="275" y="334" text-anchor="middle">pressed</text><text x="105" y="334" text-anchor="middle">lifted</text>
<text x="190" y="370" text-anchor="middle">bolts hold it against tipping</text>
<text x="640" y="392" text-anchor="middle">top ring turns;</text><text x="640" y="412" text-anchor="middle">balls roll round at half speed</text>
<text x="400" y="438" text-anchor="middle">A ring of balls between two grooved rings carries weight and lets the top turn</text>
</g>
</svg>
