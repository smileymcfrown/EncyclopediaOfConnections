<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Side cut-through of a ladder lock buckle: the strap goes up round the centre bar and back out under the gripping bar, where the pull of the load pinches it against its own tail; the animation then lifts the tab, the buckle tilts, the pinch opens and the strap slides out, before the tab drops and the strap locks again.</title>
