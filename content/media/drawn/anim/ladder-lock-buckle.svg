<g font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222" text-anchor="middle">
<text x="20" y="112" text-anchor="start">fixed strap, sewn round the back bar</text>
<text x="630" y="122" text-anchor="start">tab</text>
<text x="748" y="160">free tail</text>
<text x="700" y="298" text-anchor="start">to the load</text>
<text x="435" y="324">gripping bar pinches here</text>
<text x="400" y="375" font-size="21" font-weight="bold" opacity="1"><animate attributeName="opacity" dur="6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.2333;0.3;0.7333;0.8;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" values="1;1;0;0;1;1"/>Load pulls: the strap pinches its own tail and holds</text>
<text x="400" y="375" font-size="21" font-weight="bold" opacity="0"><animate attributeName="opacity" dur="6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.2667;0.35;0.65;0.7167;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" values="0;0;1;1;0;0"/>Tab lifted: the pinch opens and the strap slides out</text>
<text x="400" y="436" font-size="18">Side cut-through · pull the free tail to tighten · a tri-glide has the same path but no tab and no pinch</text>
</g>
</svg>
