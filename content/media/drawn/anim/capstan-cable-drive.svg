<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>A small drum beside a large drum segment, joined by one cable clamped at both ends of the large drum and wrapped several times round the small drum, so eight fast turns of the small drum give one slow sweep of the large drum; insets show the wraps from the side and a graph of grip rising steeply with each extra wrap. In the animation the small drum turns back and forth through more than half a turn while the big drum sweeps only a few degrees, the cable winding on to one end of the big drum and off the other.</title>
