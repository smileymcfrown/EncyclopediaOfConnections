<text x="100" y="372">coil spring</text><text x="100" y="394">tall</text>
<text x="300" y="372">wave spring</text><text x="300" y="394">much shorter</text>
<text x="500" y="372">disc springs facing</text><text x="500" y="394">more travel</text>
<text x="700" y="372">disc springs nested</text><text x="700" y="394">more force</text>
<text x="400" y="434">Squashing flattens the waves or the cones, so a short spring gives a strong push</text>
