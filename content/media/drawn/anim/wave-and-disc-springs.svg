<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Side cut-aways on one base, animated: plates press down on a tall coil spring, a short multi-turn wave spring whose waves flatten, a stack of four disc springs facing each other whose cones flatten for more travel, and four nested disc springs that move only a little under a bigger push; then all spring back.</title>
