<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>A clam cleat in side and end view: the rope lies in a narrow V-shaped groove whose walls carry ridges sloping toward the load, so the load drags the rope down into the V where it jams; pulling the tail up and back lifts it out; the rope is lifted out, laid back in, and pulled down into the groove again by the load.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
<marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#e8e8e8"/><line x1="0" y1="0" x2="0" y2="10" stroke="#222" stroke-width="2"/></pattern>
<clipPath id="wall"><rect x="90" y="200" width="340" height="100"/></clipPath>
</defs>
<g stroke-linejoin="round" stroke-linecap="round">
<rect x="60" y="300" width="400" height="24" rx="6" fill="#e8e8e8" stroke="#222" stroke-width="3"/>
<path d="M90,300 L90,215 Q90,200 105,200 L415,200 Q430,200 430,215 L430,300 Z" fill="#e8e8e8" stroke="#222" stroke-width="3"/>
<g clip-path="url(#wall)"><line x1="110" y1="200" x2="10" y2="300" stroke="#999" stroke-width="4"/><line x1="136" y1="200" x2="36" y2="300" stroke="#999" stroke-width="4"/><line x1="162" y1="200" x2="62" y2="300" stroke="#999" stroke-width="4"/><line x1="188" y1="200" x2="88" y2="300" stroke="#999" stroke-width="4"/><line x1="214" y1="200" x2="114" y2="300" stroke="#999" stroke-width="4"/><line x1="240" y1="200" x2="140" y2="300" stroke="#999" stroke-width="4"/><line x1="266" y1="200" x2="166" y2="300" stroke="#999" stroke-width="4"/><line x1="292" y1="200" x2="192" y2="300" stroke="#999" stroke-width="4"/><line x1="318" y1="200" x2="218" y2="300" stroke="#999" stroke-width="4"/><line x1="344" y1="200" x2="244" y2="300" stroke="#999" stroke-width="4"/><line x1="370" y1="200" x2="270" y2="300" stroke="#999" stroke-width="4"/><line x1="396" y1="200" x2="296" y2="300" stroke="#999" stroke-width="4"/><line x1="422" y1="200" x2="322" y2="300" stroke="#999" stroke-width="4"/><line x1="448" y1="200" x2="348" y2="300" stroke="#999" stroke-width="4"/><line x1="474" y1="200" x2="374" y2="300" stroke="#999" stroke-width="4"/><line x1="500" y1="200" x2="400" y2="300" stroke="#999" stroke-width="4"/><line x1="526" y1="200" x2="426" y2="300" stroke="#999" stroke-width="4"/><line x1="552" y1="200" x2="452" y2="300" stroke="#999" stroke-width="4"/></g>
<line x1="90" y1="276" x2="430" y2="276" stroke="#222" stroke-width="2" stroke-dasharray="6 6"/>
<circle cx="75" cy="312" r="5" fill="#fff" stroke="#222" stroke-width="2"/><circle cx="445" cy="312" r="5" fill="#fff" stroke="#222" stroke-width="2"/>
<path d="M10,252 L90,262 L430,262 L790,268" fill="none" stroke="#222" stroke-width="22"><animate attributeName="d" dur="6s" repeatCount="indefinite" keyTimes="0;0.25;0.45;0.55;0.7;0.85;1" values="M10,252 L90,262 L430,262 L790,268;M10,252 L90,262 L430,262 L790,268;M10,252 L90,244 L430,182 L700,80;M10,252 L90,244 L430,182 L700,80;M10,252 L90,214 L430,214 L790,232;M10,252 L90,262 L430,262 L790,268;M10,252 L90,262 L430,262 L790,268"/></path>
<path d="M10,252 L90,262 L430,262 L790,268" fill="none" stroke="#cfe3f5" stroke-width="16"><animate attributeName="d" dur="6s" repeatCount="indefinite" keyTimes="0;0.25;0.45;0.55;0.7;0.85;1" values="M10,252 L90,262 L430,262 L790,268;M10,252 L90,262 L430,262 L790,268;M10,252 L90,244 L430,182 L700,80;M10,252 L90,244 L430,182 L700,80;M10,252 L90,214 L430,214 L790,232;M10,252 L90,262 L430,262 L790,268;M10,252 L90,262 L430,262 L790,268"/></path>
<line x1="80" y1="232" x2="20" y2="232" stroke="#d1495b" stroke-width="5" marker-end="url(#ah)"><animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;0.25;0.45;0.55;0.7;0.85;1" values="1;1;.2;.2;.2;1;1"/></line>
<path d="M760,250 Q760,150 680,100" fill="none" stroke="#d1495b" stroke-width="5" marker-end="url(#ah)"><animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;0.25;0.45;0.55;0.7;0.85;1" values=".2;.2;1;.2;.2;.2;.2"/></path>
<path d="M590,330 L590,190 L650,190 L654,196.5 L653.1,203 L657.1,209.5 L656.2,216 L660.2,222.5 L659.4,229 L663.4,235.5 L662.5,242 L666.5,248.5 L665.6,255 L669.6,261.5 L668.7,268 L672.7,274.5 L671.8,281 L675.8,287.5 L675,294 L679,300.5 L675,300 L685,300 L681,300.5 L685,294 L684.2,287.5 L688.2,281 L687.3,274.5 L691.3,268 L690.4,261.5 L694.4,255 L693.5,248.5 L697.5,242 L696.6,235.5 L700.6,229 L699.8,222.5 L703.8,216 L702.9,209.5 L706.9,203 L706,196.5 L710,190 L770,190 L770,330 Z" fill="#e8e8e8" stroke="#222" stroke-width="3"/>
<ellipse cx="680" cy="268" rx="13" ry="19" fill="#cfe3f5" stroke="#222" stroke-width="3"><animate attributeName="cy" dur="6s" repeatCount="indefinite" keyTimes="0;0.25;0.45;0.55;0.7;0.85;1" values="268;268;150;150;206;268;268"/><animate attributeName="rx" dur="6s" repeatCount="indefinite" keyTimes="0;0.25;0.45;0.55;0.7;0.85;1" values="13;13;16;16;16;13;13"/><animate attributeName="ry" dur="6s" repeatCount="indefinite" keyTimes="0;0.25;0.45;0.55;0.7;0.85;1" values="19;19;16;16;16;19;19"/></ellipse>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#222">
<g font-weight="bold" text-anchor="middle"><text x="260" y="40">Side view (near wall cut away)</text><text x="680" y="40">End view</text></g>
<text x="20" y="210">load pulls</text>
<text x="260" y="356" text-anchor="middle">ridges slope toward the load</text>
<text x="250" y="110" text-anchor="middle">pull the tail up and back:</text><text x="250" y="134" text-anchor="middle">the rope rides up and out</text>
<text x="680" y="356" text-anchor="middle">the V narrows:</text><text x="680" y="380" text-anchor="middle">rope wedged deeper</text>
<text x="400" y="434" text-anchor="middle" font-size="18">The harder the load pulls, the deeper the rope is dragged into the V and the firmer the grip</text>
</g>
</svg>
