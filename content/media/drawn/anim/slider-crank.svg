<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>A slider-crank drawn in three positions: a turning crank, a connecting rod and a slider held in a straight guide; at top dead centre and bottom dead centre the crank and rod are in line, at 90 degrees the rod leans and presses the slider sideways against its guide, and the slider travels twice the crank length. In the animation the middle drawing starts at 90 degrees, pauses, then turns the crank round so the rod swings and the slider runs back and forth in its guide.</title>
