</g>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle">
<g font-size="21" font-weight="bold">
<text x="133" y="40">1. Closing</text>
<text x="399" y="40">2. Latched</text>
<text x="665" y="40">3. Opening</text>
</g>
<g font-size="17">
<text x="133" y="376">sloped face rides over</text>
<text x="133" y="398">the lip, beam bends out</text>
<text x="399" y="376">pull meets the hook's</text>
<text x="399" y="398">square back: stays shut</text>
<text x="665" y="376">lift the tab: hook clears</text>
<text x="665" y="398">circled root: make it strong</text>
</g>
<text x="400" y="432">Hook, spring and handle are all one bendy piece of the lid</text>
</g>
</svg>
