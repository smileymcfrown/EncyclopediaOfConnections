<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Animated: three side views of a one-piece plastic latch on a lid edge and a box lip: closing, the lid comes down, the sloped face of the hook rides over the lip and the thin beam bends outward, then springs straight with a click; latched, pulling the lid meets the square back of the hook; opening, a thumb lifts the tab so the beam bends and the hook clears the lip, with the root of the beam circled as the part to make strong.</title>
