<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222">
<text x="200" y="40" font-size="20" text-anchor="middle" font-weight="bold">1. Loosen, then jack it along</text>
<text x="600" y="40" font-size="20" text-anchor="middle" font-weight="bold">2. Tight: lock the screws</text>
<text x="180" y="62" font-size="18" text-anchor="middle">driven pulley</text>
<text x="306" y="150" font-size="18">jacking</text>
<text x="306" y="172" font-size="18">screw in</text>
<text x="306" y="194" font-size="18">fixed lug</text>
<text x="90" y="200" font-size="18">slack belt</text>
<text x="200" y="424" font-size="18" text-anchor="middle">plate slides along its slots</text>
<text x="470" y="200" font-size="18">belt tight</text>
<text x="600" y="424" font-size="18" text-anchor="middle">clamping screws tightened</text>
