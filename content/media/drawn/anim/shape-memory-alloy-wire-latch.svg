<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Two side views of a shape-memory wire latch: on the left a spring holds a hooked catch in a notch on the lid and the thin nickel-titanium wire is cold with the switch open; on the right the switch is closed, the current warms the wire so it shortens by about 4 percent, pulling the catch out of the notch so the lid pops up. Animated: the right-hand view loops: the switch closes, the wire warms and pulls the catch clear, the lid pops up, is pushed shut again, the switch opens and the spring pushes the catch back into the notch as the wire cools.</title>
