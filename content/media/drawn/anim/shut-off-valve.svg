<g font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222">
<text x="50" y="176">water in</text>
<text x="750" y="316" text-anchor="end">water out</text>
<text x="385" y="86" text-anchor="end">lever (handle)</text>
<text x="610" y="70">a quarter turn</text>
<text x="610" y="92">shuts it</text>
<text x="400" y="356" text-anchor="middle">ball with a hole through it (bore)</text>
<text x="90" y="318">soft seats</text>
<g font-size="22" font-weight="bold"><text x="50" y="60">OPEN<animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.2;0.28;0.77;0.85;1" dur="5s" repeatCount="indefinite"/></text><text x="50" y="60" opacity="0">SHUT: flow stopped<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.28;0.36;0.7;0.77;1" dur="5s" repeatCount="indefinite"/></text></g>
<text x="400" y="420" text-anchor="middle">Lever along the pipe = open · lever across the pipe = shut</text>
</g>
</svg>
