<rect x="322" y="268" width="12" height="18" fill="#d8f0d2" stroke="#222" stroke-width="2.5"/>
<rect x="466" y="194" width="12" height="18" fill="#d8f0d2" stroke="#222" stroke-width="2.5"/>
<rect x="466" y="268" width="12" height="18" fill="#d8f0d2" stroke="#222" stroke-width="2.5"/>
<g><animateTransform attributeName="transform" type="rotate" values="0 400 240;0 400 240;-90 400 240;-90 400 240;0 400 240;0 400 240" keyTimes="0;0.15;0.4;0.6;0.85;1" calcMode="spline" keySplines="0 0 1 1;0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1;0 0 1 1" dur="5s" repeatCount="indefinite"/>
<circle cx="400" cy="240" r="70" fill="#fde2c4" stroke="#222" stroke-width="3"/>
<path d="M336.8,210 H463.2 A70,70 0 0 1 463.2,270 H336.8 A70,70 0 0 1 336.8,210 Z" fill="#cfe3f5" stroke="#222" stroke-width="2.5"/>
</g>
<g><animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.18;0.3;0.75;0.86;1" dur="5s" repeatCount="indefinite"/>
<path d="M60,224 H740" fill="none" stroke="#d1495b" stroke-width="4" stroke-dasharray="26 14" marker-end="url(#ah)"><animate attributeName="stroke-dashoffset" values="40;0" dur="0.8s" repeatCount="indefinite"/></path>
<path d="M60,256 H740" fill="none" stroke="#d1495b" stroke-width="4" stroke-dasharray="26 14" marker-end="url(#ah)"><animate attributeName="stroke-dashoffset" values="40;0" dur="0.8s" repeatCount="indefinite"/></path>
