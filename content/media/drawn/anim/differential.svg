<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Top-down schematic of an open differential: the engine turns a ring gear on a cage that carries spider gears on a cross pin, meshing with side gears on the left and right axles; going round a bend the cage turns at 10 rpm while the inner wheel turns at 8 and the outer at 12, with equal push arrows on both wheels. Animated: the tread lines show wheel speed; on a bend the spider gears turn on their pin so one wheel turns slower and one faster; with one wheel on ice it spins at 20 while the other stops; going straight both turn at 10 and the spider gears stay still. The cage always turns at 10, the average.</title>
