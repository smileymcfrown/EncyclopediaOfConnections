<g opacity="1"><animate attributeName="opacity" values="1;0" keyTimes="0;0.33" calcMode="discrete" dur="6s" repeatCount="indefinite"/><text x="400" y="38" font-size="21" font-weight="bold">Going round a bend: inner wheel 8, outer 12</text><text x="69" y="104">8 rpm</text><text x="731" y="104">12 rpm</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.33;0.67" calcMode="discrete" dur="6s" repeatCount="indefinite"/><text x="400" y="38" font-size="21" font-weight="bold">One wheel on ice: it spins at 20, the other stops</text><text x="69" y="104">0 rpm</text><text x="731" y="104">20 rpm</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;0.67" calcMode="discrete" dur="6s" repeatCount="indefinite"/><text x="400" y="38" font-size="21" font-weight="bold">Straight ahead: both wheels 10</text><text x="69" y="104">10 rpm</text><text x="731" y="104">10 rpm</text></g><text x="69" y="80" font-size="17">left wheel</text><text x="731" y="80" font-size="17">right wheel</text><text x="390" y="115" font-size="17">spider gears</text><text x="390" y="330" font-size="17">cage: always 10 rpm</text><g text-anchor="start" font-size="17"><text x="510" y="128">ring gear</text><text x="532" y="390">from engine</text></g><text x="290" y="370" font-size="17">same push on both wheels</text><text x="400" y="420" font-size="19">The cage speed is always the average of the two wheels,</text><text x="400" y="443" font-size="19">and both wheels always get the same push</text>
</g>
