<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222">
<text x="478" y="116">driver: outer magnets,</text><text x="478" y="138">turned by the motor</text>
<text x="478" y="196">thin sealed wall between</text><text x="478" y="218">(nothing touches)</text>
<text x="478" y="276">follower: inner magnets,</text><text x="478" y="298">drives the pump or load</text>
<text x="400" y="420" text-anchor="middle" font-weight="bold" font-size="20" opacity="1">In step: the follower trails a few degrees<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.38;0.41;1" dur="6s" repeatCount="indefinite"/></text>
<text x="400" y="420" text-anchor="middle" font-weight="bold" font-size="20" opacity="0">Too much load: poles slip past, it stutters<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4;0.43;0.82;0.85;1" dur="6s" repeatCount="indefinite"/></text>
<text x="400" y="420" text-anchor="middle" font-weight="bold" font-size="20" opacity="0">Stop and restart to lock in step again<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.83;0.86;0.97;1" dur="6s" repeatCount="indefinite"/></text>
<text x="400" y="444" text-anchor="middle" font-size="16">A magnetic gear adds a ring of steel pole pieces between rotors with different pole counts</text>
</g>
