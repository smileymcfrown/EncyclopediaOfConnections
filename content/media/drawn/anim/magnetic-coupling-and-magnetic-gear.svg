<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Animated: magnetic coupling seen end-on: an outer ring of magnets turned by a motor and an inner ring of magnets that drives the load, with a thin sealed wall between them; opposite poles (N and S) attract, so the inner ring follows the outer one without touching it; under too much load the poles slip past each other and the follower stutters, until the driver stops and it locks in step again.</title>
