<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Animated cut-away of a ball-and-socket joint: a ball on a neck sits in a slotted cup whose lip wraps past the ball's widest point, so the neck can tilt in any direction until it meets the rim and spin about itself, but cannot pull out; screwing the locking ring down squeezes the fingers onto the ball to lock it. The animation tilts the neck left and right to the rim, then screws the ring down.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#e8e8e8"/><line x1="0" y1="0" x2="0" y2="10" stroke="#222" stroke-width="2"/></pattern>
</defs>
<g stroke="#222" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
<rect x="130" y="392" width="240" height="22" fill="url(#hatch)"/>
<rect x="225" y="330" width="50" height="62" fill="#e8e8e8"/>
<line x1="250" y1="250" x2="109.5" y2="87.2" stroke="#999" stroke-width="2" stroke-dasharray="7 6"/>
<line x1="250" y1="250" x2="390.5" y2="87.2" stroke="#999" stroke-width="2" stroke-dasharray="7 6"/>
<g><animateTransform attributeName="transform" type="rotate" values="0 250 250;0 250 250;-38 250 250;-38 250 250;38 250 250;38 250 250;0 250 250;0 250 250" dur="6s" repeatCount="indefinite" keyTimes="0;0.08;0.24;0.3;0.5;0.56;0.68;1" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
<rect x="235" y="72" width="30" height="178" fill="#e8e8e8"/>
<rect x="185" y="52" width="130" height="22" rx="4" fill="#d8f0d2"/>
<circle cx="250" cy="250" r="60" fill="#cfe3f5"/>
<path d="M208,280 L292,220" stroke="#7fa7c9" stroke-width="2" fill="none"/><circle cx="250" cy="250" r="4" fill="#222"/>
</g>
<path d="M200,215 A61,61 0 1 0 300,215 L320.4,200.7 A86,86 0 1 1 179.6,200.7 Z" fill="#e8e8e8"><animate attributeName="d" values="M200,215 A61,61 0 1 0 300,215 L320.4,200.7 A86,86 0 1 1 179.6,200.7 Z;M200,215 A61,61 0 1 0 300,215 L320.4,200.7 A86,86 0 1 1 179.6,200.7 Z;M203,215 A61,61 0 1 0 297,215 L317.4,200.7 A86,86 0 1 1 182.6,200.7 Z;M203,215 A61,61 0 1 0 297,215 L317.4,200.7 A86,86 0 1 1 182.6,200.7 Z;M200,215 A61,61 0 1 0 300,215 L320.4,200.7 A86,86 0 1 1 179.6,200.7 Z" dur="6s" repeatCount="indefinite" keyTimes="0;0.7;0.78;0.92;1" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/></path>
<line x1="188.4" y1="263.1" x2="167.8" y2="267.5" stroke-width="2"/>
<line x1="311.6" y1="263.1" x2="332.2" y2="267.5" stroke-width="2"/>
<g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 13;0 13;0 0" dur="6s" repeatCount="indefinite" keyTimes="0;0.7;0.78;0.92;1" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/><rect x="146" y="194" width="22" height="30" fill="#fde2c4"/><line x1="168" y1="201" x2="162" y2="205" stroke-width="1.5"/><line x1="168" y1="209" x2="162" y2="213" stroke-width="1.5"/><line x1="168" y1="217" x2="162" y2="221" stroke-width="1.5"/><rect x="332" y="194" width="22" height="30" fill="#fde2c4"/><line x1="332" y1="201" x2="338" y2="205" stroke-width="1.5"/><line x1="332" y1="209" x2="338" y2="213" stroke-width="1.5"/><line x1="332" y1="217" x2="338" y2="221" stroke-width="1.5"/></g>
<path d="M162.5,98.4 A175,175 0 0 1 337.5,98.4" fill="none" stroke="#d1495b" stroke-width="4" marker-start="url(#ah)" marker-end="url(#ah)"/>
