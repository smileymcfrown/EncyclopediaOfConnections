<circle cx="640" cy="300" r="15" fill="#e8e8e8"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222">
<text x="290" y="34" text-anchor="middle">tilts any way until the neck meets the rim</text>
<text x="300" y="120">spins too</text>
<text x="12" y="250">ball</text><line x1="55" y1="244" x2="188" y2="244" stroke="#222" stroke-width="1.5"/>
<text x="12" y="350">cup (socket)</text><line x1="120" y1="344" x2="186" y2="300" stroke="#222" stroke-width="1.5"/>
<text x="395" y="195">locking ring:</text><text x="395" y="217">screw down to lock</text>
<text x="395" y="262">lip wraps past the</text><text x="395" y="284">ball, so it can't pull out</text>
<line x1="392" y1="256" x2="304" y2="222" stroke="#222" stroke-width="1.5"/>
<text x="640" y="392" text-anchor="middle">cup from above: slots let</text><text x="640" y="414" text-anchor="middle">the fingers squeeze in</text>
<text x="400" y="440" text-anchor="middle" font-size="17">Free to tilt and spin, never to slide · tighten the ring to grip the ball</text>
</g>
</svg>
