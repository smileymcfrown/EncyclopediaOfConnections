<g><circle cx="420" cy="304" r="7.5" fill="#f5d0d0" stroke-width="2.5"/><line x1="420" y1="298" x2="420" y2="310" stroke-width="2"/><animateTransform attributeName="transform" type="rotate" values="0 420 304;360 420 304" dur="0.75s" repeatCount="indefinite"/></g>
<g><circle cx="420" cy="332" r="7.5" fill="#f5d0d0" stroke-width="2.5"/><line x1="420" y1="326" x2="420" y2="338" stroke-width="2"/><animateTransform attributeName="transform" type="rotate" values="0 420 332;360 420 332" dur="0.75s" repeatCount="indefinite"/></g>
<ellipse cx="250" cy="318" rx="26" ry="18" fill="none" stroke-width="5"></ellipse><ellipse cx="500" cy="318" rx="26" ry="18" fill="none" stroke-width="5"><animate attributeName="ry" values="18;16.6;12.7;6.9;2;6.9;12.7;16.6;18" dur="0.75s" repeatCount="indefinite"/></ellipse>
<path d="M540,292 A11,26 0 0 1 540,344" fill="none" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<line x1="90" y1="334" x2="44" y2="334" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<line x1="650" y1="334" x2="700" y2="334" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222">
<text x="40" y="52" font-size="21" font-weight="bold">Barrel swivel</text>
<text x="40" y="242" font-size="21" font-weight="bold">Ball-bearing swivel</text>
<g text-anchor="middle">
<text x="360" y="96">heads trapped inside</text>
<text x="360" y="194">pull presses each head on the end</text>
<text x="67" y="182">pull</text><text x="67" y="360">pull</text>
<text x="600" y="104">twist unwinds here</text>
<text x="708" y="194">spinning lure</text>
<text x="420" y="378">balls roll, so it keeps</text><text x="420" y="398">turning under heavy pull</text>
<text x="675" y="360">heavy pull</text>
</g>
<text x="400" y="438" text-anchor="middle">The two eyes turn on their own, so twist never builds up in the line</text>
</g>
</svg>
