<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Cut-aways of two in-line swivels, shown turning: a spinning lure twists its line, and the eye on that side spins freely on its trapped head while the eye on the rod side stays still; in the ball-bearing swivel the balls under the head roll as the eye turns.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#222" stroke-width="2"/></pattern>
</defs>
<g stroke="#222" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
<line x1="40" y1="140" x2="224" y2="140"/>
<rect x="296" y="112" width="128" height="56" rx="16" fill="#e8e8e8"/>
<rect x="308" y="123" width="104" height="34" fill="#ffffff"/>
<rect x="274" y="135" width="40" height="10" fill="#fde2c4"/><rect x="308" y="126" width="10" height="28" fill="#fde2c4"/>
<rect x="406" y="135" width="40" height="10" fill="#cfe3f5"/><rect x="402" y="126" width="10" height="28" fill="#cfe3f5"/>
<line x1="403" x2="411" y1="128" y2="128" stroke="#222" stroke-width="2"><animate attributeName="y1" values="128;131.5;140;148.5;152;152" dur="1.5s" repeatCount="indefinite" keyTimes="0;0.125;0.25;0.375;0.5;1"/><animate attributeName="y2" values="128;131.5;140;148.5;152;152" dur="1.5s" repeatCount="indefinite" keyTimes="0;0.125;0.25;0.375;0.5;1"/><animate attributeName="opacity" values="1;0" keyTimes="0;0.5" calcMode="discrete" dur="1.5s" repeatCount="indefinite"/></line><line x1="403" x2="411" y1="128" y2="128" stroke="#222" stroke-width="2" opacity="0"><animate attributeName="y1" values="128;131.5;140;148.5;152;152" dur="1.5s" repeatCount="indefinite" keyTimes="0;0.125;0.25;0.375;0.5;1" begin="-0.8s"/><animate attributeName="y2" values="128;131.5;140;148.5;152;152" dur="1.5s" repeatCount="indefinite" keyTimes="0;0.125;0.25;0.375;0.5;1" begin="-0.8s"/><animate attributeName="opacity" values="1;0" keyTimes="0;0.5" calcMode="discrete" dur="1.5s" begin="-0.8s" repeatCount="indefinite"/></line>
<ellipse cx="250" cy="140" rx="26" ry="18" fill="none" stroke-width="5"></ellipse><ellipse cx="472" cy="140" rx="26" ry="18" fill="none" stroke-width="5"><animate attributeName="ry" values="18;16.6;12.7;6.9;2;6.9;12.7;16.6;18" dur="0.75s" repeatCount="indefinite"/></ellipse>
<line x1="498" y1="140" x2="660" y2="140" stroke-width="5"/>
<line x1="498" y1="140" x2="660" y2="140" stroke="#ffffff" stroke-width="2" stroke-linecap="butt" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" values="0;12" dur="0.4s" repeatCount="indefinite"/></line>
<circle cx="668" cy="140" r="8" fill="none" stroke-width="3"/>
<ellipse cx="708" cy="140" rx="32" ry="15" fill="#d8f0d2"><animate attributeName="ry" values="15;13.9;10.6;5.7;2;5.7;10.6;13.9;15" dur="0.75s" repeatCount="indefinite"/></ellipse>
<path d="M752,114 A11,26 0 0 1 752,166" fill="none" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<path d="M512,114 A11,26 0 0 1 512,166" fill="none" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<line x1="90" y1="156" x2="44" y2="156" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<line x1="40" y1="318" x2="224" y2="318"/>
<line x1="526" y1="318" x2="700" y2="318"/>
<rect x="290" y="286" width="150" height="64" rx="16" fill="#e8e8e8"/>
<rect x="302" y="296" width="126" height="44" fill="#ffffff"/>
<rect x="274" y="313" width="40" height="10" fill="#fde2c4"/><rect x="302" y="301" width="10" height="34" fill="#fde2c4"/>
<rect x="402" y="313" width="72" height="10" fill="#cfe3f5"/><rect x="402" y="298" width="10" height="40" fill="#cfe3f5"/>
