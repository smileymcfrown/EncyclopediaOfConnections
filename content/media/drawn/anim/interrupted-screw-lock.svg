<text x="400" y="438" text-anchor="middle" font-weight="bold" opacity="1">Lined up with the gaps: slides straight in<animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.28;0.31;0.8;0.83;1" dur="6s" repeatCount="indefinite"/></text>
