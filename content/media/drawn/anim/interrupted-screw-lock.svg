<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Animated: interrupted-screw lock, seen end-on and cut open from the side: the plug and the socket each have thread only on alternate sectors, so with the plug threads lined up with the smooth gaps it pushes straight in, and a quarter turn brings the threads into mesh, pulling the plug in against a gasket; the animation pushes it in, turns it a quarter turn to lock, then turns it back and pulls it out.</title>
