<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Two identical oval (elliptical) gears meshing, each turning on a pivot near one end of the oval: the left gear turns steadily, and because the reach from each pivot to the touching point keeps changing, the right gear speeds up and slows down once every turn. The animation turns the input at a steady speed: the contact point slides along the line between the pivots and the output whips round fast, then crawls.</title>
