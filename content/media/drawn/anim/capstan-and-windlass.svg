<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>A windlass: on the left, front view of a rope drum on an axle between two posts, turned by a crank, winding up a rope that lifts a load; on the right, end view showing the long crank and small drum that multiply the pull, and a ratchet wheel with a pawl that stops the drum running back. Animated: the crank winds the load up while the pawl clicks over each ratchet tooth, the load is held when the crank is let go, then the pawl is lifted and the load let back down.</title>
