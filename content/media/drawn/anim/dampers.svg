<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Two dampers: a box lid on a hinge with a rotary damper at the pivot, and a cut-open linear damper whose piston has a tiny hole for oil to squeeze through and a one-way check valve, with a spring to push it back out; the lid sinks slowly shut while the piston is pushed in slowly, oil squeezing through the tiny hole, then the lid is lifted and the piston springs back out fast as the valve opens.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
