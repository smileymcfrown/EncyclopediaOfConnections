<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222">
<text x="200" y="40" font-size="21" font-weight="bold" text-anchor="middle">V-groove (bevelled) fold</text>
<text x="600" y="40" font-size="21" font-weight="bold" text-anchor="middle">Square-groove (overlap) fold</text>
<text x="40" y="258">foam board</text>
<text x="30" y="190">sloping cut faces</text><text x="30" y="212">meet: glue them</text>
<line x1="122" y1="221" x2="188" y2="287" stroke="#222" stroke-width="1.5"/>
<text x="40" y="372">bottom paper left uncut</text><text x="40" y="394">wraps the outside corner</text>
<line x1="222" y1="358" x2="228" y2="338" stroke="#222" stroke-width="1.5"/>
<text x="440" y="372">cut out a strip</text><text x="440" y="394">one board thick</text>
<text x="636" y="372">paper wraps the</text><text x="636" y="394">end of the base</text>
<line x1="632" y1="362" x2="617" y2="318" stroke="#222" stroke-width="1.5"/>
<text x="415" y="190">side stands on</text><text x="415" y="212">base end: glue</text>
<line x1="505" y1="221" x2="572" y2="270" stroke="#222" stroke-width="1.5"/>
<text x="400" y="436" text-anchor="middle" font-size="17">Never cut the last layer of paper: it bends round the corner, and left unglued it stays a hinge</text>
</g>
