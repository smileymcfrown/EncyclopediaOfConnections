<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Cross-sections of foam board (a foam core between two paper skins) folded into a corner. On the left a V-shaped groove is cut from the back down to the bottom paper, so when the board is folded up the two sloping cut faces meet and are glued, and the uncut paper wraps the outside corner. On the right a square strip one board thick is cut out, and the folded side stands on the end of the base with the paper wrapped round it. The animation folds both boards up from flat to a right angle, holds, and lays them flat again.</title>
