<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Cut-away side view of a turnbuckle: a body with a right-hand thread at its left end and a left-hand thread at its right end, two eye bolts screwed in with lock nuts, and slack cables to two fixed anchors. Turning the body draws both eye bolts in at once, by one thread pitch each per turn, pulling the cables tight without twisting them. Animated: a bar through the body turns it three times, both eye bolts move in together and the sagging cables straighten; then it is turned back and they let out again.</title>
