<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Top view of a side-release buckle, with the female half drawn see-through, animated: both heads are squeezed in through the side windows and the male half slides out, then it is pushed back in, the sloped heads bend the springy arms inward at the mouth, and they click out into the windows again.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#222" stroke-width="2"/></pattern>
</defs>
<g stroke="#222" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
<rect x="400" y="156" width="240" height="138" fill="#cfe3f5" fill-opacity="0.4" stroke="none"/>
<g stroke="#8aa9c4" stroke-width="2" stroke-dasharray="7 6"><line x1="404" y1="207" x2="628" y2="207"/><line x1="404" y1="243" x2="628" y2="243"/></g>
<rect x="660" y="197" width="160" height="56" fill="#e8e8e8"/>
<g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 0;0 0;-120 0;-140 0;-170 0;-170 0;-140 0;-120 0;-2 0;0 0;0 0" keyTimes="0;0.14;0.24;0.28;0.4;0.43;0.48;0.58;0.62;0.65;0.85;0.86;1" dur="6s" repeatCount="indefinite"/>
<rect x="-280" y="197" width="590" height="56" fill="#e8e8e8"/>
<rect x="380" y="212" width="222" height="26" rx="4" fill="#fde2c4"/>
<g><path d="M376,158 H502 V130 H520 L542,162 V170 H376 Z" fill="#fde2c4"/><animateTransform attributeName="transform" type="rotate" values="0 380 164;0 380 164;13 380 164;13 380 164;13 380 164;0 380 164;0 380 164;0 380 164;0 380 164;13 380 164;13 380 164;0 380 164;0 380 164" keyTimes="0;0.14;0.24;0.28;0.4;0.43;0.48;0.58;0.62;0.65;0.85;0.86;1" dur="6s" repeatCount="indefinite"/></g>
<g><path d="M376,292 H502 V320 H520 L542,288 V280 H376 Z" fill="#fde2c4"/><animateTransform attributeName="transform" type="rotate" values="0 380 286;0 380 286;-13 380 286;-13 380 286;-13 380 286;0 380 286;0 380 286;0 380 286;0 380 286;-13 380 286;-13 380 286;0 380 286;0 380 286" keyTimes="0;0.14;0.24;0.28;0.4;0.43;0.48;0.58;0.62;0.65;0.85;0.86;1" dur="6s" repeatCount="indefinite"/></g>
<rect x="300" y="140" width="80" height="170" rx="10" fill="#fde2c4"/>
<rect x="318" y="182" width="16" height="86" rx="4" fill="#ffffff"/>
</g>
<g fill="#cfe3f5"><rect x="400" y="140" width="98" height="16"/><rect x="546" y="140" width="96" height="16"/><rect x="400" y="294" width="98" height="16"/><rect x="546" y="294" width="96" height="16"/><rect x="628" y="140" width="38" height="170" rx="6"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.08;0.12;0.33;0.37;1" dur="6s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 28;0 28;0 0;0 0" keyTimes="0;0.14;0.24;0.28;0.33;1" dur="6s" repeatCount="indefinite"/><rect x="500" y="80" width="44" height="48" rx="16" fill="#f5d0d0"/></g></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.08;0.12;0.33;0.37;1" dur="6s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 -28;0 -28;0 0;0 0" keyTimes="0;0.14;0.24;0.28;0.33;1" dur="6s" repeatCount="indefinite"/><rect x="500" y="322" width="44" height="48" rx="16" fill="#f5d0d0"/></g></g>
</g>
<g fill="none" stroke="#d1495b" stroke-width="5" marker-end="url(#ah)">
<g><animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.08;0.12;0.88;0.92;1" dur="6s" repeatCount="indefinite"/><line x1="522" y1="72" x2="522" y2="118"/><line x1="522" y1="378" x2="522" y2="332"/></g>
<g><animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.1;0.13;0.88;0.92;1" dur="6s" repeatCount="indefinite"/><line x1="170" y1="225" x2="70" y2="225"/><line x1="690" y1="225" x2="785" y2="225"/></g>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle">
<text x="400" y="30" font-size="21" font-weight="bold">Top view, female half drawn see-through</text>
<text x="205" y="112">male half</text>
<text x="722" y="180">female half</text>
<text x="300" y="352">springy arm</text>
<text x="735" y="285">pull is held</text>
<g text-anchor="start"><text x="560" y="126">head clicks into window</text><text x="560" y="358">squeeze both to let go</text></g>
<text x="400" y="438">Push in: the sloped heads bend the arms in, then they spring out into the windows</text>
</g>
</svg>
