<g font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222">
<g font-weight="bold" font-size="20"><text x="140" y="48" text-anchor="middle">Compression</text><text x="400" y="48" text-anchor="middle">Extension</text><text x="665" y="48" text-anchor="middle">Torsion (end view)</text></g>
<text x="150" y="104" font-size="18">guide rod</text>
<text x="140" y="418" text-anchor="middle" font-size="18">never let the coils touch</text>
<text x="400" y="418" text-anchor="middle" font-size="18">the hooks are the weak point</text>
<text x="600" y="90" text-anchor="end" font-size="18">tighter</text>
<text x="790" y="168" text-anchor="end" font-size="18">looser</text>
<text x="665" y="418" text-anchor="middle" font-size="18">turn it the way that winds it up</text>
<text x="400" y="444" text-anchor="middle" font-size="17">Squash, stretch or twist it: the force grows with how far you move it</text>
</g></svg>
