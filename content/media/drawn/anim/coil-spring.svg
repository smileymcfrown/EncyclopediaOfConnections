<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Three coil springs: a compression spring on a guide rod squashed shorter between two plates, an extension spring hung from a hook and pulled longer, and a torsion spring seen end-on on a rod, whose arm is turned the way that winds the coils tighter; each is loaded and let go in turn, the coils closing up, opening out and the torsion coil shrinking slightly as it winds up.</title>
