<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle">
<text x="200" y="40" font-size="21" font-weight="bold">Bolted straight on</text><text x="600" y="40" font-size="21" font-weight="bold">On rubber mounts</text><text x="200" y="80" font-size="17">motor with an off-centre weight</text><text x="600" y="80" font-size="17">same motor, shaking as hard</text><text x="85" y="285" font-size="17">thin panel</text><text x="200" y="378" font-size="17">shaking spreads into the panel</text><text x="710" y="262" font-size="17">rubber flexes</text><text x="600" y="378" font-size="17">panel stays nearly still</text><text x="400" y="430" font-size="19">The rubber is a soft spring: fast shaking stays in the motor instead of the panel</text>
</g>
