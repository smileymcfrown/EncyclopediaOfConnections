<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Two end views of a motor with an off-centre weight on a thin panel: bolted straight on, the panel shakes and passes the vibration on; on two rubber mounts, the rubber flexes and the panel stays nearly still. Animated: the weight spins and both motors shake; on the left the panel bends with the motor and ripples spread out, on the right the rubber mounts squash and stretch while the panel stays put.</title>
