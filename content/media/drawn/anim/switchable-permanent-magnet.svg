<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Animated end-on cut-away of a switchable magnet base on a steel plate: a round magnet sits in a hole between two iron halves joined by a brass strip. Turned so its poles face the brass (OFF), its field just loops round inside the iron; a quarter turn puts one pole against each iron half (ON), so the field runs down through the steel plate and pulls it on hard.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#222" stroke-width="2"/></pattern>
<marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
</defs>
<g transform="translate(320,190) scale(1)" stroke-linejoin="round" stroke-linecap="round">
<rect x="-200" y="80" width="400" height="36" fill="#cfe3f5" stroke="#222" stroke-width="3"/>
<path d="M-150,-90 H-7 V80 H-150 Z" fill="#e8e8e8" stroke="#222" stroke-width="3"/><path d="M7,-90 H150 V80 H7 Z" fill="#e8e8e8" stroke="#222" stroke-width="3"/>
<rect x="-7" y="-90" width="14" height="170" fill="#fdf3c4" stroke="#222" stroke-width="3"/>
<circle r="55" fill="#ffffff" stroke="#222" stroke-width="3"/>
<g fill="none" stroke="#2f6fb0" stroke-width="3"><animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.22;0.3;0.8;0.88;1" dur="6s" repeatCount="indefinite"/><path d="M-8,-56 C-95,-78 -95,78 -8,56"/><path d="M8,-56 C95,-78 95,78 8,56"/><path d="M-4,-56 C-55,-64 -55,64 -4,56"/><path d="M4,-56 C55,-64 55,64 4,56"/></g>
<g opacity="0" fill="none" stroke="#2f6fb0" stroke-width="3"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.27;0.35;0.75;0.83;1" dur="6s" repeatCount="indefinite"/><path d="M-56,8 C-100,10 -100,96 -50,96 H50 C100,96 100,10 56,8"/><path d="M-56,-14 C-140,-14 -140,104 -60,104 H60 C140,104 140,-14 56,-14"/></g>
<g><animateTransform attributeName="transform" type="rotate" values="0;0;-90;-90;0;0" keyTimes="0;0.2;0.35;0.75;0.9;1" calcMode="spline" keySplines="0 0 1 1;0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1;0 0 1 1" dur="6s" repeatCount="indefinite"/><path d="M-50,0 A50,50 0 0 1 50,0 Z" fill="#f5d0d0" stroke="#222" stroke-width="3"/><path d="M-50,0 A50,50 0 0 0 50,0 Z" fill="#d8f0d2" stroke="#222" stroke-width="3"/><path d="M0,30 V-26" stroke="#222" stroke-width="4" marker-end="url(#ak)"/><g font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#222" stroke="none" text-anchor="middle"><text x="-26" y="-14">N</text><text x="-26" y="30">S</text></g></g>
<path d="M-49.5,-49.5 A70,70 0 0 0 -70,0" fill="none" stroke="#d1495b" stroke-width="4" marker-start="url(#ah)" marker-end="url(#ah)" transform="rotate(-8)"/>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.36;0.75;0.8;1" dur="6s" repeatCount="indefinite"/><path d="M-110,160 V124" stroke="#d1495b" stroke-width="5" marker-end="url(#ah)"/><path d="M110,160 V124" stroke="#d1495b" stroke-width="5" marker-end="url(#ah)"/></g>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222">
<text x="320" y="88" text-anchor="middle">brass strip (not magnetic)</text>
<text x="186" y="128">iron</text><text x="454" y="128" text-anchor="end">iron</text>
<text x="540" y="300">steel plate</text>
<text x="540" y="200">magnet: a knob</text>
<text x="540" y="222">turns it a</text>
<text x="540" y="244">quarter turn</text>
<path d="M536,206 L378,206" stroke="#222" stroke-width="1.5"/>
<g font-weight="bold" font-size="21"><text x="320" y="40" text-anchor="middle">OFF: the field loops round inside the iron<animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.22;0.28;0.82;0.88;1" dur="6s" repeatCount="indefinite"/></text><text x="320" y="40" text-anchor="middle" opacity="0">ON: the field runs through the plate and grips it<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.28;0.35;0.75;0.82;1" dur="6s" repeatCount="indefinite"/></text></g>
<text x="400" y="420" text-anchor="middle">No power is used in either state: you only turn the knob</text>
</g>
</svg>
