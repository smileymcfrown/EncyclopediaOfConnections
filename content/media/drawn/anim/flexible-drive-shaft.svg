<text x="392" y="60" text-anchor="end">this way: the outer layer tightens (strong)</text><line x1="392" y1="66" x2="392" y2="96" stroke="#222" stroke-width="2"/>
<text x="476" y="226" font-size="18">other way: it loosens (weaker)</text><line x1="474" y1="220" x2="466" y2="204" stroke="#222" stroke-width="2"/>
<text x="780" y="60" text-anchor="end">casing (does not turn)</text><line x1="700" y1="66" x2="690" y2="92" stroke="#222" stroke-width="2"/>
<text x="30" y="250">centre wire</text><line x1="60" y1="234" x2="66" y2="162" stroke="#222" stroke-width="2"/>
<text x="110" y="300">three wire layers, each wound</text><text x="110" y="324">the opposite way to the one below</text><line x1="150" y1="284" x2="160" y2="176" stroke="#222" stroke-width="2"/><line x1="250" y1="284" x2="280" y2="186" stroke="#222" stroke-width="2"/><line x1="350" y1="284" x2="440" y2="196" stroke="#222" stroke-width="2"/>
<text x="552" y="290">motor</text>
<text x="700" y="322" text-anchor="end">handpiece</text>
<text x="260" y="410" text-anchor="middle" font-size="18">Bends easily round curves,</text><text x="260" y="434" text-anchor="middle" font-size="18">but stays stiff in twist</text>
