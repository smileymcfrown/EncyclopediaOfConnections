<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Cutaway of a flexible drive shaft: a centre wire wrapped in three layers of wire, each wound the opposite way to the one below, turning inside a casing that does not turn; inset: a hanging motor drives a handpiece through the shaft round a U-bend; the core spins the way that tightens the outer layer, so the opposite-handed layers seem to stream in opposite directions, and the motor and handpiece turn together.</title>
