<polyline points="579.6,330 666.7,330 691.6,160 629.3,228 567.1,330 579.6,330" fill="none" stroke="#d1495b" stroke-width="5"/>
<circle cx="579.6" cy="330" r="8" fill="#ffffff" stroke="#222" stroke-width="3"><animate attributeName="cx" values="579.6;666.7;691.6;629.3;567.1;579.6" keyTimes="0;0.42;0.55;0.7;0.85;1" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1" dur="5s" repeatCount="indefinite"/><animate attributeName="cy" values="330;330;160;228;330;330" keyTimes="0;0.42;0.55;0.7;0.85;1" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1" dur="5s" repeatCount="indefinite"/></circle>
</g>
<defs><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222">
<text x="218" y="124" text-anchor="end">spring holds</text><text x="218" y="146" text-anchor="end">the disc shut</text>
<text x="92" y="200" text-anchor="end">gauge</text>
<text x="210" y="335" text-anchor="middle">tank pressure</text><text x="210" y="357" text-anchor="middle">pushes up</text>
<text x="350" y="160">air escapes</text>
<text x="62" y="420">pump keeps filling</text>
<text x="490" y="138">valve lift</text>
<text x="740" y="355" text-anchor="middle">pressure</text>
<text x="666.7" y="355" text-anchor="middle">set</text>
<line x1="480" y1="384" x2="520" y2="384" stroke="#d1495b" stroke-width="5"/><text x="530" y="390">relief valve: opens gradually</text>
<line x1="480" y1="412" x2="520" y2="412" stroke="#222" stroke-width="3" stroke-dasharray="9 7"/><text x="530" y="418">safety valve: pops fully open</text>
<text x="400" y="444" text-anchor="middle" font-size="17">Opens above the set pressure, then shuts once the pressure falls a little (blowdown)</text>
</g>
</svg>
