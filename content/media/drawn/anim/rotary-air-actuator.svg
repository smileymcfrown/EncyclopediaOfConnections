<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Two rotary air actuators, animated: in the vane type air fills one side of the chamber and swings the paddle and shaft 270 degrees, then air on the other side swings it back; in the rack-and-pinion type air pushes the two pistons apart so their racks turn the gear a quarter turn, and the springs push them back.</title>
