<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Side views of a score-and-fold hinge in card: a bone folder run along a ruler presses a groove into the top face and pushes a small bead out underneath; the card then folds on that line with the groove on the outside and the bead tucked inside the fold. Below, folding it the wrong way round (groove inside) cracks the outer face, and thick foam board is cut part-way through so its bottom paper is left to bend as the hinge. The animation folds the right-hand part of the card down through a right angle on the scored line and opens it flat again.</title>
