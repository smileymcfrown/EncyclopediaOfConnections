<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Animated side view of a carabiner (spring-gate hook) hanging from an anchor: pushing a rope against the spring-loaded gate swings it inward so the rope slips in, then the spring snaps the gate shut against the nose, and the load hangs along the strong solid back (spine); small sketches show the weak ways to load it.</title>
