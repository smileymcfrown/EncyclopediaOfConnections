<text x="132" y="216" text-anchor="end">spine</text>
<text x="132" y="240" text-anchor="end">(back)</text>
<text x="390" y="250">spring gate</text>
<text x="390" y="272">opens inward</text>
<text x="390" y="110">nose</text>
<text x="262" y="412">load: 20 kN along</text>
<text x="262" y="434">the spine, gate shut</text>
<g text-anchor="middle" font-size="18"><text x="670" y="40" font-weight="bold">weak ways</text><text x="670" y="232">across: 7 kN</text><text x="670" y="404">on the nose:</text><text x="670" y="426">under 2 kN</text></g>
</g>
</svg>
