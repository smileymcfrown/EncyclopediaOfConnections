<g font-family="Arial, Helvetica, sans-serif" fill="#222" font-size="18">
<text x="20" y="40" font-size="20" font-weight="bold">One push shared by four pads</text>
<text x="30" y="282">push</text>
<text x="340" y="88" text-anchor="middle">bars tip</text>
<text x="170" y="320" text-anchor="middle">pivot</text>
<text x="700" y="62" text-anchor="middle">touches first, stops</text>
<text x="560" y="396" text-anchor="middle">the others keep pressing until all four touch</text>
<text x="400" y="438" text-anchor="middle">Each bar tips until the forces at its two ends are equal, so every pad presses the same</text>
</g>
</svg>
