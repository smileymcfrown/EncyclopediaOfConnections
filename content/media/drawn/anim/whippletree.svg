<g font-family="Arial, Helvetica, sans-serif" fill="#222" font-size="18">
<text x="20" y="40" font-size="20" font-weight="bold">One pull shared by four hooks</text>
<text x="20" y="282">pull</text>
<text x="400" y="88" text-anchor="middle">bars tip</text>
<text x="230" y="320" text-anchor="middle">pivot</text>
<text x="640" y="52" text-anchor="middle">touches first, stops</text>
<text x="640" y="382" text-anchor="middle">the others keep closing</text>
<text x="640" y="402" text-anchor="middle">until all four touch</text>
<text x="640" y="230" text-anchor="middle" font-size="16"> </text>
<text x="400" y="438" text-anchor="middle">Each bar tips until the pulls at its two ends are equal, so every hook pulls the same</text>
</g>
</svg>
