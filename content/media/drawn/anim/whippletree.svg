<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>A whippletree: one pull on the middle pivot of a main bar is split by two smaller bars hung from its ends into four equal pulls on four sliding hooks that close on a bumpy object against a wall. When one hook touches the object first and stops, the bars tip so the other three keep closing until all four touch. Animated: all four hooks move together, the top hook meets the bump and stops, the bars tip while the other three keep moving, then the pull is released and everything returns.</title>
