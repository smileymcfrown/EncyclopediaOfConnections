<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>A whippletree: one push on the middle pivot of a main bar is split, through two smaller bars on its ends, into four equal pushes on four sliding pads that press on a bumpy object held against a wall. When one pad touches the object first and stops, the bars tip so the other three keep moving until all four touch. Animated: all four pads move together, the top pad meets the bump and stops, the bars tip while the other three keep moving, then the push is released and everything returns.</title>
