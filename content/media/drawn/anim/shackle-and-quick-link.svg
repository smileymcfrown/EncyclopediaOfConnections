<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Animated: a screw-pin D-shackle and a quick link: the shackle's pin is unscrewed and slid out so a rope eye can be put on or taken off, then screwed back in to close the bow; the quick link's threaded sleeve screws down to open the gap in the link and back up over the gap until no thread shows.</title>
