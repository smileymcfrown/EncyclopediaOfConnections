<g font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222">
<text x="40" y="40">screw pin:</text><text x="40" y="62">unscrew, slide out</text>
<text x="335" y="30">rope eye</text>
<text x="310" y="225" text-anchor="middle">bow</text>
<text x="344" y="412">chain</text>
<text x="640" y="150">threaded</text><text x="640" y="172">sleeve</text>
<text x="686" y="238">gap</text>
<text x="610" y="412" text-anchor="middle">Closed when no thread shows</text>
<text x="400" y="440" text-anchor="middle">Pull in line for full strength · a 90° sideways pull leaves about half</text>
