<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Side view in four steps: the first layers of three pieces are printed, the print pauses and a thin open mesh is taped over them, printing resumes through the mesh holes, and the finished sheet bends at the bare fabric gaps between pieces like hinges. Animated: the finished sheet lies flat, then folds at each bare gap while the printed pieces stay stiff.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="10" stroke="#222" stroke-width="2"/></pattern>
<g id="bed"><rect x="15" y="190" width="235" height="14" fill="url(#hatch)" stroke="#222" stroke-width="3"/></g>
<g id="low" fill="#e8e8e8" stroke="#222" stroke-width="3"><rect x="35" y="178" width="50" height="12"/><rect x="108" y="178" width="50" height="12"/><rect x="181" y="178" width="50" height="12"/></g>
<g id="mesh"><line x1="14" y1="175" x2="251" y2="175" stroke="#222" stroke-width="3" stroke-dasharray="4 3" stroke-linecap="butt"/><rect x="6" y="169" width="20" height="12" fill="#fde2c4" stroke="#222" stroke-width="2"/><rect x="239" y="169" width="20" height="12" fill="#fde2c4" stroke="#222" stroke-width="2"/></g>
<rect id="piece" x="-30" y="-15" width="60" height="30" fill="#e8e8e8" stroke="#222" stroke-width="3"/>
</defs>
<g stroke-linejoin="round">
<line x1="265" y1="20" x2="265" y2="215" stroke="#cccccc" stroke-width="2"/>
<line x1="530" y1="20" x2="530" y2="215" stroke="#cccccc" stroke-width="2"/>
<!-- step 1 -->
<use href="#bed"/><use href="#low"/>
<!-- step 2 -->
<g transform="translate(265,0)"><use href="#bed"/><use href="#low"/><use href="#mesh"/>
<line x1="132" y1="100" x2="132" y2="160" stroke="#d1495b" stroke-width="4" stroke-linecap="round" marker-end="url(#ah)"/></g>
<!-- step 3 -->
<g transform="translate(530,0)"><use href="#bed"/>
<g fill="#e8e8e8" stroke="#222" stroke-width="3"><rect x="35" y="150" width="50" height="40"/><rect x="108" y="150" width="50" height="40"/><rect x="181" y="150" width="50" height="40"/></g>
<use href="#mesh"/></g>
<!-- finished sheet, bent -->
<g><animateTransform attributeName="transform" type="translate" values="272.8,382.2;272.8,382.2;266.9,367.5;263.2,352.0;262.0,336.0;262.0,336.0;263.2,352.0;266.9,367.5;272.8,382.2;272.8,382.2" keyTimes="0;0.1;0.2;0.32;0.45;0.55;0.68;0.8;0.9;1" dur="5s" repeatCount="indefinite"/><use href="#piece"><animateTransform attributeName="transform" type="rotate" values="-36.0;-36.0;-24.0;-12.0;-0.0;-0.0;-12.0;-24.0;-36.0;-36.0" keyTimes="0;0.1;0.2;0.32;0.45;0.55;0.68;0.8;0.9;1" dur="5s" repeatCount="indefinite"/></use></g>
<g><animateTransform attributeName="transform" type="translate" values="355.0,345.6;355.0,345.6;354.4,342.4;354.1,339.2;354.0,336.0;354.0,336.0;354.1,339.2;354.4,342.4;355.0,345.6;355.0,345.6" keyTimes="0;0.1;0.2;0.32;0.45;0.55;0.68;0.8;0.9;1" dur="5s" repeatCount="indefinite"/><use href="#piece"><animateTransform attributeName="transform" type="rotate" values="-12.0;-12.0;-8.0;-4.0;-0.0;-0.0;-4.0;-8.0;-12.0;-12.0" keyTimes="0;0.1;0.2;0.32;0.45;0.55;0.68;0.8;0.9;1" dur="5s" repeatCount="indefinite"/></use></g>
<g><animateTransform attributeName="transform" type="translate" values="445.0,345.6;445.0,345.6;445.6,342.4;445.9,339.2;446.0,336.0;446.0,336.0;445.9,339.2;445.6,342.4;445.0,345.6;445.0,345.6" keyTimes="0;0.1;0.2;0.32;0.45;0.55;0.68;0.8;0.9;1" dur="5s" repeatCount="indefinite"/><use href="#piece"><animateTransform attributeName="transform" type="rotate" values="12.0;12.0;8.0;4.0;0.0;0.0;4.0;8.0;12.0;12.0" keyTimes="0;0.1;0.2;0.32;0.45;0.55;0.68;0.8;0.9;1" dur="5s" repeatCount="indefinite"/></use></g>
<g><animateTransform attributeName="transform" type="translate" values="527.2,382.2;527.2,382.2;533.1,367.5;536.8,352.0;538.0,336.0;538.0,336.0;536.8,352.0;533.1,367.5;527.2,382.2;527.2,382.2" keyTimes="0;0.1;0.2;0.32;0.45;0.55;0.68;0.8;0.9;1" dur="5s" repeatCount="indefinite"/><use href="#piece"><animateTransform attributeName="transform" type="rotate" values="36.0;36.0;24.0;12.0;0.0;0.0;12.0;24.0;36.0;36.0" keyTimes="0;0.1;0.2;0.32;0.45;0.55;0.68;0.8;0.9;1" dur="5s" repeatCount="indefinite"/></use></g>
<path d="M232.5,417.6 L248.5,399.8 L310.0,355.1 L400.0,336.0 L490.0,355.1 L551.5,399.8 L567.5,417.6" fill="none" stroke="#222" stroke-width="3" stroke-dasharray="4 3" stroke-linejoin="round"><animate attributeName="d" values="M232.5,417.6 L248.5,399.8 L310.0,355.1 L400.0,336.0 L490.0,355.1 L551.5,399.8 L567.5,417.6;M232.5,417.6 L248.5,399.8 L310.0,355.1 L400.0,336.0 L490.0,355.1 L551.5,399.8 L567.5,417.6;M219.1,392.4 L239.5,379.7 L308.9,348.8 L400.0,336.0 L491.1,348.8 L560.5,379.7 L580.9,392.4;M210.8,364.8 L233.9,358.2 L308.2,342.4 L400.0,336.0 L491.8,342.4 L566.1,358.2 L589.2,364.8;M208.0,336.0 L232.0,336.0 L308.0,336.0 L400.0,336.0 L492.0,336.0 L568.0,336.0 L592.0,336.0;M208.0,336.0 L232.0,336.0 L308.0,336.0 L400.0,336.0 L492.0,336.0 L568.0,336.0 L592.0,336.0;M210.8,364.8 L233.9,358.2 L308.2,342.4 L400.0,336.0 L491.8,342.4 L566.1,358.2 L589.2,364.8;M219.1,392.4 L239.5,379.7 L308.9,348.8 L400.0,336.0 L491.1,348.8 L560.5,379.7 L580.9,392.4;M232.5,417.6 L248.5,399.8 L310.0,355.1 L400.0,336.0 L490.0,355.1 L551.5,399.8 L567.5,417.6;M232.5,417.6 L248.5,399.8 L310.0,355.1 L400.0,336.0 L490.0,355.1 L551.5,399.8 L567.5,417.6" keyTimes="0;0.1;0.2;0.32;0.45;0.55;0.68;0.8;0.9;1" dur="5s" repeatCount="indefinite"/></path>
<g fill="none" stroke="#d1495b" stroke-width="4" stroke-linecap="round"><animate attributeName="opacity" values="1.00;1.00;0.67;0.33;0.00;0.00;0.33;0.67;1.00;1.00" keyTimes="0;0.1;0.2;0.32;0.45;0.55;0.68;0.8;0.9;1" dur="5s" repeatCount="indefinite"/><path d="M229.7,383.8 A245,245 0 0 0 196.9,423" marker-end="url(#ah)"/><path d="M570.3,383.8 A245,245 0 0 1 603.1,423" marker-end="url(#ah)"/></g>
<line x1="400" y1="312" x2="400" y2="333" stroke="#222" stroke-width="2"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle">
<text x="132" y="45" font-size="21" font-weight="bold">1. First layers</text>
<text x="397" y="45" font-size="21" font-weight="bold">2. Pause, lay mesh</text>
<text x="662" y="45" font-size="21" font-weight="bold">3. Print through it</text>
<text x="132" y="150">printed pieces</text>
<text x="385" y="120" text-anchor="end">tulle,</text>
<text x="385" y="142" text-anchor="end">taped flat</text>
<text x="662" y="120">plastic fuses</text>
<text x="662" y="142">through the holes</text>
<text x="400" y="262" font-size="21" font-weight="bold">4. Peel off and bend</text>
<text x="400" y="304">bare fabric = hinge</text>
<text x="690" y="370">pieces locked</text>
<text x="690" y="392">into the mesh</text>
</g>
</svg>
