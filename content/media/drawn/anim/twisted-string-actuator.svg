<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>A motor hanging from a fixed beam drives two strings that hold a load, drawn three times: with no twist the strings hang side by side and the load is low, after 10 turns the strings are twisted round each other and the load has risen, and after 20 turns the twist is tighter and the load is higher still. In the animation the left-hand motor winds its strings up through 10 and 20 turns, so the twist tightens and the load rises to the heights of the other two drawings, then unwinds again.</title>
