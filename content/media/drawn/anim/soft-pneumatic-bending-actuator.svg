<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>A cut-away of a soft silicone finger with a row of air chambers along its stretchy top and a non-stretch strip along its bottom: with no air it lies straight, and with air pumped in through a supply with a pressure gauge and relief valve the chambers swell and push apart so the finger curls round a ball; a small inset shows a fibre-wound tube version. In the animation the left finger is pumped up: its chambers swell and push apart so it curls towards the stiff strip, then the air is let out and it springs back straight.</title>
