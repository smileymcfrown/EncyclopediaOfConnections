<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>An intermittent gear pair at three moments: the driving gear's few teeth turn the output gear, then hand over, then the driver's smooth rim sits in a curved notch on the output gear and holds it still; each driver swings to and fro so you can see the output turn, stop at the hand-over, and stay locked by the rim; a graph below shows the output speed jumping on and off, compared with the smooth hump of a Geneva drive.</title>
