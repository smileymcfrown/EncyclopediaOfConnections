<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Side view of a platform held above a fixed base by two thin parallel blades: at rest the blades are straight, and when the platform is pushed sideways both blades bend into the same S shape so the platform slides along while staying level, dipping only very slightly; the pushed view slides back to rest and out again.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#222" stroke-width="2"/></pattern>
</defs>
<g stroke-linejoin="round" stroke-linecap="round">
<line x1="400" y1="20" x2="400" y2="390" stroke="#cccccc" stroke-width="2"/>
<!-- at rest -->
<rect x="50" y="320" width="300" height="26" fill="url(#hatch)" stroke="#222" stroke-width="3"/>
<rect x="100" y="140" width="10" height="180" fill="#d8f0d2" stroke="#222" stroke-width="3"/>
<rect x="290" y="140" width="10" height="180" fill="#d8f0d2" stroke="#222" stroke-width="3"/>
<rect x="80" y="110" width="240" height="32" fill="#cfe3f5" stroke="#222" stroke-width="3"/>
<!-- pushed -->
<rect x="450" y="320" width="300" height="26" fill="url(#hatch)" stroke="#222" stroke-width="3"/>
