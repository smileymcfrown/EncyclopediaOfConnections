<rect x="530" y="116" width="240" height="32" fill="#cfe3f5" stroke="#222" stroke-width="3"><animate attributeName="x" dur="4s" repeatCount="indefinite" keyTimes="0;0.15;0.2;0.25;0.3;0.35;0.4;0.45;0.6;0.65;0.7;0.75;0.8;0.85;0.9;1" values="530;530;526.3;517.04;505;492.96;483.7;480;480;483.7;492.96;505;517.04;526.3;530;530"/><animate attributeName="y" dur="4s" repeatCount="indefinite" keyTimes="0;0.15;0.2;0.25;0.3;0.35;0.4;0.45;0.6;0.65;0.7;0.75;0.8;0.85;0.9;1" values="116;116;115.14;113.29;111.5;110.4;110.03;110;110;110.03;110.4;111.5;113.29;115.14;116;116"/></rect>
<rect x="480" y="110" width="240" height="32" fill="none" stroke="#999999" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="430" y1="132" x2="470" y2="132" stroke="#d1495b" stroke-width="5" marker-end="url(#ah)"><animate attributeName="opacity" dur="4s" repeatCount="indefinite" keyTimes="0;0.15;0.25;0.6;0.65;1" values="1;1;0.15;0.15;1;1"/></line>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle">
<text x="200" y="40" font-size="21" font-weight="bold">At rest</text>
<text x="600" y="40" font-size="21" font-weight="bold">Pushed sideways</text>
<text x="200" y="132">platform</text>
<text x="200" y="240">two equal thin blades</text>
<text x="200" y="372">fixed base</text>
<text x="600" y="72">slides along and stays level,</text>
<text x="600" y="96">dipping only very slightly</text>
<text x="625" y="240">blades bend</text>
<text x="625" y="262">into S shapes</text>
<text x="600" y="372">fixed base</text>
<text x="400" y="425">Nothing slides or rubs: no friction, no play, no wear</text>
</g>
</svg>
