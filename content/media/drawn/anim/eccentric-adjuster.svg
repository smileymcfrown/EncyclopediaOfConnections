<line x1="40" y1="263" x2="770" y2="263" stroke="#888888" stroke-width="2" stroke-dasharray="8 6"/>
<line x1="530" y1="265" x2="530" y2="305" stroke="#d1495b" stroke-width="4" marker-start="url(#ah)" marker-end="url(#ah)"/>
<path d="M92.5,160.1 A62,62 0 0 1 187.5,160.1" fill="none" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222">
<text x="40" y="370">wheel clear of the rail</text>
<text x="660" y="370" text-anchor="middle">wheel pressed onto the rail</text>
<text x="514" y="292" text-anchor="end">2 × offset</text>
<text x="400" y="370" text-anchor="middle">rail</text>
<text x="262" y="100" text-anchor="middle">hex spacer</text>
<line x1="270" y1="106" x2="364" y2="188" stroke="#222" stroke-width="1.5"/>
<text x="545" y="82" text-anchor="middle">wheel axle in the</text><text x="545" y="102" text-anchor="middle">off-centre hole</text>
<line x1="530" y1="108" x2="430" y2="194" stroke="#222" stroke-width="1.5"/>
<text x="400" y="434" text-anchor="middle" font-size="19">Turn the spacer to move the wheel in or out · then tighten the bolt to lock it</text>
</g></svg>
