<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Side view of a face ratchet: two discs with sloped teeth on a shaft, a spring behind the right disc. Turned the drive way the steep faces butt and both discs turn together; turned back, the ramps push the right disc away against the spring until it clicks into the next gap. Animated: the locked pair turns together, while turned back the right disc is pushed out and snaps back in at every tooth. An end view shows the catch angle is 360 degrees divided by the number of teeth.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#e8e8e8"/><line x1="0" y1="0" x2="0" y2="10" stroke="#222" stroke-width="2"/></pattern>
<clipPath id="band"><rect x="0" y="120" width="800" height="180"/></clipPath>
<path id="ldisc" d="M50,48 L100,48 L124,84 L100,84 L124,120 L100,120 L124,156 L100,156 L124,192 L100,192 L124,228 L100,228 L124,264 L100,264 L124,300 L100,300 L124,336 L100,336 L124,372 L100,372 L50,372 Z" fill="#cfe3f5"/>
</defs>
<g stroke="#222" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
<!-- LEFT: drive way, locked -->
<rect x="25" y="200" width="245" height="20" fill="#e8e8e8"/>
<polyline points="166,210 172,166 184,254 196,166 208,254 220,166 232,254 240,210" fill="none"/>
<rect x="240" y="150" width="16" height="120" fill="url(#hatch)"/>
<g clip-path="url(#band)"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 72" dur="4s" repeatCount="indefinite"/><use href="#ldisc"/>
<path d="M166,48 L100,48 L124,84 L100,84 L124,120 L100,120 L124,156 L100,156 L124,192 L100,192 L124,228 L100,228 L124,264 L100,264 L124,300 L100,300 L124,336 L100,336 L124,372 L100,372 L166,372 Z" fill="#fde2c4"/></g></g>
<line x1="50" y1="120" x2="166" y2="120"/><line x1="50" y1="300" x2="166" y2="300"/>
<g fill="none" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)">
<line x1="75" y1="140" x2="75" y2="280"/>
<line x1="143" y1="140" x2="143" y2="280"/>
</g>
<!-- MIDDLE: back way, ramps ride up -->
<rect x="315" y="200" width="245" height="20" fill="#e8e8e8"/>
<polyline points="468.0,210 472.0,166 481.0,254 490.0,166 499.0,254 508.0,166 517.0,254 530.0,210" fill="none"><animate attributeName="points" values="468.0,210 472.0,166 481.0,254 490.0,166 499.0,254 508.0,166 517.0,254 530.0,210;480.0,210 483.2,166 490.5,254 497.8,166 505.0,254 512.2,166 519.5,254 530.0,210;456.0,210 460.8,166 471.5,254 482.3,166 493.0,254 503.7,166 514.5,254 530.0,210;480.0,210 483.2,166 490.5,254 497.8,166 505.0,254 512.2,166 519.5,254 530.0,210;456.0,210 460.8,166 471.5,254 482.3,166 493.0,254 503.7,166 514.5,254 530.0,210;468.0,210 472.0,166 481.0,254 490.0,166 499.0,254 508.0,166 517.0,254 530.0,210" keyTimes="0;0.23125;0.26875;0.73125;0.76875;1" calcMode="spline" keySplines="0.3 0 0.7 1;0.5 0 0.5 1;0.3 0 0.7 1;0.5 0 0.5 1;0.3 0 0.7 1" dur="4s" repeatCount="indefinite"/></polyline>
<rect x="530" y="150" width="16" height="120" fill="url(#hatch)"/>
<g clip-path="url(#band)"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -18;0 -18;0 -54;0 -54;0 -72" keyTimes="0;0.23125;0.26875;0.73125;0.76875;1" calcMode="spline" keySplines="0.3 0 0.7 1;0.5 0 0.5 1;0.3 0 0.7 1;0.5 0 0.5 1;0.3 0 0.7 1" dur="4s" repeatCount="indefinite"/><use href="#ldisc" transform="translate(290,0)"/></g></g>
<line x1="340" y1="120" x2="400" y2="120"/><line x1="340" y1="300" x2="400" y2="300"/>
<g><animateTransform attributeName="transform" type="translate" values="12 0;24 0;0 0;24 0;0 0;12 0" keyTimes="0;0.23125;0.26875;0.73125;0.76875;1" calcMode="spline" keySplines="0.3 0 0.7 1;0.5 0 0.5 1;0.3 0 0.7 1;0.5 0 0.5 1;0.3 0 0.7 1" dur="4s" repeatCount="indefinite"/>
<g clip-path="url(#band)">
<path d="M166,84 L100,84 L124,120 L100,120 L124,156 L100,156 L124,192 L100,192 L124,228 L100,228 L124,264 L100,264 L124,300 L100,300 L124,336 L166,336 Z" fill="#fde2c4" transform="translate(290,18)"/>
</g>
<line x1="402" y1="120" x2="456" y2="120"/>
<line x1="402" y1="300" x2="456" y2="300"/>
</g>
<g fill="none" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)">
<line x1="365" y1="280" x2="365" y2="140"/>
<line x1="420" y1="104" x2="470" y2="104"/>
</g>
<!-- RIGHT: end view -->
<circle cx="690" cy="210" r="80" fill="#cfe3f5"/>
<circle cx="690" cy="210" r="48" fill="#e8e8e8"/>
<circle cx="690" cy="210" r="12" fill="#ffffff"/>
<g stroke-width="2.5">
<line x1="736" y1="222" x2="767" y2="231"/><line x1="724" y1="244" x2="747" y2="267"/><line x1="702" y1="256" x2="711" y2="287"/><line x1="678" y1="256" x2="669" y2="287"/><line x1="656" y1="244" x2="633" y2="267"/><line x1="644" y1="222" x2="613" y2="231"/><line x1="644" y1="198" x2="613" y2="189"/><line x1="656" y1="176" x2="633" y2="153"/><line x1="678" y1="164" x2="669" y2="133"/><line x1="702" y1="164" x2="711" y2="133"/><line x1="724" y1="176" x2="747" y2="153"/><line x1="736" y1="198" x2="767" y2="189"/>
</g>
<path d="M666,121 A92,92 0 0 1 714,121" fill="none" stroke="#d1495b" marker-start="url(#ah)" marker-end="url(#ah)"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" fill="#222" text-anchor="middle">
<g font-size="20" font-weight="bold">
<text x="145" y="60">Drive way: locked</text>
<text x="435" y="60">Back way: slips</text>
<text x="690" y="60">End view</text>
</g>
<g font-size="18">
<text x="203" y="152">spring</text>
<text x="145" y="338">steep faces butt:<tspan x="145" dy="22">both discs turn together</tspan></text>
<text x="435" y="338">ramps push the disc back,<tspan x="435" dy="22">then it clicks into the next gap</tspan></text>
<text x="690" y="338">catch angle =<tspan x="690" dy="22">360° ÷ number of teeth</tspan></text>
<text x="400" y="432">Steep faces lock one way · ramps slide over with a click the other way</text>
</g>
</g>
</svg>
