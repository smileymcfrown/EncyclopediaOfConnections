<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Animated three-quarter view of a V-fold pop-up: the right-hand page swings up and over to shut the card while the V piece folds down flat between the pages, then the card opens flat again and the piece swings back up, its middle crease and both glue lines always meeting at one point on the centre fold.</title>
