<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Side view of a wrap-spring clutch: an input hub and an output hub end to end with a coil spring wrapped over the joint. Turned the winding way the coil squeezes down onto both hubs and the output is driven; turned the other way the coil opens slightly and slips, so the output stays still. Animated: the input turns two turns the winding way and the output turns with it; then the input turns back, the coil loosens and turns with the input while the output hub stays still.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#e8e8e8"/><line x1="0" y1="0" x2="0" y2="10" stroke="#222" stroke-width="2"/></pattern>
<clipPath id="sp"><rect x="250" y="100" width="300" height="220"/></clipPath>
<g id="coil"><line x1="0" y1="-52" x2="7" y2="52" stroke="#222" stroke-width="9"/><line x1="0" y1="-52" x2="7" y2="52" stroke="#fde2c4" stroke-width="4"/><circle cx="0" cy="-52" r="4.5" fill="#fde2c4" stroke="#222" stroke-width="2"/></g>
</defs>
<g stroke="#222" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
<rect x="30" y="194" width="110" height="32" fill="#e8e8e8"/><rect x="660" y="194" width="110" height="32" fill="#e8e8e8"/>
<rect x="130" y="162" width="270" height="96" rx="4" fill="#cfe3f5"/><rect x="404" y="162" width="266" height="96" rx="4" fill="#d8f0d2"/>
