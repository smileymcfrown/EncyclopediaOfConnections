<line x1="80" y1="210" x2="80" y2="164" stroke-width="7" stroke="#555"><animate attributeName="y2" values="164;164;164.1;165.4;170.5;182.5;202.6;227.6;249;255.7;240.9;209.3;177.4;164;177.4;209.3;240.9;255.7;249;227.6;202.6;182.5;170.5;165.4;164.1;164;164;164.9;169.1;179.5;198;222.5;245.6;256;245.5;216.3;182.8;164.6;172.8;202.3;235.5;254.5;251.9;232.5;207.4;185.9;172.3;166;164.2;164;164" keyTimes="0;0.05;0.0667;0.0833;0.1;0.1167;0.1333;0.15;0.1667;0.1833;0.2;0.2167;0.2333;0.25;0.2667;0.2833;0.3;0.3167;0.3333;0.35;0.3667;0.3833;0.4;0.4167;0.4333;0.45;0.5333;0.55;0.5667;0.5833;0.6;0.6167;0.6333;0.65;0.6667;0.6833;0.7;0.7167;0.7333;0.75;0.7667;0.7833;0.8;0.8167;0.8333;0.85;0.8667;0.8833;0.9;0.9167;1" dur="6s" repeatCount="indefinite"/></line>
<line x1="720" y1="210" x2="720" y2="164" stroke-width="7" stroke="#555"><animate attributeName="y2" values="164;164;164.1;165.4;170.5;182.5;202.6;227.6;249;255.7;240.9;209.3;177.4;164;177.4;209.3;240.9;255.7;249;227.6;202.6;182.5;170.5;165.4;164.1;164;164" keyTimes="0;0.05;0.0667;0.0833;0.1;0.1167;0.1333;0.15;0.1667;0.1833;0.2;0.2167;0.2333;0.25;0.2667;0.2833;0.3;0.3167;0.3333;0.35;0.3667;0.3833;0.4;0.4167;0.4333;0.45;1" dur="6s" repeatCount="indefinite"/></line>
<path d="M104,160 A14,50 0 0 1 104,260" fill="none" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"><animate attributeName="opacity" values="1;1;0.7;0.3;0;0" keyTimes="0;0.45;0.4667;0.4833;0.5;1" dur="6s" repeatCount="indefinite"/></path>
<path d="M104,260 A14,50 0 0 0 104,160" fill="none" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)" opacity="0"><animate attributeName="opacity" values="0;0;0.5;1;1;0.7;0.2;0;0" keyTimes="0;0.4833;0.5;0.5167;0.9167;0.9333;0.95;0.9667;1" dur="6s" repeatCount="indefinite"/></path>
<path d="M746,160 A14,50 0 0 1 746,260" fill="none" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"><animate attributeName="opacity" values="1;1;0.7;0.3;0;0;0.1;0.5;1;1" keyTimes="0;0.45;0.4667;0.4833;0.5;0.9333;0.95;0.9667;0.9833;1" dur="6s" repeatCount="indefinite"/></path>
</g>
<g font-family="Arial, Helvetica, sans-serif" fill="#222" font-size="18" text-anchor="middle">
<text x="400" y="40" font-size="20" font-weight="bold"><tspan>Winding way: the coil grips, both hubs turn</tspan><animate attributeName="opacity" values="1;1;0.9;0.4;0;0;0.4;0.9;1" keyTimes="0;0.45;0.4667;0.4833;0.5;0.95;0.9667;0.9833;1" dur="6s" repeatCount="indefinite"/></text>
<text x="400" y="40" font-size="20" font-weight="bold" opacity="0">Other way: the coil loosens and slips<animate attributeName="opacity" values="0;0;0.5;1;1;0.5;0;0" keyTimes="0;0.4833;0.5;0.5167;0.9333;0.95;0.9667;1" dur="6s" repeatCount="indefinite"/></text>
<text x="200" y="300">input hub</text><text x="600" y="300">output hub</text>
<text x="400" y="136">coil spring over both hubs</text>
<text x="400" y="340">turned the winding way it squeezes down and drives;</text>
<text x="400" y="362">turned back it opens a little and the output stays still</text>
<text x="400" y="430">Grip grows with every turn of the coil, like a rope wound round a post</text>
</g>
</svg>
