<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Tongue-and-groove joints: on the left an end view of three boards with tongues in grooves on a joist, with a small gap at the bottom of each groove; on the right a box with grooves along the inside of both sides, shown end-on with the lid edges in the grooves and from the side with the lid sliding out of the open end. Animated: the middle board shrinks and swells, opening thin gaps at its edges while its tongues stay in the grooves, and the box lid slides out of the open end and back.</title>
