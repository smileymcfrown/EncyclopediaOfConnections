<g font-family="Arial, Helvetica, sans-serif" fill="#222" font-size="18">
<g font-size="20" font-weight="bold" text-anchor="middle"><text x="205" y="40">Boards edge to edge</text><text x="600" y="40">Sliding box lid</text></g>
<text x="70" y="104">tongue</text>
<text x="262" y="104">groove</text>
<text x="210" y="262" text-anchor="middle">gap at the bottom of the groove</text>
<text x="205" y="300" text-anchor="middle">the middle board shrinks and swells,</text>
<text x="205" y="322" text-anchor="middle">its tongue stays in and hides the gap</text>
<text x="672" y="104">lid held up,</text><text x="672" y="124">down and</text><text x="672" y="144">sideways</text>
<text x="600" y="220" text-anchor="middle">grooves in both sides</text>
<text x="650" y="400" text-anchor="middle">free to slide out the open end</text>
<text x="400" y="438" text-anchor="middle">A tongue in a groove keeps faces flush but lets the parts slide along it</text>
</g>
</svg>
