<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>A heart-shaped groove in a sprung slider, with the pin shown at four numbered positions going round it one way: rest, pushed in, caught in the notch, and released. Animated: the pin runs round the loop one way, and in the side section the stepped groove floor slides under the sprung pin, which rides up each ramp and drops off each step.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#e8e8e8"/><line x1="0" y1="0" x2="0" y2="10" stroke="#222" stroke-width="2"/></pattern>
</defs>
<g stroke-linejoin="round" stroke-linecap="round">
<!-- slider plate -->
<rect x="110" y="25" width="300" height="340" rx="10" fill="#cfe3f5" stroke="#222" stroke-width="3"/>
<g transform="translate(0,-15)">
<!-- groove (outer wall) -->
<path d="M260,365 C200,330 140,260 140,180 C140,120 165,75 205,62 L225,62 L246,108 L290,60 L320,60 C360,75 380,120 380,180 C380,260 320,330 260,365 Z" fill="#ffffff" stroke="#222" stroke-width="3"/>
<!-- heart-shaped island -->
<path d="M252,162 L200,118 C178,110 168,135 170,170 C172,230 225,280 260,310 C295,280 350,235 350,180 C350,135 310,118 275,124 Z" fill="#cfe3f5" stroke="#222" stroke-width="3"/>
<!-- one-way path -->
<g fill="none" stroke="#d1495b" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#ah)">
<path d="M244,322 C188,296 153,250 155,182 C157,134 172,106 196,90"/>
<path d="M221,98 L240,131"/>
<path d="M263,136 L289,94"/>
<path d="M322,88 C362,122 368,200 346,258 C327,300 298,318 278,326"/>
</g>
<!-- pin positions -->
<g fill="#fde2c4" stroke="#222" stroke-width="3" stroke-dasharray="4 4">
<circle cx="260" cy="328" r="14"/>
<circle cx="212" cy="80" r="14"/>
<circle cx="252" cy="146" r="14"/>
<circle cx="306" cy="76" r="14"/>
</g>
<!-- the pin going round -->
<circle r="14" fill="#fde2c4" stroke="#222" stroke-width="4"><animateMotion path="M260,328 L232.9,316.9 L220.1,304.8 L208.3,292.4 L197.0,279.1 L186.5,264.9 L177.5,250.5 L169.6,235.3 L163.2,219.5 L158.7,203.7 L155.9,186.9 L155.1,173.2 L155.4,160.3 L156.5,148.4 L158.6,137.4 L161.5,127.4 L165.2,118.9 L169.3,111.8 L173.7,105.9 L178.3,101.1 L183.3,97.1 L212.0,80.0 L252.0,146.0 L306.0,76.0 L319.9,95.1 L326.5,98.5 L332.5,102.7 L338.1,107.5 L343.1,112.9 L348.0,119.2 L352.2,126.2 L355.9,133.8 L359.2,142.3 L361.9,151.8 L363.8,162.4 L364.9,173.8 L364.8,186.7 L362.8,203.1 L358.7,218.9 L352.5,234.8 L344.9,249.5 L335.7,264.0 L325.3,277.9 L314.0,290.9 L301.4,303.9 L288.4,315.8 L260.0,328.0" keyPoints="0.0000;0.0000;0.3953;0.4921;0.4921;0.6029;1.0000;1.0000" keyTimes="0.0000;0.1333;0.3333;0.4333;0.6000;0.6833;0.9000;1.0000" calcMode="linear" dur="6s" repeatCount="indefinite"/></circle>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#222" text-anchor="middle">
<text x="260" y="334">1</text>
<text x="212" y="86">2</text>
<text x="252" y="152">3</text>
<text x="306" y="82">4</text>
</g>
</g>
<!-- springs and ground -->
<path d="M180,365 L180,370 L168,375 L192,382 L168,389 L192,396 L180,400" fill="none" stroke="#222" stroke-width="3"/>
<path d="M340,365 L340,370 L328,375 L352,382 L328,389 L352,396 L340,400" fill="none" stroke="#222" stroke-width="3"/>
<rect x="110" y="400" width="300" height="14" fill="url(#hatch)" stroke="#222" stroke-width="3"/>
<!-- push arrow -->
<line x1="70" y1="72" x2="70" y2="160" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"><animate attributeName="opacity" values="0.25;1;1;0.25;0.25;1;1;0.25;0.25" keyTimes="0;0.1333;0.3333;0.3500;0.6000;0.6083;0.6833;0.7000;1" dur="6s" repeatCount="indefinite"/></line>
<!-- side section: steps in the groove floor -->
<rect x="585" y="215" width="45" height="12" fill="url(#hatch)" stroke="#222" stroke-width="3"/>
<clipPath id="fc"><rect x="470" y="280" width="310" height="90"/></clipPath>
<g transform="translate(0,227)"><g><animateTransform attributeName="transform" type="scale" values="1 1.0000;1 1.2686;1 1.2628;1 1.0000" keyTimes="0;0.4778;0.4889;1" dur="2s" repeatCount="indefinite"/><g transform="translate(0,-227)"><path d="M607,227 L607,231 L597,235 L617,241 L597,247 L617,253 L607,258 L607,262" fill="none" stroke="#222" stroke-width="3" vector-effect="non-scaling-stroke"/></g></g></g>
<g><animateTransform attributeName="transform" type="translate" values="0 0.00;0 9.40;0 9.20;0 0.00" keyTimes="0;0.4778;0.4889;1" dur="2s" repeatCount="indefinite"/><path d="M600,262 L614,262 L614,308 A7,7 0 0 1 600,308 Z" fill="#fde2c4" stroke="#222" stroke-width="3"/></g>
<g clip-path="url(#fc)"><g><animateTransform attributeName="transform" type="translate" values="0 0;-90 0" dur="2s" repeatCount="indefinite"/><path d="M380,365 L380,325 L380,325 L470,307 L470,325 L560,307 L560,325 L650,307 L650,325 L740,307 L740,325 L830,307 L830,325 L920,307 L920,365 Z" fill="#cfe3f5" stroke="#222" stroke-width="3"/></g></g>
<path d="M470,330 L470,365 L780,365 L780,330" fill="none" stroke="#222" stroke-width="3"/>
<line x1="560" y1="385" x2="700" y2="385" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222">
<text x="48" y="60">push</text>
<text x="450" y="60"><tspan font-weight="bold">1</tspan>  rest: held out by the springs</text>
<text x="450" y="95"><tspan font-weight="bold">2</tspan>  pushed in past the stop</text>
<text x="450" y="130"><tspan font-weight="bold">3</tspan>  let go: caught in the notch</text>
<text x="450" y="165"><tspan font-weight="bold">4</tspan>  push again: it is let out</text>
<text x="450" y="205">steps in the groove floor:</text>
<text x="520" y="412">pin can only go this way</text>
<text x="400" y="440" text-anchor="middle" font-size="18">Push once to lock it in · push again to let it spring out</text>
</g>
</svg>
