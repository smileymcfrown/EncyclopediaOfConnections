<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Animated: a lid on a hinge held up by a gas strut, and the strut cut open: nitrogen gas fills the tube on both sides of a piston with a tiny hole, a little oil sits at the rod end, and because the rod takes up area on one side the gas pushes the rod out, lifting the lid; the lid opens slowly as the rod slides out, then is pushed shut again, squeezing the rod back in.</title>
