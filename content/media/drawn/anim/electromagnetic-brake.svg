<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle">
<text x="80" y="200">motor</text>
<text x="176" y="60" text-anchor="end">friction disc</text>
<text x="226" y="22" font-size="17" text-anchor="end">air gap</text><text x="226" y="40" font-size="15" text-anchor="end">(really 0.2-0.5 mm)</text>
<text x="292" y="52">springs</text>
<text x="562" y="46" font-size="17" text-anchor="start">power switch</text>
<text x="110" y="346">fixed plate</text><text x="224" y="346">armature</text><text x="330" y="346">coil (fixed)</text>
<text x="400" y="408" font-size="19">Power off: springs push the armature and squeeze the disc, so the shaft is held.</text>
<text x="400" y="434" font-size="19">Power on: the coil pulls the armature back across the gap and the shaft turns.</text>
</g>
</svg>
