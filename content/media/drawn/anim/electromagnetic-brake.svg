<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Side cut-away of a spring-applied electromagnetic brake on a motor shaft lifting a load: with the power off, springs in the fixed coil housing push the steel armature plate against the friction disc, squeezing it against the fixed plate, so the shaft and the hanging load are held. Animated: the switch closes, the coil lights up and pulls the armature back across the small air gap, squashing the springs; the disc is freed and the motor winds the load up. The power is cut, the springs clamp the disc at once and the load stays put; then the brake is released again to lower it.</title>
