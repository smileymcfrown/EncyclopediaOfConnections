<line x1="262" y1="244" x2="242" y2="226" stroke="#222" stroke-width="2"/>
<!-- right: air out, contracted -->
<rect x="540" y="50" width="120" height="16" fill="url(#hatch)" stroke="#222" stroke-width="3"/>
