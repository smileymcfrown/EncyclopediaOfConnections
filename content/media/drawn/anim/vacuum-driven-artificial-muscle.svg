<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Cut-away of a zigzag-folded skeleton sealed in a clear bag hanging from a support: on the left, with normal air inside, it is fully open with a weight hanging below; on the right a pump sucks the air out, outside air presses the bag into the folds, and the stack folds up much shorter and lifts the weight. Animated: on the right, air is let back in so the skeleton springs open and lowers the weight, then the pump sucks the air out again and it folds up and lifts it.</title>
