<line x1="702" y1="124" x2="664" y2="124" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<line x1="702" y1="158" x2="664" y2="158" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<g><animateTransform attributeName="transform" type="translate" values="0,0;0,0;0,160;0,160;0,0;0,0" keyTimes="0;0.15;0.4;0.55;0.85;1" calcMode="spline" keySplines="0 0 1 1;0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1;0 0 1 1" dur="6s" repeatCount="indefinite"/>
</g>
<line x1="600" y1="184" x2="600" y2="200" stroke="#222" stroke-width="2.5"/>
<rect x="565" y="200" width="70" height="45" fill="#e8e8e8" stroke="#222" stroke-width="3"/></g>
<rect x="565" y="360" width="70" height="45" fill="none" stroke="#999999" stroke-width="2" stroke-dasharray="6 6"/>
<g><animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.15;0.22;0.6;0.7;1" dur="6s" repeatCount="indefinite"/><line x1="680" y1="395" x2="680" y2="222" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/></g>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle">
<text x="200" y="34" font-size="21" font-weight="bold">Air in: open</text>
<text x="600" y="34" font-size="21" font-weight="bold">Air out: pulls short</text>
<text x="264" y="120" text-anchor="start">clear bag</text>
<text x="264" y="262" text-anchor="start">folded skeleton</text>
<text x="200" y="389" font-size="16">weight</text>
<text x="741" y="83" font-size="16">pump</text>
<text x="455" y="190">outside air</text>
<text x="455" y="212">presses in</text>
<text x="600" y="305">lifts the weight</text>
<text x="400" y="436" font-size="17">The skeleton folds as designed · up to about 90% shorter · lifts about 1,000× its own weight</text>
</g>
</svg>
