<g font-family="Arial, Helvetica, sans-serif" fill="#222"><text x="40" y="40" font-size="20" font-weight="bold">The front of the page</text><text x="40" y="262" font-size="20" font-weight="bold">Cut along the slot</text><text x="312" y="87" font-size="18">slides</text><text x="730" y="148" font-size="18" text-anchor="middle">pull</text><text x="52" y="150" font-size="18">picture</text><text x="490" y="120" font-size="18" text-anchor="middle">page (card)</text><text x="440" y="166" font-size="18" text-anchor="middle">slot</text><line x1="440" y1="172" x2="440" y2="193" stroke="#222" stroke-width="1.5"/><text x="130" y="300" font-size="18">tab through the slot</text><text x="150" y="406" font-size="18">pull strip, glued to the tab, behind the page</text><text x="636" y="300" font-size="18" text-anchor="middle">guide strips</text><line x1="600" y1="306" x2="590" y2="372" stroke="#222" stroke-width="1.5"/><line x1="620" y1="306" x2="520" y2="372" stroke="#222" stroke-width="1.5"/><text x="400" y="438" font-size="18" text-anchor="middle">The guides hold the strip flat but are not glued to it, so it can slide</text></g>
</svg>
