<defs><pattern id="hc" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#fdf3c4"/><line x1="0" y1="0" x2="0" y2="10" stroke="#222" stroke-width="1.5"/></pattern><pattern id="hb" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#fde2c4"/><line x1="0" y1="0" x2="0" y2="10" stroke="#222" stroke-width="1.5"/></pattern><pattern id="hg" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#d8f0d2"/><line x1="0" y1="0" x2="0" y2="10" stroke="#222" stroke-width="1.5"/></pattern></defs>
<line x1="20" y1="236" x2="780" y2="236" stroke="#cccccc" stroke-width="2"/>
<g transform="translate(0 0)"><animateTransform attributeName="transform" type="translate" values="0 0;0 0;8.9 0;31.1 0;60 0;88.9 0;111.1 0;120 0;120 0;111.1 0;88.9 0;60 0;31.1 0;8.9 0;0 0;0 0" keyTimes="0;0.1667;0.2056;0.2444;0.2833;0.3222;0.3611;0.4;0.6;0.6389;0.6778;0.7167;0.7556;0.7944;0.8333;1" dur="6s" repeatCount="indefinite"/><path d="M560,183 L648,183 a16,16 0 0 1 0,32 L560,215 Z" fill="#d8f0d2" stroke="#222" stroke-width="3" stroke-linejoin="round"/></g>
<rect x="40" y="58" width="580" height="160" fill="#fdf3c4" stroke="#222" stroke-width="3" stroke-linejoin="round"/>
<path fill="none" stroke="#555" stroke-width="2" stroke-dasharray="6 5" d="M120,183 L618,183 M120,215 L618,215 M120,183 L120,215"><animate attributeName="d" values="M120,183 L618,183 M120,215 L618,215 M120,183 L120,215;M120,183 L618,183 M120,215 L618,215 M120,183 L120,215;M128.9,183 L618,183 M128.9,215 L618,215 M128.9,183 L128.9,215;M151.1,183 L618,183 M151.1,215 L618,215 M151.1,183 L151.1,215;M180,183 L618,183 M180,215 L618,215 M180,183 L180,215;M208.9,183 L618,183 M208.9,215 L618,215 M208.9,183 L208.9,215;M231.1,183 L618,183 M231.1,215 L618,215 M231.1,183 L231.1,215;M240,183 L618,183 M240,215 L618,215 M240,183 L240,215;M240,183 L618,183 M240,215 L618,215 M240,183 L240,215;M231.1,183 L618,183 M231.1,215 L618,215 M231.1,183 L231.1,215;M208.9,183 L618,183 M208.9,215 L618,215 M208.9,183 L208.9,215;M180,183 L618,183 M180,215 L618,215 M180,183 L180,215;M151.1,183 L618,183 M151.1,215 L618,215 M151.1,183 L151.1,215;M128.9,183 L618,183 M128.9,215 L618,215 M128.9,183 L128.9,215;M120,183 L618,183 M120,215 L618,215 M120,183 L120,215;M120,183 L618,183 M120,215 L618,215 M120,183 L120,215" keyTimes="0;0.1667;0.2056;0.2444;0.2833;0.3222;0.3611;0.4;0.6;0.6389;0.6778;0.7167;0.7556;0.7944;0.8333;1" dur="6s" repeatCount="indefinite"/></path>
<path d="M500,176 L500,222 L530,222 L530,176 Z M572,176 L572,222 L602,222 L602,176 Z" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="120" y="193" width="350" height="12" rx="3" fill="#ffffff" stroke="#222" stroke-width="2.5"/>
<g transform="translate(0 0)"><animateTransform attributeName="transform" type="translate" values="0 0;0 0;8.9 0;31.1 0;60 0;88.9 0;111.1 0;120 0;120 0;111.1 0;88.9 0;60 0;31.1 0;8.9 0;0 0;0 0" keyTimes="0;0.1667;0.2056;0.2444;0.2833;0.3222;0.3611;0.4;0.6;0.6389;0.6778;0.7167;0.7556;0.7944;0.8333;1" dur="6s" repeatCount="indefinite"/><path d="M176,154 L176,92 L136,154Z M184,154 L184,100 L216,154Z" fill="#cfe3f5" stroke="#222" stroke-width="3" stroke-linejoin="round"/><path d="M130,160 L230,160 L216,184 L144,184Z" fill="#fde2c4" stroke="#222" stroke-width="3" stroke-linejoin="round"/><rect x="166" y="184" width="28" height="15" fill="#fde2c4" stroke="#222" stroke-width="2.5"/></g>
<path d="M190,80 L300,80" fill="none" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<path d="M690,160 L770,160" fill="none" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<path d="M40,340 L120,340 L120,349 L40,349 Z M470,340 L620,340 L620,349 L470,349 Z" fill="url(#hc)" stroke="#222" stroke-width="3" stroke-linejoin="round"/>
<g transform="translate(0 0)"><animateTransform attributeName="transform" type="translate" values="0 0;0 0;8.9 0;31.1 0;60 0;88.9 0;111.1 0;120 0;120 0;111.1 0;88.9 0;60 0;31.1 0;8.9 0;0 0;0 0" keyTimes="0;0.1667;0.2056;0.2444;0.2833;0.3222;0.3611;0.4;0.6;0.6389;0.6778;0.7167;0.7556;0.7944;0.8333;1" dur="6s" repeatCount="indefinite"/><rect x="130" y="331" width="100" height="8" fill="url(#hb)" stroke="#222" stroke-width="3" stroke-linejoin="round"/><path d="M166,339 L166,353 L210,353 L210,358 L161,358 L161,339 Z" fill="url(#hb)" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/><path d="M120,358 L648,358 a8,8 0 0 1 0,16 L120,374 Z" fill="url(#hg)" stroke="#222" stroke-width="3" stroke-linejoin="round"/></g>
<path d="M500,375 L530,375 L530,383 L500,383 Z M572,375 L602,375 L602,383 L572,383 Z" fill="url(#hb)" stroke="#222" stroke-width="3" stroke-linejoin="round"/>
