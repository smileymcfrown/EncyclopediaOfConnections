<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Animated pull-tab slider: the pull tab is pulled out from the edge of the page and the pull strip slides under its guide strips, carrying the picture along the slot on the front; then it is pushed back. A cut along the slot below shows the same movement inside the page.</title>
<rect width="800" height="450" fill="#ffffff"/>
