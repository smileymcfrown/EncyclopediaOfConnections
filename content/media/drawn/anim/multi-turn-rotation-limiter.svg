<animateTransform attributeName="transform" type="translate" values="0,0;226,0;226,0;-110,0;-110,0;0,0" keyTimes="0;0.28;0.38;0.8;0.88;1" dur="6s" repeatCount="indefinite"/></g></g>
<rect x="645" y="234" width="80" height="32" fill="#e8e8e8" stroke="#222" stroke-width="3"/>
