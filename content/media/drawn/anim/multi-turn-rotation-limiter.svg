<rect x="610" y="200" width="40" height="100" rx="4" fill="#fde2c4" stroke="#222" stroke-width="3"><animate attributeName="fill" values="#fde2c4;#fde2c4;#f5b5b5;#fde2c4;#fde2c4" keyTimes="0;0.28;0.29;0.38;1" dur="6s" repeatCount="indefinite"/></rect>
<g>
<rect x="330" y="119" width="24" height="83" fill="#cfe3f5" stroke="#222" stroke-width="3"/>
<rect x="300" y="190" width="84" height="120" rx="6" fill="#cfe3f5" stroke="#222" stroke-width="3"/>
<animateTransform attributeName="transform" type="translate" values="0,0;226,0;226,0;-110,0;-110,0;0,0" keyTimes="0;0.28;0.38;0.8;0.88;1" dur="6s" repeatCount="indefinite"/></g>
<g><path d="M85,300 A30,58 0 0 0 85,196" fill="none" stroke="#d1495b" stroke-width="5" marker-end="url(#ah)"/>
