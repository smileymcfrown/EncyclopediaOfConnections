<g opacity="0"><path d="M85,300 A30,58 0 0 0 85,196" fill="none" stroke="#d1495b" stroke-width="5" marker-start="url(#ah)"/>
<line x1="400" y1="340" x2="590" y2="340" stroke="#d1495b" stroke-width="5" marker-start="url(#ah)"/>
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.36;0.38;0.8;0.82;1" dur="6s" repeatCount="indefinite"/></g>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle">
<text x="400" y="80">slot in a fixed guide: the nut's tab stops it spinning</text>
<text x="90" y="335">shaft turns</text>
<text x="342" y="335">nut</text>
<text x="170" y="320">stop</text>
<text x="630" y="320">stop</text>
<text x="495" y="370">nut walks along a little each turn</text>
<text x="400" y="420">After the set number of turns the nut hits a stop and the shaft is blocked, both ways</text>
</g></svg>
