<text x="348" y="40" text-anchor="start">input</text>
<text x="360" y="132" text-anchor="start">16-tooth bevel gear</text>
<text x="120" y="330">32-tooth gear:</text><text x="120" y="352">turns one way</text>
<text x="460" y="330">32-tooth gear:</text><text x="460" y="352">turns the other way</text>
<text x="674" y="98" font-size="18" font-weight="bold">Rod inside a tube</text>
<text x="674" y="330" font-size="17">two propellers spin</text><text x="674" y="350" font-size="17">opposite ways</text>
<text x="400" y="400" font-size="17">Two identical gears facing each other across one pinion always turn opposite ways,</text>
<text x="400" y="421" font-size="17">at half the input speed here (16 teeth driving 32)</text>
