<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>A sear and trigger seen from the side, animated: a light finger pull turns the long trigger, which tips the sear down off the bar's notch, the big spring snaps the bar forward, and then the bar is cocked again and the sear springs back up to hold it.</title>
