<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222">
<text x="100" y="106">big spring pushes the bar</text>
<text x="40" y="292">sear: a small hooked catch</text>
<text x="40" y="314">(its light spring holds it up)</text>
<g stroke="#222" stroke-width="1.5"><line x1="250" y1="286" x2="318" y2="232"/><line x1="230" y1="362" x2="334" y2="212"/><line x1="560" y1="260" x2="500" y2="300"/></g>
<text x="40" y="367">the push points almost</text><text x="40" y="389">through the sear's pivot</text>
<text x="565" y="260">trigger: a long lever</text>
<text x="620" y="386">light finger pull</text>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.28;0.3;0.52;0.54;1" dur="5s" repeatCount="indefinite"/><text x="610" y="106">bar snaps free</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.52;0.54;0.76;0.78;1" dur="5s" repeatCount="indefinite"/><text x="610" y="106">cock it again</text></g>
<text x="400" y="440" text-anchor="middle">A light pull slides the sear off and releases all the stored energy</text>
</g></svg>
