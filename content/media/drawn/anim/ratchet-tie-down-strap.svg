<g font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222" text-anchor="middle">
<text x="560" y="60">lever the handle back and forth:</text><text x="560" y="84">its pawl pushes the teeth round</text>
<text x="110" y="394">locking pawl</text>
<text x="300" y="394">toothed wheel</text>
<text x="610" y="264">webbing winds onto the spool</text>
<text x="548" y="322" font-weight="bold" font-size="18">Release</text><text x="548" y="344" font-size="16">handle swung fully</text><text x="548" y="364" font-size="16">open: both pawls lift,</text><text x="548" y="384" font-size="16">the spool spins free</text>
<text x="400" y="436" font-size="18">Each stroke winds the spool a few teeth; the locking pawl clicks into each tooth</text>
</g>
