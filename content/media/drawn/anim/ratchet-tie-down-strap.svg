<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Side view of a ratchet tie-down buckle: in the animation the handle levers up, its pawl pushing the toothed wheel round two teeth and winding the webbing onto the slotted spool while the locking pawl on the frame clicks over each tooth; on the way back the handle pawl slides over the teeth and the locking pawl holds. A small view shows the handle swung fully open with both pawls lifted to release.</title>
