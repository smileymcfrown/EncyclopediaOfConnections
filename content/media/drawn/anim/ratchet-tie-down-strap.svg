<g font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222" text-anchor="middle">
<text x="300" y="34">lever the handle back and forth</text>
<text x="80" y="128">locking pawl</text><text x="80" y="150">stops it turning back</text>
<text x="395" y="300">webbing winds onto</text><text x="395" y="322">the slotted spool</text>
<text x="225" y="345">toothed wheel</text>
<text x="660" y="200" font-weight="bold">Release</text><text x="660" y="224" font-size="17">handle swung fully open:</text><text x="660" y="244" font-size="17">both pawls lift, spool spins free</text>
<text x="400" y="436" font-size="18">The handle pawl pushes the teeth round on each stroke; the locking pawl clicks into each tooth</text>
</g>
</svg>
