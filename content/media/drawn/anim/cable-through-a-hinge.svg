<g font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222">
<text x="200" y="44" text-anchor="middle" font-size="21" font-weight="bold">Through the hinge pin</text>
<text x="600" y="44" text-anchor="middle" font-size="21" font-weight="bold">Slack loop beside the hinge</text>
<text x="200" y="146" text-anchor="middle">lid</text>
<text x="200" y="290" text-anchor="middle">box</text>
<text x="200" y="364" text-anchor="middle">hollow pin: cable only twists</text>
<text x="44" y="330" text-anchor="middle" font-size="18">clamp</text>
<text x="580" y="300" text-anchor="middle">box</text>
<text x="548" y="170" text-anchor="end" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">lid opens</text>
<text x="600" y="380" text-anchor="middle">loop bends as the lid moves</text>
<text x="400" y="432" text-anchor="middle" font-size="18">Clamp both sides, so the cable's movement is spread over the free length</text>
</g>
</svg>
