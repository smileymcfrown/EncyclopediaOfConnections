<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Three folding-blade locks, shown folding and opening in step: the liner-lock strip is pushed aside by a thumb and snaps back behind the heel when the blade opens; the lockback's tail is pressed to lift its hook out of the notch, and the hook drops back in when open; the slip joint's backspring is pushed out by the heel's corners and settles on each flat.</title>
