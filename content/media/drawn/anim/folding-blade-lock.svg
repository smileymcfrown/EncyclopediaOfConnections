<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222">
<text x="14" y="34" font-size="21" font-weight="bold">Liner lock</text><text x="14" y="56">(seen from the spine)</text>
<text x="281" y="34" font-size="21" font-weight="bold">Lockback</text>
<text x="548" y="34" font-size="21" font-weight="bold">Slip joint</text>
<g text-anchor="middle">
<text x="133" y="374">strip springs in behind</text><text x="133" y="396">the heel; thumb pushes it</text>
<text x="400" y="374">hook drops into a notch;</text><text x="400" y="396">press the tail to lift it</text>
<text x="667" y="374">spring presses on flats;</text><text x="667" y="396">a firm push folds it</text>
<text x="400" y="436">A lock blocks the blade; a slip joint only holds it with a spring</text>
</g></g>
