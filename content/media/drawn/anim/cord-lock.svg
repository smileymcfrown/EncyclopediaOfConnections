</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222">
<text x="366" y="74" text-anchor="end">squeeze</text>
<text x="250" y="190" text-anchor="end">barrel</text><line x1="256" y1="186" x2="300" y2="200" stroke="#222" stroke-width="2"/>
<text x="470" y="118">plunger</text><line x1="468" y1="124" x2="406" y2="156" stroke="#222" stroke-width="2"/>
<text x="490" y="350">spring</text><line x1="486" y1="344" x2="416" y2="334" stroke="#222" stroke-width="2"/>
<text x="60" y="244">cord</text>
<g><animate attributeName="opacity" dur="5s" repeatCount="indefinite" keyTimes="0;0.25;0.76;1" values="1;0;1;1" calcMode="discrete"/><text x="490" y="170">Let go: the spring pushes</text><text x="490" y="194">the plunger up, its hole is</text><text x="490" y="218">out of line and the cord</text><text x="490" y="242">is pinched in an S-bend</text></g>
<g opacity="0"><animate attributeName="opacity" dur="5s" repeatCount="indefinite" keyTimes="0;0.25;0.76;1" values="0;1;0;0" calcMode="discrete"/><text x="490" y="170">Squeezed: all three holes</text><text x="490" y="194">line up and the cord</text><text x="490" y="218">slides through freely</text></g>
<text x="400" y="438" text-anchor="middle" font-size="18">Friction holds the cord both ways until you squeeze</text>
</g></svg>
