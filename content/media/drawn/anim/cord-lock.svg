<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Cut-through of a barrel cord lock: a cord runs through holes in the barrel and in a sprung plunger; let go, the spring pushes the plunger up so its hole is out of line and the cord is pinched in an S-bend; the plunger is squeezed in against the spring, the three holes line up, the cord slides through, and on letting go it is pinched again.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
