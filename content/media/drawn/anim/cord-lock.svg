<polygon points="300,271 320,271 320,370 440,370 440,271 460,271 460,390 300,390" fill="#cfe3f5" stroke="#222" stroke-width="3"/>
<polygon points="410,150 460,150 460,249 440,249 440,170 410,170" fill="#cfe3f5" stroke="#222" stroke-width="3"/>
