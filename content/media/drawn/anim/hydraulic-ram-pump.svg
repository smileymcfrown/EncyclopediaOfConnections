<text x="345" y="410" text-anchor="middle" font-weight="bold" opacity="0.25">2 valve slams: surge<animate attributeName="opacity" values="0.25;0.25;1;1;0.25;0.25" keyTimes="0;0.46;0.5;0.62;0.66;1" dur="4s" repeatCount="indefinite"/></text>
