<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Animated: a hydraulic ram pump on a hillside: water runs down a long drive pipe from a source and out of an open waste valve; the fast flow slams the valve shut, the pressure surge (water hammer) opens a one-way valve into an air chamber, and the squeezed air pushes a little water up a thin pipe to a tank far higher than the source; the cycle repeats, with the waste valve dropping open again after each surge.</title>
