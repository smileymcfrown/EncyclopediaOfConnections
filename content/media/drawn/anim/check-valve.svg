<g transform="translate(296,90)"><g><animateTransform attributeName="transform" type="scale" dur="5s" repeatCount="indefinite" keyTimes="0;0.4;0.47;0.9;0.97;1" values="1 1;1 1;1.3 1;1.3 1;1 1;1 1" calcMode="spline" keySplines="0 0 1 1;0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1;0 0 1 1"/><polyline points="0,0 -3,0 -8.1,-16 -18.4,16 -28.6,-16 -38.9,16 -49.1,-16 -59.4,16 -69.6,-16 -79.9,16 -85,0 -88,0" fill="none" stroke="#222" stroke-width="3" vector-effect="non-scaling-stroke"/></g></g>
<circle cx="174" cy="90" r="34" fill="#fde2c4" stroke="#222" stroke-width="3"><animate attributeName="cx" dur="5s" repeatCount="indefinite" keyTimes="0;0.4;0.47;0.9;0.97;1" values="174;174;146;146;174;174" calcMode="spline" keySplines="0 0 1 1;0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1;0 0 1 1"/></circle>
<g opacity="1"><animate attributeName="opacity" dur="5s" repeatCount="indefinite" keyTimes="0;0.4;0.45;0.95;0.99;1" values="1;1;0;0;1;1"/><circle r="4.5" fill="#d1495b"><animateMotion dur="1.25s" repeatCount="indefinite" begin="-0s" path="M5,80 L115,80 C150,40 200,32 250,42 L290,52 C312,70 330,80 378,82"/></circle><circle r="4.5" fill="#d1495b"><animateMotion dur="1.25s" repeatCount="indefinite" begin="-0.3s" path="M5,80 L115,80 C150,40 200,32 250,42 L290,52 C312,70 330,80 378,82"/></circle><circle r="4.5" fill="#d1495b"><animateMotion dur="1.25s" repeatCount="indefinite" begin="-0.6s" path="M5,80 L115,80 C150,40 200,32 250,42 L290,52 C312,70 330,80 378,82"/></circle><circle r="4.5" fill="#d1495b"><animateMotion dur="1.25s" repeatCount="indefinite" begin="-0.9s" path="M5,80 L115,80 C150,40 200,32 250,42 L290,52 C312,70 330,80 378,82"/></circle><circle r="4.5" fill="#d1495b"><animateMotion dur="1.25s" repeatCount="indefinite" begin="-0.1s" path="M5,100 L115,100 C150,140 200,148 250,138 L290,128 C312,110 330,100 378,98"/></circle><circle r="4.5" fill="#d1495b"><animateMotion dur="1.25s" repeatCount="indefinite" begin="-0.5s" path="M5,100 L115,100 C150,140 200,148 250,138 L290,128 C312,110 330,100 378,98"/></circle><circle r="4.5" fill="#d1495b"><animateMotion dur="1.25s" repeatCount="indefinite" begin="-0.8s" path="M5,100 L115,100 C150,140 200,148 250,138 L290,128 C312,110 330,100 378,98"/></circle><circle r="4.5" fill="#d1495b"><animateMotion dur="1.25s" repeatCount="indefinite" begin="-1.1s" path="M5,100 L115,100 C150,140 200,148 250,138 L290,128 C312,110 330,100 378,98"/></circle></g>
