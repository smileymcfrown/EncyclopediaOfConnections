</g>
<g transform="translate(410,120)"><polygon points="0,60 176,60 176,20 310,20 310,60 380,60 380,120 310,120 310,160 176,160 176,120 0,120" fill="#cfe3f5"/><polygon points="0,42 130,42 130,5 330,5 330,42 380,42 380,60 310,60 310,20 176,20 176,60 0,60" fill="url(#hatch)" stroke="#222" stroke-width="3"/><polygon points="0,138 130,138 130,175 330,175 330,138 380,138 380,120 310,120 310,160 176,160 176,120 0,120" fill="url(#hatch)" stroke="#222" stroke-width="3"/>
<g><animateTransform attributeName="transform" type="rotate" dur="5s" repeatCount="indefinite" keyTimes="0;0.4;0.47;0.9;0.97;1" values="-62 180 52;-62 180 52;0 180 52;0 180 52;-62 180 52;-62 180 52" calcMode="spline" keySplines="0 0 1 1;0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1;0 0 1 1"/><rect x="176" y="50" width="9" height="76" rx="3" fill="#fde2c4" stroke="#222" stroke-width="3"/></g><circle cx="180" cy="52" r="6" fill="#fff" stroke="#222" stroke-width="2.5"/><circle cx="180" cy="52" r="2" fill="#222"/>
<g opacity="1"><animate attributeName="opacity" dur="5s" repeatCount="indefinite" keyTimes="0;0.4;0.45;0.95;0.99;1" values="1;1;0;0;1;1"/><circle r="4.5" fill="#d1495b"><animateMotion dur="1.25s" repeatCount="indefinite" begin="-0s" path="M5,100 L160,100 C200,118 240,132 280,124 L378,100"/></circle><circle r="4.5" fill="#d1495b"><animateMotion dur="1.25s" repeatCount="indefinite" begin="-0.3s" path="M5,100 L160,100 C200,118 240,132 280,124 L378,100"/></circle><circle r="4.5" fill="#d1495b"><animateMotion dur="1.25s" repeatCount="indefinite" begin="-0.6s" path="M5,100 L160,100 C200,118 240,132 280,124 L378,100"/></circle><circle r="4.5" fill="#d1495b"><animateMotion dur="1.25s" repeatCount="indefinite" begin="-0.9s" path="M5,100 L160,100 C200,118 240,132 280,124 L378,100"/></circle><circle r="4.5" fill="#d1495b"><animateMotion dur="1.25s" repeatCount="indefinite" begin="-0.1s" path="M5,80 L160,80 C200,100 245,116 285,108 L378,84"/></circle><circle r="4.5" fill="#d1495b"><animateMotion dur="1.25s" repeatCount="indefinite" begin="-0.5s" path="M5,80 L160,80 C200,100 245,116 285,108 L378,84"/></circle><circle r="4.5" fill="#d1495b"><animateMotion dur="1.25s" repeatCount="indefinite" begin="-0.8s" path="M5,80 L160,80 C200,100 245,116 285,108 L378,84"/></circle><circle r="4.5" fill="#d1495b"><animateMotion dur="1.25s" repeatCount="indefinite" begin="-1.1s" path="M5,80 L160,80 C200,100 245,116 285,108 L378,84"/></circle></g>
<g opacity="0"><animate attributeName="opacity" dur="5s" repeatCount="indefinite" keyTimes="0;0.42;0.47;0.9;0.95;1" values="0;0;1;1;0;0"/><line x1="378" y1="78" x2="336" y2="78" stroke="#d1495b" stroke-width="5" marker-end="url(#ah)"/><line x1="378" y1="102" x2="336" y2="102" stroke="#d1495b" stroke-width="5" marker-end="url(#ah)"/></g>
</g>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#222">
<g font-weight="bold" text-anchor="middle"><text x="200" y="50">Ball and spring</text><text x="600" y="50">Hinged flap (swing check)</text></g>
<text x="200" y="100" text-anchor="middle" font-size="18">ball, spring holds it on the seat</text>
<text x="600" y="100" text-anchor="middle" font-size="18">flap hangs on a hinge pin</text>
<text x="200" y="340" text-anchor="middle">→ flow: pushed open<animate attributeName="opacity" dur="5s" repeatCount="indefinite" keyTimes="0;0.42;0.47;0.92;0.97;1" values="1;1;0.25;0.25;1;1"/></text><text x="200" y="368" text-anchor="middle">← back-pressure: pressed shut<animate attributeName="opacity" dur="5s" repeatCount="indefinite" keyTimes="0;0.42;0.47;0.92;0.97;1" values="0.25;0.25;1;1;0.25;0.25"/></text>
<text x="600" y="340" text-anchor="middle">→ flow: pushed open<animate attributeName="opacity" dur="5s" repeatCount="indefinite" keyTimes="0;0.42;0.47;0.92;0.97;1" values="1;1;0.25;0.25;1;1"/></text><text x="600" y="368" text-anchor="middle">← back-pressure: pressed shut<animate attributeName="opacity" dur="5s" repeatCount="indefinite" keyTimes="0;0.42;0.47;0.92;0.97;1" values="0.25;0.25;1;1;0.25;0.25"/></text>
<text x="400" y="430" text-anchor="middle" font-size="18">Forward flow must beat a small cracking pressure · reverse flow only seals it tighter</text>
</g>
</svg>
