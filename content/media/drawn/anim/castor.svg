<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>A swivel castor: a side view shows the wheel's axle a short distance (the trail) behind the vertical swivel pivot, and a top view shows a trolley being pushed in a new direction with its four swivel castors swinging round to trail behind their pivots; the trolley is pushed round a square and at each corner the castors swing round to trail behind again.</title>
