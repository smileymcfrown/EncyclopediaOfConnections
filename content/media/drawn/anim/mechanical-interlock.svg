<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>A mechanical interlock: two sliding rods each have a notch, and a pin in a hole in the fixed block between them; in the animation rod 1 slides and holds the pin in rod 2's notch so rod 2 is locked, then rod 1 returns and rod 2 slides, its ramp pushing the pin up into rod 1's notch so rod 1 is locked.</title>
