<text x="132" y="40" font-size="20" text-anchor="middle" font-weight="bold">1. Printed flat</text>
<text x="397" y="40" font-size="20" text-anchor="middle" font-weight="bold">2. Into hot water</text>
<text x="662" y="40" font-size="20" text-anchor="middle" font-weight="bold">3. Folds and stays</text>
<text x="132" y="230" font-size="18" text-anchor="middle">stretch locked in</text>
<text x="132" y="342" font-size="18" text-anchor="middle">print bed</text>
<text x="397" y="172" font-size="18" text-anchor="middle">about 70 °C</text>
<text x="397" y="232" font-size="18" text-anchor="middle">PLA shrinks</text>
<text x="76" y="385" font-size="18">stretched PLA</text>
<text x="336" y="385" font-size="18">TPU (does not shrink)</text>
<text x="596" y="385" font-size="18">stiff panel</text>
<text x="400" y="432" font-size="18" text-anchor="middle" font-weight="bold">The shrinking top layer bends each hinge, like a bimetal strip</text>
