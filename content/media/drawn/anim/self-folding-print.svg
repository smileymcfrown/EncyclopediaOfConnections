<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Three side views of a self-folding print: a flat strip of stiff panels joined by two-layer hinges (a stretched PLA layer on a TPU layer) printed on the bed, the strip dropped into hot water where the PLA layer shrinks, and the strip folded up into a U shape that it keeps after cooling; the last view starts flat and curls up.</title>
