<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Two rings of lopsided teeth, drawn unrolled flat and pressed together by springs, shown moving: turning to tighten, the gentle slopes push the top ring up until it clicks over a tooth, again and again; turning to undo, the steep faces meet and both rings turn together.</title>
