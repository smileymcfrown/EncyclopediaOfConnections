<g font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222">
<text x="205" y="45" text-anchor="middle" font-size="21" font-weight="bold">Tighten, too hard</text>
<text x="595" y="45" text-anchor="middle" font-size="21" font-weight="bold">Undo</text>
<text x="205" y="85" text-anchor="middle">gentle slopes slide</text>
<text x="595" y="85" text-anchor="middle">steep faces meet</text>
<text x="164" y="178">pushed up</text>
<text x="326" y="170">spring</text>
<text x="205" y="333" text-anchor="middle">to the cap or screw</text>
<text x="205" y="385" text-anchor="middle">top ring hops a tooth: click</text>
<text x="595" y="385" text-anchor="middle">drives solidly, always undoes</text>
<text x="400" y="432" text-anchor="middle" font-size="18">Teeth shown unrolled flat · a stronger spring or steeper slope clicks at a higher torque</text>
</g>
</svg>
