<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>A grid of square cells, most with a diagonal brace, shown before and after a push: the unbraced middle column leans over into parallelograms so the braced block on its right swings down like the end of a linkage while the left block stays fixed; a third panel shows a door latch idea where a row of unbraced cells shears so the bolt pulls in. The middle panel loops between the push and rest: the plain cells lean over and stand back up; in the latch panel the hinge row shears to and fro so the bolt slides in and out.</title>
