<g font-size="20" font-weight="bold"><text x="140" y="40">Before</text><text x="400" y="40">After a push</text><text x="665" y="40">Door latch idea</text></g>
<text x="140" y="314">braced cells: rigid</text>
<text x="140" y="340">plain cells: hinge</text>
<text x="400" y="314">column leans over</text>
<text x="400" y="340">block swings down</text>
<text x="462" y="90" text-anchor="start">push</text>
<text x="600" y="132" text-anchor="start">handle</text>
<text x="650" y="300">hinge row shears</text>
<text x="650" y="326">bolt pulls in</text>
<text x="400" y="420">One printed piece: stiff cells act as levers, leaning cells act as hinges</text>
