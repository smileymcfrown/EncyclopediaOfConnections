<g font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#222">
<text x="12" y="125">turn the screw</text>
<text x="384" y="379">nut runs along</text>
<text x="470" y="332" font-size="18">guide stops it spinning</text>
<text x="60" y="58">return tube carries the balls back</text>
<text x="530" y="128">balls roll in the grooves</text>
<text x="600" y="300" text-anchor="middle">grooved screw</text>
<text x="400" y="434" text-anchor="middle" font-size="17">Rolling, not sliding: about 90% efficient (lead screw: about 25%), so a load can drive it back</text>
</g>
