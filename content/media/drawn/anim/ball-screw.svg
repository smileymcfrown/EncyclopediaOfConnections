<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Cutaway of a ball screw: a grooved screw turned by a handle, a nut cut open to show a row of steel balls rolling in the matching grooves between screw and nut, and a return tube on top of the nut carrying the balls back to the other end; as the screw turns one way and then back, the nut runs along it and the balls circulate through the tube.</title>
