<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Cut-away of a single-plate friction clutch, shown working: with the pedal up the springs clamp the friction disc between flywheel and pressure plate and both shafts turn together; pressing the pedal pushes the release bearing, the levers pull the plate back and the gearbox shaft coasts to a stop; letting go, the disc slips and warms, then grips and turns again.</title>
