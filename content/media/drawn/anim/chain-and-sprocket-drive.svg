<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>A chain and sprocket drive: a small 12-tooth sprocket drives a large 36-tooth sprocket through a roller chain whose rollers drop into the gaps between the teeth; the top run is pulled tight and the bottom run sags slack; both sprockets turn the same way, the large one three times slower, while the chain runs round them.</title>
