<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Animated: indexable clamping lever, cut open from the side and seen from above: a spring holds the teeth inside the lever in mesh with a toothed insert on the screw, so turning the lever turns the screw; lifting the lever frees the teeth so it can swing back without turning the screw, then it drops into mesh at a new angle; the animation tightens, lifts, swings back and drops in, like a ratchet spanner.</title>
