<text x="190" y="30" text-anchor="middle" font-weight="bold" font-size="19">Two elastic loops inside</text>
<text x="590" y="30" text-anchor="middle" font-weight="bold" font-size="19">One joint, see-through</text>
<text x="240" y="74" font-size="17">head hangs on</text><text x="240" y="94" font-size="17">the leg loop</text>
