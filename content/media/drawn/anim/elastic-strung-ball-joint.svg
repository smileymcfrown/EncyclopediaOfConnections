<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>A see-through ball-jointed doll and a close-up of one of its joints. Inside the doll, one elastic loop runs across the chest and out through both arms to S-hooks at the hands, and a second runs as an upside-down V from a hook in the head down both legs to hooks at the feet. In a see-through close-up of one joint, the stretched cord runs through a hole in the cup and the ball, pulling the ball into the cup so the rubbing holds the pose. The animation tilts the forearm one way and the other on its ball, where it stays put, then pulls it out of the cup and lets go, and the cord snaps it back in.</title>
