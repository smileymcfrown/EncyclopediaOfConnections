<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle">
<text x="118" y="200" font-size="17">from motor</text><text x="262" y="84">rotor</text><text x="334" y="84">armature</text><text x="255" y="384">coil (fixed)</text><text x="350" y="384" text-anchor="start">springs</text><text x="560" y="200">output</text><text x="106" y="24" font-size="17">power switch</text><g text-anchor="start" font-size="17"><text x="424" y="99">air gap (really 0.2-0.5 mm)</text></g><text x="400" y="420" font-size="19">Power on: the coil pulls the armature onto the spinning rotor and the output turns.</text><text x="400" y="443" font-size="19">Power off: the springs pull it back across the gap and the output stops.</text>
</g>
</svg>
