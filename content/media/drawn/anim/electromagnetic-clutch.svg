<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Side cut-away of an electromagnetic clutch: the input shaft carries a spinning rotor around a fixed coil; across a small air gap sits a steel armature plate, held back by springs on the output hub, so with the power off the output shaft stands still. Animated: the switch closes, the coil lights up and magnetic flux loops through rotor and armature, the armature snaps onto the rotor and the output speeds up to turn with the input; the switch opens, the springs pull the armature back and the output coasts to a stop.</title>
