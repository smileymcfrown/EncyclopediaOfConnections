<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Animated side view of a swing-top bottle: the wire lever, pivoted on a collar round the neck, swings up and the wire loop lifts the porcelain stopper off the mouth; then the lever swings down, the loop pulls the stopper onto the rubber seal and squashes it, and the lever's hook passes just over the dead point (the dashed line from stopper through pivot) so the seal's push keeps it locked.</title>
