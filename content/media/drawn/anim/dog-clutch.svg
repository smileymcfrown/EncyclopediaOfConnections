<g font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222">
<text x="30" y="40">fork slides the ring</text>
<text x="20" y="166">drive in</text>
<text x="110" y="330">hex: the ring slides but</text><text x="110" y="354">must turn with the shaft</text><line x1="190" y1="312" x2="215" y2="244" stroke="#222" stroke-width="2"/>
<text x="340" y="40">ring with dogs</text><line x1="350" y1="48" x2="270" y2="150" stroke="#222" stroke-width="2"/>
<text x="560" y="330" text-anchor="end">gear, free</text><text x="560" y="354" text-anchor="end">on the shaft</text><line x1="500" y1="312" x2="362" y2="280" stroke="#222" stroke-width="2"/>
<text x="724" y="124">shaft</text><text x="746" y="298">gear</text>
<text x="676" y="40" text-anchor="middle" font-size="18">End views</text>
<g opacity="0"><animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;0.26;0.4;0.78;0.92" values="1;0;0;0;1" calcMode="discrete"/><text x="400" y="404" text-anchor="middle" font-size="20">Apart: the shaft turns, the gear stays still</text></g>
<g opacity="0"><animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;0.26;0.4;0.78;0.92" values="0;1;0;1;0" calcMode="discrete"/><text x="400" y="404" text-anchor="middle" font-size="20">Stopped: the fork slides the ring in or out</text></g>
<g opacity="0"><animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;0.26;0.4;0.78;0.92" values="0;0;1;0;0" calcMode="discrete"/><text x="400" y="404" text-anchor="middle" font-size="20">Engaged: dogs in the slots, gear and shaft turn together</text></g>
<text x="400" y="438" text-anchor="middle" font-size="17">Engage only when stopped or at matched speeds, or the dogs bang</text>
</g></svg>
