<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Side view of a dog clutch: a shaft with a hex section carries a ring that a fork can slide along; the ring's square dogs fit slots in the face of a gear that spins freely on the same shaft; end views show the shaft and the gear; with the ring pulled back the shaft turns and the gear stays still, the shaft stops, the fork slides the ring in so its dogs drop into the slots, then shaft and gear turn together at the same speed, and stop again for the ring to be pulled back.</title>
