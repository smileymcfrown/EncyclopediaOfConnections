<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Three kinds of friction brake: a spinning disc pinched between two pads, two curved shoes pushed outward against the inside of a spinning drum, and a band wrapped round a drum with one end anchored and the other pulled tight by a lever. The animation releases and re-applies all three brakes: the pads, shoes and band ease off, the drums spin up, then the brakes grip again and the spin dies away.</title>
