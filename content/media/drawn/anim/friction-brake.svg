<text x="133" y="40" font-size="20" font-weight="bold">Disc and pads</text>
<text x="400" y="40" font-size="20" font-weight="bold">Shoes in a drum</text>
<text x="667" y="40" font-size="20" font-weight="bold">Band round a drum</text>
<text x="133" y="76">pads pinch the disc</text>
<text x="133" y="395">disc spins</text>
<text x="400" y="76">shoes pushed out</text>
<text x="400" y="372">drum spins</text>
<text x="600" y="372">fixed end</text>
<text x="735" y="398">pull lever</text>
<text x="400" y="436" font-size="19">Friction turns the spin into heat, so the part slows, stops or is held still</text>
