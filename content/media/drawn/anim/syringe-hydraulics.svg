<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>A thin syringe and a fat syringe joined by a liquid-filled tube, animated: the thin plunger is pushed a long way down and the liquid flows along the tube to lift the fat plunger and its heavy load a short way, both pressure gauges rise together and an air bubble shrinks; then the thin plunger is pulled back and the load comes down again.</title>
