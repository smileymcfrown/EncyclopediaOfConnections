<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Animated: a cam latch seen from inside the cabinet and in a section from above: turning the knob a quarter turn swings the flat cam from alongside the door edge to behind the lip of the frame, where it holds the door shut; the grip is the distance from the latch face to the cam's contact face.</title>
