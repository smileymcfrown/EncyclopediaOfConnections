<path d="M215.5,315.3 A92,92 0 0 0 339.3,252.3" fill="none" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<rect x="680" y="262" width="110" height="38" fill="url(#hatch)"/>
