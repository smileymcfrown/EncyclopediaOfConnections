<line x1="215" y1="40" x2="215" y2="150" stroke="#d1495b" stroke-width="5" marker-end="url(#ah)"><animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;0.08;0.2;0.26;0.38;0.44;0.66;0.71;0.81;0.85;0.97;1" values="1;1;1;1;.25;.25;.25;.25;.25;.25;.25;1"/></line>
<path d="M285,338 A120,22 0 0 0 432,352" fill="none" stroke="#d1495b" stroke-width="5" marker-end="url(#ah)"><animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;0.08;0.2;0.26;0.38;0.44;0.66;0.71;0.81;0.85;0.97;1" values=".25;.25;.25;1;1;.25;.25;.25;.25;.25;.25;.25"/></path>
<line x1="480" y1="302" x2="480" y2="262" stroke="#d1495b" stroke-width="5" marker-end="url(#ah)"><animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;0.08;0.2;0.26;0.38;0.44;0.66;0.71;0.81;0.85;0.97;1" values=".25;.25;.25;.25;1;1;1;.25;.25;.25;.25;.25"/></line>
<line x1="562" y1="360" x2="526" y2="360" stroke="#222" stroke-width="2"/>
<line x1="240" y1="298" x2="346" y2="298" stroke="#222" stroke-width="2"/>
<line x1="562" y1="252" x2="454" y2="272" stroke="#222" stroke-width="2"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#222">
<text x="200" y="88" text-anchor="end">1. push</text><text x="200" y="112" text-anchor="end">pin into slot</text>
<text x="250" y="190" text-anchor="end">plug</text>
<text x="236" y="304" text-anchor="end">L-shaped slot</text>
<text x="300" y="384">2. twist</text>
<text x="566" y="234">3. spring lifts the</text><text x="566" y="258">pin into the hook</text>
<text x="566" y="366">spring</text>
<text x="240" y="392" text-anchor="end">socket</text>
<text x="400" y="434" text-anchor="middle" font-size="18">To undo: push in against the spring, twist back, pull out</text>
</g>
</svg>
