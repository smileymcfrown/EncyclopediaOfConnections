<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>A bayonet mount in three steps: the pin on a round plug lines up with an L-shaped slot in the socket and is pushed down against a spring, twisted along the short arm of the slot, then lifted by the spring into a small hook so it cannot turn back; the plug is pushed in, twisted and locked, then pushed, twisted back and pulled out again.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
<marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#e8e8e8"/><line x1="0" y1="0" x2="0" y2="10" stroke="#222" stroke-width="2"/></pattern>
</defs>
<g stroke-linejoin="round" stroke-linecap="round">
<rect x="455" y="325" width="75" height="67" fill="#d0d0d0"/>
<g><animateTransform attributeName="transform" type="translate" dur="6s" repeatCount="indefinite" keyTimes="0;0.08;0.2;0.26;0.38;0.44;0.66;0.71;0.81;0.85;0.97;1" values="0 0;0 0;0 112;0 138;0 138;0 124;0 124;0 138;0 138;0 112;0 0;0 0"/>
<rect x="270" y="40" width="260" height="170" fill="#cfe3f5" stroke="#222" stroke-width="3"/>
<rect x="262" y="40" width="276" height="34" rx="6" fill="#cfe3f5" stroke="#222" stroke-width="3"/>
<line x1="282" y1="46" x2="282" y2="68" stroke="#222" stroke-width="2"/><line x1="298" y1="46" x2="298" y2="68" stroke="#222" stroke-width="2"/><line x1="314" y1="46" x2="314" y2="68" stroke="#222" stroke-width="2"/><line x1="330" y1="46" x2="330" y2="68" stroke="#222" stroke-width="2"/><line x1="346" y1="46" x2="346" y2="68" stroke="#222" stroke-width="2"/><line x1="362" y1="46" x2="362" y2="68" stroke="#222" stroke-width="2"/><line x1="378" y1="46" x2="378" y2="68" stroke="#222" stroke-width="2"/><line x1="394" y1="46" x2="394" y2="68" stroke="#222" stroke-width="2"/><line x1="410" y1="46" x2="410" y2="68" stroke="#222" stroke-width="2"/><line x1="426" y1="46" x2="426" y2="68" stroke="#222" stroke-width="2"/><line x1="442" y1="46" x2="442" y2="68" stroke="#222" stroke-width="2"/><line x1="458" y1="46" x2="458" y2="68" stroke="#222" stroke-width="2"/><line x1="474" y1="46" x2="474" y2="68" stroke="#222" stroke-width="2"/><line x1="490" y1="46" x2="490" y2="68" stroke="#222" stroke-width="2"/><line x1="506" y1="46" x2="506" y2="68" stroke="#222" stroke-width="2"/><line x1="522" y1="46" x2="522" y2="68" stroke="#222" stroke-width="2"/>
<line x1="360" y1="78" x2="360" y2="200" stroke="#7a9cc0" stroke-width="4"><animate attributeName="x1" dur="6s" repeatCount="indefinite" keyTimes="0;0.08;0.2;0.26;0.38;0.44;0.66;0.71;0.81;0.85;0.97;1" values="360;360;360;360;440;440;440;440;360;360;360;360"/><animate attributeName="x2" dur="6s" repeatCount="indefinite" keyTimes="0;0.08;0.2;0.26;0.38;0.44;0.66;0.71;0.81;0.85;0.97;1" values="360;360;360;360;440;440;440;440;360;360;360;360"/></line>
</g>
<g transform="translate(492,392)"><g><animateTransform attributeName="transform" type="scale" dur="6s" repeatCount="indefinite" keyTimes="0;0.08;0.2;0.26;0.38;0.44;0.66;0.71;0.81;0.85;0.97;1" values="1 1;1 1;1 1;1 0.6;1 0.6;1 0.8;1 0.8;1 0.6;1 0.6;1 1;1 1;1 1"/><polyline points="0,0 0,-3 22,-7 -22,-15 22,-23 -22,-31 22,-39 -22,-47 22,-55 -22,-63 0,-67 0,-70" fill="none" stroke="#222" stroke-width="3" vector-effect="non-scaling-stroke"/></g></g>
