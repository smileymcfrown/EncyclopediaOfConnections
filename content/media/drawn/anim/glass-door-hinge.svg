<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Animated glass cabinet door on a pivot hinge. Left, seen from above: the door, gripped at its corner by a padded metal clamp, swings open a quarter turn about the clamp's pin and closes again onto its magnetic catch. Right, a clamp cut open: plastic pads line the metal jaws so metal never touches the glass, a screw squeezes the pads, and the pin turns in a plastic sleeve in the cabinet base.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#e8e8e8"/><line x1="0" y1="0" x2="0" y2="10" stroke="#222" stroke-width="2"/></pattern></defs>
<line x1="430" y1="20" x2="430" y2="400" stroke="#cccccc" stroke-width="2"/>
<g stroke="#222" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
<path d="M60,90 L240,90 L240,196 L220,196 L220,108 L80,108 L80,196 L60,196 Z" fill="#fde2c4"/>
<rect x="208" y="190" width="12" height="15" fill="#9a9a9a" stroke-width="2"/>
<path d="M238,216 A164,164 0 0 1 74,380" fill="none" stroke="#999" stroke-width="2" stroke-dasharray="7 6"/>
<g>
<animateTransform attributeName="transform" type="rotate" values="0 74 216;0 74 216;90 74 216;90 74 216;0 74 216;0 74 216" keyTimes="0;0.12;0.42;0.58;0.88;1" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
<rect x="64" y="210" width="174" height="12" fill="#d6efed"/>
<rect x="207" y="205" width="12" height="5" fill="#9a9a9a" stroke-width="2"/>
<rect x="62" y="204" width="38" height="24" rx="3" fill="#e8e8e8"/>
<rect x="64" y="206" width="34" height="4" fill="#d8f0d2" stroke-width="2"/><rect x="64" y="222" width="34" height="4" fill="#d8f0d2" stroke-width="2"/>
<circle cx="74" cy="216" r="5" fill="#222"/>
</g>
<rect x="470" y="340" width="310" height="50" fill="#fde2c4"/>
<rect x="597" y="340" width="30" height="34" fill="#d8f0d2"/>
<rect x="604" y="316" width="16" height="54" fill="#e8e8e8"/>
<path d="M574,228 L586,228 L586,312 L638,312 L638,228 L650,228 L650,324 L574,324 Z" fill="url(#hatch)"/>
<rect x="586" y="232" width="12" height="80" fill="#d8f0d2"/><rect x="626" y="232" width="12" height="80" fill="#d8f0d2"/><rect x="598" y="302" width="28" height="10" fill="#d8f0d2"/>
<rect x="598" y="80" width="28" height="222" fill="#d6efed"/>
<rect x="632" y="262" width="40" height="16" fill="#e8e8e8"/><line x1="672" y1="264" x2="672" y2="276" stroke-width="5"/>
</g>
<line x1="604" y1="100" x2="604" y2="200" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
<g stroke="#d1495b" stroke-width="4" fill="none" stroke-linecap="round" marker-end="url(#ah)">
<path d="M196,258 A130,130 0 0 1 120,334"><animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.1;0.16;0.86;0.92;1" dur="6s" repeatCount="indefinite"/></path>
<line x1="700" y1="270" x2="678" y2="270"/>
<path d="M560,366 A40,10 0 1 0 600,357"/>
</g>
<g stroke="#222" stroke-width="1.5"><line x1="560" y1="170" x2="596" y2="170"/><line x1="676" y1="215" x2="640" y2="244"/><line x1="552" y1="288" x2="588" y2="288"/><line x1="236" y1="150" x2="214" y2="182"/><line x1="40" y1="252" x2="70" y2="221"/></g>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle">
<text x="215" y="38" font-size="21" font-weight="bold">Seen from above</text>
<text x="615" y="38" font-size="21" font-weight="bold">Corner clamp, cut open</text>
<text x="150" y="72">cabinet (top cut away)</text>
<text x="320" y="124">magnetic catch</text><text x="320" y="146">holds it shut</text>
<text x="252" y="262" text-anchor="start">glass door swings</text><text x="252" y="284" text-anchor="start">a quarter turn on</text><text x="252" y="306" text-anchor="start">its corner pin</text><text x="22" y="270" text-anchor="start">pin</text>
<text x="515" y="166">glass</text><text x="515" y="188">door</text>
<text x="716" y="190">metal clamp</text><text x="716" y="212">(cut)</text>
<text x="736" y="276" font-size="17">screw</text><text x="736" y="296" font-size="17">squeezes</text>
<text x="506" y="250">plastic pads:</text><text x="506" y="272">no metal</text><text x="506" y="294">on glass</text>
<text x="680" y="420">pin turns in a plastic sleeve</text>
</g>
<text x="215" y="420" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#222">Glass can't hold a screw, so the hinge grips it</text>
</svg>
