<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Animated snap-up card cube: the cube is pressed flat, which pulls two opposite corners apart and stretches the rubber band inside; let go, the band shortens and snaps the four card sides back into a cube. Beside it a paper spring of two strips folded over each other squashes down and springs back up under a figure.</title>
