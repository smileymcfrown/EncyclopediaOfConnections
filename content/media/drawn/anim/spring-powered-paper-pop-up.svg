<g font-family="Arial, Helvetica, sans-serif" fill="#222"><text x="220" y="36" font-size="20" text-anchor="middle" font-weight="bold">Let go: the band pulls it into a cube</text><text x="620" y="36" font-size="20" text-anchor="middle" font-weight="bold">Pressed flat</text><text x="660" y="256" font-size="20" text-anchor="middle" font-weight="bold">Paper spring</text><text x="20" y="380" font-size="19">card cube</text><line x1="70" y1="364" x2="140" y2="300" stroke="#222" stroke-width="1.5"/><text x="250" y="92" font-size="18">rubber band inside,</text><text x="250" y="113" font-size="18">hooked on two corners</text><line x1="268" y1="120" x2="245" y2="221" stroke="#222" stroke-width="1.5"/><text x="620" y="84" font-size="18" text-anchor="middle">band stretched, pulling in</text><text x="620" y="210" font-size="18" text-anchor="middle">two corners pulled apart</text><text x="608" y="330" font-size="18">two strips</text><text x="608" y="351" font-size="18">folded over</text><text x="608" y="372" font-size="18">each other</text><text x="400" y="438" font-size="18" text-anchor="middle">Pressing it flat stores energy in the band; letting go, the band shortens and springs it up</text></g>
