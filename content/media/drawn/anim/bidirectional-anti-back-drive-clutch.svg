<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Cross-section of a two-way locking clutch: a square output hub sits inside a fixed ring with spring-loaded rollers in the wedge-shaped gaps; turning the output from the load side jams the rollers, while turning the input lets its pins push the rollers free and then drive the output. Animated: in A the load nudges the output and a roller jams it at once; in B the pins free the rollers, the whole cage turns, and the rollers spring back when the input stops.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#d1495b"/></marker>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#e8e8e8"/><line x1="0" y1="0" x2="0" y2="10" stroke="#222" stroke-width="2"/></pattern>
<path id="ring" d="M-140,0 A140,140 0 1,0 140,0 A140,140 0 1,0 -140,0 Z M-100,0 A100,100 0 1,1 100,0 A100,100 0 1,1 -100,0 Z" fill="url(#hatch)" fill-rule="evenodd" stroke="#222" stroke-width="3"/>
<polygon id="hub" points="-48,-70 48,-70 70,-48 70,48 48,70 -48,70 -70,48 -70,-48" fill="#cfe3f5" stroke="#222" stroke-width="3" stroke-linejoin="round"/>
<g id="secA" stroke="#222" stroke-width="3">
<polyline points="-15,-83 -11,-89 -6,-77 -1,-89 4,-77 9,-89 13,-83" fill="none" stroke-width="2"/>
<circle cx="-28" cy="-83" r="13" fill="#f5d0d0"><animate attributeName="fill" values="#f5d0d0;#e58a96;#e58a96;#f5d0d0;#f5d0d0" keyTimes="0;0.15;0.55;0.7;1" dur="5s" repeatCount="indefinite"/></circle>
<circle cx="26" cy="-83" r="13" fill="#d8f0d2"/>
<circle cx="-65" cy="-65" r="7" fill="#fde2c4"/>
</g>
<g id="secB" stroke="#222" stroke-width="3">
<polyline points="-5,-83 -3,-89 0,-77 3,-89 6,-77 9,-89 11,-77 13,-83" fill="none" stroke-width="2"/>
<circle cx="-18" cy="-83" r="13" fill="#d8f0d2"/>
<circle cx="26" cy="-83" r="13" fill="#d8f0d2"/>
<circle cx="-37.9" cy="-83.8" r="7" fill="#fde2c4"/>
</g>
<g id="secC" stroke="#222" stroke-width="3">
<polyline points="-4.9,-83 -2.4,-89 0.2,-77 2.8,-89 5.3,-77 7.9,-89 10.4,-77 13.0,-83" fill="none" stroke-width="2"><animate attributeName="points" values="-4.9,-83 -2.4,-89 0.2,-77 2.8,-89 5.3,-77 7.9,-89 10.4,-77 13.0,-83;-4.9,-83 -2.4,-89 0.2,-77 2.8,-89 5.3,-77 7.9,-89 10.4,-77 13.0,-83;-9.9,-83 -6.7,-89 -3.4,-77 -0.1,-89 3.2,-77 6.4,-89 9.7,-77 13.0,-83;-15.0,-83 -11.0,-89 -7.0,-77 -3.0,-89 1.0,-77 5.0,-89 9.0,-77 13.0,-83;-15.0,-83 -11.0,-89 -7.0,-77 -3.0,-89 1.0,-77 5.0,-89 9.0,-77 13.0,-83;-15.0,-83 -11.0,-89 -7.0,-77 -3.0,-89 1.0,-77 5.0,-89 9.0,-77 13.0,-83;-15.0,-83 -11.0,-89 -7.0,-77 -3.0,-89 1.0,-77 5.0,-89 9.0,-77 13.0,-83;-15.0,-83 -11.0,-89 -7.0,-77 -3.0,-89 1.0,-77 5.0,-89 9.0,-77 13.0,-83;-15.0,-83 -11.0,-89 -7.0,-77 -3.0,-89 1.0,-77 5.0,-89 9.0,-77 13.0,-83;-15.0,-83 -11.0,-89 -7.0,-77 -3.0,-89 1.0,-77 5.0,-89 9.0,-77 13.0,-83;-15.0,-83 -11.0,-89 -7.0,-77 -3.0,-89 1.0,-77 5.0,-89 9.0,-77 13.0,-83;-15.0,-83 -11.0,-89 -7.0,-77 -3.0,-89 1.0,-77 5.0,-89 9.0,-77 13.0,-83;-15.0,-83 -11.0,-89 -7.0,-77 -3.0,-89 1.0,-77 5.0,-89 9.0,-77 13.0,-83;-9.9,-83 -6.7,-89 -3.4,-77 -0.1,-89 3.2,-77 6.4,-89 9.7,-77 13.0,-83;-4.9,-83 -2.4,-89 0.2,-77 2.8,-89 5.3,-77 7.9,-89 10.4,-77 13.0,-83;-4.9,-83 -2.4,-89 0.2,-77 2.8,-89 5.3,-77 7.9,-89 10.4,-77 13.0,-83" keyTimes="0.0000;0.5500;0.5667;0.5833;0.6000;0.6167;0.6333;0.6500;0.8000;0.8250;0.8500;0.8750;0.9000;0.9250;0.9500;1.0000" dur="5s" repeatCount="indefinite"/></polyline>
<g transform="translate(10.07 0)"><animateTransform attributeName="transform" type="translate" values="10.07 0;10.07 0;5.06 0;0.00 0;0.00 0;0.00 0;0.00 0;0.00 0;0.00 0;0.00 0;0.00 0;0.00 0;0.00 0;5.06 0;10.07 0;10.07 0" keyTimes="0.0000;0.5500;0.5667;0.5833;0.6000;0.6167;0.6333;0.6500;0.8000;0.8250;0.8500;0.8750;0.9000;0.9250;0.9500;1.0000" dur="5s" repeatCount="indefinite"/><circle cx="-28" cy="-83" r="13" fill="#d8f0d2"/></g>
<circle cx="26" cy="-83" r="13" fill="#d8f0d2"/>
<g transform="rotate(20.66)"><animateTransform attributeName="transform" type="rotate" values="20.66;20.66;17.22;13.78;10.33;6.89;3.44;0.00;0.00;3.44;6.89;10.33;13.78;17.22;20.66;20.66" keyTimes="0.0000;0.5500;0.5667;0.5833;0.6000;0.6167;0.6333;0.6500;0.8000;0.8250;0.8500;0.8750;0.9000;0.9250;0.9500;1.0000" dur="5s" repeatCount="indefinite"/><circle cx="-65" cy="-65" r="7" fill="#fde2c4"/></g>
</g>
</defs>
<g transform="translate(200,210)">
<use href="#ring"/><g><animateTransform attributeName="transform" type="rotate" values="0;1.5;1.5;0;0" keyTimes="0;0.15;0.55;0.7;1" calcMode="spline" keySplines="0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1;0 0 1 1" dur="5s" repeatCount="indefinite"/><use href="#hub"/></g>
<use href="#secA"/><use href="#secA" transform="rotate(90)"/><use href="#secA" transform="rotate(180)"/><use href="#secA" transform="rotate(270)"/>
<circle r="6" fill="#ffffff" stroke="#222" stroke-width="3"/><circle r="1.5" fill="#222"/>
<path d="M-39.5,-14.4 A42,42 0 0,1 39.5,-14.4" fill="none" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
</g>
<g transform="translate(600,210)">
<use href="#ring"/>
<g><animateTransform attributeName="transform" type="rotate" values="0;90;90" keyTimes="0;0.55;1" calcMode="spline" keySplines="0.4 0 0.6 1;0 0 1 1" dur="5s" repeatCount="indefinite"/><use href="#hub"/>
<use href="#secC"/><use href="#secC" transform="rotate(90)"/><use href="#secC" transform="rotate(180)"/><use href="#secC" transform="rotate(270)"/>
<circle r="6" fill="#ffffff" stroke="#222" stroke-width="3"/><circle r="1.5" fill="#222"/></g>
<path d="M-39.5,-14.4 A42,42 0 0,1 39.5,-14.4" fill="none" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<path d="M-146.8,-39.3 A152,152 0 0,1 -39.3,-146.8" fill="none" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
</g>
<g stroke="#222" stroke-width="2">
<line x1="362" y1="102" x2="300" y2="132"/>
<line x1="370" y1="244" x2="299" y2="238"/>
<line x1="442" y1="296" x2="510" y2="252"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#222">
<text x="400" y="98" text-anchor="middle">fixed ring</text>
<text x="400" y="252" text-anchor="middle">roller</text>
<text x="400" y="304" text-anchor="middle">input pin</text>
<text x="200" y="244" text-anchor="middle" font-size="18">output</text>
<text x="600" y="244" text-anchor="middle" font-size="18">output</text>
<text x="200" y="385" text-anchor="middle">A  Load turns the output:</text>
<text x="200" y="408" text-anchor="middle">a roller wedges, it locks</text>
<text x="600" y="385" text-anchor="middle">B  Turn the input: pins push</text>
<text x="600" y="408" text-anchor="middle">rollers free, then drive it</text>
<text x="400" y="440" text-anchor="middle" font-size="18">Same in both directions · the input drives, the load cannot</text>
</g>
</svg>
