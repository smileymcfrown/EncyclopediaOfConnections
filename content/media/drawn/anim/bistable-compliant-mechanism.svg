<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>A bistable compliant mechanism: a pre-curved springy beam clamped at both ends is pushed down until it flattens at its tipping point and then snaps into the opposite curve, shown beside a ball-on-a-hill energy curve with two valleys (the two stable shapes) and one peak; the beam is pushed down and snaps over, then pushed up and snaps back, while the ball climbs the hill and rolls into the other valley.</title>
