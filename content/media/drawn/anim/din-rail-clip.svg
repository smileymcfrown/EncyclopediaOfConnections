<g font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222">
<text x="20" y="40">DIN rail (35 mm top hat)</text><line x1="110" y1="46" x2="160" y2="140" stroke="#222" stroke-width="2"/>
<text x="250" y="62" text-anchor="middle">fixed hook</text>
<text x="20" y="380">spring latch</text><line x1="80" y1="386" x2="176" y2="352" stroke="#222" stroke-width="2"/>
<g font-weight="bold"><text x="556" y="132">Top view</text></g>
<text x="790" y="132" text-anchor="end">end stops</text><line x1="740" y1="138" x2="768" y2="164" stroke="#222" stroke-width="2"/>
<g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.1;0.54;0.88" values="1;0;0;1" calcMode="discrete"/><text x="556" y="340">Clipped on: hook over the</text><text x="556" y="364">top lip, latch behind the</text><text x="556" y="388">bottom lip</text></g>
<g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.1;0.54;0.88" values="0;1;0;0" calcMode="discrete"/><text x="556" y="340">Off: a screwdriver pulls</text><text x="556" y="364">the latch down, then tilt</text><text x="556" y="388">and lift the module off</text></g>
<g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.1;0.54;0.88" values="0;0;1;0" calcMode="discrete"/><text x="556" y="340">On: hook over the top lip,</text><text x="556" y="364">swing in, the sloped latch</text><text x="556" y="388">is pushed down and clicks</text></g>
<text x="790" y="312" text-anchor="end" font-size="17">modules slide along</text>
<text x="556" y="444" font-size="18">Hook on, swing in, click</text>
</g></svg>
