<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Side cross-section of a 35 mm top-hat DIN rail on a wall with a module clipped on: a fixed hook on the module hangs over the top lip and a spring latch sits behind the bottom lip; a small top view shows modules side by side on the rail between two end stops; the module is taken off (a screwdriver pulls the latch down, the module tilts and lifts off) and put back on (hook over the top lip, swing in, the sloped latch is pushed down and clicks up behind the lip), while in the top view a module slides along the rail.</title>
