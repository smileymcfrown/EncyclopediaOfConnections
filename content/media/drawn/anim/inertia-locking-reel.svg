<g transform="rotate(-15 190 105)"><animateTransform attributeName="transform" type="rotate" values="-15 190 105;-15 190 105;0 190 105;0 190 105;-15 190 105;-15 190 105" keyTimes="0;0.42;0.47;0.74;0.8;1" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1" dur="5s" repeatCount="indefinite"/><path d="M182,99 L255.4,138 L262.4,151 L194,117 Z" fill="#f5d0d0" stroke="#222" stroke-width="3"/></g><circle cx="190" cy="105" r="6" fill="#fff" stroke="#222" stroke-width="2.5"/><circle cx="190" cy="105" r="2" fill="#222"/>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.05;0.08;0.38;0.41;1" dur="5s" repeatCount="indefinite"/><line x1="620" y1="318" x2="680" y2="318" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.39;0.41;0.72;0.76;1" dur="5s" repeatCount="indefinite"/><line x1="600" y1="316" x2="720" y2="316" stroke="#d1495b" stroke-width="8" marker-end="url(#ah)"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.78;0.81;0.97;1;1" dur="5s" repeatCount="indefinite"/><line x1="680" y1="318" x2="620" y2="318" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/></g>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222">
<text x="142" y="128" text-anchor="end">pawl</text>
<text x="350" y="150">ratchet teeth</text>
<text x="380" y="245">orange flyweight, held</text><text x="380" y="267">in by a small spring</text>
<text x="260" y="384" text-anchor="middle">spring-return spool</text>
<text x="700" y="384" text-anchor="middle">strap</text>
<text x="580" y="80" text-anchor="middle" font-weight="bold" font-size="20" opacity="1">Slow pull: the spool turns freely<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.38;0.41;1" dur="5s" repeatCount="indefinite"/></text>
<text x="580" y="80" text-anchor="middle" font-weight="bold" font-size="20" opacity="0">Sudden jerk: weight flies out, pawl locks<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.39;0.42;0.74;0.77;1" dur="5s" repeatCount="indefinite"/></text>
<text x="580" y="80" text-anchor="middle" font-weight="bold" font-size="20" opacity="0">Let go: pawl drops out, strap winds back<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.76;0.79;0.98;1" dur="5s" repeatCount="indefinite"/></text>
<text x="400" y="430" text-anchor="middle">Car versions use a swinging pendulum or ball that tips the pawl in during a hard stop</text>
</g>
</svg>
