<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Animated: inertia-locking reel seen from the side: a spring-return spool with a ratchet wheel, a small flyweight on the spool held in by a spring, and a pawl on the frame; a slow pull lets the spool turn freely, but a sudden jerk flings the flyweight out, which tips the pawl into the ratchet teeth and stops the spool; when the pull eases the pawl drops out and the spring winds the strap back in.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#e8e8e8"/><line x1="0" y1="0" x2="0" y2="10" stroke="#222" stroke-width="2"/></pattern>
</defs>
<g stroke-linejoin="round" stroke-linecap="round">
<rect x="150" y="80" width="70" height="16" fill="url(#hatch)" stroke="#222" stroke-width="3"/><rect x="183" y="96" width="14" height="10" fill="#e8e8e8" stroke="#222" stroke-width="2"/>
<rect x="260" y="336" width="540" height="12" fill="#cfe3f5" stroke="#222" stroke-width="2.5"/>
<line x1="260" y1="342" x2="800" y2="342" stroke="#5a7ea0" stroke-width="3" stroke-dasharray="6 24" stroke-dashoffset="0" stroke-linecap="butt"><animate attributeName="stroke-dashoffset" values="0;0;-117.3;-287.4;-287.4;-267.8;-267.8;0" keyTimes="0;0.05;0.4;0.47;0.7;0.76;0.8;1" calcMode="spline" keySplines="0 0 1 1;0.3 0 0.7 1;0.6 0 1 1;0 0 1 1;0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1" dur="5s" repeatCount="indefinite"/></line>
<circle cx="260" cy="230" r="112" fill="#cfe3f5" stroke="#222" stroke-width="3"/><circle cx="260" cy="230" r="104" fill="none" stroke="#5a7ea0" stroke-width="1.5"/><circle cx="260" cy="230" r="96" fill="none" stroke="#5a7ea0" stroke-width="1.5"/>
<g><animateTransform attributeName="transform" type="rotate" values="0 260 230;0 260 230;-60 260 230;-147 260 230;-147 260 230;-137 260 230;-137 260 230;0 260 230" keyTimes="0;0.05;0.4;0.47;0.7;0.76;0.8;1" calcMode="spline" keySplines="0 0 1 1;0.3 0 0.7 1;0.6 0 1 1;0 0 1 1;0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1" dur="5s" repeatCount="indefinite"/><polygon points="336,230 350,232.4 325.8,268 336.7,277 298,295.8 302.9,309.1 260,306 257.6,320 222,295.8 213,306.7 194.2,268 180.9,272.9 184,230 170,227.6 194.2,192 183.3,183 222,164.2 217.1,150.9 260,154 262.4,140 298,164.2 307,153.3 325.8,192 339.1,187.1" fill="#e8e8e8" stroke="#222" stroke-width="3"/><circle cx="260" cy="230" r="14" fill="#9a9a9a" stroke="#222" stroke-width="2.5"/><rect x="294" y="230" width="8" height="8" fill="#222"/><polyline points="298,234 291.9,235 299.2,242.7 288.7,241.5 296,249.2 285.4,248 292.7,255.7 282.2,254.5 285,260" fill="none" stroke="#222" stroke-width="2.5"><animate attributeName="points" values="298,234 291.9,235 299.2,242.7 288.7,241.5 296,249.2 285.4,248 292.7,255.7 282.2,254.5 285,260;298,234 291.9,235 299.2,242.7 288.7,241.5 296,249.2 285.4,248 292.7,255.7 282.2,254.5 285,260;298,234 290.6,237.4 296.6,247.6 284.8,248.7 290.7,259 278.9,260 284.8,270.3 273,271.4 274.5,279.3;298,234 290.6,237.4 296.6,247.6 284.8,248.7 290.7,259 278.9,260 284.8,270.3 273,271.4 274.5,279.3;298,234 291.9,235 299.2,242.7 288.7,241.5 296,249.2 285.4,248 292.7,255.7 282.2,254.5 285,260;298,234 291.9,235 299.2,242.7 288.7,241.5 296,249.2 285.4,248 292.7,255.7 282.2,254.5 285,260" keyTimes="0;0.4;0.44;0.74;0.8;1" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1" dur="5s" repeatCount="indefinite"/></polyline><g><animateTransform attributeName="transform" type="rotate" values="0 225 250;0 225 250;20 225 250;20 225 250;0 225 250;0 225 250" keyTimes="0;0.4;0.44;0.74;0.8;1" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1" dur="5s" repeatCou