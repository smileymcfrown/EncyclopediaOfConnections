<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Left: crossed scissor tongs hanging from a crane ring by two short links and gripping a block, animated: the crane pull draws the tops of the arms together, so the jaws below the pivot squeeze the block, and the block is lifted and set down again; the heavier it is, the harder the grip. Right: a cut-away stone with a three-piece lewis wedged in a dovetail-shaped hole, lifted in step, which grips the stone from inside the same way.</title>
