<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Left: a cut-away hinge knuckle with three notches, where a spring pushes a ball into one notch to hold the lid at 0, 90 or 120 degrees. Right: a sofa-style ratchet fitting, where a pawl clicks up a row of teeth as the arm is raised and a bump at the end knocks it clear so the arm can fold back down; the animation swings the lid between its click-stops and raises the ratchet arm tooth by tooth.</title>
