<text x="372" y="330">loose pivot:</text><text x="372" y="350">strip to strip</text><line x1="460" y1="314" x2="508" y2="284" stroke="#222" stroke-width="1.5"/>
<text x="770" y="362" text-anchor="end">pull or push</text>
