<text x="195" y="68" text-anchor="end">rope</text>
<text x="195" y="146" text-anchor="end">frame: the rope</text><text x="195" y="167" text-anchor="end">is pinched here</text>
<text x="565" y="246">toothed cam on a</text><text x="565" y="267">pivot (off-centre)</text>
<text x="565" y="116">light spring keeps</text><text x="565" y="137">the teeth on the rope</text>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.075;0.1;0.3917;0.4167;1" dur="6s" repeatCount="indefinite"/><text x="20" y="330">slides up: teeth drag</text><text x="20" y="352">the cam open</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3833;0.4083;0.625;0.65;1" dur="6s" repeatCount="indefinite"/><text x="565" y="345">load pulls down:</text><text x="565" y="367">cam swings shut and</text><text x="565" y="389">pinches the rope</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6167;0.6417;0.9083;0.9333;1" dur="6s" repeatCount="indefinite"/><text x="565" y="345">to go down: unload it</text><text x="565" y="367">and hold the cam open</text></g>
<text x="400" y="438" text-anchor="middle">Slides up freely · grips harder the harder you pull down</text>
</g></svg>
