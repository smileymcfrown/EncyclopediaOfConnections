<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Top view of a knob with eight magnets over a base with eight magnets, shown lined up and held, and half-way round where each magnet is pulled both back and forward so the knob clicks into the next spot; a graph below shows the energy dipping once for every lined-up position. In the animation the left knob is turned round one click at a time: it resists up to half-way, then snaps into the next spot, while a red dot runs along the energy curve.</title>
