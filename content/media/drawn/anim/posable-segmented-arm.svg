<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Cut-away of a posable arm made of hollow ball-and-socket segments: each segment's ball is snapped into the next one's socket, whose lip wraps past the ball's widest point; every joint is tilted a little and held by friction, the tilts add up to a curve, and coolant flows through the hollow middle. The animation bends the arm from one shape to another; each joint swivels a little and then holds.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#222" stroke-width="2"/></pattern></defs>
<g stroke-linejoin="round" stroke-linecap="round">
<g transform="translate(220.0,310.0) rotate(-30) scale(1.9)" stroke="#222" stroke-width="2"><rect x="-52" y="-24" width="22" height="48" fill="url(#hatch)"/><rect x="-31" y="-12" width="34" height="24" fill="#e8e8e8"/>
<circle r="25" fill="#cfe3f5"/><rect x="10" y="-13" width="40" height="26" fill="#cfe3f5"/><rect x="0" y="-11.5" width="22" height="23" fill="#cfe3f5" stroke="none"/>
