<g transform="translate(220.0,310.0) rotate(-30) scale(1.9)" fill="none" stroke="#d1495b" stroke-width="2.105" stroke-dasharray="5.26 3.68"><line x1="0" y1="0" x2="66" y2="0"/><g transform="translate(66,0)"><animateTransform attributeName="transform" type="rotate" additive="sum" values="18 0 0;18 0 0;24 0 0;24 0 0;22 0 0;22 0 0;18 0 0" keyTimes="0;0.1;0.3;0.45;0.68;0.83;1" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1" dur="6s" repeatCount="indefinite"/><line x1="0" y1="0" x2="66" y2="0"/><g transform="translate(66,0)"><animateTransform attributeName="transform" type="rotate" additive="sum" values="18 0 0;18 0 0;-10 0 0;-10 0 0;22 0 0;22 0 0;18 0 0" keyTimes="0;0.1;0.3;0.45;0.68;0.83;1" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1" dur="6s" repeatCount="indefinite"/><line x1="0" y1="0" x2="66" y2="0"/><g transform="translate(66,0)"><animateTransform attributeName="transform" type="rotate" additive="sum" values="18 0 0;18 0 0;-20 0 0;-20 0 0;22 0 0;22 0 0;18 0 0" keyTimes="0;0.1;0.3;0.45;0.68;0.83;1" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1" dur="6s" repeatCount="indefinite"/><line x1="0" y1="0" x2="62" y2="0" marker-end="url(#ah)"/></g></g></g></g>
<line x1="391" y1="110" x2="443" y2="181" stroke="#222" stroke-width="1.5"/>
<line x1="616" y1="110" x2="581" y2="172" stroke="#222" stroke-width="1.5"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle">
<text x="371" y="80">ball snapped into</text><text x="371" y="102">the next socket</text>
<text x="666" y="80">socket lip wraps past</text><text x="666" y="102">the ball's widest point</text>
<text x="491" y="350">hollow middle: coolant or cables</text>
<text x="90" y="268">fixed end</text>
<text x="400" y="430">Each joint tilts a little and friction holds it; the small tilts add up to any shape</text>
