<g transform="translate(66,0)"><animateTransform attributeName="transform" type="rotate" additive="sum" values="18 0 0;18 0 0;-20 0 0;-20 0 0;22 0 0;22 0 0;18 0 0" keyTimes="0;0.1;0.3;0.45;0.68;0.83;1" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1" dur="6s" repeatCount="indefinite"/>
