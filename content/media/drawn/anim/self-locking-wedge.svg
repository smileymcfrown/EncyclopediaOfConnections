<g font-family="Arial, Helvetica, sans-serif" fill="#222" font-size="18">
<text x="20" y="32" font-size="20" font-weight="bold">Gentle slope: stays in</text>
<text x="420" y="32" font-size="20" font-weight="bold">Steep slope: pops out</text>
<text x="182" y="80">tap</text>
<text x="178" y="160">friction holds it</text>
<text x="236" y="410">big squeeze</text>
<text x="605" y="180">push</text>
<text x="440" y="410">nothing holds it</text>
<text x="400" y="436" text-anchor="middle">Light tap in, big squeeze out · gentle wedges stay put, steep ones spring back</text>
</g>
</svg>
