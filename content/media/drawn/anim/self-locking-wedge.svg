<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Side view of two wedges driven into a gap between a fixed block and a sliding part held back by a spring. A gentle wedge tapped in pushes the part sideways a little but hard, and friction on its faces keeps it in; a steep wedge pushed in springs back out when let go. Animated: three hammer taps drive the gentle wedge in step by step, squashing the spring, and it stays there until knocked out from below; the steep wedge is pushed in and pops straight back out.</title>
