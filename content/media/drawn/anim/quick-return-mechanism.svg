<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Crank and slotted-lever quick-return mechanism: a crank turning at steady speed slides a block in a lever pivoted below it, swinging the lever and the ram on top; the lever's two end positions split the crank circle into a long arc for the slow working stroke and a short arc for the fast return. In the animation the crank turns at a steady speed while the lever swings slowly one way (long blue arc) and quickly back (short orange arc), and a short link drives the ram.</title>
