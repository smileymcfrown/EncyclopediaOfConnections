<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Gear teeth drawn unrolled flat: on the left a solid gear leaves a gap beside the mating tooth, so the drive has play when it reverses; on the right the gear is split into a fixed half and a free half that a spring turns slightly, so their teeth pinch the mating tooth from both sides and the gap is gone. The animation reverses the drive: on the left the mating tooth waits while the gap closes, on the right it follows straight away.</title>
