<g transform="translate(300,263)"><animateTransform attributeName="transform" type="translate" values="300 263;300 263;466 263;466 263;466 266;466 266;466 263;300 263;300 263" dur="6s" repeatCount="indefinite" keyTimes="0;0.05;0.3;0.5;0.54;0.75;0.77;0.85;1" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
