</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle">
<text x="270" y="40" font-size="21" font-weight="bold">Side view of a latching (ZIF) connector</text>
<text x="675" y="40" font-size="21" font-weight="bold">Cable ends, top view</text>
<text x="410" y="215">latch</text>
<text x="80" y="250">flat cable</text>
<text x="240" y="250">stiffened tab</text>
<text x="160" y="300">bare copper below</text>
<text x="270" y="345">circuit board</text><text x="450" y="345">spring contact</text>
<g stroke="#222" stroke-width="1.5"><line x1="450" y1="328" x2="440" y2="292"/></g>
<text x="675" y="104" font-weight="bold">Type A</text><text x="675" y="186">bare on the same side</text>
<text x="675" y="244" font-weight="bold">Type D</text><text x="675" y="326">bare on opposite sides</text>
<text x="675" y="352" font-size="16">(dashed = on the back)</text>
<text x="400" y="430">Latch up · slide the cable in · latch down to clamp the tab onto the contacts</text>
</g>
</svg>
