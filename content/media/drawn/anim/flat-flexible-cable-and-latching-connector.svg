<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Side view of a flat flexible cable and a latching (ZIF) connector, shown working: the latch is up, the cable's stiffened tab slides into the slot with no force, the latch swings down and its pad presses the bare copper onto the spring contact, then the latch lifts and the cable slides out again; beside it, top views of Type A and Type D cable ends.</title>
