<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Top view of an eddy-current brake: an aluminium disc spins past a magnet (one above and one below the disc); swirling currents form just ahead of and just behind the magnet and drag against the motion, and a graph shows the drag rising from zero with speed, peaking, then slowly falling. Animated: the disc slows down, the currents and drag fade with its speed and vanish when it stops, then it is spun up again; a dot follows the drag graph.</title>
