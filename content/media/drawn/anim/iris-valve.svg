<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Side view of an iris valve: a fabric sleeve is held between a fixed top ring and a bottom ring. In the animation the bottom ring turns a quarter turn, twisting the sleeve into a narrow waist, then a half turn so it twists shut and the grain above stops falling, then turns back to open.</title>
