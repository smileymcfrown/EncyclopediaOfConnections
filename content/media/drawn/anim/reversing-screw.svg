<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222">
<text x="402.5" y="58" text-anchor="middle">carriage slides on a rail</text>
<text x="384.5" y="180" text-anchor="end">swivelling boat-shaped follower</text>
<text x="380" y="356" text-anchor="middle">follower runs out and back</text>
<text x="770" y="200" text-anchor="end">shaft turns</text>
<text x="770" y="310" text-anchor="end">one way only</text>
<text x="98" y="385">right-hand groove</text>
<text x="338" y="385">left-hand groove</text>
<text x="573" y="385">U-turn at each end</text>
<text x="400" y="430" text-anchor="middle" font-weight="bold" font-size="20">One-way turning in · back-and-forth sliding out</text>
</g>
</svg>