<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Side view of a reversing screw: a shaft with a right-hand groove and a left-hand groove crossing in a diamond pattern and joined by U-turns at both ends, with a boat-shaped follower in the groove; the shaft always turns one way while the follower and its carriage run out and back. The animation turns the shaft so both grooves travel along it in opposite directions; the follower rides one groove out to the end, swivels round the U-turn into the other groove and rides it back.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
