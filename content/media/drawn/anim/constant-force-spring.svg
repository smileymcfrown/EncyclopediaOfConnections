<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222">
<text x="60" y="34" font-size="20" font-weight="bold">coiled steel strip on a free-turning drum</text>
<text x="196" y="182">all the bending happens here</text>
<text x="382" y="236">same pull at</text><text x="382" y="257">every length</text>
<text x="645" y="94" text-anchor="middle" font-weight="bold" font-size="20">force against distance</text>
<text x="645" y="366" text-anchor="middle">distance pulled out</text>
<text x="508" y="220" text-anchor="middle" transform="rotate(-90 508 220)">pull force</text>
<text x="770" y="250" text-anchor="end">constant-force</text><text x="770" y="271" text-anchor="end">spring</text>
<text x="690" y="128" text-anchor="end" fill="#555555">ordinary coil spring</text>
<text x="400" y="430" text-anchor="middle" font-size="19">Pull it out a little or a lot: the force hardly changes</text>
</g></svg>
