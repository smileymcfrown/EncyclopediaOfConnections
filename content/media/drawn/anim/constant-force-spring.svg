<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>A coil of steel strip on a free-turning drum pulled out three different distances with the same-length pull arrow each time, beside a graph where the constant-force spring gives a flat force line while an ordinary coil spring gives a rising one. Animated: each strip is let in and pulled out again while its drum turns and the pull arrow stays the same length, and dots on the graph show the force staying level while a coil spring's would rise.</title>
