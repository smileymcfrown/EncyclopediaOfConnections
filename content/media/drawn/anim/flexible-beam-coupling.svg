<text x="300" y="40" font-size="21" font-weight="bold">Two shafts slightly out of line</text>
<text x="100" y="300">motor shaft</text>
<text x="490" y="290">driven shaft</text>
<text x="300" y="320">spiral slot lets the tube bend</text>
<text x="420" y="86">bends easily</text>
<text x="300" y="360">twist passes straight through, no slack</text>
<text x="690" y="100" font-weight="bold">single-beam</text>
