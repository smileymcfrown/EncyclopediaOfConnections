<text x="200" y="40" font-size="21" font-weight="bold">At rest</text>
<text x="600" y="40" font-size="21" font-weight="bold">Lifted: the band stretches</text>
<text x="75" y="180">pivot</text>
<text x="200" y="168">arm</text>
