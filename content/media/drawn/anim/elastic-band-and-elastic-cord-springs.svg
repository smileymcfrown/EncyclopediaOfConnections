<text x="300" y="384">fixed peg</text>
<line x1="286" y1="368" x2="258" y2="326" stroke="#222" stroke-width="1.5"/>
<text x="728" y="165">lift</text>
<text x="720" y="292">band pulls</text><text x="720" y="313">it back</text>
<text x="400" y="436" font-size="19">Cheap and swappable pull spring · its pull fades with time, so make it easy to replace</text>
</g></svg>
