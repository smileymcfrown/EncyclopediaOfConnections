<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Side view of a tendon-driven finger: three hinged pieces on a fixed palm, a string running along the palm side through holes a little below each hinge and tied at the fingertip, and an elastic cord along the back. The small offset of the string below each hinge (the moment arm) turns a straight pull into a turning force at every joint. Animated: the string is pulled a short way and all three joints curl together while the elastic stretches; when it is let go the elastic straightens the finger.</title>
