<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Two self-closing hinges, animated: the door is pushed open and the coiled spring in the spring hinge winds up, then on letting go it swings the door shut; on the rising butt the door rises up the spiral ramp as it opens and its weight slides it back down and shut.</title>
