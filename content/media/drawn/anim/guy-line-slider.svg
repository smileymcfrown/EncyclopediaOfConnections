<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0,10 L10,0" stroke="#222" stroke-width="2"/></pattern>
</defs>
<g stroke-linejoin="round" stroke-linecap="round">
<line x1="470" y1="40" x2="470" y2="400" stroke="#cccccc" stroke-width="2"/>
<rect x="20" y="372" width="440" height="14" fill="url(#hatch)"/><line x1="20" y1="372" x2="460" y2="372" stroke="#222" stroke-width="3"/>
