</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle">
<text x="240" y="36" font-size="21" font-weight="bold">Tent guy line</text>
<text x="70" y="80">tent</text>
<text x="440" y="330">stake</text>
<text x="190" y="172">stopper knot</text><line x1="212" y1="180" x2="216" y2="212" stroke="#222" stroke-width="2"/>
<text x="300" y="218">runner</text>
<text x="150" y="300" transform="rotate(30 150 300)">slide up to tighten</text>
<text x="645" y="36" font-size="21" font-weight="bold">Close-up of the runner</text>
<text x="645" y="90">pulled tight: sharp bends</text>
<text x="645" y="212">friction at each bend grips</text>
<text x="645" y="250">slack: gentle curves</text>
<text x="645" y="400">cord slides to adjust</text>
</g>
</svg>
