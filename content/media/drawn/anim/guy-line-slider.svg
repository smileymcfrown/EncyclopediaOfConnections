<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>A guy line running from a tent down round a stake and back up through a three-hole runner with a stopper knot, with an arrow showing the runner slid up the line to tighten it, and two close-ups: a loaded cord bent sharply round the hole edges where friction grips it, and a slack cord passing through in loose curves so it slides. Animated: the runner and stopper knot slide up the line and back down again.</title>
