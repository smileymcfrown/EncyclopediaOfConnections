<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Three cut-away panels of a solenoid latch: with the power off a spring pushes the slanted bolt out over the lid's catch so the lid stays shut (it can only lift a hair); with power on the coil pulls the bolt in and the lid lifts; when the lid is closed its catch slides down the slanted face, pushing the bolt in until it snaps back out and locks. Animated: each panel plays its own movement in a loop.</title>
