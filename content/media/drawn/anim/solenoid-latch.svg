<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222">
<text x="132" y="40" font-size="20" text-anchor="middle" font-weight="bold">1. Power off: locked</text>
<text x="397" y="40" font-size="20" text-anchor="middle" font-weight="bold">2. Power on: opens</text>
<text x="662" y="40" font-size="20" text-anchor="middle" font-weight="bold">3. Closing: snaps shut</text>
<text x="68" y="180" font-size="18" text-anchor="middle">power off</text>
<text x="333" y="180" font-size="18" text-anchor="middle">power on</text>
<text x="85" y="300" font-size="18" text-anchor="middle">coil and spring</text>
<text x="170" y="330" font-size="18" text-anchor="middle">slanted bolt</text>
<text x="120" y="112" font-size="18" text-anchor="middle">lid with catch</text>
<text x="402" y="330" font-size="18" text-anchor="middle">coil pulls bolt in</text>
<text x="662" y="330" font-size="18" text-anchor="middle">catch slides down the</text>
<text x="662" y="352" font-size="18" text-anchor="middle">slope, pushing bolt in</text>
<text x="400" y="420" font-size="18" text-anchor="middle" font-weight="bold">No power needed to stay locked · it locks itself when shut</text>
</g>
</svg>
