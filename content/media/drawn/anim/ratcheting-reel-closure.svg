<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222">
<text x="20" y="40" font-size="20" font-weight="bold">Seen from above, knob cut away</text>
<text x="22" y="152">lace</text>
<g stroke="#222" stroke-width="1.5"><line x1="375" y1="105" x2="330" y2="128"/><line x1="440" y1="345" x2="306" y2="251"/><line x1="350" y1="398" x2="248" y2="284"/></g>
<text x="380" y="104">ratchet teeth in the housing</text>
<text x="445" y="350">springy catch (pawl)</text>
<text x="355" y="405">spool winds the lace</text>
<g><animate attributeName="opacity" values="1;1;0.3;0.3;1" keyTimes="0;0.4917;0.5;0.975;1" dur="6s" repeatCount="indefinite"/><text x="430" y="170">1  Turn the knob: catches click,</text><text x="452" y="191">lace winds in</text></g>
<g><animate attributeName="opacity" values="0.3;0.3;1;1;0.3;0.3" keyTimes="0;0.4917;0.5;0.6417;0.65;1" dur="6s" repeatCount="indefinite"/><text x="430" y="222">2  Let go: lace pulls back, but</text><text x="452" y="243">a catch blocks a tooth</text></g>
<g><animate attributeName="opacity" values="0.3;0.3;1;1;0.3" keyTimes="0;0.6417;0.65;0.975;1" dur="6s" repeatCount="indefinite"/><text x="430" y="274">3  Pull the knob up: catches lift</text><text x="452" y="295">out, spool unwinds</text></g>
<text x="400" y="438" text-anchor="middle">The catches let the spool turn one way only</text>
</g></svg>
