<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>A ratcheting reel seen from above, animated: turning the spool makes its three springy catches click over the ratchet teeth while the lace winds in; on letting go a catch blocks a tooth; pulling the knob up lifts the catches clear and the lace unwinds.</title>
