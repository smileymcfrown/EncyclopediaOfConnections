<text x="190" y="30" font-size="21" font-weight="bold">Slip ring (electricity)</text>
<text x="590" y="30" font-size="21" font-weight="bold">Rotary union (fluid)</text>
<g text-anchor="start"><text x="20" y="114">wires</text><text x="20" y="136">stay still</text><text x="308" y="118">spring-pressed</text><text x="308" y="140">brushes</text><text x="586" y="94">hose stays still</text><text x="668" y="138">O-ring seals</text></g>
<text x="560" y="324">groove runs all round</text>
<text x="372" y="272">shaft spins</text><text x="372" y="294">for ever</text>
<text x="400" y="438">The rings, hole and shaft turn; the brushes, wires, housing and hose stay still</text>
