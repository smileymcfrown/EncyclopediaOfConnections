<rect x="110" y="238" width="480" height="152" fill="#cfe3f5" stroke="none"><animate attributeName="y" values="238;165;165;238;238" dur="8s" repeatCount="indefinite" keyTimes="0;0.45;0.62;0.95;1" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/><animate attributeName="height" values="152;225;225;152;152" dur="8s" repeatCount="indefinite" keyTimes="0;0.45;0.62;0.95;1" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/></rect>
<path d="M90,70 V410 H610 V70 H590 V390 H110 V70 Z" fill="#e8e8e8"/>
<line x1="110" y1="165" x2="590" y2="165" stroke="#d1495b" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="552" y="148" width="16" height="282" fill="#ffffff" stroke-dasharray="7 5" stroke-width="2.5"/>
<rect x="372" y="388" width="18" height="42" fill="#cfe3f5"/>
<line x1="381" y1="414" x2="381" y2="444" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" dur="8s" repeatCount="indefinite" keyTimes="0;0.62;0.66;0.92;0.96;1"/></line>
