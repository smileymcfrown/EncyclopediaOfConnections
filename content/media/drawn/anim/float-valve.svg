<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Cut-away of a tank with a float valve, shown working: water pours in and the level rises, lifting the float, whose long arm turns about the pivot and pushes the rubber washer onto the inlet until the flow stops at the set line; water drawn off at the bottom lowers the float again and the valve reopens.</title>
