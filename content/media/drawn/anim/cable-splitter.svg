<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>A one-into-two cable splitter: a lever pulls one cable into a junction box, shown cut open, where the input wire and two output wires are all fixed to one sliding block, so the two output cables pull their two brake arms exactly the same distance. Animated: the lever is pulled, the slider and both output wires move the same distance and both brake arms swing, then springs pull everything back.</title>
