<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Animated: a lead-screw slide with a pleated bellows cover on each side of the moving carriage: each bellows is fixed to an end block and to the carriage, so as the carriage travels one bellows opens out long and the other squashes into a short stack, while grit bounces off the folds, keeping it off the screw.</title>
