<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle">
<text x="135" y="44" font-size="21" font-weight="bold">Notch</text>
<text x="400" y="44" font-size="21" font-weight="bold">Single thin blade</text>
<text x="665" y="44" font-size="21" font-weight="bold">Crossed blades</text>
<text x="135" y="384">tiny angle,</text><text x="135" y="406">turning point fixed</text>
<text x="400" y="384">bigger angle,</text><text x="400" y="406">turning point drifts</text>
<text x="665" y="384">big angle,</text><text x="665" y="406">turning point stays put</text>
<text x="400" y="438">No pin, no rubbing: the thin part bends, then springs back</text>
</g>
</svg>
