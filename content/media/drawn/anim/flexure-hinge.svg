<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Three flexure hinges side by side, shown moving: each arm swings to and fro with no pin, the notched block bending a few degrees at its thin neck, the single blade curving so its turning point (red dot) drifts sideways, and the crossed blades bending in an X so the arm turns about a nearly fixed point.</title>
