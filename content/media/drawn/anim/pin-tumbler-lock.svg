<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Side cut-away of a pin-tumbler lock: with the right key in, every gap between key pin and driver pin sits on the shear line, and the end view shows the plug turning; then the key is pulled out, the springs push the driver pins down across the shear line (marked red, blocked), and the key slides back in, lifting each pin to the right height again.</title>
