<g><animateTransform attributeName="transform" type="translate" values="0 40;0 40;0 40;0 0;0 0;0 40;0 40" keyTimes="0;0.1;0.35;0.475;0.7;0.9;1" dur="6s" repeatCount="indefinite"/><rect x="144" y="190" width="24" height="160" fill="#d8f0d2" stroke="#222" stroke-width="3"/></g>
