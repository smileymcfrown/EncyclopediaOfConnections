<use href="#pul" x="60" y="238"/><circle cx="72" cy="250" r="4" fill="#222"/>
<g><animateTransform attributeName="transform" type="translate" values="0 40;0 40;0 13.3;0 0;0 0;0 40;0 40" keyTimes="0;0.1;0.35;0.475;0.7;0.9;1" dur="6s" repeatCount="indefinite"/><use href="#pul" x="108" y="198"/><circle cx="96" cy="342" r="4" fill="#222"/><circle cx="120" cy="205" r="4" fill="#222"/><line x1="108" y1="184" x2="108" y2="166" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"><animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.7;0.72;0.88;0.9;1" dur="6s" repeatCount="indefinite"/></line></g>
<g><animateTransform attributeName="transform" type="translate" values="0 80;0 80;0 26.7;0 0;0 0;0 80;0 80" keyTimes="0;0.1;0.35;0.475;0.7;0.9;1" dur="6s" repeatCount="indefinite"/><use href="#pul" x="156" y="158"/><circle cx="144" cy="302" r="4" fill="#222"/><line x1="156" y1="144" x2="156" y2="108" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"><animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.7;0.72;0.88;0.9;1" dur="6s" repeatCount="indefinite"/></line></g>
<g><animateTransform attributeName="transform" type="translate" values="0 120;0 120;0 40;0 0;0 0;0 120;0 120" keyTimes="0;0.1;0.35;0.475;0.7;0.9;1" dur="6s" repeatCount="indefinite"/><circle cx="192" cy="262" r="4" fill="#222"/><line x1="204" y1="104" x2="204" y2="50" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"><animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.7;0.72;0.88;0.9;1" dur="6s" repeatCount="indefinite"/></line></g>
</g>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle">
<text x="200" y="32" font-size="21" font-weight="bold">Continuous: one string</text>
<text x="600" y="32" font-size="21" font-weight="bold">Cascade: a string per stage</text>
<text x="214" y="90" text-anchor="start">1st</text>
<text x="156" y="182">2nd</text>
<text x="108" y="222">3rd</text>
<text x="498" y="180" text-anchor="end">1x</text>
<text x="546" y="130" text-anchor="end">2x</text>
<text x="594" y="82" text-anchor="end">3x</text>
<text x="28" y="420">spool</text>
<text x="240" y="300" text-anchor="start">top stage goes</text>
<text x="240" y="322" text-anchor="start">first, then the</text>
<text x="240" y="344" text-anchor="start">next one down</text>
<text x="636" y="300" text-anchor="start">all move at once,</text>
<text x="636" y="322" text-anchor="start">each faster than</text>
<text x="636" y="344" text-anchor="start">the one below</text>
<text x="400" y="441">Strings only pull: a second string or spring brings the stages back in</text>
</g>
</svg>
