<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Two three-stage slides side by side: on the left one long string zig-zags over every stage so the top stage slides out first, and on the right a separate string for each stage makes all stages move together, each faster than the one below. The animation winds the spool in: on the left the top stage slides out first and then the next one down, while on the right all three stages rise together at 1x, 2x and 3x speed; then the stages are drawn back in.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="10" stroke="#222" stroke-width="2"/></pattern>
<g id="baseparts">
<rect x="44" y="390" width="186" height="12" fill="url(#hatch)" stroke="#222" stroke-width="3"/>
<rect x="48" y="230" width="24" height="160" fill="#e8e8e8" stroke="#222" stroke-width="3"/>
<line x1="40" y1="380" x2="48" y2="380" stroke="#222" stroke-width="3"/>
<circle cx="28" cy="380" r="12" fill="#e8e8e8" stroke="#222" stroke-width="3"/>
<circle cx="28" cy="380" r="2.5" fill="#222"/>
</g>
<g id="pul"><circle r="7" fill="#ffffff" stroke="#222" stroke-width="2.5"/><circle r="2" fill="#222"/></g>
</defs>
<g stroke-linejoin="round" stroke-linecap="round">
<line x1="400" y1="20" x2="400" y2="400" stroke="#cccccc" stroke-width="2"/>
<!-- continuous -->
<use href="#baseparts"/>
<use href="#pul" x="60" y="238"/>
