<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Two tensioning knots, animated: on the left a trucker's hitch, where pulling the free end down a long way draws the loop (which works like a pulley) down a little and takes the slack out of the rope over the load; on the right a taut-line hitch on a tent guy line, slid up the line to take up the sag; each lets off and is tightened again.</title>
