<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>A lantern gear: a pinion of eight round pins held between two discs meshes with a sixteen-tooth wheel whose curved teeth follow the path of a pin centre; in the animation the wheel turns clockwise and pushes the pins round one at a time, so the lantern turns the other way twice as fast, and the side view shows the pins of the birdcage passing.</title>
