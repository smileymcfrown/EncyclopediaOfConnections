<g font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222" text-anchor="middle">
<text x="20" y="36" text-anchor="start">wheel: 16 shaped teeth</text>
<text x="680" y="58">lantern: 8 pins held</text><text x="680" y="82">between two discs</text>
<text x="680" y="345">side view: a birdcage</text>
<text x="445" y="352">turns twice as fast</text>
<text x="400" y="438" font-size="18">Dashed: the pitch circles, touching at the dot · dotted red: the path of a pin centre on the wheel</text>
</g>
</svg>
