<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Two boxes seen from the side with their lids open: on the left a folding stay whose elbow has locked just past straight so the lid's weight presses it onto its stop, and on the right a sliding stay whose bar passes through a pivoting block that a screw squeezes so friction holds the lid at any angle. The animation swings both lids part-way shut and open again: the folding stay's elbow bends and then locks just past straight, and the sliding stay's bar slides through its pivoting block.</title>
