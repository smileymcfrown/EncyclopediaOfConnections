<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Side view of a draw latch: a lever pivoted on the box carries a loop that hooks a keeper on the lid; with the lever shut, the loop pivot sits just past the dashed line from lever pivot to keeper, the lid is pulled down onto a squeezed gasket, and the gasket's push presses the lever further shut. Animated: the lever swings out, the loop goes slack and the lid rises off the gasket, then the lever swings back past centre and pulls the lid down again.</title>
