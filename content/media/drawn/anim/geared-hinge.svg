<text x="300" y="40" font-size="21" font-weight="bold">Looking along the hinge (end view)</text>
<text x="400" y="132">cap holds the two</text><text x="400" y="152">gears in mesh</text>
<text x="210" y="205">door leaf</text>
<text x="590" y="205">frame leaf</text>
<text x="700" y="148">V-shaped teeth stop</text><text x="700" y="168">the leaves sliding</text>
<text x="400" y="438">Turn one leaf and the teeth turn the other by the same amount</text>
