<g font-family="Arial, Helvetica, sans-serif" fill="#222" font-size="18">
<text x="150" y="378" text-anchor="middle">mainspring barrel</text><text x="520" y="378" text-anchor="middle">fusee (cone)</text>
<text x="582" y="114">same turning force</text>
<text x="602" y="160">wound up: strong pull,</text><text x="602" y="180">short lever arm</text>
<text x="602" y="276">run down: weak pull,</text><text x="602" y="296">long lever arm</text>
<text x="400" y="430" text-anchor="middle">Pull × lever arm stays the same, so the clock gets an even drive</text>
</g>
</svg>
