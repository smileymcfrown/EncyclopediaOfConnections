<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>A clock fusee: a mainspring barrel joined by a chain to a cone-shaped fusee with a spiral groove. Fully wound, the strong pull of the chain acts on the narrow top of the cone with a short lever arm; run down, the weaker pull acts on the wide bottom with a long lever arm, so the turning force on the fusee stays the same. Animated: as the spring runs down the chain winds off the fusee onto the barrel, the point where it leaves the cone moves down to wider grooves, the pull arrow gets thinner and the lever arm longer; then it is wound up again.</title>
