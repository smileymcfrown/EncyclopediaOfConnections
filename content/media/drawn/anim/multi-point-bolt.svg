<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>A multi-point bolt (cremone bolt) on a tall door: in the animation the knob turns, the small gear inside the gearbox drives one toothed bar up and the other down by the same amount, so one rod slides up into the head of the frame and the other down into the sill; then it turns back to unlock.</title>
