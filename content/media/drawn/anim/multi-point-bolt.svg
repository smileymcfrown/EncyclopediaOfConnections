</g>
<g stroke="#d1495b" stroke-width="4" fill="none" marker-end="url(#ah)"><line x1="258" y1="120" x2="258" y2="66"/><line x1="258" y1="300" x2="258" y2="354"/><line x1="482" y1="290" x2="482" y2="236"/><line x1="718" y1="160" x2="718" y2="214"/><path d="M542,195 A64,64 0 0 1 630,167"/></g>
<g font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222" text-anchor="middle">
<text x="370" y="36" text-anchor="start">head</text><text x="370" y="396" text-anchor="start">sill</text>
<text x="190" y="222">turn the</text><text x="190" y="244">knob</text>
<text x="182" y="100">rod slides up</text><text x="182" y="334">rod slides down</text>
<text x="600" y="32" font-weight="bold">inside the gearbox</text>
<text x="600" y="300">pinion</text>
<text x="472" y="320">rack to</text><text x="472" y="342">top rod</text>
<text x="726" y="128">rack to</text><text x="726" y="150">bottom rod</text>
<text x="400" y="436" font-size="18">One turn of the knob moves both rods out by the same amount, locking the top and the bottom</text>
</g>
</svg>
