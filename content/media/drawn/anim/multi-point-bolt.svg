<circle cx="285" cy="225" r="46" fill="none" stroke="#666" stroke-width="2" stroke-dasharray="6 5"/><line x1="326" y1="205" x2="424" y2="120" stroke="#666" stroke-width="2" stroke-dasharray="6 5"/><line x1="326" y1="245" x2="424" y2="330" stroke="#666" stroke-width="2" stroke-dasharray="6 5"/>
