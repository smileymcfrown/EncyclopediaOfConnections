<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Top view of a cam cleat: a rope runs between two spring-loaded toothed cams on pivots; pulling the rope toward you swings the cams open so it slides through, and when the load pulls back the cams turn shut and bite harder; a small side view shows the rope lifted up and out to release it; the rope is pulled through, then the load pulls back and the cams snap shut on it.</title>
