<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Two speed governors, animated: on the left the spring barrel turns slowly and drives the gears up to a fan that speeds up until the growing air drag holds it at a steady speed; on the right two weights on flat springs spin up, fly outwards and rub on the fixed felt-lined drum, which holds their speed steady; then both stop.</title>
