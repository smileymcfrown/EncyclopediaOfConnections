<g text-anchor="start"><text x="20" y="34" font-size="21" font-weight="bold">Two pieces with a pin</text><text x="20" y="232" font-size="21" font-weight="bold">One piece that bends</text><text x="545" y="44">small push,</text><text x="545" y="66">long way</text><text x="300" y="70" font-size="17">big grip, short way</text></g><g text-anchor="end"><text x="108" y="124">pin</text><text x="108" y="314">thin</text><text x="108" y="336">bending</text><text x="108" y="358">section</text></g><text x="400" y="424" font-size="19">Long handles, short jaws: a small push becomes a big grip.</text><text x="400" y="446" font-size="19">In one piece, a thin section bends instead of a pin, and springs it open again.</text>
