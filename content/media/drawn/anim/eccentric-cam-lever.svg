<g transform="translate(0,30)"><text x="228" y="203">lever</text><g text-anchor="start"><text x="424" y="166">cam with an</text><text x="424" y="188">off-centre pivot</text><text x="470" y="236">washer</text><text x="470" y="270">two plates</text><text x="392" y="306.77">adjusting nut</text><text x="633" y="168" font-size="17">cam rise</text></g><text x="700" y="324" font-size="17">lever swing</text><text x="700" y="346" font-size="17">(open to shut)</text></g><text x="400" y="420" font-size="19">Swinging the lever down turns the off-centre cam, which pushes</text><text x="400" y="444" font-size="19">the plates together; the slope is so gentle near shut that it stays put</text>
</g>
