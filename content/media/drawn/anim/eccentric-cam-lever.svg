<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Side view of an eccentric cam lever: a lever with a round cam, pivoted off-centre on a pin through a threaded rod, presses a washer down on two plates held by a nut below; a small graph shows the cam rise climbing steeply and then flattening as the lever swings shut. Animated: the lever swings up, the cam rolls back and a gap opens between the plates, then the lever swings down and the cam presses the plates shut again while a dot follows the graph.</title>
