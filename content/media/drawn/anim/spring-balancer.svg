<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Animated side view of a spring balancer, moved up and down and staying put: an arm pivots on a post with a load at its tip, and a spring runs from a point on the arm to an anchor directly above the pivot; the spring cancels the weight at every angle, so the arm stays wherever it is let go. A small inset shows the counterweight version.</title>
