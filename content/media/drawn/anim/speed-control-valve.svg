<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>A double-acting air cylinder with a speed controller on each port, shown as it extends: on the inlet side air pushes the one-way check valve open and flows in freely; on the outlet side the check valve is pushed shut, so the escaping air must squeeze past an adjustable needle, which sets how fast the piston moves. Animated: the piston slides out slowly while the air flows; on the way back the two check valves swap over.</title>
