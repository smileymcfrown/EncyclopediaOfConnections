<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Three side views of a rotary latch: open with the striker coming into the claw's mouth, closing as the striker turns the claw while the sprung pawl rides its rim, and latched with the pawl dropped into the claw's notch. Animated: in view 2 the striker comes in and turns the claw while the pawl rides its rim, clicks past the safety notch and drops into the main notch; in view 3 the pawl is pulled out and the claw springs open, pushing the striker out.</title>
