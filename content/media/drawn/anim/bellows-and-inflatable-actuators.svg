<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Two air-filled actuators: a folded rubber bellows between two plates that lifts a load when air is pumped in, and a vine robot, a soft tube folded inside itself that grows from its tip as air pushes the folded-in material out, while its body stays still; the bellows inflates and lifts, then lets the load squash it down, and the vine robot is pulled back in and grows out again.</title>
