<g font-weight="bold" text-anchor="middle"><text x="215" y="40">Bellows</text><text x="615" y="40">Vine robot (inside-out tube)</text></g>
<text x="16" y="336" font-size="18">air in/out</text>
<text x="82" y="250" text-anchor="end">folded</text><text x="82" y="274" text-anchor="end">bellows</text>
<text x="372" y="160" text-anchor="middle">pushes</text><text x="372" y="182" text-anchor="middle">up</text>
<text x="490" y="372">air in</text>
<text x="515" y="180">wall marks stay put:</text><text x="515" y="202">the body does not slide</text>
<text x="515" y="320">folded-in tube moves out</text><text x="515" y="342">and turns outward at the tip</text>
<text x="400" y="434" text-anchor="middle" font-size="17">It only pushes: air forces the plates apart (more weakly as it stretches), the load squashes it back</text>
