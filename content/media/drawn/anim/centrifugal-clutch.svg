<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>End-on view of a centrifugal clutch: a hub on the engine shaft carries three shoes on radial lugs, held in by springs, inside a free drum; when the hub spins fast enough the shoes are flung out against the drum, slip, then grip so the drum turns with the hub; the engine speeds up and slows down, the shoes move out and in, and the drum starts, catches up and coasts to a stop.</title>
<rect width="800" height="450" fill="#ffffff"/>
