<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Animated: a belt tensioner: a belt runs round a driving pulley and a driven pulley, and a small idler wheel on a pivoting arm is pushed by a coil spring into the slack lower span; as the belt stretches, the spring swings the arm further in so the belt stays tight.</title>
