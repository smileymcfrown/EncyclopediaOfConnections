<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Cut-away side view of the back edge of a model plane's wing and the front of its aileron, both balsa. A flat hinge is pushed half into a slot in each and glued, with a toothpick peg through each half so it can't pull out; the edges are bevelled and the hinge bends in the gap between them. Below, seen from above, three hinges share each hinge line, and beside it a round hinge point turns on a pin in drilled holes. The animation swings the aileron up, then down, then back level, the hinge bending in the gap.</title>
