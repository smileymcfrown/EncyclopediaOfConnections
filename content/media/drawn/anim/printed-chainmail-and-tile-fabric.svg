<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Printed chainmail or tile fabric in side section: a row of rigid tiles, each joined to the next by loops linked through each other with an air gap; in the animation the flat printed strip settles over a ball, each link turning a little so the sheet drapes like cloth, then lifts flat again.</title>
