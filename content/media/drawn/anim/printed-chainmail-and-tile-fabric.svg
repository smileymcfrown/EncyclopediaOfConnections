<g font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222" text-anchor="middle">
<text x="100" y="294" font-size="18" font-weight="bold">top view</text>
<text x="100" y="315" font-size="15">loops (dashed) link below</text>
<text x="708" y="300">rigid tiles, each</text><text x="708" y="324">loop linked through</text><text x="708" y="348">the next with an</text><text x="708" y="372">air gap all round</text>
<text x="400" y="320">ball</text>
<g font-size="20" font-weight="bold"><text x="400" y="50" opacity="1"><animate attributeName="opacity" dur="6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.1167;0.1833;0.7833;0.8667;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" values="1;1;0;0;1;1"/>As printed: flat, but every link is free</text><text x="400" y="50" opacity="0"><animate attributeName="opacity" dur="6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.2333;0.3167;0.6167;0.6833;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" values="0;0;1;1;0;0"/>Laid over a ball, it drapes like cloth</text></g>
<text x="400" y="440" font-size="18">One print, no assembly · the pieces tilt and turn a little within their gaps</text>
</g>
