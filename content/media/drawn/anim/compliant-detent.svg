<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Three steps of a compliant detent: a springy arm growing from the housing rests its rounded tip in a notch of a wheel, a tooth bends the arm upwards as the wheel turns, and the tip drops into the next notch with a click; the wheels turn and the arms bend and spring back; an inset shows a watch star wheel held by a jumper spring in the same way.</title>
