<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle">
<g font-weight="bold">
<text x="100" y="40">1. Sits in a notch</text>
<text x="300" y="40">2. Tooth bends arm</text>
<text x="500" y="40">3. Click: next notch</text>
<text x="705" y="40">Same in a watch</text>
</g>
<text x="72" y="150">springy arm</text>
<text x="100" y="350">notched wheel</text>
<text x="114" y="248" text-anchor="start">P</text>
<text x="146" y="214">α</text>
<text x="300" y="350">wheel turns</text>
<text x="578" y="186">click!</text>
<text x="680" y="172" text-anchor="end">jumper</text>
<text x="705" y="350">star wheel</text>
<text x="400" y="430" font-size="17">To leave a notch you must push with about P × tan α (P = arm's spring force, α = notch slope)</text>
</g>
</svg>
