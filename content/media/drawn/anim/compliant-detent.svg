<path id="w22" d="M7.8,-59.5 L16.8,-40.7 L36.5,-47.6 A60,60 0 0 1 47.6,-36.5 L40.7,-16.8 L59.5,-7.8 A60,60 0 0 1 59.5,7.8 L40.7,16.8 L47.6,36.5 A60,60 0 0 1 36.5,47.6 L16.8,40.7 L7.8,59.5 A60,60 0 0 1 -7.8,59.5 L-16.8,40.7 L-36.5,47.6 A60,60 0 0 1 -47.6,36.5 L-40.7,16.8 L-59.5,7.8 A60,60 0 0 1 -59.5,-7.8 L-40.7,-16.8 L-47.6,-36.5 A60,60 0 0 1 -36.5,-47.6 L-16.8,-40.7 L-7.8,-59.5 A60,60 0 0 1 7.8,-59.5 Z" fill="#cfe3f5" stroke="#222" stroke-width="3"/>
