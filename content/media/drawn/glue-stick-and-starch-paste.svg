<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>How glue stick and starch paste join paper. Top left, a magnified side view of two sheets of paper with a thin layer of paste between them: water from the paste soaks into the paper fibres and dries off into the air, leaving the paste to hold the fibres of both sheets together. Bottom left, a glue stick being rubbed on and paste brushed on. Right, two results: left to dry freely the pasted paper ripples, while dried between blotting paper under a weight it stays flat.</title>
