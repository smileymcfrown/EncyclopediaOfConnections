<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222">
<g font-size="19" font-weight="bold"><text x="200" y="40" text-anchor="middle">Water soaks in, then dries off</text><text x="600" y="40" text-anchor="middle">Dried freely: it ripples</text></g>
<text x="24" y="78" font-size="17">drying off</text>
<text x="30" y="104" font-size="17">paper</text><text x="5" y="151" font-size="17">paste</text>

<text x="50" y="204">paste dries and holds the</text><text x="50" y="224">fibres of both sheets</text><line x1="190" y1="190" x2="196" y2="152" stroke="#222" stroke-width="1.5"/>
<text x="110" y="278" text-anchor="middle">glue stick: rub on</text>
<text x="300" y="278" text-anchor="middle">paste: brush on</text>
<text x="600" y="76" text-anchor="middle">the wet paper swells, mostly</text><text x="600" y="96" text-anchor="middle">across the grain (cockling)</text>
<text x="600" y="232" font-weight="bold" font-size="19" text-anchor="middle">Dried flat: blotters and a weight</text>
<text x="600" y="293" text-anchor="middle">weight</text><text x="600" y="330" text-anchor="middle" font-size="17">blotting paper</text><text x="600" y="366" text-anchor="middle" font-size="17">blotting paper</text>


<text x="400" y="438" text-anchor="middle">Starch paste and methyl cellulose stay soluble: water can undo them later</text>
</g></svg>
