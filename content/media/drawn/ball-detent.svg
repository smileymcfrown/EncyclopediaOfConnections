<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>A threaded ball plunger in cross-section: a spring inside the body pushes a ball down into a cone-shaped dimple in a plate; sliding the plate makes the dimple's slope push the ball up into the body, squashing the spring, until the ball drops into the next dimple with a click.</title>
