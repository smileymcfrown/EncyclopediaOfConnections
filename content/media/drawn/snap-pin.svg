<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Cut-away of a split snap pin going through a hole in two plates: the legs squeeze together in the hole, spring apart once the barbs come out the far side, and the barbs' flat backs catch when pulled; an inset shows the pin printed lying flat.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
<g id="plates" stroke="#222" stroke-width="2" stroke-linejoin="round">
<rect x="-48" y="14" width="26" height="25" fill="#cfe3f5"/><rect x="22" y="14" width="26" height="25" fill="#cfe3f5"/>
<rect x="-48" y="39" width="26" height="25" fill="#d8f0d2"/><rect x="22" y="39" width="26" height="25" fill="#d8f0d2"/>
</g>
<g id="upper">
<path d="M-30,0 L30,0 L30,14 L21,14 L21,30 L12,30 L12,24 A12,12 0 0 0 -12,24 L-12,30 L-21,30 L-21,14 L-30,14 Z" fill="#fde2c4"/>
<path d="M-21,30 L-21,14 L-30,14 L-30,0 L30,0 L30,14 L21,14 L21,30 M12,30 L12,24 A12,12 0 0 0 -12,24 L-12,30" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
</g>
<path id="legR" d="M12,22 L21,22 L21,64 L29,64 L12,84 Z" fill="#fde2c4" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
<path id="legL" d="M-12,22 L-21,22 L-21,64 L-29,64 L-12,84 Z" fill="#fde2c4" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
<g id="pin"><use href="#legR"/><use href="#legL"/><use href="#upper"/></g>
</defs>
<!-- frame 1: legs squeezed in the hole -->
<g transform="translate(100,130) scale(1.6)">
<use href="#plates"/>
<g transform="translate(0,-30)">
<use href="#legR" transform="rotate(10 16.5 24)"/>
<use href="#legL" transform="rotate(-10 -16.5 24)"/>
<use href="#upper"/>
</g>
</g>
<line x1="100" y1="38" x2="100" y2="72" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<!-- frame 2: legs spring apart -->
<g transform="translate(270,130) scale(1.6)">
<use href="#plates"/>
<use href="#pin"/>
</g>
<g stroke="#d1495b" stroke-width="4" marker-end="url(#ah)">
<line x1="258" y1="252" x2="232" y2="252"/>
<line x1="282" y1="252" x2="308" y2="252"/>
</g>
<!-- frame 3: pull, barbs catch -->
<g transform="translate(440,130) scale(1.6)">
<use href="#plates"/>
<use href="#pin"/>
</g>
<line x1="440" y1="124" x2="440" y2="84" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<g stroke="#d1495b" stroke-width="6" stroke-linecap="round">
<line x1="476" y1="232" x2="486" y2="232"/>
<line x1="394" y1="232" x2="404" y2="232"/>
</g>
<!-- inset: printed lying flat -->
<rect x="590" y="150" width="190" height="120" rx="6" fill="#e8e8e8" stroke="#222" stroke-width="3"/>
<g transform="translate(630,210) rotate(-90) scale(1.25)"><use href="#pin"/></g>
<g font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222">
<text x="112" y="50">push</text>
<text x="452" y="100">pull</text>
<text x="192" y="290">barbs out: legs open</text>
<text x="100" y="320" text-anchor="middle" font-weight="bold">1 Legs squeeze</text>
<text x="270" y="320" text-anchor="middle" font-weight="bold">2 Legs spring out</text>
<text x="440" y="320" text-anchor="middle" font-weight="bold">3 Barbs catch</text>
<text x="685" y="140" text-anchor="middle">print bed, from above</text>
<text x="685" y="298" text-anchor="middle">print it lying flat</text>
<text x="400" y="420" text-anchor="middle" font-size="18">The slot lets the legs bend, so the sloped barbs can pass through the hole</text>
</g>
</svg>
