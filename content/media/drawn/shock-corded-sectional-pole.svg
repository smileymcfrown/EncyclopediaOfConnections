<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Cut-away of a shock-corded tent pole: above, three tube sections folded side by side with the elastic cord inside them stretched round the bends; below, the same sections in a straight line, with the stretched cord pulling each narrow end (spigot) into the next tube's socket.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
</defs>

<g stroke-linejoin="round" stroke-linecap="round">
<line x1="20" y1="238" x2="780" y2="238" stroke="#cccccc" stroke-width="2"/>
<rect x="250" y="88" width="300" height="24" fill="#cfe3f5" stroke="#222" stroke-width="3"/>
<rect x="550" y="92" width="34" height="16" fill="#e8e8e8" stroke="#222" stroke-width="2.5"/>
<rect x="250" y="133" width="300" height="24" fill="#cfe3f5" stroke="#222" stroke-width="3"/>
<rect x="216" y="137" width="34" height="16" fill="#e8e8e8" stroke="#222" stroke-width="2.5"/>
<rect x="250" y="178" width="300" height="24" fill="#cfe3f5" stroke="#222" stroke-width="3"/>
<path d="M258,100 H584 C640,100 620,145 550,145 H216 C160,145 180,190 250,190 H542" stroke="#222" stroke-width="2.5" fill="none"/>
<circle cx="258" cy="100" r="5" fill="#222"/><circle cx="542" cy="190" r="5" fill="#222"/>
<rect x="50" y="318" width="240" height="24" fill="#cfe3f5" stroke="#222" stroke-width="3"/>
<rect x="290" y="318" width="240" height="24" fill="#cfe3f5" stroke="#222" stroke-width="3"/>
<rect x="530" y="318" width="220" height="24" fill="#cfe3f5" stroke="#222" stroke-width="3"/>
<rect x="272" y="322" width="40" height="16" fill="#e8e8e8" stroke="#222" stroke-width="2.5"/>
<rect x="512" y="322" width="40" height="16" fill="#e8e8e8" stroke="#222" stroke-width="2.5"/>
<line x1="58" y1="330" x2="742" y2="330" stroke="#222" stroke-width="2.5" fill="none"/>
<circle cx="58" cy="330" r="5" fill="#222"/><circle cx="742" cy="330" r="5" fill="#222"/>
<line x1="232" y1="298" x2="276" y2="298" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<line x1="348" y1="298" x2="304" y2="298" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<line x1="472" y1="298" x2="516" y2="298" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<line x1="588" y1="298" x2="544" y2="298" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222">
<text x="400" y="40" font-size="20" text-anchor="middle" font-weight="bold">Folded: the cord is stretched round the bends</text>
<text x="700" y="110" font-size="18" text-anchor="middle">cord pulls</text>
<text x="700" y="132" font-size="18" text-anchor="middle">the sections</text>
<text x="700" y="154" font-size="18" text-anchor="middle">together</text>
<text x="567" y="82" font-size="18" text-anchor="middle">spigot</text>
<text x="70" y="105" font-size="18">cord anchored</text>
<text x="70" y="127" font-size="18">at each end</text>
<text x="400" y="268" font-size="20" text-anchor="middle" font-weight="bold">Unfolded: the cord snaps each spigot into the next socket</text>
<text x="170" y="375" font-size="18" text-anchor="middle">elastic cord inside</text>
<text x="410" y="375" font-size="18" text-anchor="middle">joint pulled closed</text>
<text x="400" y="425" font-size="18" text-anchor="middle" font-weight="bold">The tubes carry the load · the cord only keeps the joints closed</text>
</g>
</svg>
