<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Two cut-through views of a block sitting in a pocket: on the left one stiff pin in a slightly misplaced hole pushes the block off-centre by the whole error, and on the right twelve thin springy ribs, each a little off and bent by a different amount, push from both sides so the block settles in the middle where their errors average out.</title>
