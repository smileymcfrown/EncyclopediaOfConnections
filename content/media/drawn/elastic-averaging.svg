<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle">
<text x="200" y="40" font-size="21" font-weight="bold">One stiff pin</text>
<text x="600" y="40" font-size="21" font-weight="bold">Many springy ribs</text>
<text x="200" y="80">pin a little out of place:</text><text x="200" y="100">block is off by the whole error</text>
<text x="200" y="232">block</text>
<text x="600" y="80">each rib is a bit off and bends</text><text x="600" y="100">a different amount</text>
<text x="600" y="232">block ends up</text><text x="600" y="252">in the middle</text>
<text x="200" y="392">dashed line = where it should sit</text>
<text x="600" y="392">small errors average out</text>
<text x="400" y="434" font-size="19">More springy contacts → smaller leftover error and a stiff, repeatable fit</text>
</g></svg>
