<title>A windlass: on the left, front view of a rope drum on an axle between two posts, turned by a crank, winding up a rope that lifts a load; on the right, end view showing the long crank and small drum that multiply the pull, and a ratchet wheel with a pawl that stops the drum running back.</title>
