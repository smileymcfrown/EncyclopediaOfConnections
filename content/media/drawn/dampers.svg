<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Two dampers: a box lid on a hinge with a rotary damper at the pivot, and a cut-open linear damper whose piston has a tiny hole for oil to squeeze through and a one-way check valve, with a spring to push it back out.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
<marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#e8e8e8"/><line x1="0" y1="0" x2="0" y2="10" stroke="#222" stroke-width="2"/></pattern>

</defs>
<g stroke-linejoin="round" stroke-linecap="round">
<line x1="400" y1="70" x2="400" y2="400" stroke="#ccc" stroke-width="2"/>
<rect x="56" y="370" width="300" height="18" fill="url(#hatch)" stroke="#222" stroke-width="3"/>
<rect x="60" y="290" width="270" height="80" fill="#e8e8e8" stroke="#222" stroke-width="3"/>
<g transform="rotate(-68 66 284)"><rect x="66" y="277" width="240" height="12" rx="3" fill="#cfe3f5" stroke="#222" stroke-width="3"/><rect x="290" y="289" width="12" height="7" fill="#cfe3f5" stroke="#222" stroke-width="2.5"/></g>
<circle cx="66" cy="284" r="19" fill="#fde2c4" stroke="#222" stroke-width="3"/>
<g transform="rotate(-68 66 284)"><line x1="54" y1="284" x2="78" y2="284" stroke="#222" stroke-width="3"/></g>
<circle cx="66" cy="284" r="4" fill="#222"/>
<path d="M202.7,65.2 A258,258 0 0 1 318.4,230.4" fill="none" stroke="#d1495b" stroke-width="4" stroke-dasharray="14 8" marker-end="url(#ah)"></path>
<path d="M512,170 L740,170 L740,270 L500,270 L500,223 L512,223 Z M500,209 L500,170 L512,170" fill="#e8e8e8" stroke="#222" stroke-width="3"/>
<rect x="512" y="178" width="220" height="84" fill="#fde2c4"/>
<path d="M512,178 L732,178 L732,262 L512,262" fill="none" stroke="#222" stroke-width="2.5"/>
<rect x="500" y="170" width="12" height="39" fill="#e8e8e8" stroke="#222" stroke-width="3"/>
<polyline points="560,216 570.3,216 577.9,236 593,196 608.2,236 623.3,196 638.4,236 653.6,196 668.7,236 683.8,196 699,236 714.1,196 721.7,216 732,216" fill="none" stroke="#222" stroke-width="3"></polyline>
<g><rect x="420" y="209" width="120" height="14" fill="#e8e8e8" stroke="#222" stroke-width="2.5"/><rect x="408" y="188" width="12" height="56" rx="3" fill="#e8e8e8" stroke="#222" stroke-width="3"/><rect x="540" y="178" width="20" height="10" fill="#cfe3f5" stroke="#222" stroke-width="2.5"/><rect x="540" y="192" width="20" height="48" fill="#cfe3f5" stroke="#222" stroke-width="2.5"/><rect x="540" y="252" width="20" height="10" fill="#cfe3f5" stroke="#222" stroke-width="2.5"/><g><rect x="560" y="237" width="5" height="17" rx="1.5" fill="#222"/></g></g>
<path d="M430,150 L470,150" fill="none" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222">
<g font-weight="bold" font-size="20"><text x="250" y="36" text-anchor="middle">Rotary damper</text><text x="600" y="36" text-anchor="middle">Linear damper (cut open)</text></g>
<text x="282" y="104">sinks slowly,</text><text x="282" y="128">no slam</text>
<text x="40" y="414">damper at the pivot</text><line x1="46" y1="396" x2="50" y2="302" stroke="#222" stroke-width="2"/>
<text x="760" y="126" text-anchor="end">oil</text><line x1="742" y1="132" x2="716" y2="182" stroke="#222" stroke-width="2"/>
<text x="486" y="128" text-anchor="end">push</text>
<text x="714" y="296" text-anchor="end">spring</text><line x1="704" y1="280" x2="700" y2="240" stroke="#222" stroke-width="2"/>
<g><text x="420" y="330">In: oil squeezes through the tiny</text><text x="420" y="352">hole at the top, so it goes slowly</text></g>
<g><text x="420" y="384">Out: the one-way valve opens and</text><text x="420" y="406">the spring pushes it back fast</text></g>
<text x="400" y="442" text-anchor="middle" font-size="18">The faster you push, the harder the oil pushes back</text>
</g></svg>
