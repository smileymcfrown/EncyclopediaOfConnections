<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>A hydraulic ram pump on a hillside: water runs down a long drive pipe from a source and out of an open waste valve; the fast flow slams the valve shut, the pressure surge (water hammer) opens a one-way valve into an air chamber, and the squeezed air pushes a little water up a thin pipe to a tank far higher than the source.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#e8e8e8"/><line x1="0" y1="0" x2="0" y2="10" stroke="#222" stroke-width="2"/></pattern>
</defs>
<g stroke-linejoin="round" stroke-linecap="round">
<path d="M0,176 H118 L385,352 L392,370 H600 L735,105 H800 V450 H0 Z" fill="#d8f0d2" stroke="#222" stroke-width="3"/>
<path d="M20,150 V176 H122 V150" fill="#7fb2dd" stroke="#222" stroke-width="3"/><rect x="21.5" y="150" width="99" height="24" fill="#7fb2dd"/>
<line x1="112" y1="166" x2="400" y2="347" stroke="#222" stroke-width="22"/><line x1="112" y1="166" x2="400" y2="347" stroke="#cfe3f5" stroke-width="16"/>
<rect x="393" y="334" width="170" height="26" rx="6" fill="#cfe3f5" stroke="#222" stroke-width="3"/>
<rect x="400" y="360" width="10" height="10" fill="#e8e8e8" stroke="#222" stroke-width="2"/><rect x="545" y="360" width="10" height="10" fill="#e8e8e8" stroke="#222" stroke-width="2"/>
<path d="M540,322 H610 L712,120 V40 H752 V62" fill="none" stroke="#222" stroke-width="13"/><path d="M540,322 H610 L712,120 V40 H752 V62" fill="none" stroke="#cfe3f5" stroke-width="8"/>
<path d="M728,52 V105 H792 V52" fill="#ffffff" stroke="#222" stroke-width="3"/><rect x="729.5" y="80" width="61" height="23.5" fill="#7fb2dd"/>
<rect x="423" y="309" width="30" height="27" fill="#cfe3f5" stroke="#222" stroke-width="3"/><rect x="423" y="309" width="7" height="5" fill="#222"/><rect x="446" y="309" width="7" height="5" fill="#222"/>
<rect x="495" y="200" width="45" height="137" rx="20" fill="#ffffff" stroke="#222" stroke-width="3"/>
<rect x="496.5" y="270" width="42" height="63" fill="#cfe3f5"></rect>
<line x1="497" y1="334" x2="505" y2="334" stroke="#222" stroke-width="3"/><line x1="530" y1="334" x2="538" y2="334" stroke="#222" stroke-width="3"/>
<g><rect x="505" y="331" width="26" height="5" fill="#fde2c4" stroke="#222" stroke-width="2"/></g><circle cx="505" cy="334" r="3" fill="#222"/>
<g><rect x="427" y="325" width="22" height="5" fill="#fde2c4" stroke="#222" stroke-width="2"/><rect x="436.5" y="294" width="3" height="31" fill="#222"/><rect x="428" y="285" width="20" height="10" fill="#9a9a9a" stroke="#222" stroke-width="2"/></g>
<path d="M148,164 L214,205" stroke="#d1495b" stroke-width="5" marker-end="url(#ah)"/>
<path d="M444,300 Q460,282 474,300" fill="none" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<path d="M650,268 L690,190" stroke="#d1495b" stroke-width="5" marker-end="url(#ah)"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222">
<text x="70" y="138" text-anchor="middle">water source</text>
<text x="300" y="190" text-anchor="middle">drive pipe: water</text><text x="300" y="212" text-anchor="middle">speeds up</text>
<text x="414" y="252" text-anchor="end">waste valve</text><text x="414" y="274" text-anchor="end">slams shut</text>
<text x="488" y="196" text-anchor="end">air chamber</text>
<text x="517" y="392" text-anchor="middle">one-way valve</text>
<text x="668" y="170" text-anchor="end">delivery pipe</text>
<text x="765" y="135" text-anchor="middle">tank</text>
<text x="150" y="410" text-anchor="middle" font-weight="bold" opacity="1">1 flow speeds up</text>
<text x="345" y="410" text-anchor="middle" font-weight="bold" opacity="1">2 valve slams: surge</text>
<text x="560" y="410" text-anchor="middle" font-weight="bold" opacity="1">3 air pushes water up</text>
<text x="400" y="438" text-anchor="middle">Lots of water falling a little way lifts a little water a long way</text>
</g>
</svg>
