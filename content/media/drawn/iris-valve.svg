<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Three side views of an iris valve: a fabric sleeve is held between a fixed top ring and a bottom ring; turning the bottom ring a quarter turn twists the sleeve into a narrow waist, and a half turn twists it shut so the grain above stops falling.</title>
