<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Cross-section of a spot weld: two overlapping metal sheets squeezed between an upper and a lower copper electrode, with current passing straight through and a lens-shaped nugget of melted metal forming where the sheets touch; beside it, a battery welder's two probes pressing a nickel strip onto a cell's end, with the current going down one probe, along the strip and up the other.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
<marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
</defs>

<g stroke-linejoin="round" stroke-linecap="round">
<line x1="520" y1="60" x2="520" y2="400" stroke="#cccccc" stroke-width="2"/>
<rect x="70" y="222" width="330" height="18" fill="#e8e8e8" stroke="#222" stroke-width="3"/>
<rect x="180" y="240" width="320" height="18" fill="#cfe3f5" stroke="#222" stroke-width="3"/>
<path d="M260,90 H320 V180 L305,222 H275 L260,180 Z" fill="#fde2c4" stroke="#222" stroke-width="3"/>
<path d="M275,258 H305 L320,300 V390 H260 V300 Z" fill="#fde2c4" stroke="#222" stroke-width="3"/>
<line x1="290" y1="104" x2="290" y2="372" stroke="#222" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#ak)"/>
<ellipse cx="290" cy="240" rx="28" ry="10" fill="#f5d0d0" stroke="#222" stroke-width="2.5"/>
<line x1="290" y1="48" x2="290" y2="84" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<line x1="290" y1="432" x2="290" y2="396" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<rect x="585" y="282" width="150" height="118" rx="6" fill="#d8f0d2" stroke="#222" stroke-width="3"/>
<rect x="635" y="272" width="50" height="10" fill="#e8e8e8" stroke="#222" stroke-width="2.5"/>
<rect x="565" y="264" width="190" height="8" fill="#e8e8e8" stroke="#222" stroke-width="2.5"/>
<rect x="634" y="140" width="12" height="124" fill="#fde2c4" stroke="#222" stroke-width="2.5"/>
<ellipse cx="640" cy="268" rx="7" ry="3" fill="#f5d0d0" stroke="#222" stroke-width="1.5"/>
<rect x="674" y="140" width="12" height="124" fill="#fde2c4" stroke="#222" stroke-width="2.5"/>
<ellipse cx="680" cy="268" rx="7" ry="3" fill="#f5d0d0" stroke="#222" stroke-width="1.5"/>
<rect x="620" y="110" width="80" height="30" rx="5" fill="#e8e8e8" stroke="#222" stroke-width="3"/>
<path d="M622,160 V252 Q622,258 630,258 H690 Q698,258 698,252 V160" fill="none" stroke="#222" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ak)"/>
<line x1="660" y1="60" x2="660" y2="104" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222">
<text x="260" y="30" font-size="20" text-anchor="middle" font-weight="bold">Spot weld, cut through</text>
<text x="660" y="30" font-size="20" text-anchor="middle" font-weight="bold">Battery tab welding</text>
<text x="250" y="130" font-size="18" text-anchor="end">copper</text>
<text x="250" y="152" font-size="18" text-anchor="end">electrode</text>
<text x="204" y="66" font-size="18" text-anchor="middle">squeeze</text>
<text x="70" y="210" font-size="18">two overlapping sheets</text>
<text x="360" y="204" font-size="18">melted nugget</text>
<line x1="372" y1="210" x2="314" y2="236" stroke="#222" stroke-width="2"/>
<text x="332" y="330" font-size="18">current</text>
<text x="660" y="425" font-size="18" text-anchor="middle">nickel strip on a cell</text>
<text x="760" y="200" font-size="18" text-anchor="end">current</text>
<text x="330" y="446" font-size="16" font-weight="bold">Short, huge current · no filler, flame or glue</text>
</g>
</svg>
