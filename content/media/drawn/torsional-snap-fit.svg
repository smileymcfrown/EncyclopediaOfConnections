<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Side views of a box edge with a see-saw catch arm pivoting on a thin bar that twists: the closing lid pushes the sloped hook outward and twists the bar, then the hook springs back over the lid to lock it, and pressing the pad below the bar tips the hook clear so the lid lifts free.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#e8e8e8"/><line x1="0" y1="0" x2="0" y2="10" stroke="#222" stroke-width="2"/></pattern>
</defs>
<g stroke-linejoin="round" stroke-linecap="round">
<line x1="270" y1="20" x2="270" y2="400" stroke="#cccccc" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="535" y1="20" x2="535" y2="400" stroke="#cccccc" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="30" y="200" width="130" height="140" fill="#e8e8e8" stroke="#222" stroke-width="3"/>
<rect x="30" y="100" width="130" height="40" fill="#cfe3f5" stroke="#222" stroke-width="3"/>
<rect x="158" y="243" width="24" height="14" fill="#e8e8e8" stroke="#222" stroke-width="3"/>
<polygon points="190,125 175,125 150,150 150,160 175,160 175,335 202,335 202,295 190,295" fill="#fde2c4" stroke="#222" stroke-width="3" transform="rotate(6 182 250)"/>
<circle cx="182" cy="250" r="9" fill="#e8e8e8" stroke="#222" stroke-width="3"/><circle cx="182" cy="250" r="2.5" fill="#222"/>
<path d="M95,45 L95,92" fill="none" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<path d="M198.9,235.9 A22,22 0 0 1 196.1,266.9" fill="none" stroke="#d1495b" stroke-width="3" marker-end="url(#ah)"/>
<text x="145" y="385" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle" font-weight="bold" stroke="none">1  Lid pushes the slope</text>
<rect x="295" y="200" width="130" height="140" fill="#e8e8e8" stroke="#222" stroke-width="3"/>
<rect x="295" y="160" width="130" height="40" fill="#cfe3f5" stroke="#222" stroke-width="3"/>
<rect x="423" y="243" width="24" height="14" fill="#e8e8e8" stroke="#222" stroke-width="3"/>
<polygon points="455,125 440,125 415,150 415,160 440,160 440,335 467,335 467,295 455,295" fill="#fde2c4" stroke="#222" stroke-width="3" transform="rotate(0 447 250)"/>
<circle cx="447" cy="250" r="9" fill="#e8e8e8" stroke="#222" stroke-width="3"/><circle cx="447" cy="250" r="2.5" fill="#222"/>
<text x="360" y="187" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle" stroke="none">lid</text>
<text x="360" y="290" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle" stroke="none">box</text>
<text x="410" y="385" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle" font-weight="bold" stroke="none">2  Hook drops behind lid</text>
<line x1="490" y1="210" x2="459" y2="244" stroke="#222" stroke-width="2"/>
<text x="493" y="190" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle" stroke="none">thin bar</text>
<text x="493" y="208" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#222" text-anchor="middle" stroke="none">(end view)</text>
<rect x="560" y="200" width="130" height="140" fill="#e8e8e8" stroke="#222" stroke-width="3"/>
<rect x="560" y="112" width="130" height="40" fill="#cfe3f5" stroke="#222" stroke-width="3"/>
<rect x="688" y="243" width="24" height="14" fill="#e8e8e8" stroke="#222" stroke-width="3"/>
<polygon points="720,125 705,125 680,150 680,160 705,160 705,335 732,335 732,295 720,295" fill="#fde2c4" stroke="#222" stroke-width="3" transform="rotate(8 712 250)"/>
<circle cx="712" cy="250" r="9" fill="#f5d0d0" stroke="#222" stroke-width="3"/><circle cx="712" cy="250" r="2.5" fill="#222"/>
<rect x="733" y="301" width="62" height="28" rx="14" fill="#fde2c4" stroke="#222" stroke-width="3"/>
<path d="M790,285 L740,285" fill="none" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<text x="762" y="355" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle" stroke="none">press</text>
<path d="M625,104 L625,55" fill="none" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<path d="M728.9,235.9 A22,22 0 0 1 726.1,266.9" fill="none" stroke="#d1495b" stroke-width="3" marker-end="url(#ah)"/>
<line x1="668" y1="256" x2="701" y2="252" stroke="#222" stroke-width="2"/>
<text x="620" y="262" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle" stroke="none">twisting</text>
<text x="620" y="284" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle" stroke="none">bar = spring</text>
<text x="665" y="385" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle" font-weight="bold" stroke="none">3  Press pad: hook lifts</text>
<text x="400" y="432" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle" stroke="none">The arm rocks on a thin bar fixed at both ends; the twisting bar is the spring</text>
</g>
</svg>
