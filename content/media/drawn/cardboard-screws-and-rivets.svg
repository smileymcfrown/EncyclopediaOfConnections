<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Cut-away views through two overlapped sheets of corrugated cardboard joined two ways. Left: a plastic cardboard screw turned in from the front, its coarse thread biting into the card around a punched hole and pulling the layers together, with nothing needed behind. Right: a box rivet made of two identical plastic halves pushed in from both sides, their ridged prongs set at right angles so they slide past each other and click together; a small view from above shows the four prongs crossing.</title>
