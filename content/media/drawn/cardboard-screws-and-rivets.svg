<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222">
<g font-size="19" font-weight="bold" text-anchor="middle"><text x="200" y="44">Cardboard screw</text><text x="600" y="44">Box rivet</text></g>
<text x="24" y="96">plastic screw, turned</text><text x="24" y="116">in from the front</text><line x1="70" y1="124" x2="166" y2="190" stroke="#222" stroke-width="1.5"/>
<text x="226" y="326">coarse thread</text><text x="226" y="346">bites into the card</text><line x1="238" y1="308" x2="214" y2="264" stroke="#222" stroke-width="1.5"/>
<text x="250" y="96">pulls the layers</text><text x="250" y="116">together</text>
<text x="200" y="378" text-anchor="middle">nothing needed behind</text>
<text x="444" y="96">two identical halves</text><text x="444" y="116">pushed in from both sides</text>
<text x="444" y="320">ridged prongs</text><text x="444" y="340">click together</text><line x1="556" y1="306" x2="590" y2="238" stroke="#222" stroke-width="1.5"/>
<text x="700" y="392" text-anchor="middle" font-size="17">from above: prongs</text><text x="700" y="411" text-anchor="middle" font-size="17">at right angles</text>
<text x="40" y="282" font-size="17">corrugated card</text>
<text x="400" y="438" text-anchor="middle">Punch a hole through all the layers first · a loose rivet can be a pivot</text>
</g></svg>
