<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Side cut-away of a cam buckle: the webbing runs between a fixed bar and a toothed cam on a pivot, which a small spring presses onto it; pulling the tail lifts the cam slightly so the strap slides through, the load pulling back rolls the cam in so its teeth bite and hold, and pressing the lever lifts the cam to release.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#e8e8e8"/><line x1="0" y1="0" x2="0" y2="10" stroke="#222" stroke-width="2"/></pattern>
</defs>
<g transform="translate(0,60)">
<g stroke="#222" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
<rect x="290" y="66" width="240" height="214" rx="10" fill="#f4f4f4" stroke="#999" stroke-width="2"/>
<rect x="326" y="196" width="40" height="10" fill="#e8e8e8" stroke-width="2"/>
<rect x="30" y="232" width="740" height="12" fill="#d8f0d2"/>
