<g><path d="M513.5,194 L508.1,201.1 L502.3,207.5 L496,213.2 L489.3,218.2 L482.4,222.4 L477.9,228.9 L468,228.6 L462.8,234 L453.5,231.8 L447.7,236.1 L439.3,232.2 L433.3,235.3 L426.1,230 L420,232 L414.3,225.5 L408.3,226.5 L404.1,219.2 L398.5,219.2 L396,211.4 L390.8,210.7 L390,202.8 L385.3,201.4 L386.2,193.8 L385.1,189.2 L384.6,184.8 L384.5,180.5 L381.9,177.7 L379.4,170.9 L378.2,163.7 L378.2,156.3 L379.4,149.1 L393,128.9 L330.7,85.3 L319.2,101.7 L381.5,145.2 L395.9,125.6 L405.6,120.5 L416.3,118.2 L427.3,118.6 L437.7,121.9 L447,127.8 L454.4,135.9 L459.5,145.6 L461.8,156.3 L461.4,167.3 Z" fill="#cfe3f5"/></g>
<circle cx="420" cy="160" r="8" fill="#fff"/><circle cx="420" cy="160" r="3" fill="#222"/>
<line x1="600" y1="220" x2="690" y2="220" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"></line>
<line x1="200" y1="220" x2="110" y2="220" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"></line>
<line x1="262" y1="40" x2="290" y2="80" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"></line>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222">
<text x="560" y="196">pull the tail to tighten</text>
<text x="20" y="186">load pulls back:</text><text x="20" y="208">teeth bite and hold</text>
<text x="250" y="30" text-anchor="end">press the lever</text><text x="250" y="52" text-anchor="end">to release</text>
<text x="540" y="110">toothed cam</text><line x1="538" y1="116" x2="500" y2="150" stroke="#222" stroke-width="1.5"/>
<text x="318" y="168" text-anchor="end">spring</text>
<text x="420" y="292" text-anchor="middle">fixed bar</text>
<text x="64" y="270">to the load</text><text x="690" y="270">tail</text>
</g>
</g>
<text x="400" y="438" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#222" font-size="17">Slides through one way, grips harder the more the load pulls · press the lever to let go</text>
</svg>
