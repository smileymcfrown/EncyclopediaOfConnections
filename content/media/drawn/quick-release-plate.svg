<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>End-on cross-section of a quick-release clamp holding a dovetail plate: the plate's 45-degree bevelled edges sit under a fixed jaw and a moving jaw, and turning the knob pushes the moving jaw in so the sloping faces wedge the plate sideways and down onto the clamp base.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
</defs>
<g stroke="#222" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
<rect x="300" y="70" width="200" height="100" rx="10" fill="#f5d0d0"/>
<rect x="370" y="44" width="60" height="28" rx="6" fill="#f5d0d0"/>
<circle cx="400" cy="120" r="32" fill="#ffffff"/>
<rect x="150" y="260" width="520" height="60" fill="#e8e8e8"/>
<polygon points="236,260 564,260 516,212 516,170 284,170 284,212" fill="#cfe3f5"/>
<polygon points="150,180 270,180 270,198 284,212 240,256 240,260 150,260" fill="#e8e8e8"/>
<polygon points="650,180 530,180 530,198 516,212 560,256 560,260 650,260" fill="#e8e8e8"/>
<rect x="650" y="214" width="60" height="16" fill="#e8e8e8"/>
<rect x="706" y="190" width="30" height="64" rx="6" fill="#fde2c4"/>
</g>
<g stroke-linecap="round">
<line x1="780" y1="160" x2="680" y2="160" stroke="#d1495b" stroke-width="5" marker-end="url(#ah)"/>
<line x1="230" y1="196" x2="258" y2="224" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<line x1="570" y1="196" x2="542" y2="224" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<line x1="300" y1="134" x2="330" y2="188" stroke="#222" stroke-width="1.5"/>
<line x1="400" y1="196" x2="400" y2="246" stroke="#d1495b" stroke-width="5" marker-end="url(#ah)"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle">
<text x="400" y="30">camera</text>
<text x="150" y="100" text-anchor="start">plate with</text>
<text x="150" y="122" text-anchor="start">bevelled edges</text>
<text x="192" y="248">fixed jaw</text>
<text x="604" y="248" font-size="16">moving jaw</text>
<text x="400" y="300">clamp base</text>
<text x="730" y="140">turn knob</text>
<text x="400" y="362">The 45° faces turn the sideways squeeze into a pull down onto the base,</text>
<text x="400" y="386">so the plate can't lift, slide or wobble</text>
<text x="400" y="428">Loosen the knob and the plate slides or lifts out</text>
</g>
</svg>
