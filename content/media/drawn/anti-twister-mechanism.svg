<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Side view of an anti-twister: a cable leaves a fixed base, loops out through a guide on a carrier arm and comes back in to a spinning platform on the same axis; the carrier turns at half the platform's speed, so the cable is only bent and never twisted.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
<pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0,12 L12,0" stroke="#222" stroke-width="2"/></pattern>
</defs>
<g stroke="#222" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
<rect x="180" y="384" width="360" height="18" fill="url(#hatch)"/>
<line x1="350" y1="30" x2="350" y2="384" stroke="#999" stroke-width="2" stroke-dasharray="10 7"/>
<rect x="250" y="330" width="200" height="54" fill="#e8e8e8"/>
<rect x="340" y="104" width="20" height="226" fill="#e8e8e8"/>
<rect x="200" y="74" width="300" height="30" rx="4" fill="#cfe3f5"/>
<rect x="328" y="206" width="44" height="36" fill="#fde2c4"/>
<rect x="372" y="214" width="190" height="20" fill="#fde2c4"/>
<path d="M385,330 C385,300 577,325 577,295 L577,155 C577,125 385,135 385,104" fill="none" stroke="#222" stroke-width="13"/>
<path d="M385,330 C385,300 577,325 577,295 L577,155 C577,125 385,135 385,104" fill="none" stroke="#d8f0d2" stroke-width="7"/>
<rect x="562" y="150" width="30" height="150" rx="6" fill="#fde2c4" fill-opacity="0.8"/>
</g>
<g stroke="#d1495b" stroke-width="4" fill="none" stroke-linecap="round">
<path d="M250,52 A100,16 0 0 0 450,52" marker-end="url(#ah)"/>
<path d="M300,268 A60,12 0 0 0 420,268" marker-end="url(#ah)"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222">
<text x="190" y="96" text-anchor="end">spinning part:</text>
<text x="190" y="120" text-anchor="end">2 turns</text>
<text x="318" y="222" text-anchor="end">carrier arm:</text>
<text x="318" y="246" text-anchor="end">1 turn, same way</text>
<text x="240" y="362" text-anchor="end">fixed base</text>
<text x="605" y="210">cable loop</text>
<text x="605" y="234">through a guide</text>
<text x="605" y="258">on the carrier</text>
<text x="400" y="434" text-anchor="middle" font-size="18">Carrier turns at half speed, so the cable only bends and never twists</text>
</g>
</svg>
