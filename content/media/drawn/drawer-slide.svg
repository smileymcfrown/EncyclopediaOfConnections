<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle">
<text x="140" y="40" font-size="21" font-weight="bold">End view</text><text x="530" y="40" font-size="21" font-weight="bold">Side view: pulling it out</text><g text-anchor="start" font-size="17"><text x="74" y="352">outer, screwed to cabinet</text><text x="74" y="376">middle</text><text x="74" y="400">inner, screwed to drawer</text><text x="74" y="424">balls in a cage (retainer)</text></g><text x="630" y="66">pull</text><text x="408" y="342" font-size="17">cabinet</text><text x="245" y="96" font-size="17">drawer</text><text x="560" y="404">Middle part moves half as far as the drawer;</text><text x="560" y="428">each ball cage rolls half as far as the part on it</text>
</g>
</svg>
