<rect x="213" y="104" width="22" height="212" fill="#d8f0d2" stroke="#222" stroke-width="3"/>
<circle cx="140" cy="122.5" r="6.5" fill="#ffffff" stroke="#222" stroke-width="3"/>
<circle cx="140" cy="297.5" r="6.5" fill="#ffffff" stroke="#222" stroke-width="3"/>
<circle cx="156" cy="147.5" r="6.5" fill="#ffffff" stroke="#222" stroke-width="3"/>
<circle cx="156" cy="272.5" r="6.5" fill="#ffffff" stroke="#222" stroke-width="3"/>
<rect x="44" y="338" width="22" height="16" fill="#e8e8e8" stroke="#222" stroke-width="2"/>
