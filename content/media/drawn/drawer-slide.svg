<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>A three-part ball-bearing drawer slide: an end view of the nested outer, middle and inner channels with a row of balls between each pair, and a side view of the slide pulled fully open, the middle part out half as far as the drawer and the ball cages part-way along.</title>
