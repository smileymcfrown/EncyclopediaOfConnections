<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Side view of a ratchet tie-down buckle: webbing wound round a slotted spool with a toothed wheel, a pawl on the handle that pushes the teeth round and a locking pawl on the frame that stops the spool turning back; a small view shows the handle swung fully open with both pawls lifted to release.</title>
