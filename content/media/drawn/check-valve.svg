<g transform="rotate(0 180 52)"><rect x="176" y="50" width="9" height="76" rx="3" fill="#fde2c4" stroke="#222" stroke-width="3"/></g><circle cx="180" cy="52" r="6" fill="#fff" stroke="#222" stroke-width="2.5"/><circle cx="180" cy="52" r="2" fill="#222"/>
