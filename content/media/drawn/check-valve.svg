<g font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222">
<g font-weight="bold" text-anchor="middle"><text x="200" y="30">→ Forward flow: pushed open</text><text x="600" y="30">← Back-pressure: pressed shut</text></g>
<text x="200" y="52" text-anchor="middle" font-size="17">ball and spring</text><text x="600" y="52" text-anchor="middle" font-size="17">ball and spring</text>
<text x="200" y="244" text-anchor="middle" font-size="17">hinged flap</text><text x="600" y="244" text-anchor="middle" font-size="17">hinged flap</text>
<text x="400" y="438" text-anchor="middle" font-size="18">Forward flow must beat a small cracking pressure · reverse flow only seals it tighter</text>
</g>
</svg>
