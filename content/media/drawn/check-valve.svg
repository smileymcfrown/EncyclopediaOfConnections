<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Two check valves in cutaway, a spring-loaded ball and a hinged flap: forward flow pushes the ball off its seat against the spring, or swings the flap open, and flow from the other side presses the ball or flap back onto its seat so nothing gets through.</title>
