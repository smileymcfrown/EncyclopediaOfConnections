<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>A rod passing through a flat plate with an oversized hole: on the left a thumb holds the plate square so the rod slides freely, and on the right a spring tips the plate so two opposite edges of the hole bite the rod and pushing the rod tips the plate harder and locks it.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#e8e8e8"/><line x1="0" y1="0" x2="0" y2="10" stroke="#222" stroke-width="2"/></pattern>
<g id="fixed" fill="url(#hatch)" stroke="#222" stroke-width="3">
<rect x="100" y="115" width="18" height="56"/>
<rect x="210" y="275" width="28" height="50"/>
</g>
<rect id="rod" x="40" y="215" width="320" height="30" fill="#e8e8e8" stroke="#222" stroke-width="3"/>
<g id="plate" fill="#cfe3f5" stroke="#222" stroke-width="3">
<rect x="-10" y="-120" width="20" height="100"/>
<rect x="-10" y="20" width="20" height="50"/>
</g>
</defs>
<g stroke-linejoin="round" stroke-linecap="round">
<line x1="400" y1="20" x2="400" y2="410" stroke="#cccccc" stroke-width="2"/>
<!-- square: slides -->
<use href="#fixed"/>
<polyline points="118,142 126,132 134,152 142,132 150,152 158,132 166,152 174,132 182,152 190,142" fill="none" stroke="#222" stroke-width="3"/>
<use href="#rod"/>
<use href="#plate" transform="translate(200,230)"/>
<ellipse cx="236" cy="128" rx="24" ry="15" fill="#fde2c4" stroke="#222" stroke-width="3"/>
<line x1="300" y1="96" x2="226" y2="96" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<line x1="80" y1="360" x2="320" y2="360" stroke="#d1495b" stroke-width="4" marker-start="url(#ah)" marker-end="url(#ah)"/>
<line x1="160" y1="197" x2="196" y2="212" stroke="#222" stroke-width="2"/>
<!-- tipped: locked -->
<g transform="translate(400,0)">
<use href="#fixed"/>
<polyline points="118,142 128,132 138,152 148,132 158,152 168,132 178,152 188,132 198,152 208,132 218,152 228,132 238,152 249,142" fill="none" stroke="#222" stroke-width="3"/>
<use href="#rod"/>
<use href="#plate" transform="translate(226,230) rotate(21.3)"/>
<circle cx="242.6" cy="215" r="6" fill="#d1495b"/>
<circle cx="209.4" cy="245" r="6" fill="#d1495b"/>
<path d="M236,88 A110,110 0 0 1 318,130" fill="none" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<line x1="120" y1="360" x2="300" y2="360" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<line x1="282" y1="194" x2="249" y2="213" stroke="#222" stroke-width="2"/>
</g>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle">
<text x="200" y="32" font-size="21" font-weight="bold">Square: rod slides</text>
<text x="600" y="32" font-size="21" font-weight="bold">Tipped: locked</text>
<text x="200" y="68">thumb presses it square</text>
<text x="105" y="202">loose hole</text>
<text x="160" y="290">plate</text>
<text x="200" y="392">rod slides freely</text>
<text x="600" y="68">load tips it harder</text>
<text x="575" y="186">spring</text>
<text x="728" y="200">edges bite</text>
<text x="610" y="392">push this way: grips harder</text>
<text x="400" y="434">Stepless one-way lock · push the plate square to let go</text>
</g>
</svg>
