<path d="M352,268 L428,268 L414,292 L366,292 Z" fill="none" stroke="#222" stroke-width="3"/>
<line x1="69" y1="325" x2="69" y2="362" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<line x1="731" y1="325" x2="731" y2="362" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle">
<g opacity="1"><text x="400" y="38" font-size="21" font-weight="bold">Going round a bend: inner wheel 8, outer 12</text><text x="69" y="104">8 rpm</text><text x="731" y="104">12 rpm</text></g><g opacity="0"><text x="400" y="38" font-size="21" font-weight="bold">One wheel on ice: it spins at 20, the other stops</text><text x="69" y="104">0 rpm</text><text x="731" y="104">20 rpm</text></g><g opacity="0"><text x="400" y="38" font-size="21" font-weight="bold">Straight ahead: both wheels 10</text><text x="69" y="104">10 rpm</text><text x="731" y="104">10 rpm</text></g><text x="69" y="80" font-size="17">left wheel</text><text x="731" y="80" font-size="17">right wheel</text><text x="390" y="115" font-size="17">spider gears</text><text x="390" y="330" font-size="17">cage: always 10 rpm</text><g text-anchor="start" font-size="17"><text x="510" y="128">ring gear</text><text x="532" y="390">from engine</text></g><text x="290" y="370" font-size="17">same push on both wheels</text><text x="400" y="420" font-size="19">The cage speed is always the average of the two wheels,</text><text x="400" y="443" font-size="19">and both wheels always get the same push</text>
</g>
</svg>
