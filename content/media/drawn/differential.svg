<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Top-down schematic of an open differential: the engine turns a ring gear on a cage that carries spider gears on a cross pin, meshing with side gears on the left and right axles; going round a bend the cage turns at 10 rpm while the inner wheel turns at 8 and the outer at 12, with equal push arrows on both wheels.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="10" stroke="#222" stroke-width="2"/></pattern>
</defs>
<g stroke-linejoin="round" stroke-linecap="round">
<g opacity="0"><rect x="674" y="112" width="112" height="208" rx="10" fill="#cfe3f5" opacity="0.8"/><text x="688" y="166" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#222" text-anchor="middle">ice</text></g>
<rect x="100" y="205" width="230" height="20" fill="#e8e8e8" stroke="#222" stroke-width="3"/>
<rect x="450" y="205" width="252" height="20" fill="#e8e8e8" stroke="#222" stroke-width="3"/>
<rect x="40" y="115" width="58" height="200" rx="8" fill="#e8e8e8" stroke="#222" stroke-width="3"/>
<pattern id="pL" width="55" height="15.43" patternUnits="userSpaceOnUse" x="41.5" y="116.5"><rect width="55" height="15.43" fill="#e8e8e8"/><rect width="55" height="3" fill="#555555"/></pattern><clipPath id="cL"><rect x="41.5" y="116.5" width="55" height="197"/></clipPath><g clip-path="url(#cL)"><rect x="41.5" y="-114.93" width="55" height="443.86" fill="url(#pL)"></rect></g>
<rect x="40" y="115" width="58" height="200" rx="8" fill="none" stroke="#222" stroke-width="3"/>
<rect x="702" y="115" width="58" height="200" rx="8" fill="#e8e8e8" stroke="#222" stroke-width="3"/>
<pattern id="pR" width="55" height="15.75" patternUnits="userSpaceOnUse" x="703.5" y="116.5"><rect width="55" height="15.75" fill="#e8e8e8"/><rect width="55" height="3" fill="#555555"/></pattern><clipPath id="cR"><rect x="703.5" y="116.5" width="55" height="197"/></clipPath><g clip-path="url(#cR)"><rect x="703.5" y="-403.25" width="55" height="732.5" fill="url(#pR)"></rect></g>
<rect x="702" y="115" width="58" height="200" rx="8" fill="none" stroke="#222" stroke-width="3"/>
<rect x="504" y="300" width="18" height="100" fill="#e8e8e8" stroke="#222" stroke-width="3"/>
<path d="M494,286 L532,286 L524,306 L502,306 Z" fill="#fde2c4" stroke="#222" stroke-width="3"/>
<rect x="300" y="125" width="180" height="180" rx="6" fill="#d8f0d2" stroke="#222" stroke-width="3"/>
<pattern id="pG" width="19" height="10" patternUnits="userSpaceOnUse" x="481.5" y="100"><rect width="19" height="10" fill="#fde2c4"/><rect width="19" height="2.5" fill="#222222"/></pattern><clipPath id="cG"><rect x="481.5" y="100" width="19" height="230"/></clipPath><g clip-path="url(#cG)"><rect x="481.5" y="-270" width="19" height="610" fill="url(#pG)"></rect></g>
<rect x="480" y="98" width="22" height="234" fill="none" stroke="#222" stroke-width="3"/>
<path d="M318,170 L346,150 L346,280 L318,260 Z" fill="#cfe3f5" stroke="#222" stroke-width="3"/>
<path d="M462,170 L434,150 L434,280 L462,260 Z" fill="#cfe3f5" stroke="#222" stroke-width="3"/>
<rect x="384" y="134" width="12" height="162" fill="#e8e8e8" stroke="#222" stroke-width="3"/>
<path d="M352,162 L428,162 L414,138 L366,138 Z" fill="#fde2c4" stroke="#222" stroke-width="3"/>
<pattern id="pS138" width="12" height="18" patternUnits="userSpaceOnUse" x="368" y="141"><rect width="12" height="18" fill="#fde2c4"/><rect width="2.5" height="18" fill="#222222"/></pattern><clipPath id="cS138"><rect x="368" y="141" width="44" height="18"/></clipPath><g clip-path="url(#cS138)"><rect x="140" y="141" width="284" height="18" fill="url(#pS138)"></rect></g>
<path d="M352,162 L428,162 L414,138 L366,138 Z" fill="none" stroke="#222" stroke-width="3"/>
