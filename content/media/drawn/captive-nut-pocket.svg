<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Captive nut pocket: on the left a cut-away of a printed block with a bolt passing down through a hole into a hex nut sitting in a pocket in the bottom face, so tightening pulls the nut up against solid plastic; on the right the view from below, where the hexagonal pocket is just bigger than the nut, so its flat sides stop it turning.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker></defs>
<line x1="400" y1="20" x2="400" y2="400" stroke="#cccccc" stroke-width="2"/>
<g stroke="#222" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><rect x="60" y="120" width="280" height="30" fill="#cfe3f5"/><path d="M60,150 L188,150 L188,255 L158,255 L158,300 L60,300 Z" fill="#d8f0d2"/><path d="M340,150 L212,150 L212,255 L242,255 L242,300 L340,300 Z" fill="#d8f0d2"/><rect x="162" y="258" width="76" height="40" fill="#e8e8e8"/><line x1="184" y1="258" x2="184" y2="298" stroke-width="2"/><line x1="216" y1="258" x2="216" y2="298" stroke-width="2"/><rect x="160" y="92" width="80" height="28" rx="3" fill="#e8e8e8"/><rect x="191" y="120" width="18" height="182" fill="#e8e8e8"/><line x1="191" y1="262" x2="209" y2="266" stroke-width="1.5"/><line x1="191" y1="269" x2="209" y2="273" stroke-width="1.5"/><line x1="191" y1="276" x2="209" y2="280" stroke-width="1.5"/><line x1="191" y1="283" x2="209" y2="287" stroke-width="1.5"/><line x1="191" y1="290" x2="209" y2="294" stroke-width="1.5"/><line x1="191" y1="297" x2="209" y2="301" stroke-width="1.5"/><rect x="470" y="100" width="260" height="240" fill="#d8f0d2"/><polygon points="680.0,220.0 640.0,289.3 560.0,289.3 520.0,220.0 560.0,150.7 640.0,150.7" fill="#ffffff"/><polygon points="672.0,220.0 636.0,282.4 564.0,282.4 528.0,220.0 564.0,157.6 636.0,157.6" fill="#e8e8e8"/><circle cx="600" cy="220" r="26" fill="#ffffff"/><circle cx="600" cy="220" r="20" fill="#e8e8e8"/></g>
<g stroke="#d1495b" stroke-width="4" fill="none" stroke-linecap="round" marker-end="url(#ah)"><line x1="200" y1="52" x2="200" y2="86"/><line x1="200" y1="352" x2="200" y2="310"/></g>
<g font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222">
<text x="200" y="40" text-anchor="middle" font-size="21" font-weight="bold">Cut-away side view</text>
<text x="600" y="40" text-anchor="middle" font-size="21" font-weight="bold">Seen from below</text>
<text x="250" y="112">bolt</text>
<text x="72" y="205" font-size="18">printed part</text><text x="250" y="142" font-size="18">part held</text>
<text x="200" y="378" text-anchor="middle">nut in its pocket is pulled up</text>
<text x="200" y="400" text-anchor="middle">against solid plastic</text>
<text x="600" y="372" text-anchor="middle">pocket a little bigger than the nut:</text>
<text x="600" y="396" text-anchor="middle">the flat sides stop it turning</text>
<text x="400" y="436" text-anchor="middle" font-size="18">A strong metal thread in a 3D-printed part, for the cost of one nut</text>
</g></svg>
