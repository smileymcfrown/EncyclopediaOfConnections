<pattern id="stripe" width="40" height="8" patternUnits="userSpaceOnUse"><rect width="40" height="8" fill="#e8e8e8"/><rect width="40" height="2.5" fill="#999999"/></pattern>
<clipPath id="csh"><rect x="140" y="179.5" width="526.5" height="21"/></clipPath>
<clipPath id="cdr"><rect x="571.5" y="161.5" width="77" height="57"/></clipPath>
</defs>
