<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Side cut-away of a spring-applied electromagnetic brake on a motor shaft lifting a load: with the power off, springs in the fixed coil housing push the steel armature plate against the friction disc, squeezing it against the fixed plate, so the shaft and the hanging load are held.</title>
