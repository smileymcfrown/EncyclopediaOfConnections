<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>The inside of a click pen's tube unrolled flat: fixed ribs with alternating short ledges and deep channels, and the zig-zag path of one rotator lug over four pushes, each push driving it down onto the button's sloped teeth and letting it spring up into the next gap, so the pen tip goes out, in, out, in.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
<rect id="lug" x="-8" y="-8" width="16" height="16" fill="#cfe3f5" stroke="#222" stroke-width="2"/>
<g id="pen" stroke="#222" stroke-width="2">
<rect x="-8" y="306" width="16" height="50" fill="#cfe3f5"/>
<polygon points="-8,356 8,356 0,368" fill="#e8e8e8"/>
</g>
</defs>
<g stroke-linejoin="round" stroke-linecap="round">
<rect x="40" y="90" width="720" height="190" fill="none" stroke="#cccccc" stroke-width="2"/>
<!-- fixed ribs on the tube wall -->
<polygon points="40,90 40,214.5 90,200 90,120 110,120 110,232 240,200 240,232 350,200 350,120 370,120 370,232 500,200 500,232 610,200 610,120 630,120 630,232 760,200 760,90" fill="#e8e8e8" stroke="#222" stroke-width="3"/>
<line x1="40" y1="90" x2="760" y2="90" stroke="#e8e8e8" stroke-width="3"/>
<!-- sloped ends of the button teeth at full push -->
<polyline points="40,238 85,238 152,252 152,238 215,238 282,252 282,238 345,238 412,252 412,238 475,238 542,252 542,238 605,238 672,252 672,238 735,238 760,243" fill="none" stroke="#222" stroke-width="2.5" stroke-dasharray="8 5"/>
<!-- lug rest positions -->
<use href="#lug" x="100" y="128"/><use href="#lug" x="232" y="208"/><use href="#lug" x="360" y="128"/><use href="#lug" x="492" y="208"/><use href="#lug" x="620" y="128"/>
<!-- lug path -->
<polyline points="100,138 100,241 148,251 148,226 226,204 232,216 232,242 278,251 278,224 342,203 360,196 360,138 360,241 408,251 408,226 486,204 492,216 492,242 538,251 538,224 602,203 620,196 620,142" fill="none" stroke="#d1495b" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#ah)"/>
<!-- pens below each rest position -->
<use href="#pen" x="100"/>
<rect x="96" y="290" width="8" height="16" fill="#fde2c4" stroke="#222" stroke-width="2"/>
<use href="#pen" x="232"/>
<rect x="228" y="298" width="8" height="8" fill="#fde2c4" stroke="#222" stroke-width="2"/>
<line x1="232" y1="368" x2="232" y2="382" stroke="#222" stroke-width="3"/>
<use href="#pen" x="360"/>
<rect x="356" y="290" width="8" height="16" fill="#fde2c4" stroke="#222" stroke-width="2"/>
<use href="#pen" x="492"/>
<rect x="488" y="298" width="8" height="8" fill="#fde2c4" stroke="#222" stroke-width="2"/>
<line x1="492" y1="368" x2="492" y2="382" stroke="#222" stroke-width="3"/>
<use href="#pen" x="620"/>
<rect x="616" y="290" width="8" height="16" fill="#fde2c4" stroke="#222" stroke-width="2"/>
<line x1="100" y1="76" x2="100" y2="118" stroke="#222" stroke-width="2"/>
<line x1="246" y1="76" x2="238" y2="198" stroke="#222" stroke-width="2"/>
<line x1="708" y1="300" x2="662" y2="252" stroke="#222" stroke-width="2"/>
<line x1="74" y1="150" x2="91" y2="132" stroke="#222" stroke-width="2"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle">
<text x="400" y="30" font-size="21" font-weight="bold">Inside of the tube, unrolled flat</text>
<text x="100" y="70">deep channel</text>
<text x="246" y="70">short ledge</text>
<text x="440" y="155">fixed ribs</text>
<text x="62" y="166">lug</text>
<text x="712" y="318">button teeth</text>
<text x="712" y="338">(fully pushed)</text>
<g font-size="16">
<text x="100" y="404">tip in</text><text x="232" y="404">tip out</text><text x="360" y="404">tip in</text><text x="492" y="404">tip out</text><text x="620" y="404">tip in</text>
<text x="166" y="338">push 1</text><text x="296" y="338">push 2</text><text x="426" y="338">push 3</text><text x="556" y="338">push 4</text>
</g>
<text x="400" y="436">Each push steps the lug round once: channel, ledge, channel, ledge</text>
</g>
</svg>
