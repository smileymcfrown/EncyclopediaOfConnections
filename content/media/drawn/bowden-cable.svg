<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>A Bowden cable from a hand lever to a brake caliper: squeezing the lever pulls the inner wire, which slides inside a curved outer sleeve held in a stop at each end, so the far end of the wire pulls the brake arm and its pad onto the rim while the sleeve pushes back on its two stops; a return spring opens the brake again. A small graph shows the force getting through falling as the total bend grows.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#e8e8e8"/><line x1="0" y1="0" x2="0" y2="10" stroke="#222" stroke-width="2"/></pattern>
</defs>
<g stroke="#222" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
<rect x="56" y="30" width="34" height="320" rx="6" fill="#e8e8e8"/>
<path d="M90,66 H200 V122 H246 V158 H200 V114 H90 Z" fill="#e8e8e8"/>
<g><path d="M128,84 L160,96 L190,300 Q186,316 172,312 L132,150 Z" fill="#fde2c4"/><circle cx="140" cy="140" r="5" fill="#222"/></g>
<circle cx="140" cy="90" r="7" fill="#fff"/><circle cx="140" cy="90" r="2.5" fill="#222"/>
<line x1="140" y1="140" x2="246" y2="140" stroke="#555" stroke-width="3"></line>
<path d="M245,140 C320,140 330,70 410,80 C490,90 470,250 600,250" fill="none" stroke="#222" stroke-width="18"/>
<path d="M245,140 C320,140 330,70 410,80 C490,90 470,250 600,250" fill="none" stroke="#cfe3f5" stroke-width="12"/>
<path d="M245,140 C320,140 330,70 410,80 C490,90 470,250 600,250" fill="none" stroke="#555" stroke-width="3" stroke-linecap="butt" stroke-dasharray="14 8"></path>
<rect x="600" y="196" width="22" height="66" fill="#e8e8e8"/><rect x="600" y="182" width="60" height="16" fill="url(#hatch)"/>
<rect x="646" y="292" width="22" height="70" rx="3" fill="#e8e8e8"/>
<rect x="650" y="392" width="110" height="18" fill="url(#hatch)"/><path d="M680,392 L686,370 L694,370 L700,392 Z" fill="#e8e8e8"/>
<rect x="770" y="250" width="18" height="60" fill="url(#hatch)"/>
<polyline points="698,280 706,280 709.5,289 713,271 716.5,289 720,271 723.5,289 727,271 730.5,289 734,271 737.5,289 741,271 744.5,289 748,271 751.5,289 755,271 758.5,289 762,280 770,280" fill="none" stroke-width="2.5"></polyline>
<line x1="622" y1="250" x2="690" y2="250" stroke="#555" stroke-width="3"></line>
<g><rect x="682" y="238" width="16" height="140" rx="5" fill="#fde2c4"/><rect x="674" y="304" width="8" height="32" fill="#d8f0d2"/><circle cx="690" cy="250" r="4.5" fill="#222"/></g>
<circle cx="690" cy="370" r="6" fill="#fff"/><circle cx="690" cy="370" r="2.2" fill="#222"/>
<line x1="222" y1="176" x2="178" y2="176" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<path d="M210,300 A140,140 0 0 1 150,334" fill="none" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<line x1="292" y1="166" x2="262" y2="166" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<line x1="560" y1="274" x2="592" y2="274" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<line x1="728" y1="232" x2="700" y2="232" stroke="#d1495b" stroke-width="3.5" marker-end="url(#ah)"/>
<g stroke-width="2"><path d="M262,262 V380 H462" fill="none"/><path d="M266,276 C320,320 370,350 456,368" fill="none" stroke="#d1495b" stroke-width="3" stroke-dasharray="1 0"/></g>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222">
<text x="214" y="206">squeeze the lever:</text><text x="214" y="228">the wire is pulled</text>
<text x="250" y="40">outer sleeve: pushes back on both stops</text>
<text x="604" y="170" font-size="17">frame stop</text>
<text x="712" y="338" font-size="17">return</text><text x="712" y="358" font-size="17">spring</text>
<text x="638" y="312" text-anchor="end" font-size="17">pad closes</text><text x="638" y="332" text-anchor="end" font-size="17">on the rim</text>
<g font-size="16"><text x="272" y="256">force out</text><text x="362" y="400" text-anchor="middle">total bend angle</text></g>
<text x="12" y="380">handlebar</text>
<text x="400" y="440" text-anchor="middle" font-size="17">Every bend adds friction, so route the sleeve as straight as you can</text>
</g>
</svg>
