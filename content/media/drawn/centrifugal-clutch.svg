</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222">
<text x="470" y="62">engine speed</text><text x="629.5" y="128" text-anchor="middle" font-size="17">shoes engage</text>
<g opacity="0.6"><text x="470" y="170">Slow: springs pull the</text><text x="470" y="194">shoes clear, no drive</text></g>
<g opacity="0.6"><text x="470" y="240">Speeding up: shoes fly</text><text x="470" y="264">out, touch, slip and heat up</text></g>
<g opacity="1"><text x="470" y="310">Fast: shoes grip, the</text><text x="470" y="334">drum turns with the hub</text></g>
<text x="40" y="40">drum (output)</text><line x1="110" y1="46" x2="140" y2="104" stroke="#222" stroke-width="2"/>
<text x="470" y="400">hub on the engine shaft</text><line x1="466" y1="395" x2="275" y2="270" stroke="#222" stroke-width="2"/>
<text x="400" y="440" text-anchor="middle" font-size="18">The pull on the shoes grows with speed squared, so the clutch takes up the drive smoothly</text>
</g>
</svg>
