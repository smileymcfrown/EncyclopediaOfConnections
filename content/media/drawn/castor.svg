<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>A swivel castor: a side view shows the wheel's axle a short distance (the trail) behind the vertical swivel pivot, and a top view shows a trolley being pushed in a new direction with its four swivel castors swinging round to trail behind their pivots.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
<marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#e8e8e8"/><line x1="0" y1="0" x2="0" y2="10" stroke="#222" stroke-width="2"/></pattern>
<g id="cas"><g transform="rotate(54.4)"><line x1="0" y1="0" x2="-22" y2="0" stroke="#222" stroke-width="5"/><rect x="-37" y="-6" width="30" height="12" rx="4" fill="#555" stroke="#222" stroke-width="2"/></g><circle r="6" fill="#fff" stroke="#222" stroke-width="2.5"/><circle r="2" fill="#222"/></g>
</defs>
<g stroke-linejoin="round" stroke-linecap="round">
<line x1="345" y1="40" x2="345" y2="400" stroke="#cccccc" stroke-width="2"/>
<rect x="20" y="360" width="300" height="20" fill="url(#hatch)" stroke="#222" stroke-width="3"/>
<line x1="175" y1="80" x2="175" y2="360" stroke="#222" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="100" y="110" width="150" height="16" fill="#e8e8e8" stroke="#222" stroke-width="3"/>
<rect x="150" y="126" width="50" height="22" fill="#cfe3f5" stroke="#222" stroke-width="3"/>
<polygon points="155,148 195,148 130,298 104,292" fill="#cfe3f5" stroke="#222" stroke-width="3"/>
<circle cx="115" cy="300" r="60" fill="#555" stroke="#222" stroke-width="3"/><circle cx="115" cy="300" r="44" fill="#e8e8e8" stroke="#222" stroke-width="3"/>
<g><line x1="115" y1="258" x2="115" y2="342" stroke="#222" stroke-width="3"/><line x1="73" y1="300" x2="157" y2="300" stroke="#222" stroke-width="3"/></g>
<polygon points="155,148 195,148 130,298 104,292" fill="#cfe3f5" stroke="#222" stroke-width="3" opacity="0.85"/>
<circle cx="115" cy="300" r="7" fill="#fff" stroke="#222" stroke-width="3"/><circle cx="115" cy="300" r="2" fill="#222"/>
<line x1="117" y1="395" x2="173" y2="395" stroke="#222" stroke-width="2.5" marker-start="url(#ak)" marker-end="url(#ak)"/>
<line x1="115" y1="362" x2="115" y2="402" stroke="#222" stroke-width="1.5"/>
<line x1="235" y1="170" x2="315" y2="170" stroke="#d1495b" stroke-width="5" marker-end="url(#ah)"/>
<path d="M480,120 h150 v150 h-150 z" fill="none" stroke="#bbb" stroke-width="2" stroke-dasharray="6 6"/>
<g transform="translate(150,25)">
<g transform="translate(420,80)"><rect x="0" y="0" width="120" height="80" rx="6" fill="#fde2c4" stroke="#222" stroke-width="3" opacity="0.9"/>
<use href="#cas" x="15" y="15"/><use href="#cas" x="105" y="15"/><use href="#cas" x="15" y="65"/><use href="#cas" x="105" y="65"/>
<g transform="translate(60,40)"><g transform="rotate(90)"><line x1="-24" y1="0" x2="20" y2="0" stroke="#d1495b" stroke-width="5" marker-end="url(#ah)"/></g></g>
</g></g>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#222">
<g font-weight="bold" text-anchor="middle"><text x="175" y="40">Side view</text><text x="575" y="40">Top view: trolley pushed round</text></g>
<text x="186" y="100">swivel pivot</text>
<text x="275" y="160" text-anchor="middle" font-size="18">travel</text>
<text x="206" y="250">fork</text>
<text x="40" y="215" font-size="18">wheel</text>
<text x="186" y="401" font-size="18">trail</text>
<text x="575" y="365" text-anchor="middle" font-size="18">Push it a new way and each wheel is dragged</text>
<text x="575" y="388" text-anchor="middle" font-size="18">round to trail behind its pivot</text>
<text x="400" y="436" text-anchor="middle" font-size="18">Braked castors lock the wheel, the swivel, or both</text>
</g>
</svg>
