<text x="205" y="255">pivot</text>
<text x="460" y="255">pivot</text>
<text x="297.5" y="201">long reach</text>
<text x="465" y="201">short reach</text>
<text x="400" y="390">Each gear turns on a pivot near one end of its oval.</text>
<text x="400" y="416">Half a turn later the reaches swap, so the output slows to a crawl.</text>
</g></svg>
