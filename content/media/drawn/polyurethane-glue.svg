<text x="200" y="40" font-size="21" font-weight="bold">Tight and clamped: strong</text>
<text x="600" y="40" font-size="21" font-weight="bold">Gappy: weak foam</text>
<text x="250" y="86">clamp</text>
<text x="200" y="346" dy="26">thin glue film soaks into the wood</text>
<text x="610" y="80">moisture from air and wood</text>
<text x="600" y="346" dy="26">gas bubbles swell the glue into foam</text>
<text x="400" y="425">Glue cures with water and foams: clamp the joint tight</text>
