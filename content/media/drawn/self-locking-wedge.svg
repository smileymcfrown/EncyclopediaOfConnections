<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Side view of two wedges driven into a gap between a fixed block and a sliding part held back by a spring. A gentle wedge tapped in pushes the part sideways a little but hard, and friction on its faces keeps it in; a steep wedge pushed in springs back out when let go.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#e8e8e8"/><line x1="0" y1="0" x2="0" y2="10" stroke="#222" stroke-width="2"/></pattern>
</defs>
<g stroke="#222" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" transform="translate(0,20)">
<rect x="60" y="140" width="50" height="190" fill="url(#hatch)"/>
<rect x="30" y="330" width="80" height="18" fill="url(#hatch)"/>
<rect x="120" y="330" width="240" height="18" fill="url(#hatch)"/>
<rect x="330" y="170" width="20" height="160" fill="url(#hatch)"/>
<g><polygon points="144.7,150 230,150 230,330 113,330" fill="#cfe3f5"/></g>
<polyline points="230,250 242.5,264 255,236 267.5,264 280,236 292.5,264 305,236 317.5,264 330,250" fill="none" stroke-width="2.5"></polyline>
<g><polygon points="110,120 150,120 120,290 110,290" fill="#fde2c4"/><g stroke="#d1495b" stroke-width="3.5" marker-end="url(#ah)"><line x1="116" y1="160" x2="116" y2="200"/><line x1="141" y1="150" x2="134" y2="190"/></g></g>
<g><line x1="104" y1="58" x2="30" y2="30" stroke-width="10" stroke="#222"/><line x1="104" y1="58" x2="30" y2="30" stroke-width="5" stroke="#fde2c4"/><rect x="96" y="44" width="74" height="30" rx="4" fill="#e8e8e8"/></g>
<line x1="120" y1="390" x2="120" y2="360" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)" opacity="0"></line>
<line x1="244" y1="222" x2="296" y2="222" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<rect x="460" y="215" width="50" height="115" fill="url(#hatch)"/>
<rect x="430" y="330" width="80" height="18" fill="url(#hatch)"/>
<rect x="520" y="330" width="240" height="18" fill="url(#hatch)"/>
<rect x="730" y="170" width="20" height="160" fill="url(#hatch)"/>
<g><polygon points="572.5,225 630,225 630,330 511.9,330" fill="#cfe3f5"/></g>
<polyline points="630,287.5 642.5,301.5 655,273.5 667.5,301.5 680,273.5 692.5,301.5 705,273.5 717.5,301.5 730,287.5" fill="none" stroke-width="2.5"></polyline>
<g><polygon points="510,219 576,219 511.9,330 510,330" fill="#fde2c4"/></g>
<g><rect x="526" y="205" width="36" height="12" rx="3" fill="#e8e8e8"/><rect x="537" y="150" width="14" height="55" fill="#e8e8e8"/></g>
<line x1="590" y1="140" x2="590" y2="196" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"></line>
<line x1="490" y1="200" x2="490" y2="140" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)" opacity="0.25"></line>
</g>
<g font-family="Arial, Helvetica, sans-serif" fill="#222" font-size="18">
<text x="20" y="32" font-size="20" font-weight="bold">Gentle slope: stays in</text>
<text x="420" y="32" font-size="20" font-weight="bold">Steep slope: pops out</text>
<text x="182" y="80">tap</text>
<text x="178" y="160">friction holds it</text>
<text x="236" y="410">big squeeze</text>
<text x="605" y="180">push</text>
<text x="440" y="410">nothing holds it</text>
<text x="400" y="436" text-anchor="middle">Light tap in, big squeeze out · gentle wedges stay put, steep ones spring back</text>
</g>
</svg>
