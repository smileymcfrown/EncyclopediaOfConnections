<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Gear teeth drawn unrolled flat: on the left a solid gear leaves a gap beside the mating tooth, so the drive has play when it reverses; on the right the gear is split into a fixed half and a free half that a spring turns slightly, so their teeth pinch the mating tooth from both sides and the gap is gone.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker></defs>
<line x1="400" y1="20" x2="400" y2="400" stroke="#cccccc" stroke-width="2"/>
<g stroke="#222" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
<polygon points="30,345 30,300 48,300 66,250 94,250 112,300 168,300 186,250 214,250 232,300 288,300 306,250 334,250 352,300 370,300 370,345" fill="#cfe3f5"/>
<polygon points="84.8,170 84.8,245 121.8,245 138.7,292 170.9,292 187.8,245 224.8,245 224.8,170" fill="#fde2c4"/>
<polygon points="430,385 430,300 418,300 436,250 464,250 482,300 538,300 556,250 584,250 602,300 658,300 676,250 704,250 722,300 770,300 770,385" fill="#d8f0d2"/>
<polygon points="430,345 430,300 448,300 466,250 494,250 512,300 568,300 586,250 614,250 632,300 688,300 706,250 734,250 752,300 770,300 770,345" fill="#cfe3f5"/>
<polygon points="455.2,170 455.2,245 492.2,245 509.1,292 541.3,292 558.2,245 595.2,245 595.2,170" fill="#fde2c4"/>
<rect x="448" y="338" width="22" height="34" fill="#cfe3f5"/>
<circle cx="459" cy="362" r="5" fill="#222"/><circle cx="650" cy="362" r="5" fill="#222"/>
<path d="M459,362 L490,362 L500,350 L514,374 L528,350 L542,374 L556,350 L570,374 L584,350 L598,374 L612,350 L620,362 L650,362" fill="none"/>
</g>
<g stroke="#d1495b" stroke-width="4" fill="none" marker-end="url(#ah)">
<line x1="530" y1="405" x2="450" y2="405"/>
</g>
<line x1="104" y1="270" x2="128" y2="270" stroke="#d1495b" stroke-width="4" marker-start="url(#ah)" marker-end="url(#ah)"/>
<g font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222" text-anchor="middle">
<text x="200" y="40" font-size="21" font-weight="bold">Solid gear: a gap</text>
<text x="600" y="40" font-size="21" font-weight="bold">Split gear: gap filled</text>
<text x="200" y="120">mating gear tooth</text>
<text x="600" y="120">mating gear tooth</text>
<text x="200" y="378">gap = play when it reverses</text>
<text x="542" y="411" text-anchor="start">spring turns the free half</text>
<text x="700" y="330">fixed half</text>
<text x="712" y="372" font-size="18">free half</text>
<text x="400" y="438" font-size="18">Teeth shown unrolled flat · the two halves pinch each mating tooth like scissors</text>
</g></svg>
