<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Front views of a gear whose hub is split into three curved spring arms pressing on a round shaft: normally the arms' grip turns the shaft with the gear; when the shaft is stuck the gear keeps turning and the arms slide round it. On the right, a servo saver whose arm is held in line by springs gives way when knocked and springs back.</title>
