<g><rect x="137" y="202" width="19" height="16" fill="#fde2c4" stroke="#222" stroke-width="2.5"/><rect x="160" y="201" width="34" height="18" fill="#fde2c4" stroke="#222" stroke-width="2.5"/><rect x="180" y="198" width="14" height="24" fill="#fde2c4" stroke="#222" stroke-width="2.5"/><rect x="154" y="183" width="7" height="54" fill="#fde2c4" stroke="#222" stroke-width="2.5"/>
