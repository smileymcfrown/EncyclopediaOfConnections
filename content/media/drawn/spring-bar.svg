</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222">
<text x="340" y="88" text-anchor="middle">watch case</text>
<text x="80" y="200" text-anchor="end">lug</text>
<text x="340" y="176" text-anchor="middle">tube</text>
<text x="340" y="262" text-anchor="middle">spring inside pushes both tips out</text>
<text x="565" y="302" text-anchor="middle">hole in lug</text>
<text x="246" y="344">fork tool pushes</text>
<text x="246" y="366">the flange in</text>
<text x="700" y="30" text-anchor="middle" font-weight="bold">side view</text>
<text x="700" y="425" text-anchor="middle">strap swings</text>
<text x="700" y="445" text-anchor="middle">round the bar</text>
<text x="300" y="432" text-anchor="middle">Let go: the spring snaps the tip back into the hole</text>
</g>
</svg>
