<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Front cut-away view of a watch spring bar between two lugs, with a side view of the strap: a coil spring inside the tube pushes a tip out of each end into small holes in the lugs; a forked tool pushes one flange inward so that tip comes out of its hole, and when let go the spring pushes it back in; the strap loop hangs on the bar and swings round it.</title>
<rect width="800" height="450" fill="#ffffff"/>
