<text x="139" y="40" font-size="18" font-weight="bold">top view</text>
<text x="139" y="64" font-size="17">loops (dashed) link underneath</text>
<text x="560" y="40" text-anchor="middle">rigid tiles, each loop linked</text><text x="560" y="64">through the next, with an air gap</text>
<text x="400" y="310">ball</text>
<g font-size="20" font-weight="bold"><text x="400" y="122" opacity="1">As printed: flat, but every link is free</text><text x="560" y="122" opacity="0">Laid over a ball, it drapes like cloth</text></g>
<text x="400" y="440" font-size="18">One print, no assembly · the pieces tilt and turn a little within their gaps</text>
