</g>
<rect x="14" y="250" width="230" height="140" rx="10" fill="#ffffff" stroke="#999" stroke-width="2"/>
<g stroke="#222" stroke-width="3" stroke-linejoin="round"><path d="M86,355 60,370 34,355 34,325 60,310 86,325Z" fill="#cfe3f5"/><path d="M155,355 129,370 103,355 103,325 129,310 155,325Z" fill="#fde2c4"/><path d="M224,355 198,370 172,355 172,325 198,310 224,325Z" fill="#cfe3f5"/><ellipse cx="88.5" cy="340" rx="12" ry="8" fill="none" stroke-width="3.5" stroke-dasharray="5 3"/><ellipse cx="100.5" cy="340" rx="12" ry="8" fill="none" stroke-width="3.5" stroke-dasharray="5 3"/><ellipse cx="157.5" cy="340" rx="12" ry="8" fill="none" stroke-width="3.5" stroke-dasharray="5 3"/><ellipse cx="169.5" cy="340" rx="12" ry="8" fill="none" stroke-width="3.5" stroke-dasharray="5 3"/></g>
<g font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222" text-anchor="middle">
<text x="129" y="276" font-size="18" font-weight="bold">top view</text>
<text x="129" y="298" font-size="17">loops (dashed) link underneath</text>
<text x="670" y="300">rigid tiles, each</text><text x="670" y="324">loop linked through</text><text x="670" y="348">the next with an</text><text x="670" y="372">air gap all round</text>
<text x="400" y="300">ball</text>
<g font-size="20" font-weight="bold"><text x="400" y="50" opacity="1">As printed: flat, but every link is free</text><text x="400" y="50" opacity="0">Laid over a ball, it drapes like cloth</text></g>
<text x="400" y="440" font-size="18">One print, no assembly · the pieces tilt and turn a little within their gaps</text>
</g>
