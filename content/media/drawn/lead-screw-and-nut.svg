<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222">
<text x="420" y="60" text-anchor="middle">nut in a carriage: the rail stops it turning, so it slides</text>
<text x="560" y="168" text-anchor="middle">lead screw</text>
<text x="560" y="114" text-anchor="middle">guide rail</text>
<text x="20" y="276">handwheel</text>
<text x="436" y="276">1 turn = 1 lead of travel</text>
<text x="210" y="322" text-anchor="middle" font-size="17">plain nut: small gap (backlash)</text>
<text x="590" y="322" text-anchor="middle" font-size="17">two-part nut + spring: no gap</text>
