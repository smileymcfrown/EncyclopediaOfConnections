<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Lead screw and nut: turning the handwheel turns a threaded rod, and a nut fixed in a carriage that slides on a guide rail moves along by one lead for every turn; two close-ups show the small gap between nut and screw threads (backlash) and a spring-loaded two-part nut that presses on both thread faces to remove it.</title>
