<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Left: crossed scissor tongs hanging from a crane ring by two short links and gripping a block; the crane pull draws the tops of the arms together, so the jaws below the pivot squeeze the block harder the heavier it is. Right: a cut-away stone with a three-piece lewis wedged in a dovetail-shaped hole, which grips the stone from inside the same way.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
</defs>
<g stroke-linejoin="round" stroke-linecap="round">
<line x1="520" y1="30" x2="520" y2="400" stroke="#cccccc" stroke-width="2"/>
<!-- block -->
<rect x="200" y="270" width="120" height="120" fill="#fde2c4" stroke="#222" stroke-width="3"/>
<!-- links -->
<line x1="260" y1="86" x2="196" y2="134" stroke="#222" stroke-width="9"/>
<line x1="260" y1="86" x2="196" y2="134" stroke="#e8e8e8" stroke-width="4"/>
<line x1="260" y1="86" x2="324" y2="134" stroke="#222" stroke-width="9"/>
<line x1="260" y1="86" x2="324" y2="134" stroke="#e8e8e8" stroke-width="4"/>
<!-- arm A: top left, crosses, jaw on right face -->
<path d="M196,134 L260,196 L344,250 L344,322 L322,334" fill="none" stroke="#222" stroke-width="15"/>
<path d="M196,134 L260,196 L344,250 L344,322 L322,334" fill="none" stroke="#cfe3f5" stroke-width="9"/>
<!-- arm B: top right, crosses, jaw on left face -->
<path d="M324,134 L260,196 L176,250 L176,322 L198,334" fill="none" stroke="#222" stroke-width="15"/>
<path d="M324,134 L260,196 L176,250 L176,322 L198,334" fill="none" stroke="#cfe3f5" stroke-width="9"/>
<!-- pivot pin and link pins -->
<circle cx="260" cy="196" r="9" fill="#ffffff" stroke="#222" stroke-width="3"/><circle cx="260" cy="196" r="2.5" fill="#222"/>
<circle cx="196" cy="134" r="6" fill="#ffffff" stroke="#222" stroke-width="3"/>
<circle cx="324" cy="134" r="6" fill="#ffffff" stroke="#222" stroke-width="3"/>
<!-- ring -->
<circle cx="260" cy="72" r="15" fill="none" stroke="#222" stroke-width="5"/>
<!-- arrows -->
<line x1="260" y1="54" x2="260" y2="22" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<line x1="160" y1="134" x2="184" y2="134" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<line x1="360" y1="134" x2="336" y2="134" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<line x1="140" y1="330" x2="166" y2="330" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<line x1="380" y1="330" x2="354" y2="330" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<line x1="260" y1="300" x2="260" y2="372" stroke="#d1495b" stroke-width="5" marker-end="url(#ah)"/>
<!-- lewis in stone -->
<path d="M560,190 H640 L626,300 H714 L700,190 H770 V390 H560 Z" fill="#e8e8e8" stroke="#222" stroke-width="3"/>
<path d="M640,190 L626,300 H652 L652,190 Z" fill="#cfe3f5" stroke="#222" stroke-width="3"/>
<path d="M700,190 L714,300 H688 L688,190 Z" fill="#cfe3f5" stroke="#222" stroke-width="3"/>
<rect x="652" y="160" width="36" height="140" fill="#d8f0d2" stroke="#222" stroke-width="3"/>
<rect x="630" y="150" width="80" height="14" rx="5" fill="#e8e8e8" stroke="#222" stroke-width="3"/>
<circle cx="670" cy="132" r="15" fill="none" stroke="#222" stroke-width="5"/>
<line x1="670" y1="114" x2="670" y2="84" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222">
<text x="272" y="30">crane pulls up</text>
<text x="348" y="106">links pull the tops in</text>
<text x="238" y="202" text-anchor="end">pivot</text>
<text x="392" y="336">jaws squeeze</text>
<text x="252" y="298" text-anchor="end" font-size="17">weight</text>
<text x="686" y="104">lewis</text>
<text x="665" y="420" text-anchor="middle">dovetail hole in the stone</text>
<text x="260" y="425" text-anchor="middle">Heavier load = harder grip</text>
</g>
</svg>
