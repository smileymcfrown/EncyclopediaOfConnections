<text x="195" y="68" text-anchor="end">rope</text>
<text x="195" y="146" text-anchor="end">frame: the rope</text><text x="195" y="167" text-anchor="end">is pinched here</text>
<text x="565" y="246">toothed cam on a</text><text x="565" y="267">pivot (off-centre)</text>
<text x="565" y="116">light spring keeps</text><text x="565" y="137">the teeth on the rope</text>
<text x="20" y="330">slide it up: the teeth</text><text x="20" y="352">drag the cam open</text>
