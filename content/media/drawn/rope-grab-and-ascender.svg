<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>A rope grab cut open from the side: the rope runs between the frame and a toothed, off-centre cam on a pivot, with a light spring keeping the teeth on the rope; sliding up swings the cam open, a downward load swings it shut and pinches the rope against the frame.</title>
