<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>A belt tensioner: a belt runs round a driving pulley and a driven pulley, and a small idler wheel on a pivoting arm is pushed by a coil spring into the slack lower span; as the belt stretches, the spring swings the arm further in so the belt stays tight.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#e8e8e8"/><line x1="0" y1="0" x2="0" y2="10" stroke="#222" stroke-width="2"/></pattern>
</defs>
<g stroke="#222" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
<rect x="380" y="410" width="150" height="18" fill="url(#hatch)"/>
<path d="M470,410 L474,330 L486,330 L490,410 Z" fill="#e8e8e8"/>
<polyline points="428,410 428.3,400 438.5,394.3 418.8,387.7 439,382.3 419.2,375.7 439.4,370.3 419.6,363.6 439.8,358.3 420,351.6 440.2,346.3 420.4,339.6 440.6,334.3 420.8,327.6 441,322.3 421.3,315.6 441.5,310.3 431.7,304 432,294" fill="none" stroke-width="2.5"></polyline>
<g><line x1="480" y1="330" x2="400" y2="270" stroke-width="14" stroke="#222"/><line x1="480" y1="330" x2="400" y2="270" stroke-width="8" stroke="#cfe3f5"/><g><circle cx="400" cy="270" r="25" fill="#fde2c4"/><line x1="383" y1="270" x2="417" y2="270" stroke-width="2.5"/><line x1="400" y1="253" x2="400" y2="287" stroke-width="2.5"/><circle cx="400" cy="270" r="5" fill="#fff"/></g></g>
<circle cx="480" cy="330" r="7" fill="#fff"/><circle cx="480" cy="330" r="2.5" fill="#222"/>
<g><circle cx="200" cy="190" r="75" fill="#e8e8e8"/><line x1="133" y1="190" x2="267" y2="190" stroke-width="2.5"/><line x1="200" y1="123" x2="200" y2="257" stroke-width="2.5"/><circle cx="200" cy="190" r="5" fill="#fff"/></g>
<g><circle cx="600" cy="190" r="60" fill="#e8e8e8"/><line x1="548" y1="190" x2="652" y2="190" stroke-width="2.5"/><line x1="600" y1="138" x2="600" y2="242" stroke-width="2.5"/><circle cx="600" cy="190" r="5" fill="#fff"/></g>
<defs><path id="belt" d="M202.8,115.1 L602.2,130 A60,60 0 0 1 660,191.9 A60,60 0 0 1 598.5,250 L400.7,245 A25,25 0 0 0 399.1,245 A25,25 0 0 0 397.5,245.1 L207.7,264.6 A75,75 0 0 1 125,192.4 A75,75 0 0 1 202.8,115.1"></path></defs>
<use href="#belt" fill="none" stroke="#555" stroke-width="9"/>
<use href="#belt" fill="none" stroke="#fde2c4" stroke-width="4" stroke-linecap="butt" stroke-dasharray="8 12"></use>
<path d="M276,125 A100,100 0 0 0 123,125" fill="none" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<line x1="455" y1="96" x2="345" y2="96" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<line x1="232" y1="294" x2="322" y2="283" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<line x1="358" y1="322" x2="376" y2="294" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<circle cx="417.1" cy="252.3" r="25" fill="none" stroke="#999" stroke-width="2" stroke-dasharray="6 5"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222">
<text x="400" y="80" text-anchor="middle">tight side</text>
<text x="200" y="66" text-anchor="middle">driving pulley</text>
<text x="660" y="110" text-anchor="middle">driven pulley</text>
<text x="270" y="325" text-anchor="middle">slack side</text>
<text x="520" y="300">idler wheel on a</text><text x="520" y="322">pivoting arm</text>
<text x="410" y="372" text-anchor="end">spring pushes it in</text>
<text x="400" y="440" text-anchor="middle" font-size="17">As the belt stretches, the spring swings the idler further in and keeps it tight</text>
</g>
</svg>
