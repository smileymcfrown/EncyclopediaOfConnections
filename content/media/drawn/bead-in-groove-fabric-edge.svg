<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Two cross-sections: on the left a round bead on the edge of a fabric sits inside a C-shaped rail whose slot is narrower than the bead, so pulling the fabric cannot drag it out; on the right a rubber cord (spline) is rolled into a frame channel on top of the screen mesh, wedging the mesh in.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
</defs>
<line x1="400" y1="20" x2="400" y2="400" stroke="#cccccc" stroke-width="2"/>
<g stroke="#222" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
<!-- keder rail -->
<rect x="90" y="170" width="200" height="170" rx="10" fill="#e8e8e8"/>
<circle cx="190" cy="262" r="48" fill="#ffffff"/>
<rect x="177" y="168" width="26" height="60" fill="#ffffff" stroke="none"/>
<line x1="177" y1="170" x2="177" y2="217"/>
<line x1="203" y1="170" x2="203" y2="217"/>
<path d="M190,232 L190,150 C190,115 230,95 300,88" fill="none" stroke="#222" stroke-width="11"/>
<path d="M190,232 L190,150 C190,115 230,95 300,88" fill="none" stroke="#cfe3f5" stroke-width="5"/>
<circle cx="190" cy="268" r="36" fill="#fde2c4"/>
<!-- screen frame -->
<path d="M470,215 L562,215 L562,300 L618,300 L618,215 L720,215 L720,335 L470,335 Z" fill="#e8e8e8"/>
<path d="M440,208 L566,208 L566,296 L614,296 L614,208 L750,208" fill="none" stroke="#222" stroke-width="2" stroke-dasharray="6 5"/>
<circle cx="590" cy="270" r="24" fill="#f5d0d0"/>
<circle cx="590" cy="140" r="38" fill="#fde2c4"/>
<circle cx="590" cy="140" r="6" fill="#222"/>
<line x1="590" y1="140" x2="680" y2="80" stroke-width="8"/>
</g>
<g stroke="#d1495b" stroke-width="4" fill="none" stroke-linecap="round" marker-end="url(#ah)">
<line x1="306" y1="87" x2="372" y2="78"/>
<line x1="545" y1="150" x2="545" y2="225"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222">
<text x="200" y="40" text-anchor="middle" font-size="21" font-weight="bold">Keder in a rail</text>
<text x="600" y="40" text-anchor="middle" font-size="21" font-weight="bold">Screen spline</text>
<text x="112" y="140">fabric</text>
<text x="300" y="200">slot narrower</text>
<text x="300" y="223">than the bead</text>
<text x="190" y="374" text-anchor="middle">bead on the fabric edge</text>
<text x="440" y="190">mesh</text>
<text x="595" y="370" text-anchor="middle">spline cord wedges the mesh in</text>
<text x="640" y="150">roller</text>
<text x="400" y="432" text-anchor="middle" font-size="18">The thick edge cannot pull out through the narrow mouth of the groove</text>
</g>
</svg>
