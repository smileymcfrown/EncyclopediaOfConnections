<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>A Hirth joint: two parts with rings of V-shaped teeth on their faces, clamped together by a centre screw, shown from the side and from above; to change the angle you loosen the screw, lift the upper part clear of the teeth, turn it by one tooth (15 degrees with 24 teeth) and tighten again.</title>
