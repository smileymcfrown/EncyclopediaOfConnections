<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222">
<text x="190" y="60" text-anchor="middle" font-weight="bold" font-size="20">Side view</text>
<text x="530" y="80" text-anchor="middle" font-weight="bold" font-size="20">Top view</text>
<text x="240" y="112">centre screw</text>
<text x="72" y="214" text-anchor="end">turns</text><text x="72" y="300" text-anchor="end">fixed</text>
<text x="310" y="250">V-teeth wedge</text><text x="310" y="272">together, no play</text>
<text x="645" y="372" text-anchor="middle">one tooth = 360° ÷ 24 = 15°</text>
<text x="400" y="420" text-anchor="middle">Loosen and lift · turn by whole teeth · tighten: it locks at a fixed set of angles</text>
</g>
