<g font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222">
<text x="20" y="40">DIN rail (35 mm top hat)</text><line x1="110" y1="46" x2="160" y2="140" stroke="#222" stroke-width="2"/>
<text x="250" y="62" text-anchor="middle">fixed hook</text><line x1="222" y1="68" x2="186" y2="130" stroke="#222" stroke-width="2"/>
<text x="20" y="380">spring latch</text><line x1="80" y1="386" x2="176" y2="352" stroke="#222" stroke-width="2"/>
