<title>Shelf pins: on the left, the inside face of a cupboard side with two rows of small holes 32 mm apart, the front row 37 mm from the front edge, and a shelf resting on two pins whose weight pushes straight down; on the right, side cut-aways of four kinds of support: a plain pin, a flat spoon pin, a pin with a rubber ring under a glass shelf, and a support with a flap that locks over the top of the shelf.</title>
