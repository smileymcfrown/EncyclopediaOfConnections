<g font-size="20" font-weight="bold">
<text x="200" y="44">Free way: rollers sit loose</text>
<text x="600" y="44">Lock way: rollers wedge in</text>
</g>
<g font-size="18">
<text x="400" y="138">spring</text>
<text x="400" y="210">roller</text>
<text x="400" y="284">ramp</text>
<text x="200" y="398">shaft spins, ring stays still</text>
<text x="600" y="398">shaft and ring turn together</text>
<text x="400" y="436">Rollers roll to the deep end one way · jam in the shallow end the other way</text>
</g>
</g>
