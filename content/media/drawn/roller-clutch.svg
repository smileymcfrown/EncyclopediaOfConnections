<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Cross-section of a roller clutch: an outer ring with four ramped pockets round a shaft, each holding a roller pushed by a small spring. Turned the free way the rollers sit in the deep ends and the shaft spins inside a still ring; turned the other way the rollers wedge into the shallow ends and the shaft and ring turn as one.</title>
