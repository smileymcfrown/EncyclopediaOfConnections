<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle"><text x="613" y="337">free</text><text x="717" y="337">wedged</text></g>
<path d="M392,60 L342,88 M440,108 L362,137 M430,300 L318,262" stroke="#222" stroke-width="1.5"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222">
<text x="396" y="58">outer ring</text>
<text x="444" y="112">sprags</text>
<text x="434" y="306">inner ring</text>
<text x="665" y="84" text-anchor="middle">one sprag, enlarged:</text>
<text x="665" y="108" text-anchor="middle">longer corner to corner</text>
<text x="665" y="130" text-anchor="middle" fill="#d1495b">than the gap</text>
<text x="400" y="400" text-anchor="middle" font-weight="bold" font-size="20">Free: the sprags lean over and slide</text>
<text x="400" y="434" text-anchor="middle">Turned the other way they stand up and wedge · no teeth, so it locks at any angle</text>
</g>
</svg>
