<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>A smooth rod seen from above running through a nut that holds a bearing pressed on the rod at a slight tilt; as the rod spins, the bearing rolls along a spiral path (dashed) and carries the nut one pitch along per turn. Small views show three bearings around the rod end-on, and that tilting the bearing the other way sends the nut back.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#e8e8e8"/><line x1="0" y1="0" x2="0" y2="10" stroke="#222" stroke-width="2"/></pattern>
</defs>
<g stroke-linejoin="round" stroke-linecap="round">
<line x1="565" y1="20" x2="565" y2="415" stroke="#cccccc" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="230" y="105" width="120" height="190" rx="8" fill="#fde2c4" stroke="#222" stroke-width="3"/>
<rect x="40" y="170" width="500" height="60" fill="#e8e8e8" stroke="#222" stroke-width="3"/>
<path d="M40,170 C45,170 48,190 50,200 S55,230 60,230 M80,170 C85,170 88,190 90,200 S95,230 100,230 M120,170 C125,170 128,190 130,200 S135,230 140,230 M160,170 C165,170 168,190 170,200 S175,230 180,230 M200,170 C205,170 208,190 210,200 S215,230 220,230 M240,170 C245,170 248,190 250,200 S255,230 260,230 M280,170 C285,170 288,190 290,200 S295,230 300,230 M320,170 C325,170 328,190 330,200 S335,230 340,230 M360,170 C365,170 368,190 370,200 S375,230 380,230 M400,170 C405,170 408,190 410,200 S415,230 420,230 M440,170 C445,170 448,190 450,200 S455,230 460,230 M480,170 C485,170 488,190 490,200 S495,230 500,230 M520,170 C525,170 528,190 530,200 S535,230 540,230 " fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4"/>
<g transform="rotate(-12 290 200)"><rect x="273" y="130" width="34" height="140" rx="6" fill="#cfe3f5" stroke="#222" stroke-width="3"/><line x1="273" y1="200" x2="307" y2="200" stroke="#222" stroke-width="2"/><circle cx="290" cy="200" r="3.5" fill="#222"/></g>
<path d="M64,252 C100,240 100,160 64,148" fill="none" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<text x="40" y="135" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="start" stroke="none">rod spins</text>
<path d="M240,86 L382,86" fill="none" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<text x="300" y="66" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle" stroke="none">nut moves 1 pitch per turn</text>
<text x="360" y="128" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="start" stroke="none">nut (cut away)</text>
<text x="372" y="160" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="start" stroke="none">contact path</text>
<path d="M450,240 L450,262 M490,240 L490,262 M450,251 L490,251" stroke="#222" stroke-width="2" fill="none"/>
<text x="470" y="284" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle" stroke="none">1 pitch</text>
<line x1="292" y1="316" x2="301" y2="275" stroke="#222" stroke-width="2"/>
<text x="60" y="336" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="start" stroke="none">bearing, tilted a few degrees</text>
<circle cx="685" cy="112" r="64" fill="#fde2c4" stroke="#222" stroke-width="3"/>
<circle cx="685" cy="72" r="20" fill="#cfe3f5" stroke="#222" stroke-width="3"/><circle cx="685" cy="72" r="3" fill="#222"/>
<circle cx="719.6" cy="132" r="20" fill="#cfe3f5" stroke="#222" stroke-width="3"/><circle cx="719.6" cy="132" r="3" fill="#222"/>
<circle cx="650.4" cy="132" r="20" fill="#cfe3f5" stroke="#222" stroke-width="3"/><circle cx="650.4" cy="132" r="3" fill="#222"/>
<circle cx="685" cy="112" r="20" fill="#e8e8e8" stroke="#222" stroke-width="3"/><circle cx="685" cy="112" r="3" fill="#222"/>
<text x="685" y="204" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle" stroke="none">end view: 3 bearings</text>
<rect x="590" y="262" width="190" height="40" fill="#e8e8e8" stroke="#222" stroke-width="3"/>
<path d="M605.4,262 C602,262 600,275.3 598.7,282 S595.3,302 592,302 M632.1,262 C628.7,262 626.7,275.3 625.4,282 S622,302 618.7,302 M658.8,262 C655.4,262 653.4,275.3 652.1,282 S648.8,302 645.4,302 M685.5,262 C682.1,262 680.1,275.3 678.8,282 S675.5,302 672.1,302 M712.2,262 C708.9,262 706.9,275.3 705.5,282 S702.2,302 698.8,302 M738.9,262 C735.6,262 733.6,275.3 732.2,282 S728.9,302 725.6,302 M765.6,262 C762.3,262 760.3,275.3 758.9,282 S755.6,302 752.3,302 " fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4"/>
<g transform="rotate(12 685 282)"><rect x="673" y="236" width="24" height="92" rx="6" fill="#cfe3f5" stroke="#222" stroke-width="3"/><line x1="673" y1="282" x2="697" y2="282" stroke="#222" stroke-width="2"/><circle cx="685" cy="282" r="3.5" fill="#222"/></g>
<path d="M606,318 C628,312 628,252 606,246" fill="none" stroke="#d1495b" stroke-width="3" marker-end="url(#ah)"/>
<path d="M745,344 L625,344" fill="none" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<text x="685" y="378" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle" stroke="none">tilt reversed:</text>
<text x="685" y="400" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle" stroke="none">nut goes the other way</text>
<text x="400" y="438" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle" stroke="none">No thread on the rod: friction at the tilted bearings drives the nut</text>
</g>
</svg>
