<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>A whippletree: one push on the middle pivot of a main bar is split, through two smaller bars on its ends, into four equal pushes on four sliding pads that press on a bumpy object held against a wall. When one pad touches the object first and stops, the bars tip so the other three keep moving until all four touch.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#e8e8e8"/><line x1="0" y1="0" x2="0" y2="10" stroke="#222" stroke-width="2"/></pattern>
</defs>
<g stroke="#222" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
<polygon points="760,82 690,82 674,96 674,126 688,142 714,148 714,346 760,346" fill="#d8f0d2"/>
<rect x="760" y="70" width="16" height="290" fill="url(#hatch)"/>
<g fill="url(#hatch)"><rect x="560" y="80" width="16" height="40"/><rect x="560" y="150" width="16" height="40"/><rect x="560" y="220" width="16" height="40"/><rect x="560" y="290" width="16" height="40"/><rect x="560" y="330" width="16" height="30"/></g>
<polyline points="440,110 340,110" fill="none" stroke-width="5" stroke="#555"></polyline>
<polyline points="440,180 340,180" fill="none" stroke-width="5" stroke="#555"></polyline>
<polyline points="440,250 340,250" fill="none" stroke-width="5" stroke="#555"></polyline>
<polyline points="440,320 340,320" fill="none" stroke-width="5" stroke="#555"></polyline>
<polyline points="340,145 200,145" fill="none" stroke-width="5" stroke="#555"></polyline>
<polyline points="340,285 200,285" fill="none" stroke-width="5" stroke="#555"></polyline>
<polyline points="200,215 40,215" fill="none" stroke-width="7" stroke="#555"></polyline>
<g><rect x="440" y="105" width="200" height="10" fill="#e8e8e8" stroke-width="2.5"/><rect x="640" y="88" width="12" height="44" rx="3" fill="#cfe3f5"/><circle cx="440" cy="110" r="3" fill="#222"/></g>
<g><rect x="440" y="175" width="200" height="10" fill="#e8e8e8" stroke-width="2.5"/><rect x="640" y="158" width="12" height="44" rx="3" fill="#cfe3f5"/><circle cx="440" cy="180" r="3" fill="#222"/></g>
<g><rect x="440" y="245" width="200" height="10" fill="#e8e8e8" stroke-width="2.5"/><rect x="640" y="228" width="12" height="44" rx="3" fill="#cfe3f5"/><circle cx="440" cy="250" r="3" fill="#222"/></g>
<g><rect x="440" y="315" width="200" height="10" fill="#e8e8e8" stroke-width="2.5"/><rect x="640" y="298" width="12" height="44" rx="3" fill="#cfe3f5"/><circle cx="440" cy="320" r="3" fill="#222"/></g>
<g><g><rect x="333" y="103" width="14" height="84" rx="7" fill="#fde2c4"/><circle cx="340" cy="110" r="3" fill="#222"/><circle cx="340" cy="180" r="3" fill="#222"/><circle cx="340" cy="145" r="6" fill="#ffffff"/><circle cx="340" cy="145" r="2" fill="#222"/></g></g>
<g><g><rect x="333" y="243" width="14" height="84" rx="7" fill="#fde2c4"/><circle cx="340" cy="250" r="3" fill="#222"/><circle cx="340" cy="320" r="3" fill="#222"/><circle cx="340" cy="285" r="6" fill="#ffffff"/><circle cx="340" cy="285" r="2" fill="#222"/></g></g>
<g><g><rect x="193" y="138" width="14" height="154" rx="7" fill="#fde2c4"/><circle cx="200" cy="145" r="3" fill="#222"/><circle cx="200" cy="285" r="3" fill="#222"/><circle cx="200" cy="215" r="6" fill="#ffffff"/><circle cx="200" cy="215" r="2" fill="#222"/></g></g>
<line x1="30" y1="250" x2="80" y2="250" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"></line>
<g stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"><line x1="610" y1="368" x2="680" y2="368"></line></g>
</g>
<g font-family="Arial, Helvetica, sans-serif" fill="#222" font-size="18">
<text x="20" y="40" font-size="20" font-weight="bold">One push shared by four pads</text>
<text x="30" y="282">push</text>
<text x="340" y="88" text-anchor="middle">bars tip</text>
<text x="170" y="320" text-anchor="middle">pivot</text>
<text x="700" y="62" text-anchor="middle">touches first, stops</text>
<text x="560" y="396" text-anchor="middle">the others keep pressing until all four touch</text>
<text x="400" y="438" text-anchor="middle">Each bar tips until the forces at its two ends are equal, so every pad presses the same</text>
</g>
</svg>
