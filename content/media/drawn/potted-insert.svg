<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Two cross-sections of a sandwich panel: two thin skins with a soft core of balsa or foam between them. Left: a bolt through the bare panel crushes the core and dents the skins when it is tightened. Right: the core has been dug out round the hole and filled with epoxy round a flanged threaded insert, so a bracket, whose foot is wider than the plug, screws into a solid plug glued to both skins.</title>
