<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>A volvelle (paper wheel): on the left, its parts from the side, a split pin, a top disc with a window and a base disc, and the same parts put together with the pin's legs opened out behind; on the right, the front, where the top disc covers a ring of words on the base disc and its window shows just one.</title>
