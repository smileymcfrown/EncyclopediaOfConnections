<text x="135" y="26" font-weight="bold" font-size="20">1 : 1  single pulley</text>
<text x="398" y="26" font-weight="bold" font-size="20">2 : 1  moving pulley</text>
<text x="672" y="26" font-weight="bold" font-size="20">4 : 1  double tackle</text>
<g text-anchor="end"><text x="108" y="170">100 kg</text><text x="353" y="160">50 kg</text><text x="353" y="180">on each</text><text x="592" y="160">25 kg</text><text x="592" y="180">on each</text></g>
<g text-anchor="start"><text x="186" y="182">pull 1 m</text><text x="467" y="262">pull 2 m</text><text x="752" y="410" text-anchor="end">pull 4 m</text></g>
<text x="65" y="372">lifts 1 m</text><text x="320" y="372">lifts 1 m</text><text x="560" y="372">lifts 1 m</text>
<text x="400" y="438">More rope parts hold the load: less pull, but more rope to pull</text>
