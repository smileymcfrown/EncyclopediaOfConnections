<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>A single fixed pulley, a 2:1 moving pulley and a 4:1 double tackle each lifting 100 kg by 1 m: the load is shared by 1, 2 or 4 rope parts, so you pull 1, 2 or 4 m of rope with 100, 50 or 25 kg of effort.</title>
