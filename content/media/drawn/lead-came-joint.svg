<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Leaded glass in three steps: first, two pieces of glass slide into the grooves on each side of an H-shaped strip of lead (came); then, seen from the front, three came strips meet between pieces of coloured glass and are soldered together only at that joint; finally, in cross-section, dark cement packed under the came leaves seals the glass in and stiffens the panel.</title>
