<g font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222" text-anchor="middle">
<text x="134" y="40" font-size="20" font-weight="bold">Glass slides in</text>
<text x="401" y="40" font-size="20" font-weight="bold">Solder joins the came</text>
<text x="667" y="40" font-size="20" font-weight="bold">Cement seals</text>
<text x="134" y="182">lead came (H shape)</text>
<text x="42" y="210">glass</text>
<text x="226" y="210">glass</text>
<text x="134" y="312" font-size="18">into the grooves</text>
<text x="401" y="72" font-size="18">seen from the front</text>
<text x="401" y="416" font-size="18">solder only where cames meet</text>
<text x="700" y="324" font-size="18">cement packed</text>
<text x="700" y="345" font-size="18">under the leaves</text>
<text x="667" y="158" font-size="17" fill="#555">pattern line</text>
<text x="400" y="440" font-size="17">The shape holds the glass, solder joins the came, cement makes the panel stiff and waterproof</text>
</g>
</svg>
