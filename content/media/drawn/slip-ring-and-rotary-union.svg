<g transform="translate(0 161)" stroke="#666" stroke-width="3"><line x1="103" x2="137" y1="0" y2="0"/><line x1="173" x2="207" y1="0" y2="0"/><line x1="243" x2="277" y1="0" y2="0"/></g>
<g transform="translate(0 239)" stroke="#666" stroke-width="3"><line x1="103" x2="137" y1="0" y2="0"/><line x1="173" x2="207" y1="0" y2="0"/><line x1="243" x2="277" y1="0" y2="0"/></g>

<rect x="80" y="80" width="220" height="15" fill="url(#hatch)"/>
