<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Cut-away side view of one turning shaft: on the left a slip ring, where three coloured rings on the shaft are rubbed by spring-pressed brushes on a fixed bar, each wired to a fixed wire of the same colour; on the right a rotary union, where fluid from a fixed hose fills a groove running all round the shaft between two O-ring seals and flows through a cross-drilled hole into the shaft.</title>
