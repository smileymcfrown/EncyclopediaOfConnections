<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>A spiral power spring in its round case: a flat steel strip coiled loosely, with its inner end hooked to the centre shaft and its outer end to the case; beside it the ratchet wheel and click on the same shaft, a curved arrow for the winding direction, and a graph of turning force rising as more turns are wound.</title>
