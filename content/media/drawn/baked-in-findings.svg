<g font-size="19" font-weight="bold"><text x="100" y="45">Eye pin</text><text x="300" y="45">Earring post</text><text x="500" y="45">Screw eye</text><text x="700" y="45">Hooked wire</text></g>
<text x="100" y="278">raw clay</text>
<text x="300" y="258">clay earring</text><text x="352" y="160">top layer</text><line x1="346" y1="166" x2="334" y2="200" stroke="#222" stroke-width="1.5"/>
<text x="500" y="282">baked clay</text>
<text x="700" y="282">baked clay</text>
<text x="100" y="326">straight: slides out</text><text x="100" y="348">bent end: holds fast</text>
<text x="300" y="326">flat pad sandwiched</text><text x="300" y="348">between two layers</text>
<text x="500" y="326">smaller pilot hole,</text><text x="500" y="348">drop of glue on top</text>
<text x="700" y="326">hole packed with clay</text><text x="700" y="348">paste, baked again</text>
<text x="400" y="434" font-size="18">Glue alone won't hold metal to clay: shape the fitting so the clay locks round it</text>
</g>
</svg>
