<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle">
<text x="133" y="36" font-size="20" font-weight="bold">Push-in: before</text>
<text x="400" y="36" font-size="20" font-weight="bold">Pin pushed flush</text>
<text x="667" y="36" font-size="20" font-weight="bold">Fir-tree clip</text>
<text x="175" y="88" text-anchor="start">pin</text>
<text x="133" y="330">split legs</text>
<text x="400" y="330">pin spreads the legs</text>
<text x="400" y="352">behind the sheet</text>
<text x="667" y="345">fins fold in, then</text>
<text x="667" y="367">spring out behind</text>
<text x="667" y="88" text-anchor="end">push in</text>
<text x="67" y="168">panel</text>
<text x="67" y="246">backing</text>
<text x="400" y="430">Pushed into a plain hole by hand; no screws, nuts or tools</text>
</g></svg>
