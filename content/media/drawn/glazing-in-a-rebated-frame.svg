<text x="206" y="38" font-size="21" font-weight="bold">Picture frame</text>
<text x="606" y="38" font-size="21" font-weight="bold">Old window</text>
<text x="200" y="72" font-size="17">front at the top</text><text x="606" y="72" font-size="17">outside at the top</text>
<text x="300" y="122">glass</text>
