<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Cut through one side of two frames, front at the top. Left, a picture frame: the glass, the card mount with the picture and the backing board drop into a stepped ledge (rebate) and rest against the frame's front lip, and a small metal glazier's point pushed into the wood holds them in; below, a back view of a turn button that swivels over the backing board and swings back to let it out. Right, an old window: the glass sits on a bed of putty in the rebate, a glazier's point holds it, and bevelled face putty over the point sheds rain.</title>
