<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Using a split-pin paper fastener. Left, three side views: push its two legs through a hole made in both card strips, spread the legs apart, then fold them flat against the back so the round head and the folded legs trap the strips. Right, a moving card: a card arm is held to the backing card by one fastener (a fixed pivot) and joined to a sliding card strip by another (a loose pivot); the strip runs under a card bridge, and pushing or pulling it swings the arm.</title>
