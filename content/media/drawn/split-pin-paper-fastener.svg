<g font-size="19" font-weight="bold"><text x="20" y="36">Fitting it</text><text x="570" y="36" text-anchor="middle">A card arm on two fasteners</text></g>
<g font-size="17"><text x="206" y="112">push it through a</text><text x="206" y="132">hole in both strips</text><text x="206" y="244">spread the legs</text><text x="206" y="330">fold them flat</text><text x="206" y="350">behind</text></g>
