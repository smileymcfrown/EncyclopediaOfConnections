<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>A jaw coupling: an end view cut through the jaws shows the motor hub's jaws pressing the rubber spider's legs against the driven hub's jaws, and a side view shows the two hubs with interlocking jaws and the spider between them, with the driven shaft able to sit slightly out of line.</title>
