<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Top view of a side-release buckle, with the female half drawn see-through: the male half is pushed in and its two springy arms have sprung out so their heads sit in side windows, where their flat backs hold against a pull on the straps; squeezing both heads inward lets it go.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#222" stroke-width="2"/></pattern>
</defs>
<g stroke="#222" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
<rect x="400" y="156" width="240" height="138" fill="#cfe3f5" fill-opacity="0.4" stroke="none"/>
<g stroke="#8aa9c4" stroke-width="2" stroke-dasharray="7 6"><line x1="404" y1="207" x2="628" y2="207"/><line x1="404" y1="243" x2="628" y2="243"/></g>
<rect x="660" y="197" width="160" height="56" fill="#e8e8e8"/>
<g>
<rect x="-280" y="197" width="590" height="56" fill="#e8e8e8"/>
<rect x="380" y="212" width="222" height="26" rx="4" fill="#fde2c4"/>
<path d="M376,158 L400,158 L425,158 L450,158 L475,158 L502,158 L502,130 L520,130 L542,162 L542,170 L510,170 L475,170 L450,170 L425,170 L400,170 L376,170 Z" fill="#fde2c4"></path>
<path d="M376,292 L400,292 L425,292 L450,292 L475,292 L502,292 L502,320 L520,320 L542,288 L542,280 L510,280 L475,280 L450,280 L425,280 L400,280 L376,280 Z" fill="#fde2c4"></path>
<rect x="300" y="140" width="80" height="170" rx="10" fill="#fde2c4"/>
<rect x="318" y="182" width="16" height="86" rx="4" fill="#ffffff"/>
</g>
<g fill="#cfe3f5"><rect x="400" y="140" width="98" height="16"/><rect x="546" y="140" width="96" height="16"/><rect x="400" y="294" width="98" height="16"/><rect x="546" y="294" width="96" height="16"/><rect x="628" y="140" width="38" height="170" rx="6"/></g>
</g>
<g fill="none" stroke="#d1495b" stroke-width="5" marker-end="url(#ah)">
<g><line x1="522" y1="72" x2="522" y2="118"/><line x1="522" y1="378" x2="522" y2="332"/></g>
<g><line x1="170" y1="225" x2="70" y2="225"/><line x1="690" y1="225" x2="785" y2="225"/></g>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle">
<text x="400" y="30" font-size="21" font-weight="bold">Top view, female half drawn see-through</text>
<text x="205" y="112">male half</text>
<text x="722" y="180">female half</text>
<text x="300" y="352">springy arm</text>
<text x="735" y="285">pull is held</text>
<g text-anchor="start"><text x="560" y="126">head clicks into window</text><text x="560" y="358">squeeze both to let go</text></g>
<text x="400" y="438">Push in: the sloped heads bend the arms in, then they spring out into the windows</text>
</g>
</svg>
