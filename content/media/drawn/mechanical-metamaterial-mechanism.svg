<title>A grid of square cells, most with a diagonal brace, shown before and after a push: the unbraced middle column leans over into parallelograms so the braced block on its right swings down like the end of a linkage while the left block stays fixed; a third panel shows a door latch idea where a row of unbraced cells shears so the bolt pulls in.</title>
