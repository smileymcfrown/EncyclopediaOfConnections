<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle">
<text x="200" y="36" font-size="21" font-weight="bold">Just twist: clicks round</text>
<text x="600" y="36" font-size="21" font-weight="bold">Push and twist: opens</text>
<text x="200" y="68">teeth held apart, slip over</text>
<text x="200" y="122">outer cap</text>
