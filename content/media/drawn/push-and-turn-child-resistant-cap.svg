<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Cut-away of a push-and-turn child-resistant cap in two states: just twisting, springy fingers hold the loose outer cap up so its teeth slip over the inner cap's ramps and it clicks round uselessly; pressing down while twisting meshes the teeth so both caps turn together and the inner cap unscrews.</title>
