<rect x="372" y="213" width="390" height="24" fill="#e8e8e8" stroke="#222" stroke-width="3"/>
<clipPath id="cout"><rect x="420" y="213" width="340" height="24"/></clipPath><g clip-path="url(#cout)"><rect x="420" y="-59" width="340" height="304" fill="url(#stripe)"></rect></g>
<rect x="640" y="189" width="44" height="22" fill="url(#hatch)" stroke="#222" stroke-width="2.5"/>
<rect x="640" y="239" width="44" height="22" fill="url(#hatch)" stroke="#222" stroke-width="2.5"/>
<rect x="230" y="95" width="70" height="260" fill="#cfe3f5" stroke="#222" stroke-width="3"/>
<rect x="224" y="112" width="60" height="66" fill="#ffffff" stroke="#222" stroke-width="3"/>
<rect x="200" y="118" width="78" height="54" rx="3" fill="#e8e8e8" stroke="#222" stroke-width="3"/>
<rect x="178" y="126" width="22" height="38" fill="url(#hatch)" stroke="#222" stroke-width="2.5"/>
<rect x="232" y="126" width="38" height="38" fill="#fde2c4" stroke="#222" stroke-width="3"/>
<rect x="234" y="128" width="34" height="34" fill="#d1495b" opacity="0"></rect>
<circle cx="243" cy="137" r="2" fill="#222"/><circle cx="251" cy="137" r="2" fill="#222"/><circle cx="259" cy="137" r="2" fill="#222"/><circle cx="243" cy="145" r="2" fill="#222"/><circle cx="251" cy="145" r="2" fill="#222"/><circle cx="259" cy="145" r="2" fill="#222"/>
<rect x="224" y="272" width="60" height="66" fill="#ffffff" stroke="#222" stroke-width="3"/>
<rect x="200" y="278" width="78" height="54" rx="3" fill="#e8e8e8" stroke="#222" stroke-width="3"/>
<rect x="178" y="286" width="22" height="38" fill="url(#hatch)" stroke="#222" stroke-width="2.5"/>
<rect x="232" y="286" width="38" height="38" fill="#fde2c4" stroke="#222" stroke-width="3"/>
<rect x="234" y="288" width="34" height="34" fill="#d1495b" opacity="0"></rect>
<circle cx="243" cy="297" r="2" fill="#222"/><circle cx="251" cy="297" r="2" fill="#222"/><circle cx="259" cy="297" r="2" fill="#222"/><circle cx="243" cy="305" r="2" fill="#222"/><circle cx="251" cy="305" r="2" fill="#222"/><circle cx="259" cy="305" r="2" fill="#222"/>
<g fill="none" stroke="#d1495b" stroke-width="3.5" stroke-dasharray="9 6" opacity="0"><rect x="214" y="102" width="102" height="86" rx="16"/><rect x="214" y="262" width="102" height="86" rx="16"/></g>
<g><rect x="308.0" y="100" width="18" height="250" fill="#fde2c4" stroke="#222" stroke-width="3"/></g>
<polyline points="326,150 331.67,159 337.33,141 343,159 348.67,141 354.33,159 360,150" fill="none" stroke="#222" stroke-width="3"></polyline>
<polyline points="326,300 331.67,309 337.33,291 343,309 348.67,291 354.33,309 360,300" fill="none" stroke="#222" stroke-width="3"></polyline>
<rect x="360" y="120" width="16" height="210" fill="#d8f0d2" stroke="#222" stroke-width="3"/>
