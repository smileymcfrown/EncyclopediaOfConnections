<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Crank and slotted-lever quick-return mechanism: a crank turning at steady speed slides a block in a lever pivoted below it, swinging the lever and the ram on top; the lever's two end positions split the crank circle into a long arc for the slow working stroke and a short arc for the fast return.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#222" stroke-width="2"/></pattern></defs>
<g stroke-linejoin="round" stroke-linecap="round">
<path d="M237.6,328.9 A71,71 0 1 1 362.4,328.9 L346.6,320.3 A53,53 0 1 0 253.4,320.3 Z" fill="#cfe3f5" stroke="#222" stroke-width="2"/>
<path d="M362.4,328.9 A71,71 0 0 1 237.6,328.9 L253.4,320.3 A53,53 0 0 0 346.6,320.3 Z" fill="#fde2c4" stroke="#222" stroke-width="2"/>
<line x1="300" y1="425" x2="130.7" y2="113.0" stroke="#999999" stroke-width="3" stroke-dasharray="9 7"/>
<line x1="300" y1="425" x2="469.3" y2="113.0" stroke="#999999" stroke-width="3" stroke-dasharray="9 7"/>
<rect x="60" y="34" width="460" height="30" rx="4" fill="#d8f0d2" stroke="#222" stroke-width="3"/>
<rect x="40" y="64" width="500" height="10" fill="url(#hatch)" stroke="#222" stroke-width="2"/>
<g transform="translate(300,425) rotate(-80.4)"><rect x="-14" y="-14" width="369" height="28" rx="14" fill="#e8e8e8" stroke="#222" stroke-width="3"/><rect x="60" y="-5" width="265" height="10" rx="5" fill="#ffffff" stroke="#222" stroke-width="2"/></g>
<line x1="300" y1="295" x2="331.0" y2="241.3" stroke="#222" stroke-width="10"/>
<line x1="300" y1="295" x2="331.0" y2="241.3" stroke="#fde2c4" stroke-width="5"/>
<rect x="-11" y="-9" width="22" height="18" fill="#fde2c4" stroke="#222" stroke-width="3" transform="translate(331.0,241.3) rotate(-80.4)"/>
<circle cx="300" cy="295" r="7" fill="#ffffff" stroke="#222" stroke-width="3"/><circle cx="300" cy="295" r="2" fill="#222"/>
<circle cx="300" cy="425" r="7" fill="#ffffff" stroke="#222" stroke-width="3"/><circle cx="300" cy="425" r="2" fill="#222"/>
<circle cx="359.1" cy="74.9" r="7" fill="#ffffff" stroke="#222" stroke-width="3"/><circle cx="359.1" cy="74.9" r="2" fill="#222"/>
<rect x="270" y="433" width="60" height="14" fill="url(#hatch)" stroke="#222" stroke-width="2"/>
<path d="M266,325 A45,45 0 0 1 264,267" fill="none" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle">
<text x="290" y="24">ram (tool slide) moves back and forth</text>
<text x="215" y="300" text-anchor="end">crank turns</text><text x="215" y="322" text-anchor="end">steadily</text>
<text x="340" y="430" text-anchor="start">lever pivot</text>
<text x="560" y="150" text-anchor="start" font-weight="bold">slotted lever</text>
<line x1="552" y1="145" x2="362" y2="150" stroke="#222" stroke-width="1.5"/>
<rect x="560" y="210" width="26" height="18" fill="#cfe3f5" stroke="#222" stroke-width="2"/>
<text x="596" y="226" text-anchor="start">long arc:</text><text x="596" y="248" text-anchor="start">slow working stroke</text>
<rect x="560" y="290" width="26" height="18" fill="#fde2c4" stroke="#222" stroke-width="2"/>
<text x="596" y="306" text-anchor="start">short arc:</text><text x="596" y="328" text-anchor="start">fast return</text>
<text x="560" y="390" text-anchor="start">dashed: the lever's</text><text x="560" y="412" text-anchor="start">two end positions</text>
</g></svg>
