<line x1="400" y1="300" x2="470" y2="300" stroke="#d1495b" stroke-width="4" marker-start="url(#ah)" marker-end="url(#ah)"></line>
<circle cx="640" cy="235" r="30" fill="#cfe3f5"/><circle cx="640" cy="235" r="22" fill="#ffffff"/>
