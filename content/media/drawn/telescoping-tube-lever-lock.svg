<text x="186" y="150" text-anchor="end">dead centre</text>
<text x="40" y="280">outer tube</text>
<text x="282" y="300">split collar</text>
<text x="435" y="330" text-anchor="middle">inner tube slides</text>
<text x="706" y="128">nut sets</text><text x="706" y="148">the grip</text>
<text x="400" y="400" text-anchor="middle">Lever open: tube slides · lever snapped just past dead centre: collar squeezes the tube</text>
