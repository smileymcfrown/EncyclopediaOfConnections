<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>A telescoping tube with a lever lock: side view of an outer tube with a split clamp collar on its end, a lever on a pin through the collar ears and an inner tube sliding out, and an end view of the collar gap, the pin and its tension nut. With the lever open the inner tube slides; snapping the lever down just past the dead-centre line squeezes the collar gap shut and grips the tube.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
