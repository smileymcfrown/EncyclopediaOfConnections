<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222">
<g font-size="20" font-weight="bold" text-anchor="middle"><text x="133" y="40">Glued on the front</text><text x="400" y="40">Glued on the back</text><text x="667" y="40">Buried in the layers</text></g>
<text x="60" y="176" font-size="17">stud</text><line x1="98" y1="171" x2="120" y2="171" stroke="#222" stroke-width="1.5"/>
