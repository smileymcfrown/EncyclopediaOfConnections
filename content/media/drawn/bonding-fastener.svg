<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Three cross-sections of a bonding fastener, a threaded stud welded to a wide, thin plate full of holes. Left: the plate glued to the front of a panel, with glue squeezed up through the holes like rivet heads. Middle: the plate glued to the back, the stud poking through a small hole and a nut clamping a bracket down. Right: the plate buried between the glass layers as the part is made. In each, a pull on the stud is spread over the plate's whole area.</title>
