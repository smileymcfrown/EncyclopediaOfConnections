<g text-anchor="middle" font-size="17"><text x="133" y="384">glue squeezes up through</text><text x="133" y="405">the holes like rivet heads</text><text x="400" y="384">strongest: the nut clamps</text><text x="400" y="405">the panel onto the plate</text><text x="667" y="384">laid in between the layers</text><text x="667" y="405">while the part is made</text></g>
<text x="400" y="440" text-anchor="middle" font-size="17">The wide plate spreads the pull over a big glued area instead of one small hole</text>
</g>
