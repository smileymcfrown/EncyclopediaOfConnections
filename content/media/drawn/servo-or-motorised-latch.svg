<rect x="130" y="262" width="90" height="60" rx="5" fill="#cfe3f5" stroke="#222" stroke-width="3"/>
<rect x="150" y="322" width="12" height="22" fill="#e8e8e8" stroke="#222" stroke-width="2"/><rect x="190" y="322" width="12" height="22" fill="#e8e8e8" stroke="#222" stroke-width="2"/>
<rect x="230" y="204" width="122" height="12" rx="3" fill="#e8e8e8" stroke="#222" stroke-width="2.5"/>
<line x1="190" y1="262" x2="229.3" y2="234.5" stroke="#222" stroke-width="9"/><line x1="190" y1="262" x2="229.3" y2="234.5" stroke="#ffffff" stroke-width="4"/>
<line x1="229.3" y1="234.5" x2="234" y2="210" stroke="#222" stroke-width="4"/>
<circle cx="190" cy="262" r="7" fill="#ffffff" stroke="#222" stroke-width="2.5"/><circle cx="190" cy="262" r="2" fill="#222"/>
<circle cx="229.3" cy="234.5" r="7" fill="#ffffff" stroke="#222" stroke-width="2.5"/><circle cx="229.3" cy="234.5" r="2" fill="#222"/>
<circle cx="234" cy="210" r="7" fill="#ffffff" stroke="#222" stroke-width="2.5"/><circle cx="234" cy="210" r="2" fill="#222"/>
<line x1="330" y1="140" x2="330" y2="95" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
</g>
<g transform="translate(400,0)">
<path d="M40,170 V360 H360 V170 H344 V344 H56 V170 Z" fill="#fde2c4" stroke="#222" stroke-width="3"/>
<rect x="344" y="204" width="9" height="12" fill="#ffffff" stroke="#222" stroke-width="2"/>
<g transform="rotate(-14 48 160)">
<rect x="40" y="150" width="324" height="20" fill="#fde2c4" stroke="#222" stroke-width="3"/>
<path d="M298,170 V230 H314 V170 Z" fill="#e8e8e8" stroke="#222" stroke-width="3"/>
<rect x="298" y="203" width="16" height="14" fill="#ffffff" stroke="#222" stroke-width="2"/>
</g>
<circle cx="48" cy="160" r="7" fill="#ffffff" stroke="#222" stroke-width="2.5"/><circle cx="48" cy="160" r="2" fill="#222"/>
<rect x="250" y="196" width="26" height="28" fill="#e8e8e8" stroke="#222" stroke-width="2.5"/>
<line x1="263" y1="224" x2="263" y2="344" stroke="#222" stroke-width="3"/>
<rect x="130" y="262" width="90" height="60" rx="5" fill="#cfe3f5" stroke="#222" stroke-width="3"/>
<rect x="150" y="322" width="12" height="22" fill="#e8e8e8" stroke="#222" stroke-width="2"/><rect x="190" y="322" width="12" height="22" fill="#e8e8e8" stroke="#222" stroke-width="2"/>
<rect x="175" y="204" width="117" height="12" rx="3" fill="#e8e8e8" stroke="#222" stroke-width="2.5"/>
