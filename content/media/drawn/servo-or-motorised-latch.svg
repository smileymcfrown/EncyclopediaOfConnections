<circle cx="179" cy="210" r="7" fill="#ffffff" stroke="#222" stroke-width="2.5"/><circle cx="179" cy="210" r="2" fill="#222"/>
<line x1="330" y1="110" x2="342" y2="62" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<path d="M150,207 A50,50 0 0 0 132,257" fill="none" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<line x1="168" y1="190" x2="128" y2="190" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
</g>
</g>
<line x1="308" y1="275" x2="306" y2="234" stroke="#222" stroke-width="2"/>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222">
<text x="200" y="40" font-size="20" text-anchor="middle" font-weight="bold">Locked</text>
<text x="600" y="40" font-size="20" text-anchor="middle" font-weight="bold">Open</text>
<text x="175" y="298" font-size="18" text-anchor="middle">servo</text>
<text x="240" y="192" font-size="18" text-anchor="end">bolt</text>
<text x="268" y="92" font-size="18" text-anchor="end">lid pulled up</text>
<text x="200" y="385" font-size="18" text-anchor="middle">the pull presses across the bolt:</text>
<text x="200" y="407" font-size="18" text-anchor="middle">it holds with the power off</text>
<text x="570" y="92" font-size="18" text-anchor="middle">lid lifts</text>
<text x="600" y="385" font-size="18" text-anchor="middle">servo turns back and</text>
<text x="600" y="407" font-size="18" text-anchor="middle">pulls the bolt clear</text>
<text x="312" y="292" font-size="18" text-anchor="middle">eyelet</text>
</g>
</svg>
