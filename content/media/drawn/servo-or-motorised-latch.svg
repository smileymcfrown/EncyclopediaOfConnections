<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Two cut-away side views of a box with a servo latch: when locked, the servo arm has pushed a bolt through an eyelet under the lid and into the box wall, so pulling the lid presses across the bolt and needs no power; when open, the servo arm has swung back and pulled the bolt clear so the lid lifts.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
</defs>

<g stroke-linejoin="round" stroke-linecap="round">
<line x1="400" y1="60" x2="400" y2="395" stroke="#cccccc" stroke-width="2"/>
<g transform="translate(0,0)">
<path d="M40,170 V360 H360 V170 H344 V344 H56 V170 Z" fill="#fde2c4" stroke="#222" stroke-width="3"/>
<rect x="344" y="204" width="9" height="12" fill="#ffffff" stroke="#222" stroke-width="2"/>
<g transform="rotate(0 48 160)">
<rect x="40" y="150" width="324" height="20" fill="#fde2c4" stroke="#222" stroke-width="3"/>
