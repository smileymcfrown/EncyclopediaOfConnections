<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Three frames of two links joined at a knee: bent and free to fold, exactly straight at the dead point, and a few degrees past straight resting on a stop where the load presses the knee harder into the stop; a small graph shows the force boost rising steeply as the links near straight.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="10" stroke="#222" stroke-width="2"/></pattern>
<g id="fixed">
<rect x="14" y="230" width="12" height="12" fill="#e8e8e8" stroke="#222" stroke-width="2.3"/>
<rect x="4" y="242" width="32" height="12" fill="url(#hatch)" stroke="#222" stroke-width="2.3"/>
<rect x="74" y="244" width="22" height="14" fill="url(#hatch)" stroke="#222" stroke-width="2.3"/>
<rect x="105" y="244" width="85" height="12" fill="url(#hatch)" stroke="#222" stroke-width="2.3"/>
</g>
<g id="pin"><circle r="7" fill="#ffffff" stroke="#222" stroke-width="2.3"/><circle r="2.2" fill="#222"/></g>
</defs>
<g stroke-linejoin="round" stroke-linecap="round">
<!-- frame 1: bent -->
<g transform="translate(5,-83.5) scale(1.3)">
<use href="#fixed"/>
<g stroke="#222" stroke-width="12.3"><line x1="20" y1="230" x2="73.2" y2="192.7"/><line x1="73.2" y1="192.7" x2="126.5" y2="230"/></g>
<line x1="20" y1="230" x2="73.2" y2="192.7" stroke="#cfe3f5" stroke-width="7.7"/><line x1="73.2" y1="192.7" x2="126.5" y2="230" stroke="#d8f0d2" stroke-width="7.7"/>
<rect x="114.5" y="216" width="24" height="28" fill="#fde2c4" stroke="#222" stroke-width="2.3"/>
<use href="#pin" x="20" y="230"/><use href="#pin" x="73.2" y="192.7"/><use href="#pin" x="126.5" y="230"/>
<line x1="73" y1="125" x2="73" y2="176" stroke="#d1495b" stroke-width="3.1" marker-end="url(#ah)"/>
</g>
<!-- frame 2: straight -->
<g transform="translate(270,-83.5) scale(1.3)">
<use href="#fixed"/>
<line x1="20" y1="230" x2="150" y2="230" stroke="#222" stroke-width="12.3"/>
<line x1="20" y1="230" x2="85" y2="230" stroke="#cfe3f5" stroke-width="7.7"/><line x1="85" y1="230" x2="150" y2="230" stroke="#d8f0d2" stroke-width="7.7"/>
<rect x="138" y="216" width="24" height="28" fill="#fde2c4" stroke="#222" stroke-width="2.3"/>
<use href="#pin" x="20" y="230"/><use href="#pin" x="85" y="230"/><use href="#pin" x="150" y="230"/>
<g stroke="#d1495b" stroke-width="3.1"><line x1="122" y1="196" x2="160" y2="196" marker-end="url(#ah)"/></g>
</g>
<!-- frame 3: past straight -->
<g transform="translate(535,-83.5) scale(1.3)">
<use href="#fixed"/>
<g stroke="#222" stroke-width="12.3"><line x1="20" y1="230" x2="84.6" y2="236.8"/><line x1="84.6" y1="236.8" x2="149.3" y2="230"/></g>
<line x1="20" y1="230" x2="84.6" y2="236.8" stroke="#cfe3f5" stroke-width="7.7"/><line x1="84.6" y1="236.8" x2="149.3" y2="230" stroke="#d8f0d2" stroke-width="7.7"/>
<rect x="137.3" y="216" width="24" height="28" fill="#fde2c4" stroke="#222" stroke-width="2.3"/>
<use href="#pin" x="20" y="230"/><use href="#pin" x="84.6" y="236.8"/><use href="#pin" x="149.3" y="230"/>
<g stroke="#d1495b" stroke-width="3.1"><line x1="195" y1="230" x2="168" y2="230" marker-end="url(#ah)"/><line x1="85" y1="186" x2="85" y2="220" marker-end="url(#ah)"/></g>
</g>
<!-- graph -->
<polyline points="590,298 590,410 775,410" fill="none" stroke="#222" stroke-width="3"/>
<polyline points="602.3,300 605.5,322.1 608.5,336.8 614.7,355.1 620.8,366.1 633.2,378.7 651.7,388.2 682.5,395.6 713.2,399.4 775,403.3" fill="none" stroke="#222" stroke-width="3"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="middle">
<text x="128.5" y="40" font-size="21" font-weight="bold">Bent: free</text>
<text x="393.5" y="40" font-size="21" font-weight="bold">Straight: tightest</text>
<text x="658.5" y="40" font-size="21" font-weight="bold">Past: locked</text>
<text x="113" y="118" text-anchor="start">push knee</text>
<text x="455" y="158">squeeze</text>
<text x="769" y="189">load</text>
<text x="626" y="251" text-anchor="end">stop</text>
<text x="612" y="316" text-anchor="start">force boost</text>
<text x="682" y="432">angle to straight</text>
<text x="290" y="365" font-size="19">Just past straight, the load pushes the knee</text>
<text x="290" y="390" font-size="19">into the stop, so it stays locked with no catch</text>
</g>
</svg>
