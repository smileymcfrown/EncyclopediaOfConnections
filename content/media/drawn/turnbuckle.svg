<g font-family="Arial, Helvetica, sans-serif" fill="#222" font-size="18" text-anchor="middle">
<text x="400" y="100">turn the body</text>
<text x="251" y="150">lock nut</text><text x="549" y="150">lock nut</text>
<text x="255" y="250">right-hand thread</text>
<text x="545" y="250">left-hand thread</text>
<text x="400" y="296">both ends pull in</text>
<text x="90" y="290">slack cable</text><text x="90" y="312">pulled tight</text>
<text x="400" y="420">Each turn pulls each end in by one pitch, so it shortens by two pitches per turn</text>
