<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Two rings of lopsided teeth, drawn unrolled flat and pressed together by springs: turning to tighten, the gentle slopes push the top ring up until it clicks over a tooth; turning to undo, the steep faces meet and drive solidly.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
</defs>
<g stroke="#222" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
<!-- frame 1: tightening, overloaded -->
<rect x="30" y="112" width="350" height="18" rx="3" fill="#e8e8e8"/>
<path d="M100,130 L100,136 L86,143 L114,152 L86,161 L114,170 L86,179 L114,188 L100,194 L100,200" fill="none"/>
<path d="M310,130 L310,136 L296,143 L324,152 L296,161 L324,170 L296,179 L324,188 L310,194 L310,200" fill="none"/>
<path d="M30,200 L30,270 L65,255 L65,285 L135,255 L135,285 L205,255 L205,285 L275,255 L275,285 L345,255 L345,285 L380,270 L380,200 Z" fill="#cfe3f5"/>
<path d="M30,350 L30,300 L100,270 L100,300 L170,270 L170,300 L240,270 L240,300 L310,270 L310,300 L380,270 L380,350 Z" fill="#fde2c4"/>
<!-- frame 2: undoing -->
<rect x="420" y="112" width="350" height="18" rx="3" fill="#e8e8e8"/>
<path d="M490,130 L490,137 L476,145 L504,156 L476,167 L504,178 L476,189 L504,200 L490,208 L490,215" fill="none"/>
<path d="M700,130 L700,137 L686,145 L714,156 L686,167 L714,178 L686,189 L714,200 L700,208 L700,215" fill="none"/>
<path d="M420,215 L420,300 L490,270 L490,300 L560,270 L560,300 L630,270 L630,300 L700,270 L700,300 L770,270 L770,215 Z" fill="#cfe3f5"/>
<path d="M420,350 L420,300 L490,270 L490,300 L560,270 L560,300 L630,270 L630,300 L700,270 L700,300 L770,270 L770,350 Z" fill="#fde2c4"/>
</g>
<!-- contact highlights -->
<g stroke="#d1495b" stroke-width="5" stroke-linecap="round">
<line x1="65" y1="285" x2="82" y2="278"/>
<line x1="135" y1="285" x2="152" y2="278"/>
<line x1="205" y1="285" x2="222" y2="278"/>
<line x1="275" y1="285" x2="292" y2="278"/>
<line x1="490" y1="273" x2="490" y2="298"/>
<line x1="560" y1="273" x2="560" y2="298"/>
<line x1="630" y1="273" x2="630" y2="298"/>
<line x1="700" y1="273" x2="700" y2="298"/>
</g>
<!-- movement arrows -->
<g stroke="#d1495b" stroke-width="4" fill="none" marker-end="url(#ah)">
<line x1="120" y1="228" x2="250" y2="228"/>
<line x1="150" y1="196" x2="150" y2="150"/>
<line x1="680" y1="243" x2="550" y2="243"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222">
<text x="205" y="45" text-anchor="middle" font-size="21" font-weight="bold">Tighten, too hard</text>
<text x="595" y="45" text-anchor="middle" font-size="21" font-weight="bold">Undo</text>
<text x="205" y="85" text-anchor="middle">gentle slopes slide</text>
<text x="595" y="85" text-anchor="middle">steep faces meet</text>
<text x="164" y="178">pushed up</text>
<text x="326" y="170">spring</text>
<text x="205" y="333" text-anchor="middle">to the cap or screw</text>
<text x="205" y="385" text-anchor="middle">top ring hops a tooth: click</text>
<text x="595" y="385" text-anchor="middle">drives solidly, always undoes</text>
<text x="400" y="432" text-anchor="middle" font-size="18">Teeth shown unrolled flat · a stronger spring or steeper slope clicks at a higher torque</text>
</g>
</svg>
