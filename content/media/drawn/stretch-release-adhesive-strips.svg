<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Side view of a hook stuck to a wall with a stretchy adhesive strip: first holding a hanging weight that pulls along the wall, then the strip's tab pulled slowly straight down so the strip stretches thin and peels off the wall and the hook plate from the bottom up, and a small sketch showing that pulling the tab outwards is the wrong way.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
<pattern id="hatch" patternUnits="userSpaceOnUse" width="10" height="10"><path d="M-2,12 L12,-2" stroke="#222" stroke-width="1.5"/></pattern>
<g id="wall"><rect x="40" y="70" width="20" height="320" fill="url(#hatch)" stroke="#222" stroke-width="3"/></g>
<g id="hook" fill="none">
<path d="M90,150 H135 Q150,150 150,165 V198 Q150,215 135,215 Q120,215 120,200" stroke="#222" stroke-width="10"/>
<path d="M90,150 H135 Q150,150 150,165 V198 Q150,215 135,215 Q120,215 120,200" stroke="#cfe3f5" stroke-width="4"/>
</g>
</defs>
<g stroke-linejoin="round" stroke-linecap="round">
<line x1="290" y1="20" x2="290" y2="430" stroke="#cccccc" stroke-width="2"/>
<line x1="580" y1="20" x2="580" y2="430" stroke="#cccccc" stroke-width="2"/>
<!-- 1: holding a load -->
<use href="#wall"/>
<rect x="60" y="130" width="12" height="170" fill="#d8f0d2" stroke="#222" stroke-width="3"/>
<rect x="72" y="120" width="18" height="140" fill="#cfe3f5" stroke="#222" stroke-width="3"/>
<use href="#hook"/>
<line x1="135" y1="218" x2="135" y2="300" stroke="#222" stroke-width="2"/>
<rect x="100" y="300" width="70" height="50" fill="#e8e8e8" stroke="#222" stroke-width="3"/>
<line x1="135" y1="358" x2="135" y2="390" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<line x1="98" y1="108" x2="67" y2="128" stroke="#222" stroke-width="2"/>
<!-- 2: pull the tab down -->
<g transform="translate(290,0)">
<use href="#wall"/>
<path d="M60,130 H72 V185 L69,212 V366 H63 V212 L60,185 Z" fill="#d8f0d2" stroke="#222" stroke-width="3"/>
<rect x="72" y="120" width="18" height="140" fill="#cfe3f5" stroke="#222" stroke-width="3"/>
<use href="#hook"/>
<rect x="58" y="346" width="48" height="46" rx="14" fill="#fde2c4" stroke="#222" stroke-width="3"/>
<path d="M72,360 H96 M72,374 H96" stroke="#222" stroke-width="2"/>
<line x1="134" y1="330" x2="134" y2="392" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<line x1="102" y1="242" x2="69" y2="200" stroke="#222" stroke-width="2"/>
</g>
<!-- 3: wrong way -->
<g transform="translate(580,0)">
<rect x="30" y="110" width="20" height="220" fill="url(#hatch)" stroke="#222" stroke-width="3"/>
<path d="M50,150 H62 V245 L114,284 L106,295 L50,255 Z" fill="#d8f0d2" stroke="#222" stroke-width="3"/>
<rect x="62" y="140" width="18" height="105" fill="#cfe3f5" stroke="#222" stroke-width="3"/>
<line x1="120" y1="300" x2="196" y2="300" stroke="#d1495b" stroke-width="4" marker-end="url(#ah)"/>
<path d="M142,282 L174,318 M142,318 L174,282" stroke="#222" stroke-width="4"/>
</g>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222">
<g font-size="20" font-weight="bold" text-anchor="middle">
<text x="145" y="40">1. Holding a load</text>
<text x="435" y="40">2. Pull tab down</text>
<text x="690" y="40">Wrong way</text>
</g>
<text x="100" y="104">sticky strip</text>
<text x="160" y="185">hook</text>
<text x="80" y="292">tab</text>
<text x="135" y="331" text-anchor="middle" font-size="16">weight</text>
<text x="145" y="420" text-anchor="middle">load pulls along the wall</text>
<text x="395" y="262">glue peels off</text>
<text x="395" y="284">from the bottom up</text>
<text x="370" y="316">strip stretches thin</text>
<text x="435" y="420" text-anchor="middle">pull slowly, along the wall</text>
<text x="690" y="350" text-anchor="middle">pulling outwards</text>
<text x="690" y="372" text-anchor="middle">can damage the wall</text>
</g>
</svg>
