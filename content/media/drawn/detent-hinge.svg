<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Left: a cut-away hinge knuckle with three notches, where a spring pushes a ball into one notch to hold the lid at 0, 90 or 120 degrees. Right: a sofa-style ratchet fitting, where a pawl clicks up a row of teeth as the arm is raised and a bump at the end knocks it clear so the arm can fold back down.</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#e8e8e8"/><line x1="0" y1="0" x2="0" y2="10" stroke="#222" stroke-width="2"/></pattern>
</defs>
<g stroke="#222" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
<!-- LEFT: click-stop hinge -->
<path d="M40,230 L160,230 L160,282 L280,282 L280,360 L40,360 Z" fill="#e8e8e8"/>
<rect x="210" y="283" width="20" height="67" fill="#ffffff"/>
<polyline points="220,348 213,343 227,337 213,331 227,325 213,319 227,313 213,307 227,301 213,295 220,290" fill="none"/>
<!-- lid positions -->
<rect x="40" y="210" width="180" height="20" fill="none" stroke-dasharray="7 6"/>
<rect x="210" y="40" width="20" height="180" fill="none" stroke-dasharray="7 6" transform="rotate(30 220 220)"/>
<rect x="210" y="40" width="20" height="180" fill="#fde2c4"/>
<!-- knuckle disc with three notches -->
<path d="M241.9,275.9 A60,60 0 0 1 229.0,279.3 A9,9 0 0 0 211.0,279.3 A60,60 0 0 1 160.7,229.0 A9,9 0 0 0 160.7,211.0 A60,60 0 1 1 257.4,266.9 A9,9 0 0 0 241.9,275.9 Z" fill="#fde2c4"/>
<circle cx="220" cy="280" r="9" fill="#cfe3f5"/>
<circle cx="220" cy="220" r="8" fill="#ffffff"/>
<circle cx="220" cy="220" r="2" fill="#222"/>
<path d="M90,145 A150,150 0 0 1 259,75" fill="none" stroke="#d1495b" marker-start="url(#ah)" marker-end="url(#ah)"/>
<!-- RIGHT: ratchet fitting (toothed arm root, pawl on fixed bracket) -->
<rect x="500" y="170" width="220" height="210" rx="8" fill="#e8e8e8"/>
<rect x="500" y="380" width="220" height="16" fill="url(#hatch)"/>
<rect x="-15" y="-13" width="225" height="26" rx="6" fill="#fde2c4" transform="translate(560,250) rotate(-115)"/>
<path d="M568,175 L582,148 L596,152 L593,183 L598,185 L606,170 L609,193 L610,194 L622,182 L620,205 L621,206 L634,196 L628,218 L629,219 L644,213 L633,233 L633,234 L650,231 L635,249 L635,250 L652,250 L634,264 L633,266 L650,269 L629,279 L629,281 L644,287 L621,293 L621,294 L634,304 L611,305 L610,306 L622,318 L599,314 A75,75 0 1 1 568,175 Z" fill="#fde2c4"/>
<polyline points="668,272 676,267 660,261 676,255 660,249 676,243 660,237 668,231" fill="none"/>
<path d="M697,194 L715,209 L639,249 Z" fill="#cfe3f5"/>
<circle cx="705" cy="202" r="6" fill="#ffffff"/>
<circle cx="560" cy="250" r="9" fill="#ffffff"/>
<circle cx="560" cy="250" r="2" fill="#222"/>
<path d="M419,109 A200,200 0 0 1 525,53" fill="none" stroke="#d1495b" marker-end="url(#ah)"/>
<path d="M682,38 A245,245 0 0 0 497,13" fill="none" stroke="#d1495b" stroke-dasharray="9 6" marker-end="url(#ah)"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222">
<text x="48" y="200">0°</text>
<text x="238" y="54">90°</text>
<text x="318" y="74">120°</text>
<text x="160" y="390" text-anchor="middle">spring pushes the ball into a notch</text>
<text x="420" y="136" text-anchor="middle">raise</text>
<text x="664" y="316">pawl clicks<tspan x="664" dy="22">over teeth</tspan></text>
<text x="604" y="132">bump knocks<tspan x="604" dy="22">pawl clear</tspan></text>
<text x="694" y="62">then folds<tspan x="694" dy="22">back freely</tspan></text>
<text x="400" y="436" text-anchor="middle">Click-stop hinge (left) · furniture ratchet fitting (right)</text>
</g>
</svg>
